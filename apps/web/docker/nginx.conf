server {
  listen 5173;
  root /usr/share/nginx/html;
  # No request logs: the app must not keep IP addresses (SPEC "Accounts and anonymity").
  access_log off;
  error_log /dev/stderr crit;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    # Rate limits need the client address; the API keeps it in a Redis-only counter (never logged).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # append, so a proxy in front (Caddy) keeps the client's address
  }

  # The agents stream Server-Sent Events, but send nothing while one LLM step runs: an agent
  # step may take up to 60 s (generate) or 75 s (advisor escalation), past nginx's default
  # 60 s read timeout, which would cut the stream off. 300 s covers a whole run.
  location /api/agents/ {
    proxy_pass http://api:8000/agents/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # append, so a proxy in front (Caddy) keeps the client's address
  }

  # Built files have a content hash in their name: cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself must be re-checked on every visit, so a rebuild shows up at once (without
  # this header browsers guess, and kept showing an old build for hours).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
