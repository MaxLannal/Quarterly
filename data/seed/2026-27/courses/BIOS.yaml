- code: BIOS 11143
  title: 'Small Molecule, Big Targets: Fundamentals of Structure-based Drug Design'
  units: 100
  description: This course introduces undergraduate students to the chemical basis of drugs and principles of structure- based
    drug design, with a focus on how drugs interact with biological targets at the molecular level. Students will engage with
    primary literature case studies and immersive technologies involving virtual and mixed reality (VR/MR) to explore the
    process of rational drug design. The course emphasizes how protein structure informs drug discovery and the strategies
    used to optimize ligand binding and therapeutic efficacy. Students will gain hands-on experience to visualize how small
    molecules bind to target proteins, evaluate their potential as drug candidates, and experiment with ways to improve them.
    Through collaborative learning and interactive tools, students will connect theory to practice and develop a deeper understanding
    of the molecular logic driving modern drug discovery.
