- code: BIOS 11144
  title: The Genetic Basis for Human Disorders
  units: 100
  description: Our genes determine what we look like, how our cells function, and how we survive in the world around us. If
    genes mutate, the consequences can range from treatable symptoms to full body disorders and potentially a premature death.
    In this course, we will explore the foundations of inheritance and gene expression, while also examining the consequences
    of mutations that disrupt protein location, structure, and function. We will also discuss the question of why harmful
    alleles still exist in human gene pools by examining the foundational principles of evolution, selection, and population
    genetics using case studies of well characterized genetic disorders. Throughout the course, students will encounter a
    range of genetic disorders and will learn how they occur, what therapies currently exist, and how advancing biotechnological
    capabilities will shape treatments of the future. Lastly, we will end the course with a jigsaw discussion regarding the
    bioethical implications of genetic technologies, and it's use on human populations.
  core_tags:
