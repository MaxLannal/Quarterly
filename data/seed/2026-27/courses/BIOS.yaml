    quote: BIOS 14117. The Science and Art of Vision. 100 Units.
  needs_review: true
- code: BIOS 14118
  title: 'Mechanisms of Memory: How the Brain Stores Information'
  units: 100
  description: Our memories greatly shape who we are. Whether it is our memories of past experiences, facts and information,
    or how to play an instrument, our memories influence how we interact and think about the world around us. In this course,
    we will investigate the processes through which the brain supports our ability to learn and remember. We will examine
    the brain regions involved in the different types of memory and study the dynamic cellular mechanisms that take place
    during learning. The goal of this class is to provide students with a basic understanding of how fundamental neurobiological
    mechanisms contribute to the complex behaviors of learning and memory, as well as to foster appreciation and engagement
    with neuroscience and other biological sciences.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10130 or BIOS 10140; NO BIOLOGICAL SCIENCES MAJORS, NEUROSCIENCE MAJORS, AND NO NON-BIOLOGY PRE-MEDS,
    except by petition.
