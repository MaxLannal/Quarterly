    quote: BIOS 27753. Fundamentals of Synapses. 100 Units.
  needs_review: true
- code: BIOS 27760
  title: An Introduction to Parasitology
  units: 100
  description: This course introduces the diversity of parasitic organisms, both protozoan and metazoan, and explores the
    life cycles, morphology, genomics, pathology, immunology, epidemiology, and treatment and control of major parasite groups.
    The focus will be on aquatic species, including those that cause disease in humans and livestock. The course will involve
    lectures, a journal club and lab work including carrying out a research project. The lab work and research project will
    include working on parasitic flatworms; in particular investigating the molecular and cellular biology of a tropical species,
    Schistosoma mansoni, that is medically important. Here, in this research-led institute, you will contribute novel data
    and information to ongoing research at MBL that will advance our understanding of parasites. The lab portion will introduce
    the morphological and molecular techniques that form part of the toolkit used by parasitologists to understand the biology
    of these organisms, an essential step in the search and development of novel control strategies and therapeutics.
  notes: Offered at The Marine Biological Laboratory in Woods Hole, MA.
  core_tags:
  - biological_sciences
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27760. An Introduction to Parasitology. 100 Units.
- code: BIOS 27761
  title: Embryology
  units: 100
  description: How do animals make eggs, and how to eggs make animals? How will a changing climate affect these processes?
    The most diverse group of animals in our oceans is the invertebrates. In this course, students will learn broad concepts
    in animal reproduction and development, from a biomedical, evolutionary, and climate perspective. Topics will include
    oogenesis, meiosis, fertilization, early development, and germ line specification, covered through morning lectures and
    journal club discussions of research papers. We will approach these topics through a cell biological and gene regulatory
    lens. In the lab, we will primarily work with the bat star Patiria miniata, but also with local sea urchin species that
    we will collect locally from Vineyard Sound (weather and spawning season permitting). Students will learn essential cell
    biological and embryological techniques including gamete and embryo/larval culture, staining, microinjection, live imaging,
    and cutting-edge approaches in CRISPR-Cas9 gene editing. Students will conduct independent embryology projects focusing
    on marine invertebrate reproduction and embryogenesis.
  core_tags:
  - biological_sciences
  prereq_text: Second-year standing or greater (or by consent) and acceptance into the Spring Semester in Biological Discovery
    at MBL.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27761. Embryology. 100 Units.
  needs_review: true
