- code: BIOS 13135
  title: Marine Ecology and Experimental Design
  units: 100
  description: The ocean is home to many ecosystems ranging from the deep ocean to shallow coasts. You may not realize it,
    but the ocean affects everyone living on this planet (including you!) either directly (i.e. resource consumption) or indirectly
    (i.e. climate regulation). This course will explore how species interactions and the physical environment shape these
    marine ecosystems, with a focus on the coastal ocean. We will learn the fundamentals of marine ecology through readings
    and discussion of primary literature, with a focus on how experimental design was used to come to these conclusions. In
    the second half of this course, we will explore human impacts on the ocean and the foundations of experimental design
    and how we can design experiments to answer questions about marine ecosystems. Furthermore, good experimental design can
    inform conservation and restoration of marine ecosystems. You will design an experiment of your own to either understand
    a fundamental ecological phenomenon OR inform conservation in an ecosystem of your choosing. At the end of this course
    not only will you have an understanding of the foundational principles of Marine Ecology, but you will be able to read
    and discuss primary literature, write in a scientific writing style, and design experiments to explore fundamental questions
    in Marine Ecology.
  core_tags:
