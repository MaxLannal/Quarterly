- code: BIOS 11142
  title: 'Forensic Biology: "Who done it?" - DNA tells the story'
  units: 100
  description: This course is designed to introduce the field of forensic biology to those with an introductory biology background.
    Starting with a brief overview of relevant basic concepts of molecular biology, genetics, and inheritance patterns, the
    course will explore the crucial role played by individuals' unique DNA in precisely solving mysteries of missing people
    and crimes. This course will combine theoretical knowledge with hands-on experimentation to provide a comprehensive understanding
    of forensic biology with a focus on DNA analysis. In this course, we will also cover adjacent topics such as identity-by-descent
    and the use of non-human DNA in Forensics, and also expand on the legal and ethical implications surrounding this form
    of investigation. Upon completion, students will gain a comprehensive understanding of DNA analysis in forensic investigations,
    including the limitations in current practice. They will be empowered to contribute to the enhancement of criminal justice
    and public safety policies and guidelines.
