- code: BIOS 12121
  title: 'Life at the Edge: Human Adaptation to Extreme Environments'
  units: 100
  description: This course explores the human physiological responses to environmental stressors. Topics include acute responses
    and chronic acclimatization to extreme environments such as heat, cold, high altitude, and high pressure, and the mechanisms
    that maintain function under these conditions. Students will analyze human populations that have adapted over generations
    to environmental extremes, alongside comparisons with adaptive strategies in other species. We will also consider the
    limits of human physiological flexibility, especially in the context of ongoing global environmental change. Students
