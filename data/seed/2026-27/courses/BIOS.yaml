- code: BIOS 11136
  title: Introduction to Complex Trait Genetics
  units: 100
  description: The goal of the course is to provide a basic understanding of how genetics affect complex diseases, like asthma
    and depression. We will cover differences between complex disorders and Mendelian disorders, like Huntington's. We will
    summarize how geneticists use big data and machine learning to learn about the biology of complex diseases. We will also
    cover genetic predictions for complex traits, including their potential value for disease prevention and their potential
    peril for traits like education attainment. Students will read news articles and accessible excerpts from the literature,
