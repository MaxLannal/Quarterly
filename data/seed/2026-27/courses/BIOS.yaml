    quote: 'BIOS 13142. From Fossils to Fermi''s Paradox: Origin and Evolution of Intelligent Life. 100 Units.'
  needs_review: true
- code: BIOS 13143
  title: Why Sex? Biological Oddities and the Evolutionary Battle of the Sexes
  units: 100
  description: This course explores why sexual reproduction exists despite its high evolutionary costs. We will investigate
    the fundamental biological and selective pressures that shape a vast range of reproductive strategies. Using the lens
    of animal behavior, we will uncover a variety of bizarre sexual displays, mating rituals, sexual conflict, and anatomical
    diversity, and discuss the costs and benefits of interpreting behavior from a human perspective. This course encourages
    students to engage their curiosity about the wild realities of the natural world and examine the evolution of these behaviors.
    From sex-changing fish to fatal courtship displays, lectures, discussions, and analysis of primary scientific literature
    highlight how natural and sexual selection drive unexpected physiological and behavioral adaptations.
  core_tags:
