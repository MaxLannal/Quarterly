    quote: 'BIOS 15115. Cancer Biology: How Good Cells Go Bad. 100 Units.'
  needs_review: true
- code: BIOS 15126
  title: Biology and Epidemiology of Cancer
  units: 100
  description: This course focuses on an introduction to cancer providing a biological perspective on how cancer arises and
    further progresses as a disease. The course will additionally focus on the ways in which genetics and environmental factors
    contribute to specific types of cancer. A brief analysis of the epidemiology of some cancers will be discussed in addition
    to providing an overview of the traditional and emerging cancer therapeutics and a perspective on the psychological and
    societal impacts of cancer and how this continues to evolve.
  notes: NO BIOLOGICAL SCIENCES MAJORS AND NO NON-BIOLOGY PRE-MEDS, except by petition.
  core_tags:
  - biological_sciences
  prereq:
    any:
    - BIOS 10130
    - BIOS 10140
  prereq_text: BIOS 10130 or BIOS 10140.
  terms_offered:
