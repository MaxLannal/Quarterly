- code: BIOS 27715
  title: "Roles of Animals in Ecosystems \x96 Marine Biological Laboratory"
  units: 100
  description: This course addresses the question, How do animals, including man, affect the structure and function of ecosystems.
    The course takes an interdisciplinary approach focused on the interactions of animal diversity, migration patterns, population
    dynamics, and behavior with biogeochemical cycles, productivity, and transport of materials across ecosystems. This course
    is an elective option within the Semester in Environmental Science program at the Marine Biological Laboratory in Woods
