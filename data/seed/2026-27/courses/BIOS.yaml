- code: BIOS 10602
  title: 'Computing the Living World: Quantitative Approaches to Biology I'
  units: 100
  description: Have you ever wondered what your DNA can reveal about you? Can your genome help predict your risk for certain
    diseases? These questions lie at the heart of Bioinformatics-the science of extracting meaningful information from biological
    data. In this course, you will discover how computational tools and quantitative methods are transforming modern biology,
    medicine, and biotechnology. Beginning with the molecular foundations of life, you will explore how DNA, RNA, and proteins
    store, transmit, and process biological information. You will then develop practical programming and data-analysis skills
    such as dynamic programming to align two biological sequences in order to identify genes, compare genomes, reconstruct
    evolutionary relationships, and uncover biological insights hidden in DNA sequences. Using the University's High-Performance
    Computing (HPC) resources, you will analyze real genomic datasets similar to those used in leading research laboratories
    and biotechnology companies. For the class final project, you will investigate the genome of a real individual, identify
    genetic variants associated with disease risk, and learn how large-scale biological data are processed and interpreted.
    Along the way, you will gain valuable computational skills by implementing bioinformatics algorithms, developing data-analysis
    workflows, and applying quantitative approaches to solve biological problems.
  core_tags:
  - biological_sciences
  prereq_text: MATH 13300/15300/16300 or equivalent placement. NO BIOLOGICAL SCIENCES MAJORS OR NON-BIOLOGY PRE-MED STUDENTS,
    except by petition. This course MUST be followed by the second course in the sequence.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 10602. Computing the Living World: Quantitative Approaches to Biology I. 100 Units.'
  needs_review: true
- code: BIOS 10603
  title: 'Computing the Living World: Quantitative Approaches to Biology II'
  units: 100
  description: How do drugs recognize and bind to their targets in the body? What determines whether a protein functions correctly-or
    contributes to disease? Answering these questions requires looking beyond static pictures of molecules and exploring how
    they move, interact, and change over time. As the molecular machines that power life, proteins enable cells to communicate,
    catalyze chemical reactions, fight infections, and carry out nearly every biological process. In this course, you will
    explore how proteins function at the atomic level, how protein structure determines biological function, and how protein
    structural changes can contribute to health and disease. You will gain hands-on experience with the computational tools,
    such as VMD and AlphaFold, used by modern biologists to visualize, model, and predict protein behavior. A central focus
    of the course is Molecular Dynamics (MD) simulation, a cutting-edge technique that allows researchers to observe proteins
    and other biomolecules in motion with atomic resolution, earning it the name "computational microscope". Using the University's
    High-Performance Computing (HPC) resources, you will build, visualize, and simulate molecular systems similar to those
    studied in modern pharmaceutical and biomedical research for drug discovery and development. As your final project, you
    will select a protein of interest, construct its molecular model, and investigate its structural dynamics using MD simulations.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10602 or consent of instructor. NO BIOLOGICAL SCIENCES MAJORS OR NON-BIOLOGY PRE-MED STUDENTS, except
    by petition.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 10603. Computing the Living World: Quantitative Approaches to Biology II. 100 Units.'
  needs_review: true
