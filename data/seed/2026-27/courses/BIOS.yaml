- code: BIOS 27714
  title: Methods in Microbial Ecology - Marine Biological Laboratory
  units: 100
  description: This course explores the biology of microbes found in the environment, including relationships with the physical,
    chemical, and biotic elements of their environment. Emphasis is placed on understanding the science underlying the various
    methodologies used in the study of these organisms and systems. In the laboratory, students will work with the latest
    techniques to measure microbial biomass, activity, extracellular enzymes, and biogeochemical processes. Students are also
    introduced to molecular methods for assessing microbial genomic diversity.
