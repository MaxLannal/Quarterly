- code: BIOS 27716
  title: Methods and Concepts in Oceanography- at Marine Biological Laboratory
  units: 100
  description: This immersive course provides students with a thorough introduction to the core methodologies and concepts
    in oceanographic research. Over a 10-week period, with 3 hours of class each week, students will explore the dynamic systems
    that shape our oceans and the cutting-edge techniques used to study them. The course combines engaging lectures, hands-on
    laboratory work, and field work aboard a coastal research vessel to offer a comprehensive introduction to biological oceanography,
    physical oceanography, biogeochemistry, marine ecology, and the ever-changing nature of our oceans. Students will gain
    practical experience in key laboratory, field, and ship-board oceanographic techniques, including microscopy, molecular
    methods like PCR and sequencing, ocean sampling methods such as water column profiling using CTD casts and Niskin bottle
    grabs, and sediment grabs. Additionally, they will delve into the physical processes that drive ocean circulation, major
    oceanographic features, the role of primary and secondary production and the microbial loop in marine ecosystems, and
    the impact of climate change and human activities on ocean health. Throughout the course, students will actively participate
    in discussions, lab work, and field activities. They will be evaluated based on their engagement, performance in practical
    sessions, quizzes, and a final project report that synthesizes their learning and research findings.
  core_tags:
  - biological_sciences
  crosslists:
  - ENSC 25100
  prereq_text: Consent only. Admission by application to the Semester in Environmental Science program at the Marine Biological
    Laboratory in Woods Hole, MA; concurrent registration in BIOS 27710, BIOS 27711 and BIOS 27712.
  source:
