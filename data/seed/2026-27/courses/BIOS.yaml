    quote: BIOS 27717. Marine Resource Use and Conservation- at Marine Biological Laboratory. 100 Units.
  needs_review: true
- code: BIOS 27720
  title: Microbiomes Across Environments
  units: 100
  description: This course provides a comprehensive introduction to the theory and techniques of microbiome science, an emerging
    field that bridges disciplines, merging microbiology with genomics, ecology, population and evolutionary biology, phylogenetics,
    ecosystem science, and biogeochemistry, and has broad applications in medicine, agriculture, and ecosystem health. Through
    a combination of faculty and guest lectures and student-led discussion of primary literature we will explore the vast
    biochemical and metabolic diversity of the microbial world and its relationships with multicellular life. The major component
    of the course is an independent research project investigating the microbiomes of marine organisms collected by the students
    or resident in the MBL's Marine Resources Center, or of a salt marsh ecosystem in Woods Hole. Students develop their own
    hypotheses and sampling strategies, carry our sampling, extract DNA, and perform PCR for sequencing. The last third of
    the course is devoted to data analysis, where students learn to use the Unix-based bioinformatic tools necessary to find
    patterns in the hundreds of thousands of DNA sequences their project produced, a skill broadly applicable to any discipline
    in modern biology.
  core_tags:
  - biological_sciences
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27720. Microbiomes Across Environments. 100 Units.
- code: BIOS 27723
  title: 'Biodiversity and Genomics: Exploring the Marine Animal Diversity of Woods Hole Using Molecular Tools'
  units: 100
  description: In this course, student will have the opportunity to explore the large diversity of marine animal species in
    Woods Hole, Massachusetts and its surroundings. We will combine fieldwork with genomic and bioinformatic approaches to
    study different aspects of the evolution, ecology, taxonomy, physiology, and biogeography of marine animals in this unique
    location. Student will integrate knowledge and analytical tools from different biological disciplines to develop short
    research projects. During the three weeks of the course, student will have access to the Marine Biological Laboratory's
    collection of living marine animals, participate in ongoing research projects at MBL, and contribute data that will advance
    our understanding of marine biodiversity.
  notes: This course will be given at Marine Biological Laboratories, Woods Hole, Massachusetts. E.
  core_tags:
  - biological_sciences
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 27723. Biodiversity and Genomics: Exploring the Marine Animal Diversity of Woods Hole Using Molecular Tools.
      100 Units.'
- code: BIOS 27724
  title: Introduction to Imaging for Biological Research
  units: 100
  description: Many breakthroughs in science have been made possible by revolutionary advances in our ability to visualize
    biological processes, and recent progress in microscopy has led to important breakthroughs in understanding life at the
    molecular, cellular, and organismal level. In this course, we will introduce the students to basic techniques in microscopy,
    starting with an opportunity for students to build their own simple microscopes, and then proceeding all the way to using
    state-of-the-art confocal, light sheet, and electron microscopes. Students will explore the challenges of sample preparation,
    of imaging processes in living cells, and in the computational analysis of imaging data. Throughout the course, students
    will be able to design their own experiments, and undertake a student-designed research project.
  core_tags:
  - biological_sciences
  crosslists:
  - NSCI 21515
  prereq_text: Second-year standing or greater (or by consent) and acceptance into the Spring Quarter Program at MBL.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27724. Introduction to Imaging for Biological Research. 100 Units.
  needs_review: true
- code: BIOS 27725
  title: Biogeography and Distribution of Species
  units: 100
  description: This course will investigate themes found in the geographic distribution of species and communities. We will
    ask questions such as 'how does climate change from the poles to the equator and how does that impact the distribution
    and coexistence of species?' In lab we will focus on local habitat types and local species in the region surrounding Chicago
    (e.g., grasslands, woodland, aquatic habitats such as ponds/streams). We will examine various patterns in the distribution
    and abundance of the flora/fauna in local habitats over the course of 3 weeks through a combination of in class lectures
    and laboratory sessions, combined with field studies. Surveys will be made of local habitats for biogeographic comparisons
    of patterns of abundance with a focus on vegetation, rodents and aquatic and terrestrial insects.
  core_tags:
  - biological_sciences
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27725. Biogeography and Distribution of Species. 100 Units.
- code: BIOS 27726
  title: 'Marine Ecosystems: From Microbiomes, to Conservation, Climate & Beyond'
  units: 100
  description: This course is designed for rising 2nd years with interests in microbiology, the environment, and society.
    More specifically, the course is designed for students considering a science major, as well as non-majors, who are looking
    for broad exposure to geosciences, environmental and climate science, microbiology, molecular biology, and the intersection
    between society and science. Students will study coastal marine habitats, connectivity to ocean and climate, dynamics
    of microbial community structure, and marine conservation alongside gaining experience on laboratory microbiome science
    and environmental field work. Students will gain firsthand experience with the types of microbes that that influence climate
    and that impact health through laboratory experiments on culturing and analyzing microbes in 'pristine' and highly impacted
    coastal ecosystems. Methods to be learned include plating, epifluorescence microscopy, flow cytometry, DNA extraction,
    and sequencing. Lectures will cover marine microbiology, CO2 sequestration (natural and engineered), geochemistry, coastal
    and open ocean habitat structure, and links to climate and the climate crisis. We will also address equity issues in marine
    conservation and the climate crisis. While all field work will be coastal, students will also learn about the open ocean
    due to the key linkages of water masses as well as climate feedback.
  core_tags:
  - biological_sciences
  crosslists:
  - ENSC 24600
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 27726. Marine Ecosystems: From Microbiomes, to Conservation, Climate & Beyond. 100 Units.'
- code: BIOS 27727
  title: Light and Color in the Ocean
  units: 100
  description: Spectacular optical adaptations shape marine life, from sunlit shallows to the deep sea. We will explore how
    ocean creatures manipulate light-becoming transparent, ultra-black, iridescent, vividly colored, or bioluminescent-through
    the lens of physics, photosynthesis, and visual systems. With morning lectures, afternoon hands-on work, local outings,
    and a final research project, students will learn the physics and biology of light in the ocean. We encourage students
    to develop publishable original research projects using the fantastic resources of the MBL.
  core_tags:
  - biological_sciences
  prereq_text: This course will be given at Marine Biological Laboratories, Woods Hole, Massachusetts. E.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 27727. Light and Color in the Ocean. 100 Units.
  needs_review: true
- code: BIOS 27728
  title: 'The Meaning of Life: Experimenting with the History of Biology in Woods Hole'
  units: 100
  description: This course, taught on-site at the Marine Biological Laboratory (MBL) in Woods Hole Massachusetts, examines
    early twentieth century biology through hands-on recreations of classic experiments. Course undertakings include working
    with organisms like sea urchins, starfish, hydras, slipper snails, and plankton; fieldwork in local beaches, ponds, and
    marshes; laboratory experimentation using early twentieth century equipment; and close readings of historical sources
    in early twentieth-century experimental biology. By the end of this course, students will have gained experiences collecting,
    identifying, caring for, and working with classic invertebrate model organisms; they will be able to identify and explain
    key concepts and techniques in biology between 1900 and today; and they will be able to parse historical sources and recreate
    the knowledge-making strategies that shaped early twentieth century biology.
  core_tags:
  - biological_sciences
  crosslists:
  - CEGU 27728
  prereq_text: This course can be counted as a biology topics course or as an upper-level elective for biology majors.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 27728. The Meaning of Life: Experimenting with the History of Biology in Woods Hole. 100 Units.'
  needs_review: true
- code: BIOS 27750
  title: 'Stem Cells and Regeneration: from aquatic research organisms to mammals'
  units: 100
  description: This course will focus on contemporary stem cell biology and regeneration with emphasis on molecular mechanisms
    and applications. The course will cover the history of stem cell discoveries through the latest advances, including genome-wide
    profiling, targeted gene editing, and other techniques used in stem cell and regeneration research. A portion of the course
    will consist of modules where specific stem cell types will be discussed together with relevant diseases they could impact
    (i.e. stem cells and neurodegeneration). A focus of the course will be around how discoveries in aquatic research organisms
    have driven the progress in regeneration biology. In this classroom and lab based course, students will have the opportunity
    to work on an independent research project under the supervision of a Resident Faculty at MBL. The lab portion of the
    course will introduce and provide hands-on experience on experimental approaches and techniques used in cell biology,
    development, and regeneration research. There will be a focus on microscopy (brightfield, fluorescence, high-resolution
    microscopy) and use of open source software to analyze images. There will be an introduction into the use of stains, antibodies,
    and genetically-encoded fluorescent markers to analyze cellular structures in aquatic organisms that include axolotls,
    Nematostella, worms, cephalopods and zebrafish. In addition, this course will provide hands-on experience through labs.
  core_tags:
  - biological_sciences
  prereq_text: Second-year standing or greater (or by consent) and acceptance into the Spring Quarter Program at MBL.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 27750. Stem Cells and Regeneration: from aquatic research organisms to mammals. 100 Units.'
  needs_review: true
- code: BIOS 27752
  title: 'Dynamic Camouflage: Behavior, Visual Perception and Neural Skin Patterning in Cephalopods'
  units: 100
  description: This course takes an integrative approach to understanding a neurally controlled system of dynamic defense
    against visual predators. Camouflage is a widespread form of defense throughout the animal kingdom in every known habitat
    - land or sea. In the oceans, cephalopods (cuttlefish, octopus, squid) have evolved a sophisticated sensorimotor system
    called Rapid Adaptive Coloration, which can instantaneously change their total body appearance within a fraction of a
    second to range from highly camouflaged to startlingly conspicuous for a wide range of behaviors. The forms and functions
    of this dynamic system will be teased apart in integrative fashion in a top-down approach from ecology to organismal biology
    to organs, tissues and cells. The course touches on neural anatomy, sensation, visual perception (including psychophysics)
    and animal behavior. There are also applied biology aspects of this system that will be presented as well.
  notes: E.
  core_tags:
  - biological_sciences
  crosslists:
  - NSCI 21530
  prereq_text: Second-year standing or greater (or by consent) and acceptance into the Spring Quarter Program at MBL.
  terms_offered:
  - SP
