- code: BIOS 13142
  title: 'From Fossils to Fermi''s Paradox: Origin and Evolution of Intelligent Life'
  units: 100
  description: 'The course approaches Fermi''s question, "Are we alone in the universe?," in the light of recent evidence
    primarily from three fields: the history and evolution of life on Earth (paleontology), the meaning and evolution of complex
    signaling and intelligence (cognitive science), and the distribution, composition and conditions on planets and exoplanets
    (astronomy). We also review the history and parameters governing extrasolar detection and signaling. The aim of the course
    is to assess the interplay between convergence and contingency in evolution, the selective advantage of intelligence,
    and the existence and nature of life elsewhere in the universe - in order to better understand the meaning of human existence.'
  core_tags:
  - biological_sciences
  crosslists:
