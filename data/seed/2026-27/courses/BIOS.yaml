- code: BIOS 10140
  title: Inquiry-based Exploration of Biology
  units: 100
  description: This inquiry-based approach permits students to learn fundamental biological principles while carrying out
    scientific experiments and expanding our knowledge of living systems. Each course will focus on a different Grand Challenge
    question in biology. In this context, students will conduct their own research projects to experience how biologists frame
    questions and test hypotheses. Classes will take place in the lab, integrating lectures, discussions, and experiments
    in active sessions, thus eliminating the separation between theory and practice. Students will also have an opportunity
    to develop communication skills during the quarter, presenting their proposals and results to their peers and instructors.
    Each course instructor will focus their section on a different major problem in the biological sciences that will frame
    the students' research questions.
