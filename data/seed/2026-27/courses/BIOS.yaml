- code: BIOS 13134
  title: 'It''s Not Easy Being Green: An Introduction to Plant Biology'
  units: 100
  description: During this course students will obtain a broad tour of plant biology as we explore the evolution, reproduction,
    physiology, genetics, and ecology of plants. We will also explore the importance of plants to human society. Emphasis
    will also be placed on understanding scientific research - from experimental design to data analysis and future implications.
    The course will feature a selection of readings from diverse perspectives about plants, their biology, and their cultural
    significance. This course will encourage students to use their strengths and interests to explore the biology and significance
    of plants and will allow flexibility to explore student questions and curiosities.
