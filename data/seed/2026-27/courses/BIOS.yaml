    quote: 'BIOS 14118. Mechanisms of Memory: How the Brain Stores Information. 100 Units.'
  needs_review: true
- code: BIOS 15115
  title: 'Cancer Biology: How Good Cells Go Bad'
  units: 100
  description: This lecture/discussion course examines the multi-step process by which normal cells become malignant cancer
    cells. Topics include how defects in the regulation of proliferation, differentiation, and apoptosis can occur in cancer
    cells, as well as how cancer cells can acquire the ability to attract blood vessels (angiogenesis) and to invade other
    organ systems (metastasis). We emphasize the study of signal transduction pathways and how they are altered in cancer
    cells. The concept of genes that cause cancer (oncogenes) and genes that deter cancer (tumor suppressor genes) is discussed.
    New disease treatments that target specific molecular defects within cancer cells are reviewed.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10130 or BIOS 10140. NO BIOLOGICAL SCIENCES MAJORS OR NON-BIOLOGY PRE-MED STUDENTS, except by petition.
  terms_offered:
