    quote: BIOS 20151. Introduction to Quantitative Modeling in Biology. 100 Units.
  needs_review: true
- code: BIOS 20153
  title: Fundamentals of Ecology and Evolutionary Biology
  units: 100
  description: This course surveys the basic principles of ecology and evolutionary biology to lay the foundation for further
    study in all fields of biology. Broad ecological concepts, such as population growth, disease dynamics, and species interactions,
    will be explored through a combination of published data, simulations, and mathematical models. The emphasis is placed
    on "ecological thinking". Essential topics in the modern study of evolutionary biology will be covered with a focus on
    both theory and empirical examples. Examples of topics include history of evolutionary thought, evidence for evolution,
    mechanisms of microevolution, phylogenetics, molecular evolution, and speciation.
  core_tags:
  - biological_sciences
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: BIOS 20153. Fundamentals of Ecology and Evolutionary Biology. 100 Units.
- code: BIOS 20170
  title: Microbial and Human Cell Biology
  units: 100
  description: This course is the entry point into an integrated biology sequence designed to prepare non-biology majors for
    application to schools in the health professions. We explore topics in human cell biology within the context of evolutionary
    biology, chemistry, microbiology, and medicine. We pay special attention to the influence of prokaryotes on the history
    of life and to the ecological interactions between humans and their microbiota, which have major implications for human
    health and disease. Students read and discuss papers from the scientific literature, attend discussions and gain experience
    with microbiological basic microscopy techniques in lab.
  core_tags:
  - biological_sciences
  prereq_text: This sequence is open only to students who are not planning to major in Biological Sciences or Biological Chemistry
    and cannot be applied to either of these majors. It is recommended that students start the sequence in their first or
    second year.
