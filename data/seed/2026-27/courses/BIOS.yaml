    quote: 'BIOS 27752. Dynamic Camouflage: Behavior, Visual Perception and Neural Skin Patterning in Cephalopods. 100 Units.'
  needs_review: true
- code: BIOS 27753
  title: Fundamentals of Synapses
  units: 100
  description: In this course, students will learn about the fundamentals of synapses, from molecular analysis to structure
    and function. Marine and aquatic models have historically provided a unique opportunity to investigate synaptic function
    due to the large size of their neurons, including the synaptic connections. Today, these synapse models are used to study
    basic principles of neuron-to-neuron communication (synaptic transmission), as well as disease mechanisms. In addition
    to lectures and discussions of key literature, this course will feature hands-on laboratory-based exercises in molecular
    genetics, imaging and physiology of synapses, as well as independent "discovery" projects to explore new topics in synapse
    biology.
  core_tags:
  - biological_sciences
  crosslists:
  - NSCI 21510
  prereq_text: Second-year standing or greater (or by consent) and acceptance into the Spring Quarter Program at MBL.
  terms_offered:
