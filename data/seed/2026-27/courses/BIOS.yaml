  - PSYC 28810
  prereq_text: 'PQ: Third or fourth-year standing. This course does not meet the requirements of the Biological Sciences major.
    Prerequisite(s) for BIOS 13142 only: BIOS 10130 or BIOS 10140. For BIOS 13142: NO BIOLOGICAL SCIENCES MAJORS OR NON-BIOLOGY
    PRE-MED STUDENTS, except by petition.'
  source:
