  title: Ecology - Marine Biological Laboratory
  units: 100
  description: This course examines the structure and functioning of terrestrial and aquatic ecosystems including the application
    of basic principles of community and ecosystem ecology. The course also examines contemporary environmental problems such
    as the impacts of global and local environmental change on community composition and food webs within forest, grassland,
    marsh and nearshore coastal ecosystems on Cape Cod. This course examines the structure and functioning of terrestrial
    and aquatic ecosystems including the application of basic principles of community and ecosystem ecology. The course also
    examines contemporary environmental problems such as the impacts of global and local environmental change on community
    composition and food webs within forest, grassland, marsh and nearshore coastal ecosystems on Cape Cod.
