    quote: BIOS 15126. Biology and Epidemiology of Cancer. 100 Units.
- code: BIOS 15127
  title: Plants, Pathogens, and People
  units: 100
  description: Students will explore the major plant disease causing pathogens and how scientists and farmers are working
    to protect our food supply. Students will explore the biology of the major groups of disease-causing microorganisms (bacteria,
    fungi, oomycetes, viruses, and nematodes). We will also learn how plants are protected from infection - including protection
    from plant immunity, genetic improvement, and disease management practices. Additionally, we will discuss how plant pathogens
    have and continue to shape society - from the Irish Potato Famine to modern day disease epidemics. Emphasis will be placed
    on understanding scientific research in the context of plant biology - from experimental design to data analysis. Students
    will apply their knowledge and critical thinking skills through case studies and analysis of new research findings. This
    course will encourage students to use their strengths and interests to explore plant pathology and will allow flexibility
    to explore student questions and curiosities.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10130 or BIOS 10140. NO BIOLOGICAL SCIENCES MAJORS OR NON-BIOLOGY PRE-MED STUDENTS, except by petition.
  terms_offered:
