  needs_review: true
- code: BIOS 20171
  title: Human Genetics and Developmental Biology
  units: 100
  description: This course covers the fundamentals of genetics, with an emphasis on human traits and diseases. Topics include
    Mendelian genetics, simple and complex traits, genetic diseases, the human genome, and testing for human traits and diseases.
    After establishing a foundation in genetics, we will discuss mechanisms underlying differentiation and development in
    humans. We will focus on events that lead to gastrulation and the establishment of the body plan (how humans develop from
    an un-patterned egg into a recognizable human form). Other topics may include limb development and stem cell biology.
  core_tags:
  - biological_sciences
  prereq_text: Not open to students who have not completed BIOS 20170. Must be taken concurrently with BIOS 20172.
