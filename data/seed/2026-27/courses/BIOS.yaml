    quote: BIOS 15127. Plants, Pathogens, and People. 100 Units.
  needs_review: true
- code: BIOS 15128
  title: 'Outbreak: Emerging and Evolving Viruses'
  units: 100
  description: Viruses are everywhere! There are viruses that infect all living organisms from bacteria to humans. While life
    and viruses have coexisted for billions of years, there are a number of viruses that can wreak havoc on their hosts by
    causing disease. From a human perspective, viral pathogens impact us both directly by causing human disease and indirectly
    by causing disease in organisms that are important to us on social, ecological, and economic levels. In recent decades,
    we have seen viruses emerge or reemerge to have significant impacts on health and the economy, both locally and globally.
    The COVID-19 pandemic, the global spread of mpox, recurring outbreaks of avian influenza (H5N1), and the resurgence of
    diseases such as dengue in expanding geographic regions underscore the continuing threat posed by both newly emerging
    and reemerging viruses. This class will focus on basic concepts of virology with a focus on emerging viruses. Beyond understanding
    the basics of a viral "life cycle", we will address questions such as how do new viruses emerge? How do viruses evolve
    and change over time? How does human activity impact the emergence of new viruses? How can we mitigate the impacts of
    these disease-causing emerging viruses? We will address these questions by examining viral outbreaks of the past, as well
    as contemporary ones.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10130 or BIOS 10140; NO BIOLOGICAL SCIENCES MAJORS AND NO NON-BIOLOGY PRE-MEDS, except by petition.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/biologicalsciencescore/
    quote: 'BIOS 15128. Outbreak: Emerging and Evolving Viruses. 100 Units.'
  needs_review: true
- code: BIOS 20151
  title: Introduction to Quantitative Modeling in Biology
  units: 100
  description: The goal for this course is to give future biologists the quantitative tools to fully participate in modern
    biological research. These include descriptive statistics, linear regression, stochastic independence and hypothesis testing,
    Markov models and stationary probability distributions, solutions of linear differential equations, equilibria and stability
    analysis of nonlinear differential equations. The ideas are applied to different areas of biology, e.g. molecular evolution,
    allometry, epidemiology, and biochemistry, and implemented by students in computer assignments using the R computational
    platform.
  notes: This course is required to partially fulfill the general education requirement in biology for Biological Sciences
    majors in all tracks except for students in the Advanced Biology sequence. This course cannot be used as a Topics course
    for the general education requirement for non-Biological Sciences majors.
  core_tags:
  - biological_sciences
  prereq_text: Two quarters of calculus of any sequence (MATH 13200 or 15200 or 16200). First-year Biology Major standing
    only.
