- code: BIOS 14117
  title: The Science and Art of Vision
  units: 100
  description: Why does a work of art evoke certain perceptual sensations or emotions? To what degree are these experiences
    shared or unique between individuals? This course will explore how scientific inquiry has contributed to our understanding
    of visual system function and our perception of the visual arts. We will evaluate hypotheses about the evolution of human
    vision and the impact of genetic and structural anomalies on perception. We will investigate how mechanisms of visual
    information processing influence the perception of art and how artists can exploit techniques that interface with the
    visual system to create striking impressions. The goal of this course is to enhance student appreciation for both the
    neuroanatomical and subjective bases for our experience of the visual arts.
  core_tags:
  - biological_sciences
  prereq_text: BIOS 10130 or BIOS 10140. NO BIOLOGICAL SCIENCES MAJORS, NEUROSCIENCE MAJORS, OR NON-BIOLOGY PRE-MED STUDENTS,
