  needs_review: true
- code: BIOS 14112
  title: 'Workings of the Human Brain: From Brain to Behavior'
  units: 100
  description: How do humans see, smell, hear, feel, think, and learn? This course examines how the brain generates behavior.
    Topics covered include the organization of the nervous system, the mechanisms by which the brain translates external stimuli
    into electrical and chemical signals to initiate or modify behavior, and the neurological bases of learning, memory, sleep,
    cognition, drug addiction, and neurological conditions. Each week, we will begin with a review of the microscopic workings
    of the cell and basic neuroanatomy and functional physiology and continue to a more macroscopic study of the senses, behavior,
    higher order mental processes, and psychological disorders. The goal of the course is to provide students with a basic
    understanding of how fundamental brain processes contribute to cognitive states and basic human behavior, as well as encourage
    further study in the "brain and behavioral sciences."
  core_tags:
