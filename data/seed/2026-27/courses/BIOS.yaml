    quote: BIOS 27716. Methods and Concepts in Oceanography- at Marine Biological Laboratory. 100 Units.
  needs_review: true
- code: BIOS 27717
  title: Marine Resource Use and Conservation- at Marine Biological Laboratory
  units: 100
  description: Students will learn about coastal and marine resource use and examine threats to ecosystem biodiversity and
    conservation exploring examples in the Cape Cod region and discussing global case studies. The course will review various
    methods and uses of aquaculture and mariculture for promoting the blue economy, their potential consequences, but also
    potential to mitigate climate change and nutrient pollution. We will also review the role of restoration in promoting
    ecosystem recovery and conservation. Field trips will include visits to local shellfish and finfish hatcheries, ongoing
    restoration projects, and conservation organizations. The course is organized into focused two- to four-day modules that
    include lectures, discussions of papers, field trips, and field and lab activities.
  core_tags:
  - biological_sciences
  crosslists:
  - ENSC 24450
  prereq_text: Consent only. Admission by application to the Semester in Environmental Science program at the Marine Biological
    Laboratory in Woods Hole, MA
  source:
