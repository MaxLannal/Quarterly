# Transfer general credit (Richard, FEEDBACK "Minor issues", 2026-11-16). Not a College Catalog
# course block: the source is Richard's note, quoted verbatim. It fills no program or Core
# requirement and is never offered in a quarter; a transfer credit mapped to it counts only
# toward the total units (the credit itself says how many units it carries). Tagged
# credit_only: the plan generator never places it in a quarter.
courses:
- code: TRNC 10100
  title: Transfer General Credit
  units: 100
  description: General credit for coursework transferred from another institution. It counts toward the total units for
    the degree but meets no program or Core requirement.
  repeatable: true
  tags:
  - credit_only
  source:
    url: docs/FEEDBACK.md
    quote: TRNC 10100 is currently not in the catalog. It is transfer general credit and every transfer student will receive
      some of them. They do not count as a course for any specific programs but students can use it to meet credit
      requirements.
  needs_review: true
