- code: PHSC 12900
  title: The Chemistry of Artists' Materials
  units: 100
  description: The goal of this course is to understand the fundamentals of molecular structure as applied to dyes, pigments,
    and other materials used in art and crafts. Students will gain general scientific literacy skills and engage with fundamental
    laboratory techniques in an inherently interdisciplinary way. The first part of the course will delve into molecular structure
    of organic dyes and inorganic pigments as well as principles behind how visible light interacts with these compounds to
    produce the colors we see. The fundamental set of techniques used to probe and explore these processes is called spectroscopy;
    these techniques will play a large role in the laboratory component. Throughout the rest of the course, a number of case
    studies of these principles will be investigated, including natural v. synthetic dyes and historical dye extraction processes,
    conservation and restoration of fine art, pigments and materials used in pottery, and the chemistry of stained glass.
    Additional topics will be driven by student interest. Course assignments will include readings, class discussions, homework
    sets, lab reports, and a final written pape
  notes: PHSC 12200 The Chemistry of Food and Cooking PHSC 12400 The Chemistry of Big Problems, and PHSC 12500 Molecular Mechanisms
    of Human Disease. Students who have credit for CHEM 10100, 11100, or 12100 by either taking the course or by AP credit
    (for CHEM 11100) and do not wish to take CHEM 10200, 11200, or 12200 may complete the general education requirement with
    any of the PHSC courses offered by the Department of Chemistry.
  core_tags:
