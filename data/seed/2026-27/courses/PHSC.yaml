- code: PHSC 10800
  title: 'Earth as a Planet: Exploring Our Place in the Universe'
  units: 100
  description: 'This course explores the diversity of bodies in our Solar System, and the physical and chemical processes
    that have shaped them over their histories. We will also discuss how these studies have carried us away from an Earth-centered
    view of the universe to one where Earth is just one of billions of planets that exist in our galaxy. Topics to be covered
    include: early observations of the Solar System and the laws of planetary motion, the formation and evolution of the Moon,
    the structure and geophysical evolution of the planets, and the search for habitable environments outside of Earth.'
  notes: Under no circumstances may a student receive credit for both PHSC 10100 and PHSC 10800.
  core_tags:
