- code: PHSC 11800
  title: Physics and Contemporary Architecture
  units: 100
  description: Architectural structures form the built environment around us and in many ways create the backbone of our civilization.
    They push the limits of form and function on the largest human scales, often leading to iconic masterpieces that symbolize
    the aesthetics as well as the technical achievements of a period. Many architectural advances have been made possible
    by breakthroughs in the science of materials, which then led to innovation in construction and fabrication techniques.
    This course will introduce the physics principles that have enabled some of the most innovative architecture of our time.
    This course will take key ideas and tools from physics and demonstrate their power and relevance in a broader context
    familiar from everyday experience. The course will challenge students to recognize physics concepts in the built structures
    that make up the urban environment we live in. Chicago is a most appropriate place for this study; it was the birthplace
    of the first skyscraper, and ever since it has played an internationally celebrated role in pushing the limits of the
    architectural state of the art. A long succession of renowned Chicago architects and structural engineers has turned this
    city into a premier laboratory for architectural innovation. Against this backdrop, the course will show how science,
    and physics in particular, delivers the conceptual foundations that drive current directions in architecture and open
    up new opportunities.
  notes: The course will consist of two lectures per week plus a weekly hands-on workshop (lab) component. The Monday lectures
    will introduce the physics principles to be explored that week. The Thursday lectures will be delivered by distinguished
    guest speakers, including renowned architects and engineers. These lectures will be public lectures. They will relate
    to the physics principle introduced that Monday and explore its ramification within the broader context of contemporary
    architectural practice. The Thursday afternoon workshop component will involve team-based, hands-on construction projects
    to develop a better understanding and intuition of the physics principles introduced in the lectures and to obtain a sense
    of their real-life implications. The workshops will also provide an opportunity to interact with the guest lecturers.
    Attendance at Thursday lectures is required. This course meets the general education requirement in the physical sciences
    and may be paired with PHSC 11600, 11700, 12600, or 13400 in order to complete the requirement. This course can be taken
    for credit towards either the general education requirement in the physical sciences or the Architectural Studies minor,
    but not both. Students intending to receive physical sciences general education credit should register for PHSC 11800;
    students intending to receive credit towards the Architectural Studies Minor should register for ARCH 11800.
  core_tags:
  - physical_sciences
  crosslists:
  - CHST 11800
  - ARCH 11800
  prereq_text: Some exposure to high-school physics is recommended
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 11800. Physics and Contemporary Architecture. 100 Units.
- code: PHSC 11900
  title: Getting Something for Nothing
  units: 100
  description: We can learn an incredible amount about the physical world with simple tools of estimation. So-called Fermi
    problems involve estimating quantities of interest to within an order of magnitude, or factor of 10, on the "back of an
    envelope." There are leanable techniques that we can use to approach these problems. Developing these skills is incredibly
    useful for physical scientists because it allows us to quickly estimate whether an idea is worth pursuing with expensive
    resources and time. More generally, order-of-magnitude estimation can keep you from getting fooled by journalists and
    politicians, or give you a trading edge in a competitive market. Finally, Fermi problems are common in interviews for
    jobs in finance, consulting, and software. Students in this course will develop techniques to quickly estimate physical
    science quantities to within an order of magnitude.
  core_tags:
  - physical_sciences
  crosslists:
  - GEOS 25600
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 11900. Getting Something for Nothing. 100 Units.
- code: PHSC 12200
  title: The Chemistry of Food and Cooking
  units: 100
  description: The goals of this course are for students to understand the everyday chemistry involved in food and cooking,
    gain science literacy, and critically evaluate food marketing. The first part of the course will explore the basics of
    food chemistry, establishing how the structure and properties of water, fats, proteins, and other macromolecules influence
    our eating and cooking experiences. We will also investigate the chemical components that contribute to color, flavor,
    and aroma in food. The rest of the course will examine consumer issues related to food science. What do the food labels
    organic, all-natural, and non-GMO actually mean from a chemistry perspective? What is the science involved in the plant-based
    meat industry? How can we use chemistry to be a more thoughtful consumer of food? Additional topics will be driven by
    student interest. The course will include a both a lecture and laboratory component. The laboratory sessions will involve
    case studies and application of lecture topics in a collaborative environment. Course assignments will include readings,
    class discussions, written papers, and a final presentation.
  notes: 'In order to complete the Physical Sciences Core Requirement, this course may be paired with: PHSC 11600, PHSC 11700,
    PHSC 12400, PHSC 12500, PHSC13400, PHSC 13600'
  core_tags:
  - physical_sciences
  crosslists:
