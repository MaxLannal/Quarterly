  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12700. Stars. 100 Units.
- code: PHSC 12710
  title: Galaxies
  units: 100
  description: Galaxies have been called island universes, places where stars are concentrated, where they are born, and where
    they die. The study of galaxies reaches back to the Renaissance; Galileo Galilei first pointed a telescope skyward in
    1610 and confirmed a then 2000 year-old Greek conjecture about the nature of our own galaxy -- the Milky Way. This course
    will use extensive modern observational data from a wide range of telescopes to trace the modern picture for the formation
    and evolution of galaxies and the stars in them. Galaxies will then be used as markers of yet larger scale structures,
    in order to explore the influence of gravity over cosmic time. The object of study in this course is galaxies, and the
    narrative arc traced through that extensive data and understanding will highlight our profound discovery that most of
    the mass in galaxies (and the Universe as a whole) is in fact an exotic form of matter -- dark matter -- that we cannot
    directly see. Quantitative analysis will be an important part of the course in both laboratory work and lectures, but
    mathematics beyond algebra and some geometric understanding will not be required. This course will feature several observationally-oriented
    labs that will allow students to directly experience how some of the modern understanding of galaxies has arisen. (L)
    This course will be offered in the Spring 2027 Study Abroad Paris Astronomy program.
  core_tags:
  - physical_sciences
  crosslists:
  - ASTR 12710
  prereq:
    any:
    - PHSC 10800
    - PHSC 12600
    - PHSC 12700
  prereq_text: PHSC 10800, PHSC 12600 or PHSC 12700. PHSC 12710 can be taken as the first course in a sequence combined with
    PHSC 12720.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12710. Galaxies. 100 Units.
  needs_review: true
- code: PHSC 12720
  title: Exoplanets
  units: 100
  description: The discovery of planets in orbit around other stars is one of the newest developments in astronomy, which
    set off a race to characterize these "exoplanetary" systems. The architectures of planetary systems are set by the formation
    of the parent star and its protoplanetary disk, but they also encode subsequent evolution. We are now able to place our
    Solar System into the context of other worlds, and we find some aspects familiar and other aspects quite alien. A challenging
    next step is to find planets like the Earth in orbit around stars like the Sun. This course will review the techniques
    for discovery of planets around other stars, what we have learned so far about exoplanetary systems, and the driving questions
    for the future, including the quest for habitable environments elsewhere. Although quantitative analysis will be an important
    part of the course, students will not be expected to employ mathematics beyond algebra. (L) This course will be offered
    in the Spring 2027 Study Abroad Paris Astronomy program.
