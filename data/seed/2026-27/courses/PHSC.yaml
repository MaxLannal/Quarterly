- code: PHSC 12600
  title: Matter, Energy, Space, and Time
  units: 100
  description: 'A comprehensive survey of how the physical world works, and how matter, energy, space, and time evolved from
    the beginning to the present. A brief survey of the historical development of mathematics, physics, and astronomy leads
    to a conceptual survey of the modern theory of the physical universe: space and time in relativity; the quantum theory
    of matter and energy; and the evolution of cosmic structure and composition. The major theme of this course is the understanding
    of all nature, from the prosaic to the exotic, using powerful quantitative theory grounded in precise experiments. Although
    quantitative analysis will be an important part of the course, students will not be expected to employ mathematics beyond
    algebra. (L)'
  core_tags:
  - physical_sciences
  crosslists:
  - ASTR 12600
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12600. Matter, Energy, Space, and Time. 100 Units.
- code: PHSC 12610
  title: Black Holes
  units: 100
  description: The past decade has seen the stunning discovery of gravitational waves from black holes merging together, allowing
    physical theory to be tested in the most exotic and extreme environment in the universe. Black holes are mathematically
    the most perfectly understood of any physical structure, but their visible effects can be extraordinarily complex. This
    course will survey the physics of space and time; the nature of black holes, neutron stars, and white dwarf stars; their
    effects on surrounding matter and light; the astrophysical contexts in which they are observed; and frontier areas of
    research. The development of Albert Einstein's theory of General Relativity will be placed in historical context, including
    a review of observational confirmation of predictions of the theory. Experimental work will include use of a robotic telescope
    to observe circumstances related to extreme gravity, such as supernovae and the centers of giant galaxies that harbor
    super-massive black holes. Quantitative analysis will be an important part of the course, but mathematics beyond algebra
    will not be required. (L)
  core_tags:
