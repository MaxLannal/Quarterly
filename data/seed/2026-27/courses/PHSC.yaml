    quote: PHSC 12400. The Chemistry of Big Problems. 100 Units.
- code: PHSC 12500
  title: Molecular Mechanisms of Human Disease
  units: 100
  description: This course will examine the molecular basis for a few specific instances of human disease. We will use each
    of these molecular case studies as a vehicle to demonstrate quantitative chemical principles such as thermodynamics, chemical
    equilibrium, chemical kinetics, diffusive dynamics, and DNA damage and repair. The goal of the course will be to use well-understood
    biological and medical examples to illustrate chemical principles and to give students a toolbox and techniques to understand
    molecular systems more broadly. The course will have a classroom lecture component as well as a laboratory component.
    The laboratory component will involve specific case studies and mechanistic proposals that represent exploratory independent
    work by teams of students. (L)
  notes: 'Note(s): In order to satisfy the general education requirements in the physical sciences PHSC 12500 may be combined
    with PHSC 123 Chemistry for an Alternative Energy Source or PHSC 12400 The Chemistry of Big Problems, If a student does
    not wish to continue with CHEM 10100 Introductory General Chemistry, CHEM 11100 Comprehensive General Chemistry, or CHEM
    12100 Honors General Chemistry sequence, they may take PHSC 12500 as the second course.'
