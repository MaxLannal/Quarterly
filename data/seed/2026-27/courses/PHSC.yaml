  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12610. Black Holes. 100 Units.
- code: PHSC 12620
  title: The Big Bang
  units: 100
  description: The Big Bang model describes the Universe on the largest scales and its evolution from the earliest observationally
    accessible times through the formation of the complex world we live in today. This powerful framework allows us to interpret
    a wide range of observations and to make detailed and precise predictions for new experiments. The key motivating observations
    include the expansion of the Universe and how it has changed with time; the existence of radiation indicating a hot and
    dense early phase; the abundance of the light elements; and how matter is organized over a wide range of physical scales.
    The model naturally incorporates dark matter and dark energy, two surprising and poorly understood components that govern
    the growth of structure over time. The course will explore the history of scientific cosmology and the evidence for the
    Big Bang model, its consequences for the earliest moments after the Big Bang, and its predictions for the eventual fate
    of the Universe. Labs will include a hands-on measurement of the relic cosmic microwave background radiation from the
    early universe and the use of astronomical data to verify key discoveries in the history of Big Bang cosmology. Quantitative
    analysis will be an important part of the course, but prior experience with mathematics beyond algebra will not be required.
    (L)
  core_tags:
  - physical_sciences
  crosslists:
  - ASTR 12620
  prereq: PHSC 12600
  prereq_text: Must have ASTR/PHSC 12600 Matter, Energy, Space and Time as the pre-requisite for ASTR/PHSC The Big Bang.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12620. The Big Bang. 100 Units.
- code: PHSC 12700
  title: Stars
  units: 100
  description: 'Elements such as carbon and oxygen are created in fusion reactions at high temperatures and pressures in the
    deep interiors of stars, conditions that naturally arise in stars like the Sun. This course will outline the physical
    principles at work and the history of the development of the key ideas: how nuclear physics and the theory of stellar
    interiors account for how stars shine, why they live for such long times, and how the heavy elements in their cores are
    dispersed to form a new generation of stars. Gravity assembles stars out of more diffuse material, a process that includes
    the formation of planetary systems. The course shows how, taken together, these physical processes naturally lead to the
    ingredients necessary for the emergence of life, namely elements like carbon, nitrogen, and oxygen, and planets in stable
    orbits around long-lived stars. The course features quantitative analysis of data; any tools needed beyond pre-calculus
    algebra will be taught as part of the course. (L) This course will be offered in the Spring 2027 Study Abroad Paris Astronomy
    program.'
  core_tags:
  - physical_sciences
  crosslists:
  - ASTR 12700
  terms_offered:
