    quote: 'PHSC 13000. Exploring the Organic Chemistry of Medicinal Plants: From Field to Laboratory. 100 Units.'
- code: PHSC 13400
  title: 'Global Warming: Understanding the Forecast'
  units: 100
  description: 'The future of human civilization depends on its ability to avoid, or adapt to, climate change associated with
    fossil-fuel (carbon) emissions. With so much at stake, it is important that citizens of the world understand the science
    which forms the foundation of what is understood about global climate change. The learning objectives of this course are
    to develop understanding of: (1) the historical and pre-historical records of global climate change, (2) the Earth''s
    carbon budget, (3) how the greenhouse effect determines temperature in Earth''s atmosphere and at the land and sea surface,
    (4) how climate projections are made, and (5) how present-day activities, both in the scientific research realm and in
    the socio-economic/political realm are shaping what will happen in the future. Course activity is partitioned into lectures
    (given by the course instructor), weekly laboratory-section activity (run by graduate teaching assistants), outside reading,
    and occasional homework. Assessment leading to a course grade will focus primarily on student performance in completing
    laboratory exercises and on a midterm and final exam. (L)'
  core_tags:
  - physical_sciences
  crosslists:
  - ENSC 13400
  - GEOS 13400
  mutually_exclusive:
