- code: PHSC 10100
  title: Origin and Evolution of the Solar System and the Earth
  units: 100
  description: 'This course examines the physical and chemical origins of planetary systems, the role of meteorite studies
    in this context, and a comparison of the Earth with neighboring planets. It then turns to chemical and physical processes
    that lead to internal differentiation of the Earth. Further topics include the thermal balance at the Earth''s surface
    (glaciation and the greenhouse effect), and the role of liquid water in controlling crustal geology and evolution. (L)
    Note: This course includes a lab section, but the labs can be done at home at any time with no need for specialized equipment.'
  notes: Under no circumstances may a student receive credit for both PHSC 10100 and PHSC 10800.
