- code: PHSC 11000
  title: Environmental History of the Earth
  units: 100
  description: This course considers how physical and biological processes determine environmental conditions at the surface
    of the Earth. The Spring Quarter version stresses how environments and life have changed over the 4.5 billion-year history
    of Earth (Webster). Topics include the methods of historical inference in geology; major transitions in the history of
    life, including the origin of life, the evolution of oxygen-producing photosynthesis, the origin of animals, and the series
    of massive extinctions that have repeatedly re-set ecosystems both on land and in the sea; and ecosystem evolution, including
    the environmental effects of human evolution. The Autumn Quarter version covers the same methodological ground but places
    greater stress on evaluating environmental and ecological changes within our present-day, increasingly human-dominated
    Anthropocene (Kidwell). In both versions, labs involve hands-on study of rock and fossil specimens, and analysis and interpretation
    of datasets drawn from the scientific literature and/or faculty research programs.
  notes: Due to significant overlap of course content, students may register for only one of PHSC 11000, BIOS 12117, or GEOS
    13900/BIOS 13123
  core_tags:
  - physical_sciences
  terms_offered:
