  prereq_text: Some previous background in Chemistry is recommended
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 12200. The Chemistry of Food and Cooking. 100 Units.
- code: PHSC 12400
  title: The Chemistry of Big Problems
  units: 100
  description: This course will discuss the chemistry of big problems that impact human life and society, such as the future
    accessibility of personal genetic sequence information, genetically modified organisms, or plastics and polymers and alternative
    sources of energy. We will use each of these topics as a window to grasp the underlying chemistry, reaction mechanisms,
    analytical methods, and quantitative chemical principles applied to major scientific issues that impact the world around
    us. Relevant examples will be considered in a discussion-oriented format to bring out chemical and analytical principles
    associated with big problems. The course will have a classroom lecture component as well as a laboratory component. The
    laboratory component will involve case studies and problem solving by application of analytical principles and independent
    work or teams of students. (L)
  notes: 'Note(s): In order to satisfy the general education requirements in the physical sciences PHSC 12400 may be combined
    with PHSC 12300 Chemistry for an Alternative Energy Source or PHSC 12500 Molecular Mechanisms of Human Disease. If a student
    does not wish to continue with CHEM 10100 Introductory General Chemistry, CHEM 11100 Comprehensive General Chemistry,
    or CHEM 12100 Honors General Chemistry sequence, they may take PHSC 12400 as the second course.,'
  core_tags:
