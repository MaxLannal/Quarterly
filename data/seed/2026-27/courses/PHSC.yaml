- code: PHSC 13600
  title: Natural Hazards
  units: 100
  description: This course presents the current understanding of high-impact weather and geologic events and an introduction
    to risk assessment and mitigation. Topics include an overview of geography, statistics, and societal impacts of the world's
    natural hazards; physics and forecasts of hurricanes, extratropical cyclones, tornadoes, earthquakes, tsunamis, volcanic
    eruptions, droughts, floods and wildfires; climate change and extreme weather events; quantifying and managing risks.
    (L)
  core_tags:
  - physical_sciences
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 13600. Natural Hazards. 100 Units.
- code: PHSC 13800
  title: 'GeoSciFi: Earth Science through the Lens of Science Fiction'
  units: 100
  description: GeoSciFi uses science fiction as a gateway to understanding how the Earth works and how physical laws constrain
    what is possible on other worlds. Familiar films and books provide starting points for exploring earthquakes, volcanoes,
    climate feedbacks, the origins of life, biological evolution, and planetary habitability. Rather than focusing on cinematic
    accuracy for its own sake, this course, instead, asks what real scientific processes underlie fictional scenarios and
    what would need to be true for them to occur. Through weekly lectures and a hands-on discussion/lab section, students
    will learn to reason from basic physical, chemical, and biological principles, interpret maps and data, and, ultimately,
    evaluate scientific claims in popular media. Labs emphasize low-math, conceptual engagement through experiments, measurements,
    and guided analysis. The course is open to all students, and no prior science coursework is required.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: 'PHSC 13800. GeoSciFi: Earth Science through the Lens of Science Fiction. 100 Units.'
- code: PHSC 15100
  title: Machine Learning and Artificial Intelligence for Molecular Discovery and Engineering
  units: 100
  description: The foundations of artificial intelligence can be dated back to Alan Turing's seminal 1950 paper in which the
    concept of "thinking machines" was first introduced and the 1956 Dartmouth Summer Conference in which the term artificial
    intelligence was first coined. The field has since passed through multiple epochs of development, and today artificial
    intelligence and machine learning are ubiquitous and enabling tools that pervade all corners of engineering discovery
    and practice. This course will survey the conceptual and historical basis of artificial intelligence and machine learning;
    the role, integration, and ethics of these approaches in modern engineering practice; the mathematical and algorithmic
    underpinnings of some popular machine learning techniques; and selected applications of these tools in particular applications
    in molecular engineering drawn from areas such as energy and sustainability, drug discovery, quantum science and information,
    materials science, and bioengineering.
  core_tags:
  - physical_sciences
  crosslists:
  - MENG 15100
  prereq_text: Quantitative analysis and numerical calculations will be an important part of the course, but mathematics beyond
    algebra will not be required and any necessary mathematics will be reviewed as part of the course.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 15100. Machine Learning and Artificial Intelligence for Molecular Discovery and Engineering. 100 Units.
- code: PHSC 15200
  title: Engineering for Human Health
  units: 100
  description: This course is designed to introduce undergraduates to the types of clinical problems that engineers solve
    and the physical concepts they apply to solve them. Various types of devices - from genetically engineered bacteria to
    biosensors - will be discussed, and we will explore the physics and chemistry necessary to understand and design each
    of these devices. We will also discuss many of the more practical concerns that influence the development of therapies,
    including intellectual property, regulation, and clinical trial design. In addition, students will learn how to work effectively
    in groups and to communicate their findings in a professional manner.
  core_tags:
  - physical_sciences
  crosslists:
  - MENG 15200
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 15200. Engineering for Human Health. 100 Units.
- code: PHSC 18000
  title: The Search for Extraterrestrial Life
  units: 100
  description: The origin of life is one of the biggest questions of modern science. While substantial progress has been made
    in understanding how life arose on our planet, such research represents just a single case study in how life originates
    and evolves. This course covers the search for life beyond Earth from the planets and moons of the Solar System to planets
    orbiting other stars and intelligent life that may have left its mark on macroscopic scales. The discovery of life beyond
    Earth would be transformative for our understanding of humanity's place in the universe. A range of ongoing and planned
    experiments have the potential to detect or put strong constraints on the existence of life during the next few decades.
    This class will mix traditional lectures with flipped classroom problem-solving sessions.
  crosslists:
  - ASTR 18000
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 18000. The Search for Extraterrestrial Life. 100 Units.
- code: PHSC 18100
  title: The Milky Way
  units: 100
  description: Within a largely empty universe, we live in a vast stellar "island" that we call the Milky Way. As we survey
    the stellar and interstellar components of the Milky Way-the distribution and motions of stars and interstellar gas, and
    how these dynamic, ever-changing components interact with each other during their life cycles inside the Milky Way-we
    will follow the path of ancient astronomers, wonder at their mistakes and prejudices, and form our own understanding.
  crosslists:
  - ASTR 18100
  prereq_text: Any two-course 10000-level general education sequence in chemistry, geophysical sciences, physical sciences,
    or physics. Can be used as a third course in physical sciences to meet the general education requirement (of six courses
    total in the biological, physical, and mathematical sciences).
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 18100. The Milky Way. 100 Units.
  needs_review: true
- code: PHSC 18200
  title: The Origin and Evolution of the Universe
  units: 100
  description: This course provides a comprehensive introduction to modern cosmology. It will discuss how the fundamental
    laws of physics allow us to understand the origin, evolution, and large-scale structure of the universe. After a brief
    review of the history of cosmology, the course will cover the expansion of the universe, Newtonian cosmology, Einstein's
    Special and General Relativity, black holes, dark matter, dark energy, the Cosmic Microwave Background radiation, Big
    Bang nucleosynthesis, the early universe, primordial inflation, the origin and evolution of large-scale structure in the
    universe, and cosmic surveys that are probing inflation and cosmic acceleration.
  crosslists:
  - ASTR 18200
  prereq_text: No pre-requisites. May not be taken if previous enrollment in ASTR/PHSC 12620 Big Bang.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 18200. The Origin and Evolution of the Universe. 100 Units.
  needs_review: true
- code: PHSC 28102
  title: 'Science Communication: Producing a Science Video Story'
  units: 100
  description: Students will gain skills in oral communication and will apply these skills to produce a video communicating
    primary research in a scientific area of the student's choice. The goal is effective, engaging communication of science
    to a general audience without sacrificing scientific accuracy or complexity. Students will work with faculty to write
    scripts and design visual and audio elements. The talks will be filmed and edited in collaboration with UChicago Creative,
    who will assist with visual aids and animation. Students will leave the course with a professionally produced video that
    they can use to advance their career and promote their topic. While this course naturally follows BIOS 28101, that course
    is not a pre-requisite.
  crosslists:
  - BIOS 28102
  - SCPD 11200
  prereq:
    any:
    - standing: third-year
    - standing: fourth-year
  prereq_text: Three quarters of a Biological Sciences Fundamentals sequence. Third- or fourth-year standing. This course
    does not satisfy the general education requirement in the physical sciences.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: 'PHSC 28102. Science Communication: Producing a Science Video Story. 100 Units.'
  needs_review: true
- code: PHSC 28104
  title: 'Science Communication: Crafting a Science Think Piece'
  units: 100
  description: Science think pieces are an important genre of public writing. Think pieces are longform journalism typically
    ranging between 2,000 and 5,000 words that appear in print and online publications. Readers of all kinds turn to science
    think pieces to understand critical issues in STEM fields and get a big picture perspective. Science think pieces provide
    deep context, informed perspective, and expert synthesis of the most recent data and findings. They have the power to
    shape public opinion and influence science policy. This course guides students through the process of conceiving, developing,
    pitching, writing, and potentially publishing an engaging and persuasive science think piece. Through reading-inspired
    group discussions and instructor-led writing projects, the course introduces students to current theories and best practices
    of science communication as well as everyday processes in science journalism and public-facing science writing. Students
    will finish the course with a polished science think piece ready for submission to potential venues for publication. No
    prior knowledge of science communication is required.
  crosslists:
  - SCPD 11300
  - HIPS 11300
  - CCSG 22702
  prereq:
    any:
    - standing: third-year
    - standing: fourth-year
    - consent: instructor
  prereq_text: Three quarters of physical or biological (including neuroscience) sciences. Third- or fourth-year standing
    or consent of instructor.
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: 'PHSC 28104. Science Communication: Crafting a Science Think Piece. 100 Units.'
  needs_review: true
- code: PHSC 28500
  title: Effective Writing in the Sciences
  units: 100
  description: 'This course will help undergraduates majoring in the sciences write effectively in major-level coursework
    and thesis research. The course is in its pilot year; in future years, the course''s graduates may be eligible to serve
    as teaching assistants in it. For this reason, although the course is mostly devoted to scientific writing, it will include
    a component on how to teach writing, potentially helping undergraduate science students obtain broader impacts opportunities
    in science communication. Our reading texts will range from lab reports and posters to advanced scientific work such as
    research articles, review articles, and grant proposals. We''ll analyze how these documents are structured, discuss strategies
    for reading them efficiently, and discuss what makes them succeed (or not). We''ll develop strategies for note- taking,
    drafting, and revision. Our ultimate purposes: communicating complex information clearly, articulating research questions,
    justifying the plausibility of methods, and explaining how new research contributes to the advancement of a field. All
    these writing tasks must ultimately be tailored to meet the needs of the many audiences that working scientists address,
    including not only researchers in the field but funding agencies, policymakers, and the general public."'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: PHSC 28500. Effective Writing in the Sciences. 100 Units.
- code: PHSC 29103
  title: 'Science Communication: Building a Science Exhibit'
  units: 100
  description: Students will work as a class to create an interactive physical exhibit that communicates a particular scientific
    topic to the public. The student-created exhibit will be displayed either on campus or across the city of Chicago. We
    will welcome guest speakers who are experts in data visualization, visual arts, and museum exhibits to demonstrate the
    variety of ways science can be communicated. Students will also take field trips to the local museums to observe the different
    ways in which research and science communication work together. Students will critically analyze exhibits, evaluate how
    exhibits and approaches across the city are similar and different, and reflect on the variety of approaches. An advisory
    board of researchers from local Chicagoland museums will inform and review the final exhibits.
  notes: This course does not meet the requirements for the Biological Sciences major. This course does not satisfy the general
    education requirement in the physical sciences.
  crosslists:
  - BIOS 29103
  prereq:
    any:
    - standing: third-year
    - standing: fourth-year
  prereq_text: Third- or fourth-year standing.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/physicalsciences/
    quote: 'PHSC 29103. Science Communication: Building a Science Exhibit. 100 Units.'
