    quote: STAT 24300. Numerical Linear Algebra. 100 Units.
- code: STAT 24310
  title: 'Numerical Linear Algebra: An Introduction to Computation'
  units: 100
  description: Computation is an essential topic across the physical and social sciences, in statistics, data science, and
    machine learning. Numerical linear algebra is the essential language of computation. Through a series of hands-on applications,
    students will implement and evaluate the essential algorithms used to solve linear systems and least squares problems,
    perform regression, orthogonalize bases, decompose signals via the FFT and related transforms, and perform matrix factorizations.
    We will focus on the computational complexity and stability of each algorithm, as well as its practical uses. Example
    applications include iterative optimizers used to solve large systems arising in engineering, spectral embedding methods
    for dimension reduction (PCA, MDS, and diffusion maps), and linear methods for classification and clustering. Examples
    will be presented as interactive coding notebooks available through a web browser. Prior coding experience is strongly
    encouraged, though students looking for an introduction to Jupyter notebooks and Python are welcome to enroll.
  crosslists:
  - CAAM 24310
  prereq_text: STAT 24300 or an equivalent introductory linear algebra class. Coding experience in Python, Matlab, R, or Julia
    is strongly recommended. Master's students must be in Statistics, Computational and Applied Mathematics, Data Science,
    Mathematics, or Financial Mathematics, or have consent of instructor.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: 'STAT 24310. Numerical Linear Algebra: An Introduction to Computation. 100 Units.'
  needs_review: true
- code: STAT 24320
  title: Applications in Numerical Linear Algebra
  units: 100
  description: This course delves into the practical applications of methods in numerical linear algebra. Students will see
    how material first introduced in STAT 24300 can be applied to problems in data analysis, dynamical systems, and statistics.
    Topics will include projection and orthogonality for optimization in linear systems; spectral methods for discrete time
    dynamical systems and sampling algorithms including Markov Chain Monte Carlo; and matrix decompositions such as QR and
    SVD for dimensionality reduction techniques including PCA and others. For each topic, students will have multiple opportunities
    to apply the methods to real data sets. While this course will not emphasize programming, some familiarity with Python
    or Julia is encouraged.
  prereq_text: STAT 24300 or an equivalent introductory linear algebra class. Coding experience in Python, Matlab, R, or Julia
