- code: STAT 25250
  title: Fundamentals of Probability in Statistical Inference
  units: 100
  description: This course provides the necessary probabilistic foundation for tackling statistical problems and explores
    how these concepts can be applied to real-world data. Beginning with an introduction to probability and statistical inference,
    the course develops a framework for understanding convergence of probability measures, including convergence in distribution,
    probability, and almost sure convergence. We examine the Law of Large Numbers and the Central Limit Theorem, emphasizing
    their importance in statistical inference and real-world applications. Markov Chains are introduced with a focus on their
    recurrence, transience, and ergodicity, along with their applications in sampling techniques like Markov Chain Monte Carlo
    and simulated annealing. Methods for parameter estimation are explored in depth. The efficiency and asymptotic properties
    of estimators are discussed using tools such as the Cramer-Rao bound. Hypothesis testing methods, including Wald tests,
    t-tests, and goodness-of-fit tests, are studied in detail, with particular emphasis on their asymptotic consistency and
    power analysis. Bayesian approaches, such as prior and posterior distributions, Bayesian confidence regions, and the Bernstein-von
    Mises Theorem, are also covered. The course concludes with problems in regression methods, including linear models, least-squares
    estimation, inference, and a brief exploration of high-dimensional linear regression.
  prereq:
    all:
    - STAT 25100
    - STAT 24400
  prereq_text: STAT 25100 and STAT 24400. Master's students must be in Statistics, Computational and Applied Mathematics,
    Data Science, Mathematics, or Financial Mathematics, or have consent of instructor.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: STAT 25250. Fundamentals of Probability in Statistical Inference. 100 Units.
- code: STAT 25300
  title: Introduction to Probability Models
  units: 100
  description: This course introduces stochastic processes as models for a variety of phenomena in the physical and biological
    sciences. Following a brief review of basic concepts in probability, we introduce stochastic processes that are popular
    in applications in sciences (e.g., discrete time Markov chain, the Poisson process, continuous time Markov process, renewal
    process and Brownian motion).
