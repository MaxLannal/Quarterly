- code: STAT 27815
  title: Practical R Programming
  units: 100
  description: This course covers a practical set of skills vital to modern statistics and data science in handling messy,
    real-world data. Throughout the course, students will practice reproducible research with version control and literate
    programming. They will think algorithmically with base R objects, control flow, functions, and iteration. Students will
    also be introduced to a variety of tidyverse data wrangling methods to import, clean, transform, join, and summarize their
    data. Finally, students will visualize and explore data using the grammar of graphics framework. Additional introductory
    topics may be discussed. No programming experience is required, although some will be helpful. Credit may not be earned
    for both STAT 27815 and STAT 37815.
  prereq:
    any:
    - STAT 22000
    - STAT 22200
    - STAT 22400
    - STAT 22600
