  title: Machine Learning
  units: 100
  description: 'This course introduces the foundations of machine learning and provides a systematic view of a range of machine
    learning algorithms. Topics covered include two parts: (1) a gentle introduction of machine learning: generalization and
    model selection, regression and classification, kernels, neural networks, clustering and dimensionality reduction; (2)
    a statistical perspective of machine learning, where we will dive into several probabilistic supervised and unsupervised
    models, including logistic regression, Gaussian mixture models, and generative adversarial networks.'
