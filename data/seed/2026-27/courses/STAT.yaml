- code: STAT 28000
  title: Optimization
  units: 100
  description: This is an introductory course on optimization that will cover the rudiments of unconstrained and constrained
    optimization of a real-valued multivariate function. The focus is on the settings where this function is, respectively,
    linear, quadratic, convex, or differentiable. Time permitting, topics such as nonsmooth, integer, vector, and dynamic
    optimization may be briefly addressed. Materials will include basic duality theory, optimality conditions, and intractability
    results, as well as algorithms and applications.
  crosslists:
  - CAAM 28000
  prereq:
    all:
    - any:
      - MATH 20500
      - MATH 20510
      - MATH 20520
      - MATH 20800
    - any:
      - STAT 24300
      - MATH 20250
      - MATH 20700
  prereq_text: (MATH 20500 or MATH 20510 or MATH 20520 or MATH 20800) and (STAT 24300 or MATH 20250 or MATH 20700). Master's
    students must be in Statistics, Computational and Applied Mathematics, Data Science, Mathematics, or Financial Mathematics,
    or have consent of instructor.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: STAT 28000. Optimization. 100 Units.
- code: STAT 28200
  title: Dynamical Systems with Applications
  units: 100
  description: This course is concerned with the analysis of nonlinear dynamical systems arising in the context of mathematical
    modeling. The focus is on qualitative analysis of solutions as trajectories in phase space, including the role of invariant
    manifolds as organizers of behavior. Local and global bifurcations, which occur as system parameters change, will be highlighted,
    along with other dimension reduction methods that arise when there is a natural time-scale separation. Concepts of bi-stability,
    spontaneous oscillations, and chaotic dynamics will be explored through investigation of conceptual mathematical models
    arising in the physical and biological sciences.
  crosslists:
  - CAAM 31405
  - STAT 31405
  - CAAM 28200
  prereq_text: MATH 27300 or (Multivariable calculus (MATH 18400 or 19520 or 20000 or 20400 or 20410 or PHYS 22100 or equivalent),
    AND linear algebra, including eigenvalues & eigenvectors (MATH 18600 or 19620 or 20250 or 20700 or STAT 24300)). Previous
    knowledge of elementary differential equations is helpful but not required. Master's students must be in Statistics, Computational
    and Applied Mathematics, Data Science, Mathematics, or Financial Mathematics, or have consent of instructor.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: STAT 28200. Dynamical Systems with Applications. 100 Units.
  needs_review: true
