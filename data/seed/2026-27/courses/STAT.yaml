- code: STAT 27750
  title: Further Topics in Machine Learning
  units: 100
  description: This is an intermediate-to-advanced course in machine learning. You should have taken at least one course in
    machine learning before and be familiar with both theoretical foundations---(empirical) risk minimization and friends---as
    well as having some practical experience fitting machine learning models to data. The intended material covered by the
