- code: STAT 10001
  title: Collaborative Learning in Statistics 20000
  units: 0
  description: This is an optional, limited enrollment workshop for students concurrently enrolled in STAT 20000 Elementary
    Statistics. Undergraduate Team Leaders guide small groups of students in weekly workshops. The workshops focus on the
    analysis of problem sets designed to augment and complement the Elementary Statistics material. Instead of tutoring or
    lecturing, Team Leaders coach students as they work collaboratively in small groups on the assigned problems by referencing
    class lectures and assigned reading materials. The workshops do not repeat but extend the substantive discussions and
    lectures of the Elementary Statistics course. Additionally, these workshops aim to develop communication skills, cooperative
    attitudes, and promote a teamwork environment. Because the benefits of collaborative learning can only be gained through
