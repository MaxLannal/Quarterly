- code: STAT 24300
  title: Numerical Linear Algebra
  units: 100
  description: This course is devoted to the basic theory of linear algebra and its significant applications in scientific
    computing. The objective is to introduce students to the tools needed to state, analyze, and solve multivariate problems.
    Students should leave the course ready to use linear algebra in future courses in algorithms, scientific computing, mathematical
    modeling, signal processing, multivariate statistics, data analysis, as well as the physical and social sciences. Topics
    include Gaussian elimination, vector spaces, linear transformations and associated fundamental subspaces, orthogonality
    and projections, eigenvectors and eigenvalues, diagonalization of real symmetric and complex Hermitian matrices, the spectral
    theorem, and matrix decompositions (QR, and Singular Value Decompositions). Systematic methods applicable in high dimensions
    and techniques commonly used in scientific computing are emphasized. Students enrolled in the graduate level STAT 30750
    will have additional work in assignments, exams, and projects including applications of matrix algebra in statistics and
    numerical computations implemented in Matlab or R. Some programming exercises will appear as optional work for students
    enrolled in the undergraduate level STAT 24300.
  prereq:
    any:
    - MATH 16300
    - MATH 16310
    - MATH 18300
    - MATH 19620
    - MATH 20300
    - MATH 20310
    - MATH 20320
  prereq_text: MATH 16300 or MATH 16310 or MATH 18300 or MATH 19620 or MATH 20300 or MATH 20310 or MATH 20320. Or graduate
    student in Statistics or Financial Mathematics. Master's students must be in Statistics, Computational and Applied Mathematics,
    Data Science, Mathematics, or Financial Mathematics, or have consent of instructor.
  terms_offered:
