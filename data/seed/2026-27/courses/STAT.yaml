- code: STAT 10118
  title: Pathways in Data Science
  units: 100
  description: Learn how to glean insights and meaning from complex sets of data in this overview of a field with growing
    importance in business, government, and scientific research. Students will learn to use the transformational tools of
    data science and see how researchers are applying them in the service of social good. Working with faculty from the Department
    of Statistics, students will study how data is collected and stored and then how it is explored, visualized, and communicated.
    Using Python, students will learn techniques for classification, prediction, inference, and regression. Then, together
    with researchers from the University of Chicago Urban Labs, students will explore how these tools and methods can be used
    to inform social policy in multiple domains including poverty, health, and social mobility. Throughout the course, visiting
    guest lecturers will broaden students' perspectives by sharing how data science is used in their diverse fields, ranging
    from business applications to biology.
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: STAT 10118. Pathways in Data Science. 100 Units.
- code: STAT 11800
  title: Introduction to Data Science I
  units: 100
  description: Data science provides tools for gaining insight into specific problems using data, through computation, statistics
    and visualization. This course introduces students to all aspects of a data analysis process, from posing questions, designing
    data collection strategies, management+storing and processing of data, exploratory tools and visualization, statistical
    inference, prediction, interpretation and communication of results. Simple techniques for data analysis are used to illustrate
    both effective and fallacious uses of data science tools. Although this course is designed to be at the level of mathematical
    sciences courses in the Core, with little background required, we expect the students to develop computational skills
    that will allow them to analyze data. Computation will be done using Python and Jupyter Notebook.
  crosslists:
