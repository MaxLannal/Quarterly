- code: STAT 26300
  title: Introduction to Statistical Genetics
  units: 100
  description: As a result of technological advances over the past few decades, there is a tremendous wealth of genetic data
    currently being collected. These data have the potential to shed light on the genetic factors influencing traits and diseases,
    as well as on questions of ancestry and population history. The aim of this course is to develop a thorough understanding
    of probabilistic models and statistical theory and methods underlying analysis of genetic data, focusing on problems in
    complex trait mapping, with some coverage of population genetics. Although the case studies are all in the area of statistical
    genetics, the statistical inference topics, which will include likelihood-based inference, linear mixed models, and restricted
    maximum likelihood, among others, are widely applicable to other areas. No biological background is needed, but a strong
    foundation in linear algebra, as well as probability and statistics at the level of STAT 24400-STAT 24500 or higher is
    assumed.
  crosslists:
