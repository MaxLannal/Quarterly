  needs_review: true
- code: STAT 27400
  title: Nonparametric Inference
  units: 100
  description: Nonparametric inference is about developing statistical methods and models that make weak assumptions. A typical
    nonparametric approach estimates a nonlinear function from an infinite dimensional space rather than a linear model from
    a finite dimensional space. This course gives an introduction to nonparametric inference, with a focus on density estimation,
    regression, confidence sets, orthogonal functions, random processes, and kernels. The course treats nonparametric methodology
    and its use, together with theory that explains the statistical properties of the methods.
  crosslists:
  - DATA 27400
  - STAT 37400
  - DATA 37400
  prereq_text: STAT 24400 or STAT 24410 w/B- or better is required; alternatively STAT 22400 w/B+ or better and exposure to
