- code: STAT 24400
  title: Statistical Theory and Methods I
  units: 100
  description: This course is the first quarter of a two-quarter systematic introduction to the principles and techniques
    of statistics, as well as to practical considerations in the analysis of data, with emphasis on the analysis of experimental
    data. This course covers tools from probability and the elements of statistical theory. Topics include the definitions
    of probability and random variables, binomial and other discrete probability distributions, normal and other continuous
    probability distributions, joint probability distributions and the transformation of random variables, principles of inference
    (including Bayesian inference), maximum likelihood estimation, hypothesis testing and confidence intervals, likelihood
    ratio tests, multinomial distributions, and chi-square tests. Examples are drawn from the social, physical, and biological
    sciences. The coverage of topics in probability is limited and brief, so students who have taken a course in probability
    find reinforcement rather than redundancy. Students who have already taken STAT 25100 have the option to take STAT 24410
    (if offered) instead of STAT 24400.
