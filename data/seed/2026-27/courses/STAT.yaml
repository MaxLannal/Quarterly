- code: STAT 27420
  title: Introduction to Causality with Machine Learning
  units: 100
  description: This course is an introduction to causal inference. We'll cover the core ideas of causal inference and what
    distinguishes it from traditional observational modeling. This includes an introduction to some foundational ideas---structural
    equation models, causal directed acyclic graphs, and then do calculus. The course has a particular emphasis on the estimation
    of causal effects using machine learning methods.
