- code: STAT 27850
  title: Multiple Testing, Modern Inference, and Replicability
  units: 100
  description: This course examines the problems of multiple testing and statistical inference from a modern point of view.
    High-dimensional data is now common in many applications across the biological, physical, and social sciences. With this
    increased capacity to generate and analyze data, classical statistical methods may no longer ensure the reliability or
    replicability of scientific discoveries. We will examine a range of modern methods that provide statistical inference
    tools in the context of modern large-scale data analysis. The course will have weekly assignments as well as a final project,
    both of which will include both theoretical and computational components.
  crosslists:
  - STAT 30850
  prereq_text: STAT 24400 or STAT 24410. Familiarity with regression and with coding in R are recommended. Master's students
    must be in Statistics, Computational and Applied Mathematics, Data Science, Mathematics, or Financial Mathematics, or
    have consent of instructor.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/statistics/
    quote: STAT 27850. Multiple Testing, Modern Inference, and Replicability. 100 Units.
  needs_review: true
- code: STAT 27855
  title: Hypothesis Testing with Empirical Bayes Methodology
  units: 100
  description: Large scale data sets regularly produced in fields such as biology, social sciences, and neuroscience bring
    new challenges, like controlling the amount of false positives when testing many hypotheses, as well as the opportunity
    to leverage information across the entire dataset toward making individual inferences. In this course, we will study theoretical
    foundations and practical aspects of hypothesis testing in a Bayesian framework. We will focus attention on the local
    false discovery rate (lfdr), which represents the probability that the null hypothesis is true given the data, and learn
    several methods for estimating this quantity. Decision theory provides a formal connection between quantities of interest
    in a Bayesian framework to population parameters in a strictly frequentist model, where the truth status of each null
    hypothesis is fixed and unknown. We may also discuss methodology for estimating the null distribution, and methods for
    finite-sample lfdr control if time permits. Homework assignments will have theoretical and computational components.
  prereq:
    any:
    - STAT 24400
    - STAT 24410
    - consent: instructor
  prereq_text: STAT 24400 or STAT 24410 or consent of instructor. Master's students must be in Statistics, Computational and
    Applied Mathematics, Data Science, Mathematics, or Financial Mathematics, or have consent of instructor.
  source:
