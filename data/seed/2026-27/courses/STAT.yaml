- code: STAT 26700
  title: History of Statistics
  units: 100
  description: This course covers topics in the history of statistics, from the eleventh century to the middle of the twentieth
    century. We focus on the period from 1650 to 1950, with an emphasis on the mathematical developments in the theory of
    probability and how they came to be used in the sciences. Our goals are both to quantify uncertainty in observational
    data and to develop a conceptual framework for scientific theories. This course includes broad views of the development
    of the subject and closer looks at specific people and investigations, including reanalyses of historical data.
  crosslists:
  - HIPS 25600
  - CHSS 32900
  - STAT 36700
  prereq_text: Prior statistics course
