- code: STAT 22810
  title: Epidemiology and Population Health
  units: 100
  description: Epidemiology is the basic science of public health. It is the study of how diseases are distributed across
    populations and how one designs population-based studies to learn about disease causes, with the object of identifying
    preventive strategies. Epidemiology is a quantitative field and draws on biostatistical methods. Historically, epidemiology's
    roots were in the investigation of infectious disease outbreaks and epidemics. Since the mid-twentieth century, the scope
    of epidemiologic investigations has expanded to a fuller range non-infectious diseases and health problems. This course
    will introduce classic studies, study designs and analytic methods, with a focus on global health problems.
