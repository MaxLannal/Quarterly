- code: STAT 27751
  title: Trustworthy Machine Learning
  units: 100
  description: Machine learning systems are routinely used in safety critical situations in the real world. However, they
    often dramatically fail! This course covers foundational and practical concerns in building machine learning systems that
    can be trusted. Topics include foundational issues---when do systems generalize, and why, essential results in fairness
    and domain shifts, and evaluations beyond standard test/train splits. This is an intermediate level course in machine
    learning; students should have at least one previous course in machine learning.
  crosslists:
