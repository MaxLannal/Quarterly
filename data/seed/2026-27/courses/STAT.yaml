- code: STAT 27700
  title: Mathematical Foundations of Machine Learning
  units: 100
  description: This course is an introduction to the mathematical foundations of machine learning that focuses on matrix methods
    and features real-world applications ranging from classification and clustering to denoising and data analysis. Mathematical
    topics covered include linear equations, regression, regularization, the singular value decomposition, and iterative algorithms.
    Machine learning topics include classification and regression, support vector machines, kernel methods, clustering, matrix
    completion, neural networks, and deep learning. Students are expected to have taken calculus and have exposure to numerical
    computing (e.g. Matlab, Python, Julia, R).
  notes: Undergraduate students are not allowed to enroll in CMSC 35300.
