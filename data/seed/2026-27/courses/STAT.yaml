- code: STAT 20010
  title: Elementary Statistics Through Case Study
  units: 100
  description: 'This course uses a single real-world case study to introduce statistical concepts throughout the quarter.
    Topics include methods for the collection, presentation, analysis, and interpretation of data, including elements of sampling,
    simple techniques for analysis of means, proportions, and linear association. The case study examines the development
    of the water contamination crisis in Flint, Michigan, from its beginnings in 2014 to present day conditions. Students
    will use statistical techniques learned in the course to probe critical facets of the story including: the demographics
    and history of Flint; the evidence for (and uncertainty about) the existence of contamination; statistical mistakes that
    allowed officials to initially deny the problem; and predictions for future health effects due to the contamination. Throughout
    the course, students will practice critically examining claims made in the media and in scientific publications. At the
    end of the quarter, students are asked to use their statistical skills to propose and defend a set of interventions to
    benefit the children of Flint.'
  core_tags:
