courses:
- code: JWSC 12000
  title: 'Jewish Civilization I: Ancient Beginnings to Medieval Period'
  units: 100
  description: This course provides an interdisciplinary introduction to the textual, geo-political, social, economic, religious,
    and cultural developments, transformations, and conflicts that shaped Jewish civilization between the first millennium
    BCE and the end of the Middle Ages. Working both chronologically and thematically, we read a range of primary sources
    tracking the development of the Jewish biblical canon, Jewish writings from the Greco-Roman period, the formation of rabbinic
    Judaism, and the changes across the Jewish diaspora brought on by the rise and expansion of Christianity and Islam. Throughout
    the course, we look at how Judaism was shaped by interactions with neighboring civilizations, as well as the debates Jewish
    communities had among themselves about what Jewish civilization is or ought to be. Topics covered include the growing
    significance of textual interpretation; Jewish political and religious vulnerability under foreign rule; anti-Judaism;
    Jewish religious, cultural, and intellectual creativity; and the role played by class, gender, legal status, and other
    hierarchies in our sources. Readings may include selections from the Hebrew Bible, the Dead Sea Scrolls, Christian New
    Testament, Josephus, Philo, Talmud, the Qur'an, the Cairo Genizah, Maimonides, Kabbalah, Crusade Chronicles, and the edict
    of Jewish expulsion from Spain. All texts are read in English translation.
  core_tags:
  - civilization
  crosslists:
