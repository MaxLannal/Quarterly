- code: HUMA 18100
  title: Poetry and the Human II
  units: 100
  description: In Winter (crisis/performance/politics), we turn to questions of social rupture, breakdown, and reformation
    as we consider the ways that poetry revolts, reflects, and rebuilds in political crises. We will also look at poetry in
    performance, and performance as poetry, to consider how poetry is practiced in non-textual media such as spoken word,
    film, visual arts, and dance.
  notes: These courses must be taken in sequence
  core_tags:
