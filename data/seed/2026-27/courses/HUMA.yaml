- code: HUMA 12050
  title: 'Greece and Rome: Texts, Traditions, Transformations I'
  units: 100
  description: In the Autumn quarter of the sequence, we will examine the epic tradition as it is received - and transformed
    - in Homer, Vergil, and Milton. Each poem explores the relationship between war and social order, the breakdown and possibility
    of restoration in the wake of disruption. Each poem also transforms the terms set in the prior readings without leaving
    their framework entirely behind. We will ask how the hero or paradigmatic individual lives, loves, suffers, and recovers
    (or not) in relation to others and how the craft of poetry participates in shaping a world for the contemporary audience
    as well as for the readership of posterity.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
