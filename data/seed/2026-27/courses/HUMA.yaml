- code: HUMA 12300
  title: Human Being and Citizen I
  units: 100
  description: The autumn quarter explores the ways that ancient literary, philosophical, and religious texts (from the Greek,
    Mesopotamian, and Abrahamic traditions) conceive of, express ideals about, and articulate tensions in conceptions of human
    and divine law and justice, affective life, human striving, and the human being as such. Texts include the Epic of Gilgamesh,
    Homer's Iliad, the book of Genesis, dialogues of Plato, and Sophocles' Antigone.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
