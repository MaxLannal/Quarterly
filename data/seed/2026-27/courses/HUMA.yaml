- code: HUMA 14000
  title: 'Reading Cultures: Collection, Travel, Exchange I'
  units: 100
  description: The Autumn Quarter of Reading Cultures is devoted to the analysis of "collection" as a form of cultural activity.
    Reading texts such as Ovid's Metamorphoses, The Arabian Nights, and Zora Neale Hurston's Mules and Men that offer collections
    of stories in lieu of a single tale, we consider the extent to which culture comes into being through the accumulation,
    assemblage and transmission of narratives. In other words, students in this quarter learn how to think about narrative
    and storytelling in terms of the production, organization and control of culture. Who gets to collect and to tell the
    stories of a culture, we ask, and what difference does their identity make to cultural representation?
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - humanities
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 14000. Reading Cultures: Collection, Travel, Exchange I. 100 Units.'
- code: HUMA 14100
  title: 'Reading Cultures: Collection, Travel, Exchange II'
  units: 100
  description: The Winter Quarter of Reading Cultures considers the centrality of movement, migration and travel to the study
    of culture. Turning to texts such as Harriet Jacobs's Incidents in the Life of a Slave Girl, Jamaica Kincaid's A Small
    Place and Tomás Rivera's And the Earth Did Not Devour Him, we ask how cultures have retained their coherence, historically,
    under conditions of migration, diaspora and violent or enforced movement. We also consider the ways that cultures themselves
    travel and change, and analyze the ways that language and narrative function as mediums of cultural movement and transmission.
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 14000
  prereq_text: HUMA 14000
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 14100. Reading Cultures: Collection, Travel, Exchange II. 100 Units.'
- code: HUMA 14200
  title: 'Reading Cultures: Collection, Travel, Exchange III'
  units: 100
  description: The Spring Quarter of Reading Cultures focuses on exchange as a fundamental cultural activity. Here, we consider
    literary texts such as Xiao Hong's "Hands," Richard Wright's Native Son and Honoré de Balzac's Le Père Goriot, as well
    as theoretical texts by Karl Marx and Marcel Mauss that raise questions about the cultural function of exchange. Thus
    in this quarter, students study the ways in which literary works from different cultural traditions have offered unique
    critiques of and pointed responses to the prevailing economic systems of their times.
  notes: These courses must be taken in sequence.
  core_tags:
