    quote: HUMA 18100. Poetry and the Human II. 100 Units.
- code: HUMA 18200
  title: Poetry and the Human III
  units: 100
  description: 'In the Spring Quarter Humanities course offers two options: The first one, Myths and Ecologies, looks at how
    humans tell stories through the poetry of the world: from ancient myths reconfigured by voices feminist, queer, and indigenous,
    to ecologies that draw on the history and geography of the earth, to imaginings of a world without boundaries, and finally
    to explorations of how our pasts and futures merge in the poetic word. Students will be asked to formulate a research
    project over the course of the quarter that handles one of these themes. The second one, Poetry in Public, combines some
    of the Myths and Ecologies curriculum with a study of poetry and the body, in the public world, and as a social good.
    How can we as agents in society use poetry to make the world better? How can we bring our practice into the lives of others?
    How does poetry help treat the body and mind, and how does it connect the body and mind to the world that surrounds them?
    In this quarter, we invite students to take their knowledge and practice of poetry into the world by volunteering to help
    young patients at the Comer Children''s Hospital to write their own poetry, and by working together to understand the
    experience of poetry as a social good. Writing assignments are focused on journalistic and exploratory forms, and based
    on ongoing work in a reading journal. There is one final essay due at the end of the quarter. Students must apply to register
    for this course by the end of autumn quarter.'
  notes: These courses must be taken in sequence. For the option of taking the third quarter of Poetry and the Human to meet
    the general education requirement in the arts, see CRWR 18200.
