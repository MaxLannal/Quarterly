- code: HUMA 16300
  title: 'Understanding Digital Media: An Introduction to Contemporary Media Aesthetics'
  units: 100
  description: 'This course offers an introduction to the aesthetics and theory of digital media. We explore how the digital
    revolution has transformed media aesthetics across film, television, online environments and the arts. Through a blend
    of philosophical, political, and aesthetic inquiry, we investigate how the digital society redefines what it means to
    be human, how we interact socially, and how we conceptualize reality itself. Our exploration is guided by several questions:
    Is reality a simulation? Can humans be "upgraded" through merger with digital technology? Are algorithms and A.I. ushering
    in a post-human social reality? We will also address the political dimensions of these shifts, specifically how computational
    power has fueled "cybernetic capitalism" and the rise of the "control society". We engage with these concepts through
    a diverse range of media, including film (Inception, The Matrix, Ex Machina, Edge of Tomorrow, Everything Everywhere All
    at Once), television (Black Mirror, The Rehearsal), digital media examples and A.I., video games, and the arts. Along
    the way we discuss media theory and cybernetic theory (e.g. Katherine Hayles, Niklas Luhmann) in pursuit of our themes
    and questions. No prior background is required - only curiosity about our digital world and its future. HUMA 16300 can
    qualify for a third Humanities general education requirement if the student completed HUMA 16000 and HUMA 16100. HUMA
    16300 may also be taken as an independent elective.'
  crosslists:
  - MADD 10630
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 16300. Understanding Digital Media: An Introduction to Contemporary Media Aesthetics. 100 Units.'
- code: HUMA 17000
  title: Language and the Human I
  units: 100
  description: 'The Autumn Quarter of this sequence explores the role of language in articulating, maintaining, and subverting
    power relations in society. Some of the questions we discuss include: How does language support structures of power and
    privilege? How does language shape our assumptions and beliefs? How does language motivate us to act or keep us from acting?
    Is language a basic human right? How does language influence the ways we think about race, gender, sexual orientation,
    and species? How do we use language to perceive or shape the identity of others? Typical texts used include George Bernard
    Shaw''s Pygmalion, Shakespeare''s The Tempest, and Margaret Atwood''s The Handmaid''s Tale.'
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - humanities
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 17000. Language and the Human I. 100 Units.
- code: HUMA 17100
  title: Language and the Human II
  units: 100
  description: The Winter Quarter of this sequence examines the relations between language and identity. Some of the issue
    we will explore include language ideologies and hierarchies, vernacular languages and literatures, linguistic nationalism,
    language in the education system, and the involvement of language in constructing identities around race, gender, sexuality,
    nationality, religion and culture. Readings include Patanjali, Dante Alighieri, Lu Xun, Zora Neale Hurston, Antonio Gramsci,
    Richard Rodriguez, Junot Díaz, and Sumathi Ramaswamy.
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 17000
  prereq_text: HUMA 17000
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 17100. Language and the Human II. 100 Units.
- code: HUMA 17200
  title: Language and the Human III
  units: 100
  description: 'The Spring Quarter of this sequence examines the many interrelationships between language and thought. We
    will explore this theme through readings from a wide range of fields, including philosophy, neuroscience, anthropology,
    linguistics, literature and animal cognition. Some of the questions we discuss include: Does language shape your thought,
    or vice versa? Is thought even possible without language? Are you the same person across different languages that you
    speak? Do animals use language to think and communicate? How does language acquisition in children change their capacity
    to think? Does learning languages make us smarter? What kind of thought does translation involve? Does body language "count"
    as language? These readings will help us address the questions above, while providing an overview of some of the most
    fascinating problems surrounding our notions of language today.'
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 17100
  prereq_text: HUMA 17100
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 17200. Language and the Human III. 100 Units.
