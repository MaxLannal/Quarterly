- code: HUMA 16200
  title: 'Media Aesthetics: Image, Text, Sound III'
  units: 100
  description: Spring Quarter focuses on sound, music, and listening. How do sounds or noises become meaningful? Why are music
    and voice so effective at expressing desire, suffering, or even overwhelming the intellect? We explore these and other
    questions through William Blake's Songs of Innocence and Experience, W.E.B. Du Bois's The Souls of Black Folk, Nietzsche's
    The Birth of Tragedy, contemporary albums, and sound art.
  notes: These courses must be taken in sequence. For the option of taking the third quarter of Media Aesthetics as the general
