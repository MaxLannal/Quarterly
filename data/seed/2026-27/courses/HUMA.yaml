- code: HUMA 10001
  title: 'Undergraduate Research: What, Why, and How'
  units: 0
  description: Faculty-mentored research experiences can complement and deepen academic work done in the classroom, nurture
    mentoring relationships, and prepare students for national and international fellowships, graduate study, and diverse
    careers-but where do you start? This course introduces the basics of undergraduate research. We will discover what the
    practice of research entails in different fields, discuss why undergraduates might choose to get involved in research,
    and practice foundational skills and literacies that are essential for any undergraduate researcher. Presenters include
    staff from the College Center for Research and Fellowships (CCRF) and the University Library, as well as current undergraduate
    researchers and faculty members. Topics include navigating the library's vast array of physical and digital resources;
    working with archives and special collections; managing, analyzing, and sharing data; ethical conduct of research; writing
    research proposals; and sharing your research. We will also think together about the role research experiences might play
    in your UChicago education and how to decide whether research is right for you. Together we will demystify the world of
    research, understand how research experiences can align with broader academic and vocational goals, and take practical
    steps to prepare for involvement in research. Requirements include attendance at each session and completion of brief
    weekly exercises. This series is designed to complement our Spring Quarter sequence, which provides the opportunity to
    reflect deeply and holistically on the purpose and structure of your UChicago education and its components, including
    research.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 10001. Undergraduate Research: What, Why, and How. 000 Units.'
- code: HUMA 11000
  title: Readings in World Literature I
  units: 100
  description: The theme for the Autumn Quarter of Readings in World Literature is "The Epic". Beginning with the oldest extant
    literary text known to mankind, The Epic of Gilgamesh, and moving on to India's national epic The Mahabharata as well
    as The Odyssey, we study epic texts that are central to the literary and cultural traditions of various regions and peoples
    of the world. As an introduction to the study of the Humanities, this course will help you develop your skills in textual
    analysis, independent critical thinking, and expository writing. As a course on literature, it will pay particular attention
    to issues such as narrative structure, verse form, performativity and poetic devices, but also to the question of how
    literature might matter for our lives here and now. As a course that aims to address world literatures, this class will
    focus on ways in which texts from different cultural backgrounds articulate the cultural values, existential anxieties,
    and power structures of the societies that produced them.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - humanities
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 11000. Readings in World Literature I. 100 Units.
- code: HUMA 11100
  title: Readings in World Literature II
  units: 100
  description: The theme for the Winter Quarter of Readings in World Literature is "Autobiography/ Writing the Self." This
    course examines the nature of autobiographical writing from a wide range of cultural and historical contexts, including
    texts such as Augustine's Confessions, Sei Shonagon's The Pillow Book, Vladimir Nabokov's Speak Memory, Wole Soyinka's
    Aké and Alison Bechdel's graphic memoir Fun Home. While last quarter focused on the genre of the epic-texts that imagine
    and even create a people's sense of a shared past and a shared culture-this quarter will focus on how individuals imagine
    their own, particular lives. We will explore, among other issues, how the self is constructed through reading and writing,
    the relationship between memory and identity, the claims of authenticity or truth, the oscillation between interior and
    exterior life, and the peculiarities of individual voice.
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 11000
  prereq_text: HUMA 11000
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 11100. Readings in World Literature II. 100 Units.
