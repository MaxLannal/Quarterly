- code: HUMA 19100
  title: Humanities Writing Seminars
  units: 0
  description: 'These seminars introduce students to the analysis and practice of expert academic writing. Experts must meet
    many familiar standards for successful writing: clear style, logical organization, and persuasive argument. But because
    they work with specialized knowledge, experts also face particular writing difficulties: they must be clear about complexities
    and specific about abstractions; they must use uncomplicated organization for very complicated ideas; they must create
    straightforward logic for intricate arguments; they must be concise but not incomplete, direct but not simplistic; they
    must clarify the obscure but not repeat the obvious; and they must anticipate the demands of aggressively skeptical readers.
    The seminars do not repeat or extend the substantive discussion of the Humanities class; they use the discussions and
    assignments from those classes as a tool for the advanced study of writing. We study various methods not only for the
    construction of sophisticated and well-structured arguments but also for understanding the complications and limits of
    those arguments. These seminars also address issues of readership and communication within expert communities. As students
    present papers in the seminars, we can use the reactions of the audience to introduce the techniques experts can use to
    transform a text from one that serves the writer to one that serves the readers.'
  notes: These seminars are available only in combination with either a two- or a three-quarter general education sequence
    in the Humanities.
  core_tags:
  - writing
  repeatable: true
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 19100. Humanities Writing Seminars. 000 Units.
  needs_review: true
