- code: HUMA 24800
  title: Dostoevsky
  units: 100
  description: 'Dostoevsky was an inveterate risk-taker, not only at the baccarat tables of the Grand Casino in Baden-Baden,
    but in his personal life, his political activities, and his artistic endeavors. This course is intended to investigate
    his two greatest wagers: on the presence of the divine in the world and on the power of artistic form to convey and articulate
    this presence. Dostoevsky''s wager on form is evident even in his early, relatively conventional texts, like The Double.
    It intensifies after his decade-long sojourn in Siberia, exploding in works like The Notes from Underground, which one-and-a-half
    centuries later remains an aesthetic and philosophical provocation of immense power. The majority of the course will focus
    on Dostoevsky''s later novels. In Crime and Punishment Dostoevsky adapts suspense strategies to create a metaphysical
    thriller, while in The Demons he pairs a study of nihilism with the deformation of the novel as a genre. Through close
    readings of these works we will trace how Dostoevsky''s formal experimentation created new ways of exploring realms of
    existence that traditionally belonged to philosophy and theology. The results were never comfortable or comforting; we
    will focus on interpreting Dostoevsky''s metaphysical provocations.'
  crosslists:
  - RLST 28204
  - FNDL 24612
  - RLIT 39501
  - REES 30013
  - REES 20013
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 24800. Dostoevsky. 100 Units.
- code: HUMA 25207
  title: 'Mindfulness: Experience and Media'
  units: 100
  description: How do we experience media (of all kinds) with (or without) awareness? Methods of mindfulness offer principles
    and practices of awareness focusing on mind, body, and embodied mind. Mindfulness (a flexible, moment-to-moment, non-judging
    awareness) is an individual experience and at the same time, practices of mindfulness can be a mode of public health intervention.
    Mindfulness involves social epistemologies of how we know (or don't know) collectively, as we interact with immediate
    sensory experience as well as with mediated communication technologies generating various sorts of virtual realities (from
    books to VR). In addition to readings and discussions, this course teaches embodied practices of attention and awareness
    through the curriculum of Mindfulness-Based Stress Reduction.
  crosslists:
  - HLTH 25207
  - MADD 14207
  - HIPS 25207
  - TAPS 20507
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 25207. Mindfulness: Experience and Media. 100 Units.'
- code: HUMA 25208
  title: 'Seeing Anew: Human Transformation and the Senses in Art, Film, Music, and Literature'
  units: 100
  description: 'This course explores the ways in which writers, musicians, and other artists renew and reframe the way that
    we see the world. Through readings, viewings, and other experiences, we will consider how the arts speak to our senses
    and imagination, the relationship between the senses and reality, and how works of art might help us imagine a transformed
    world. We will devote most of our time to discussions of works on the individual senses: vision through experimental cinema
    and poetry from the Romantic and modern eras; hearing through soundscapes-especially those of the South Side of Chicago-and
    the Afrofuturist music of Sun Ra; touch through art spaces and recent advances in human-computer interaction; and smell
    and taste through gastronomic writing and explorations of the urban agriculture of the South Side. The course will also
    feature guest lectures by local artists, musicians, and scholars, as well as field trips to local sites such as museums,
    galleries, and music venues. Students will be expected to contribute regularly to class discussions, keep a log of their
    responses to readings, artworks, and field trips, and create their own critical or creative project that responds to the
    themes explored in the course.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: 'HUMA 25208. Seeing Anew: Human Transformation and the Senses in Art, Film, Music, and Literature. 100 Units.'
- code: HUMA 28400
  title: Comparative Fairy Tales
  units: 100
  description: How do we account for the allure of fairy tales? For some, fairy tales count as sacred tales meant to enchant
    rather than edify. For others, they are cautionary tales, replete with obvious moral lessons. For the purposes of the
    course, we will assume that these critics are correct in their contention that fairy tales contain essential underlying
    meanings. We will conduct our own readings of fairy tales from the German Brothers Grimm, the Norwegians, Asbjørnsen and
    Moe and the Dane, Hans Christian Andersen, relying on our own critical skills as well as selected secondary readings.
  crosslists:
  - NORW 28500
  - GRMN 28500
  - CMLT 21600
  terms_offered:
  - WI
  source:
