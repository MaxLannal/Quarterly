- code: HUMA 12400
  title: Human Being and Citizen II
  units: 100
  description: In the winter quarter, we examine conceptions of the human good in connection with practices of the self as
    they pertain to virtue, the social order, spiritual beliefs and practices, and community. We ask what constitutes human
    flourishing and explore relations and tensions between individual self-formation and the social and political good. Texts
    include Aristotle's Nicomachean Ethics, Augustine's Confessions, and Dante's Inferno.
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 12300
  prereq_text: HUMA 12300
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/humanities/
    quote: HUMA 12400. Human Being and Citizen II. 100 Units.
- code: HUMA 12500
  title: Human Being and Citizen III
  units: 100
  description: The spring quarter addresses matters of community, law, freedom, morality, and ideology in a (broadly speaking)
    modern idiom of citizenship, with its attendant idea of the human being as a rights-bearing subject. We ask what (whether
    culture, religion, reason itself) might ground our moral judgments, and what the limits and freedoms are of thinking the
    human being as a subject accorded rights through instruments of philosophical or political law. Resourced by our autumn
    and winter texts, we consider the impact of thinking about race, ethnicity, and gender through a modern lens and how these
    considerations both challenge and draw on the past. Texts include Shakespeare's The Tempest, Kant's Groundwork of the
    Metaphysics of Morals, and Baldwin's No Name in the Street.
  notes: These courses must be taken in sequence.
  core_tags:
  - humanities
  prereq: HUMA 12400
  prereq_text: HUMA 12400
