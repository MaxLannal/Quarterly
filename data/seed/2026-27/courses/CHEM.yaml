- code: CHEM 12100
  title: Honors General Chemistry I
  units: 100
  description: Enrollment by placement only. The first two courses in this sequence meet the general education requirement
    in the physical sciences. The subject matter and general program of this sequence is similar to that of the Comprehensive
    General Chemistry sequence. However, this accelerated course on the subject matter is designed for students deemed well
    prepared for a thorough and systematic study of chemistry. Introductory materials covered in the Comprehensive General
    Chemistry sequence are not part of the curriculum for this sequence; instead, special topics are included in each quarter
    to provide an in-depth examination of various subjects of current interest in chemistry. Please note that individual sections
    in the Honors (120's) General Chemistry sequence may vary in some content and foci based on the instructor in a given
    quarter. If you are curious about specific content please reach out to the instructor. Attendance at one discussion session
    per week and laboratory sessions is required.
