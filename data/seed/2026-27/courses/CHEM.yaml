courses:
- code: CHEM 10100
  title: Introductory General Chemistry I
  units: 100
  description: 'This three-quarter sequence is a systematic introduction to chemistry for beginning students in chemistry
    or for those whose exposure to the subject has been moderate. We cover atomic and molecular theories, chemical periodicity,
    chemical reactivity and bonding, chemical equilibria, acid-base equilibria, solubility equilibria, phase equilibria, thermodynamics,
    electrochemistry, kinetics, quantum mechanics, and nuclear chemistry. Examples are drawn from chemical, biological, and
    materials systems. The laboratory portion includes an introduction to quantitative measurements, investigation of the
    properties of the important elements and their compounds, and experiments associated with the common ions and their separation
    and identification. Apart from one discussion session per week and a laboratory component, special emphasis on scientific
    problem-solving skills is made through two additional structured learning sessions per week devoted to quantitative reasoning.
    Attendance at discussion, structured learning, and laboratory sessions is mandatory. FOR THE THIRD (SPRING) QUARTER OF
    THE SEQUENCE, STUDENTS WILL ENROLL IN CHEM 11300. Prerequisite(s): Enrollment limited to first-year students Note(s):
    Enrollment by placement only. The first two courses in this sequence meet the general education requirement in the physical
    sciences.'
  notes: Enrollment by placement only. The first two courses in this sequence meet the general education requirement in the
    physical sciences. THE DEADLINE FOR LAB SECTION SWAP OR JOINING THE CLASS IS FRIDAY AT 5:00 PM, THE FIRST WEEK OF THE
    QUARTER. An average grade of C or higher in the General Chemistry sequence, CHEM 10100-CHEM 10200-CHEM 11300 or CHEM 11100-11200-11300
    Comprehensive General Chemistry I-II-III or CHEM 12100-12200-12300 Honors General Chemistry I-II-III, is a prerequisite
    for enrollment in Organic Chemistry.
  core_tags:
  - physical_sciences
  prereq_text: Enrollment limited to first-year students
  terms_offered:
  - AU
