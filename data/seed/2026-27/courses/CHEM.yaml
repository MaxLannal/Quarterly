- code: CHEM 11100
  title: Comprehensive General Chemistry I
  units: 100
  description: 'Enrollment by placement only. The first two courses in this sequence meet the general education requirement
    in the physical sciences. This three-quarter sequence is a comprehensive survey of modern descriptive, inorganic, and
    physical chemistry for students with a good secondary school exposure to general chemistry. We cover atomic and molecular
    theories, chemical periodicity, chemical reactivity and bonding, chemical equilibria, acid-base equilibria, solubility
    equilibria, phase equilibria, thermodynamics, electrochemistry, kinetics, quantum mechanics, and nuclear chemistry. Examples
    are drawn from chemical, biological, and materials systems. The laboratory portion includes an introduction to quantitative
    measurements, investigation of the properties of the important elements and their compounds, and experiments associated
    with the common ions and their separation and identification. Attendance at one discussion session per week and laboratory
    sessions is required. Prerequisite(s): Good performance on the mathematics/calculus and chemistry placement tests Note(s):
    Enrollment by placement only. The first two courses in this sequence meet the general education requirement in the physical
    sciences.'
