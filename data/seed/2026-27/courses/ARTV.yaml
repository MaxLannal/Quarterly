- code: ARTV 10100
  title: 'Visual Language: On Images'
  units: 100
  description: Through studio work and critical discussions on 2D form, this course is designed to reveal the conventions
    of images and image-making. Basic formal elements and principles of art are presented, but they are also put into practice
    to reveal perennial issues in a visual field. Form is studied as a means to communicate content. Topics as varied as,
    but not limited to, illusion, analogy, metaphor, time and memory, nature and culture, abstraction, the role of the author,
    and universal systems can be illuminated through these primary investigations. Visits to museums and other fieldwork required,
    as is participation in studio exercises and group critiques.
  notes: ARTV 10100, 10200, and 10300 may be taken in sequence or individually. This course meets the general education requirement
    in the arts. Previous experience in media-based studio courses not accepted as a substitute for this course. During the
    Academic Year (autumn, winter, spring) students must attend the first two class sessions to confirm enrollment and wait
    list requests are due several weeks before the quarter begins. Sign up for the Academic Year wait list at https://dova.uchicago.edu/waitlist.
  core_tags:
  - arts
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/visualarts/
    quote: 'ARTV 10100. Visual Language: On Images. 100 Units.'
- code: ARTV 10200
  title: 'Visual Language: On Objects'
  units: 100
  description: Through studio work and critical discussions on 3D form, this course is intended to reveal the conventions
    of sculpture while investigating its modes of production. Basic formal elements and principles of art are presented, but
    also put into practice to reveal perennial issues in a visual field. Form is studied as a means to communicate content.
    Topics as varied as, but not limited to, platonic form, analogy, metaphor, verisimilitude, abstraction, nature and culture,
    and the body politic can be illuminated through these primary investigations. Visits to museums and other fieldwork required,
