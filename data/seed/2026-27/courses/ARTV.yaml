    quote: 'ARTV 10300. Visual Language: On Time and Space. 100 Units.'
- code: ARTV 16210
  title: Media Art and Design Practice
  units: 100
  description: 'This studio-based course explores the practice, conventions, and boundaries of contemporary media art and
    design. This can encompass areas as diverse as interactive installation, app design, and the Internet meme. Through projects
    and critical discussion, students engage with the problems and opportunities of digitally driven content creation. Fundamental
    elements of digital production are introduced, including basic properties of image, video, and the global network. Further
    topics as varied as--though not limited to--web production, digital fabrication, interfaces, the glitch, and gaming may
    be considered. Sections will vary based on the instructor''s fields of expertise. This course meets the general education
    requirement in the arts. This course may not double count for general education requirements and the Media Arts and Design
    minor. However, it is a great way for students to explore a potential interest in these areas. During the academic year,
    students must attend the first course session to confirm enrollment. Students aiming to get into the course after registration
    or during drop/add must use the waitlist to request to enroll. WAITLIST: https://forms.gle/WjLWCguW42GpcoRBA'
  crosslists:
