- code: ARTV 20006
  title: Contemporary Art
  units: 100
  description: This course will consider the practice and theory of visual art in the late twentieth and early twenty-first
    centuries. Among the subjects that will drive our narrative will be the rise of postmodernism, pop art, the aesthetics
    of the social movements of the 1960s, institutional critique, the relationship between reproductive media and Feminism,
    the concept of spectacle, conceptual art, the appearance of a global art industry after 1989, the connections between
    art school and art-making, "relational aesthetics," the fate of art in the age of the Internet, the art of the post-studio
    moment, and what happens to art when it engages with *everything*.
  crosslists:
  - MADD 10006
  - ARTH 15800
  terms_offered:
  - SP
