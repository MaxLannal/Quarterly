- code: ARTV 10300
  title: 'Visual Language: On Time and Space'
  units: 100
  description: The course is primarily concerned with how patterns of techniques and formal logics interact and shape our
    experience of space and time. We will engage in creative and technical studies, individual projects, readings and screenings
    that focus on the organization and technical realization of content as well as its interpretation. The goal is for students
    to understand how the experience of space and time can be shaped. Faculty teaching this course will emphasize different
    media to engage these issues including animation, computation, video/film-ography, and performance.
  core_tags:
  - arts
  terms_offered:
