- code: HIST 16800
  title: 'Ancient Mediterranean World II: Rome'
  units: 100
  description: Part II surveys the social, economic, and political history of Rome, from its prehistoric beginnings in the
    twelfth century BCE to the end of the Severan dynasty in 235 CE. Throughout, the focus will be upon the dynamism and adaptability
    of Roman society, as it moved from a monarchy to a republic to an empire. The course will also cover the questions of
    social organization (free and unfree people, foreigners), gender relations, religion, and specific forms of the way of
    life of the Romans. It will be based both on lectures and on discussions of textual or archaeological documents in smaller
    discussion groups.
