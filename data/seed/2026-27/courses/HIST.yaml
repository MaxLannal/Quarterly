- code: HIST 13900
  title: 'Russia and Eurasia: Empires, Societies, Cultures I (formerly Introduction to Russian Civilization)'
  units: 100
  description: 'The first quarter spans the centuries between early medieval Rus'', which furnished modern Ukraine, Russia,
    and Belarus with a story of origins, to the intellectual, social, and national mobilization in the mid-19th century. Major
    themes include: the influence of Byzantine, Mongol-Tataric, and Western cultures; medieval principalities, city-states,
    and the rise of the centralized state, its oversized role in Russian and regional social and economic development, its
    hyper-modernizing schemes and its periodic collapse; cross-cultural interactions in the steppe and the Baltic and Black
    Seas littorals; Russia''s wars and the emergence of the Russian empire; varieties of resistance, from peasant uprisings
    and flight to religious dissent to aristocratic opposition, and the emergence of the repressive machinery of the state;
    forces of change and continuity in political, intellectual, and cultural life.'
  notes: Taking these courses in sequence is recommended but not required. When taken with HIST 14000, HIST 13900 meets the
    two-quarter general education requirement in Civilization Studies.
  core_tags:
  - civilization
  crosslists:
  - REES 26011
  - SOSC 24000
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'HIST 13900. Russia and Eurasia: Empires, Societies, Cultures I (formerly Introduction to Russian Civilization)'
- code: HIST 14000
  title: 'Russia and Eurasia: Empires, Societies, Cultures II (formerly Introduction to Russian Civilization)'
  units: 100
  description: The second quarter focuses on nearly two centuries of upheaval, from the radical movements of the late 19th
    century to the birth, life, and death of the Soviet Union and the emergence of post-Soviet states. Our topics include
    Russian imperialism, colonial conquests, and the reconstitution of the Russian empire as the Soviet Union; systems of
    social and political legitimization; political violence, the evolution of the repressive machinery, and the enduring problem
    of the rule of law; religious, national, and sexual minorities, practices of everyday life, social order and disorder;
    resistance, dissent, and liberation movements; creativity, experimentation, and self-expression under censorship.
  notes: Taking these courses in sequence is recommended but not required. When taken with HIST 13900, HIST 14000 meets the
    two-quarter general education requirement in Civilization Studies.
  core_tags:
  - civilization
  crosslists:
  - SOSC 24100
  - REES 26012
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'HIST 14000. Russia and Eurasia: Empires, Societies, Cultures II (formerly Introduction to Russian Civilization)'
- code: HIST 14100
  title: 'Russia and Eurasia: Empires, Societies, Cultures III, Russia and the West, 18th to 21st centuries'
  units: 100
  description: 'The third quarter is thematic, rather than chronological, and offers an in-depth or comparative exploration
    of special topics. Topics vary from year to year. There are few problems as enduring and central to Russian history as
    the question of the West-Russia''s most passionate romance and most bitter letdown. In this course we will read and think
    about Russia from the eighteenth to the twenty-first centuries through the lens of this obsession. We will study the products
    of Russian interactions with the West: constitutional projects, paintings, scientific and economic thought, the Westernizer-Slavophile
    controversy, and revolutions. We will consider the presence of European communities in Russia: German and British migrants
    who filled important niches in state service, trade, and scholarship; Italian sculptors and architects who designed some
    of Russia''s most famous monuments; French expatriates in the wake of the French Revolution; Communist workers and intellectuals,
    refugees from Nazi Germany; and Western journalists who, in the late Soviet decades, trafficked illicit ideas, texts,
    and artworks. In the end, we will follow émigré Russians to Europe and the United States and return to present-day Russia
    to examine the anti-Western turn in its political and cultural discourse.'
  notes: When taken with HIST 13900 and HIST 14000, HIST 14100 meets the three-quarter general education requirement in Humanities,
    Civilization Studies, and the Arts. HIST 14100 does not meet the two-quarter Civilization Studies requirement and cannot
    be combined with HIST 13900 or HIST 14000 for Civilization Studies credit.
  core_tags:
  - civilization
  crosslists:
  - SOSC 24200
  - REES 26015
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
