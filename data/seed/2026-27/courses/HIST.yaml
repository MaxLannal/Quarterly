- code: HIST 13100
  title: Western Civilization I
  units: 100
  description: This term introduces students to debates about the nature of Western Civilization. It then traces the emergence
    of the state, of commerce, and the rise of monotheism and Christianity. Students will explore the nature of the Greek
    polis, the development of the Mediterranean economy, the development of the Roman republic and the establishment of the
    Empire. The term concludes with a discussion of the Christianization of the Roman Empire and the Empire's division with
    the shift of the capital to Constantinople. Readings may include selections from Homer, Thucydides, Euripides, Cicero,
    Augustine, the New Testament Gospels, Tacitus and Vergil.
  core_tags:
  - civilization
  crosslists:
  - SOSC 28110
  prereq_text: These courses must be taken in sequence.
  terms_offered:
  - AU
  - SU
  source:
