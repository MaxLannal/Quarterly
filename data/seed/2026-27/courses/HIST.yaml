    quote: HIST 13100. Western Civilization I. 100 Units.
  needs_review: true
- code: HIST 13200
  title: Western Civilization II
  units: 100
  description: This term continues the discussion of themes of state formation, commercial development, Christianity and empire
    introduced in the first term. This term begins with a discussion of the collapse of the Mediterranean unity that had been
    fostered by the Roman Empire. It concludes with the crisis of the seventeenth century. It thus begins with a moment of
    retreat and ends with the expansion of Europeans into regions beyond the Mediterranean. Readings this term may include
    selections from Bede, Thomas Aquinas, Dante, Machiavelli, Bernal Diaz, John Locke, and William Shakespeare.
