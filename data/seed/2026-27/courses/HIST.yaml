- code: HIST 13500
  title: America In World Civilization I
  units: 100
  description: America in World Civilization I examines foundational texts and moments in American culture, society, and politics,
    from early European incursions into the New World through the early republic of the United States, roughly 1500-1800.
    We will examine encounters between Native Americans and representatives of imperial powers (Spain, France, and England)
    as well as the rise of African slavery in North America before 1700. We will consider the development of Anglo-American
    society and government in the eighteenth century, focusing especially on the causes and consequences of the American Revolution.
