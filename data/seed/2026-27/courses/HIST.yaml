  - ANTH 20702
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: HIST 10102. Introduction to African Civilization II. 100 Units.
- code: HIST 10103
  title: Introduction to African Civilization III
  units: 100
  description: African Civilization III examines Africa and the African diaspora in the modern era. Topics may include the
    end of colonialism and decolonization, the legacies of slavery and its racial logics, identity and cultural expression,
