- code: ARTH 17781
  title: Women in 20th-Century Architecture
  units: 100
  description: From the Renaissance to the present day, architecture has been a blatantly male-centric field. This course
    invites students to consider women who overcame systemic barriers to become figures of agency in 20th-century architecture.
    We will examine the lives and works of women who have managed to attend architecture schools, despite historical gender-based
    exclusion or restriction on enrollment, as well as those who found impactful ways to play architectural roles without
    academic training. We will pay particular attention to how these protagonists add necessary complexity to the modernist
    canon. The course will start with a first module on positionality (women as architects, women as clients, and women as
    residents) followed by a second module with a biographical scope (Minnette De Silva, Eileen Gray, bell hooks, and Sibyl
    Moholy-Nagy).
  notes: 'This course fulfills the Art In Context Core Requirement: European and American, modern (post-1800), Theory and
    Historiography'
