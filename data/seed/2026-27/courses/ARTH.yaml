  needs_review: true
- code: ARTH 17415
  title: 'Conceptualism: A Global Approach to Art since 1960'
  units: 100
  description: This course offers an introduction to conceptual approaches to artmaking as they emerged between the 1960s
    and 1990s across diverse sociopolitical and art historical contexts. We will study topics such as the turn to language,
    data and systems; the shift away from traditional objects of art toward ephemeral acts and their documentation; critiques
    of artistic institutions; strategies for creating alternative networks; and political interventions. The constellation
    of practices that we will explore developed in artistic centers throughout North America and Europe, Latin America, East
    Asia, the Soviet Bloc, and Africa, often independently of each other. Looking to an increasingly interconnected but unequal
    world, this course approaches these many conceptualisms as shaped by differing experiences of global processes, including
    technological development, the expansion of mass media, decolonization, dictatorship, exile, and diaspora. Designed for
    students new to art history, this course focuses on developing skills for analyzing a wide range of artistic media beyond
    painting and sculpture.
  core_tags:
