- code: ARTH 17214
  title: 'Seeing Ghosts: Visualizing the Unseen in East Asian Art'
  units: 100
  description: This course interrogates the persistent presence of ghosts, spirits, demons, and souls in East Asian art from
    the premodern period to the present, asking what it means to give visual form to the invisible. This paradox will anchor
    our exploration of how images of ghosts and other spectral subjects both reflect and shape the societies that produce
    them. That is, on one hand, we will explore how images of the supernatural and otherworldly have been embedded in lived
    experience through rituals, festivals, performances, and domestic worship. But we will also examine the range of worldly,
    historical, and social meanings that the spectral has acquired in East Asian visual culture. Through close attention to
    individual works in diverse artistic forms and genres across China, Japan, and Korea-including paintings, funerary art,
    ritual objects, prints, photography, and film-students will reflect on how the destabilizing power of "seeing ghosts"
    unsettles dominant accounts of gender, politics, environment, and community, subverts social hierarchies and established
    orders of perception, and challenges the boundaries between the real and the imaginary, the human and non-human, bringing
    overlooked dimensions of major artworks into view.
  core_tags:
