- code: ARTH 14006
  title: Introduction to Byzantine Art
  units: 100
  description: In this course, we will explore works of art and architecture as primary sources on the civilization of Byzantium.
    Through the close investigation of artifacts of different media and techniques, students will gain insight into the artistic
    production of the Byzantine Empire from its beginnings in the fourth century C.E. to the Ottoman conquest in 1453. We
    will employ different methodological approaches and scholarly resources that are relevant for the fruitful investigation
    of artifacts in their respective cultural setting. In order to fully assess the pivotal importance of the visual arts
    in Byzantine culture, we will address a wide array of topics, including art and ritual, patronage, the interrelation of
    art and text, the classical heritage, art and theology, icons and Iconoclasm (etc.).
