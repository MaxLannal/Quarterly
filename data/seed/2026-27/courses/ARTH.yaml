- code: ARTH 14004
  title: Colonial Art of Latin America
  units: 100
  description: 'This core class introduces students to the art and material culture of colonial Latin America, from the time
    of the Spanish invasion until the independence movements of the 19th century. We will examine how visual and material
    culture mediated and intervened in: the hybridization of indigenous, Black, and European cultures and religions; the negotiation
    of territorial and economic power; and the construction of race and ethnicity in the colonial world. Spectacular objects
    from this time -- indigenous maps, lush paintings made of feathers, and ceramics imported from as far as Manila -- will
    constitute our case studies. Through a mixture of lectures and discussion, students will develop skills in analytical
    reading and writing, close reading of visual materials, and in logical and effective argumentation.'
