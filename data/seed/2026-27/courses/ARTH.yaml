- code: ARTH 17722
  title: 'Making Together: Crafts and Workshop Cultures in Early Modern East Asia'
  units: 100
  description: 'This course introduces students to the diverse crafts and workshop cultures of Early Modern China, Japan,
    and Korea (roughly 14th to 19th centuries) through techniques of production and reproduction such as ceramics, enamels,
    prints, and painting, with attention to collaborative and serial production. We will examine case studies grounded in
    specific historical contexts, from Qing imperial kiln to the Joseon Bunwon kilns, from "Suzhou pian" (commercial workshop
    forgeries) to the studios of the Kano school. Through these cases, students are encouraged to think together with the
    craftspeople, exploring different systems of artisanal knowledge and their social, cultural, and political significance.
    While the course is largely structured around medium/material, weekly discussions will be guided by a set of common questions
    and themes: How are the works made, and how does understanding the making process impact our perception of the works themselves?
    Why did certain workshop models emerge or persist-what did the production mode make possible or foreclose? How are artisanal
    knowledge and skills acquired and transmitted, both locally and globally? How did the market, gift economies, or diplomatic
    exchanges affect workshop organization and art production? Students are encouraged to bring their own art- and craft-making
    experience into class discussions. As we read about the history of crafts and workshop cultures, we will also consider
    how these histories were written and why.'
  core_tags:
  - arts
  prereq_text: 'This course meets the general education requirement in the arts. Fulfilled requirements: Asian, premodern
    (pre-1800), modern (post-1800)'
  terms_offered:
  - SP
