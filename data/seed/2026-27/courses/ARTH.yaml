- code: ARTH 15636
  title: Modern Korean Art
  units: 100
  description: This course introduces students to key histories, artworks, and theoretical discourses surrounding modern Korean
    art. Covering the period from the late 19th to mid-20th century, the course explores historical junctures-late Joseon,
    the Korean Empire (1897-1910), the colonial period (1910-1945), and the Korean War (1950-1953)-as critical moments during
    which the concepts of modernity and "modern art" (geundae misul) were imported and contested. Beyond providing a basic
    understanding of modern Korean art history, the course engages with broader art-historical inquiries, particularly how
    modernity and modernism can be articulated within a global framework. Readings encompass art historical texts as well
    as theories on global modernisms, theories of imperialism, and decoloniality. Discussion sections will emphasize the close
    reading of texts and visual materials, including drawings, paintings (oil and ink), photography, sculpture, and architecture.
