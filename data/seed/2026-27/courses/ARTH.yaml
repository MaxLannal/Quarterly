- code: ARTH 15520
  title: Impressionism
  units: 100
  description: The avant-garde movement of mid-19th century French painters painting modern life, the city and the landscape
    in the open air and its full chromatic spectrum has been one of the artistic success stories of the past two centuries,
    visible around the world from umbrellas and credit cards to interactive experiences; yet at the time of their emergence,
    critics derided their corpse-like colors and lack of interest in traditional art values like drawing from the nude. Who
    were the precursors, protagonists, and inheritors of this revolutionary way of seeing? Was Impressionism very Parisian,
    or an international phenomenon? Did it make a particular place for women artists? Did it strive to be true to nature,
    an "innocent eye" as Claude Monet once put it, or did it replace the objective perspectival rendering of the world, newly
    given over to black and white photography, with a subjective phantasmagoria of one person's unrepeatable experience? How
    did the Impressionists survive in business, and did they have a political or social vision? And do should we care about
    them today?
  core_tags:
