- code: ARTH 18704
  title: Contemporary Art Beyond Korea
  units: 100
  description: This course surveys key histories and theoretical discourses of contemporary art with a focus on Korea, both
    North and South. Beginning at the end of the Korean War (1950-1953), the course reexamines the notion of the "postwar"
    from Korean and broader Asian perspectives, extending the conversation to art produced in the present day. The parallel
    postwar histories-industrialization, authoritarianism, democratization movements, and globalization across East and Southeast
    Asia-necessitate an interregional and global approach. Korea, from the aftermath of the Korean War onwards, has served
    as a testing ground within these interconnected historical trajectories. While centering discussions on artworks and discourses
    from Korea, the course will also engage with artistic practices from other regions, including but not limited to Japan,
    China, Taiwan, Europe, the United States, Malaysia, Singapore, Indonesia, Vietnam, and the Philippines. This course may
    include a self-directed visit to the MCA and the Art Institute, along with participation in selected artist talks.
  notes: 'This course fulfills the following requirements in the ARTH major and minor: Asian post-1800'
  core_tags:
  - arts
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/arthistory/
    quote: ARTH 18704. Contemporary Art Beyond Korea. 100 Units.
- code: ARTH 24193
  title: Water Water Everywhere?
  units: 100
  description: 'This interdisciplinary course explores aesthetics, environmental racism, and a human rights approach to the
    Commons to inform our perspective on the politics and aesthetics of water from the local to the global. The course will
    look at issues of scarcity and abundance through the lenses of art and human rights. The course will incorporate guest
    speakers, including artist Iñigo Manglano-Ovalle and environmental and water rights experts and advocates. Students will
    consider works by artists such as Pope L, Mel Chin, Allan Kaprow, LaToya Ruby Frazier, and Fazal Sheikh, to understand
    how art can confront the 21st century''s environmental challenges. A diverse set of texts will include relevant human
    rights instruments, the documentary film "Whose Water" (Kate Levy 2024); Lewis Hyde, "Common as Air: Revolution, Art,
    and Ownership"; and Emily Eliza Scott & Kristen Swenson, ''Contemporary Art and the Politics of Land Art'' from "Critical
    Landscapes: Art, Space, and Politics." The course will include site visits to nearby natural areas, such as the Big Marsh
    wetlands, the "Toxic Donut" near Altgeld Gardens, and Lake Michigan. This course is an extension of a collaborative project
    at the Gray Center for Arts and Inquiry with human rights lawyer Susan Gzesh, artist Iñigo Manglano-Ovalle, and curator
    Abigail Winograd.'
