- code: ARTH 16107
  title: 'Moving Objects, Dispersed Cultures: Case Studies from China and the Middle East'
  units: 100
  description: In this course, we will delve into "big problems" created by the movement, relocation, or displacement of objects
    that are assigned special cultural, artistic, and historical values in new contexts. We will follow the movement of artifacts
    across both geographical and disciplinary boundaries, challenging established notions of cultural heritage and art. We
    often study and read ancient texts as primary sources, but we don't always pause to consider that those texts were written
    on physical objects like pieces of wood, leaves, or animal skin. Similarly, we're familiar with the display of ancient
    artwork inside museums or galleries, but have we wondered about the journey of individual objects to those new locations?
    How do objects move from their original place to modern collections? How do they become art? And how do they become historical
    sources? Guided by an art historian and a social historian, this course presents different ways to look at "objects that
    move", both as sources about past societies and as mirrors for contemporary ones. Through studying examples from the history
    of China and the Middle East, we will reconsider concepts such as cultural heritage, national patrimony, or even art that
    have been taken for granted. We will learn about the different histories of the dispersal of cultural heritages in those
    two regions, from nation-building and colonial projects in the twentieth century to the illicit trade in antiquities and
    the creation of digital replicas today.
  core_tags:
  - arts
  crosslists:
