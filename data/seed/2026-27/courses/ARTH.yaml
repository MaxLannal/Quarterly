    quote: 'ARTH 17551. Beyond the Vitruvian Man: Architecture and the Body in the Italian Renaissance. 100 Units.'
  needs_review: true
- code: ARTH 17602
  title: Contemporary Art Beyond Korea
  units: 100
  description: This course surveys key histories and theoretical discourses of contemporary art, with a particular focus on
    Korea, both North and South. Beginning at the end of the Korean War (1950-1953), the course reexamines the notion of the
    "postwar" from Korean and broader Asian perspectives, extending the conversation to art produced in the present day. The
    parallel postwar histories-industrialization, authoritarianism, democratization movements, and globalization across East
    and Southeast Asia-necessitate an interregional and global approach. Korea, from the aftermath of the Korean War onwards,
    has served as a significant testing ground within these interconnected historical trajectories. While centering discussions
    on artworks and discourses from Korea, the course will also engage with artistic practices from other regions, including
    but not limited to Japan, China, Taiwan, Europe, the United States, Malaysia, Singapore, Indonesia, Vietnam, and the Philippines.
    This course may include a self-directed visit to the MCA and the Art Institute, as well as participation in selected artist
    talks.
  notes: 'This course fulfills the following requirements in the ARTH major and minor: Asian, modern (1800-present)'
  core_tags:
  - arts
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/arthistory/
    quote: ARTH 17602. Contemporary Art Beyond Korea. 100 Units.
- code: ARTH 17712
  title: Cold War Cultures
  units: 100
  description: As the world emerged from the wreckage of the Second World War, the cultural sphere became a battlefield where
    countries jostled for power over the hearts and minds of the public. This class considers the entanglements between art
    and ideology during the Cold War. In the mid twentieth century, an unprecedented expansion of the mass media, a boom of
    international events and exhibitions, and new forms of artmaking made images and culture a flash point for political debate.
    We will examine how specific artistic styles attained ideological associations, how international governments employed
    art exhibitions to negotiate soft power, and how artists challenged the binary ideological divides of the Cold War. We
    will also consider solidarity movements and artistic responses to active conflicts in the Global South. Case studies will
    be drawn from a wide geographic range, including the United States and Europe, the USSR, Latin America, and West Africa.
    This is a seminar style core class in which students will be expected to lead class discussions, conduct original research,
    and share their writing with their peers.
