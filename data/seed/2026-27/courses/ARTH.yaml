- code: ARTH 17313
  title: The Medieval Art of Illusion
  units: 100
  description: 'This course explores the creation, description, and depiction of spaces and surfaces designed to confuse or
    trick the eye in medieval Europe. Whereas traditional art historical narratives credit Renaissance artists with the rediscovery
    of methods for crafting pictorial illusions, medieval art and ars (craft) bears witness to a diverse and sustained fascination
    with illusionism. Its manifestations range from the simulation of virtual space to the confection of misleading surfaces
    that concealed the true nature of their substrates. In addition to unpacking illusionism as a descriptor or technique,
    topics to be explored include: the relationship between real and simulated architecture; the imitation of precious materials
    in paint, glass, etc.; attitudes towards cosmetics and other "improving" bodily adornment; the danger of visual confusion
    in a medieval salvation economy. Throughout, we will interrogate the tendency to treat illusionism as a desirable zenith
    of artistic achievement.'
  core_tags:
