- code: ARTH 17551
  title: 'Beyond the Vitruvian Man: Architecture and the Body in the Italian Renaissance'
  units: 100
  description: With its ideal proportions inscribed in perfect geometry, the Vitruvian Man long served as the iconic model
    of early modern architecture, inspiring Renaissance designers to reimagine buildings and cities in pursuit of its ideal
    form. Yet this abstract male figure, often framed as a symbol of human dignity, conceals the vital multiplicity essential
    to both human and urban life and obscures the diverse experiences of early modern populations. This course challenges
    students to consider how the human body-both as a cultural construct and a site of lived experience-shaped the design
    and reception of early modern architecture. While the Vitruvian Man serves as our point of departure, we will move beyond
    its idealised geometry to explore how sensory experience and embodied practice animated and reconfigured Renaissance architectural
    space, paying particular attention to urban inhabitants who negotiated, reshaped, and at times overturned the harmonious
    projections of architects and designers. Students will engage with canonical architects such as Michelangelo, Alberti,
    and Leonardo alongside ordinary inhabitants-including artisans, women, Jewish communities, and travellers-who deployed
    their eyes, ears, hands, mouths, and feet to rewrite the meaning of urban space and inscribe their own presence in the
    fabric of Renaissance cities. With their support, we will also explore the potential for historical urban experience to
    inform, unsettle, or inspire the way we imagine cities today.
  core_tags:
  - arts
  crosslists:
  - HIST 12204
  prereq_text: 'This course is an art in context core course. This course fulfills the following requirements in the ARTH
    major and minor: European and American pre-1800'
  terms_offered:
  - SP
  source:
