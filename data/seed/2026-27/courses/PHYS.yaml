- code: PHYS 21400
  title: Creative Machines and Innovative Instrumentation
  units: 100
  description: An understanding of the techniques, tricks, and traps of building creative machines and innovative instrumentation
    is essential for a range of fields from the physical sciences to the arts. In this hands-on, practical course, you will
    design and build functional devices as a means to learn the systematic processes of engineering and fundamentals of design
    and construction. The kinds of things you will learn may include mechanical design and machining, computer-aided design,
    rapid prototyping, circuitry, electrical measurement methods, and other techniques for resolving real-world design problems.
    In collaboration with others, you will complete a mini-project and a final project, which will involve the design and
    fabrication of a functional scientific instrument. The course will be taught at an introductory level; no previous experience
    is expected. The iterative nature of the design process will require an appreciable amount of time outside of class for
    completing projects. The course is open to undergraduates in all majors (subject to the pre-requisites), as well as Master's
    and Ph.D. students.
