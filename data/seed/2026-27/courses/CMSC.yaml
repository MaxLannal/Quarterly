- code: CMSC 25440
  title: Machine Learning in Medicine
  units: 100
  description: In this course we will study the how machine learning is used in biomedical research and in healthcare delivery.
    We will build and explore a range of models in areas such as infectious disease and drug resistance, cancer diagnosis
    and treatment, drug design, genomics analysis, patient outcome prediction, medical records interpretation and medical
    imaging. Students will become familiar with the types and scale of data used to train and validate models and with the
    approaches to build, tune and deploy machine learned models. We will use traditional machine learning methods as well
    as deep learning depending on the problem. The course will be fast moving and will involve weekly program assignments.
    We will introduce the machine learning methods as we go, but previous familiarity with machine learning will be helpful.
    Programming assignments will be in python and we will use Google Collaboratory and Amazon AWS for compute intensive training.
  prereq:
    any:
    - CMSC 12200
    - CMSC 15200
    - CMSC 16200
  prereq_text: CMSC 12200 or CMSC 15200 or CMSC 16200. Proficiency in Python is expected.
  source:
