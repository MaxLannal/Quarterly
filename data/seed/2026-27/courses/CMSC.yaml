    - CMSC 12300
    - CMSC 22000
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 14400 or CMSC 15400 or CMSC 12300 or CMSC 22000 or CMSC 20300 or CMSC 20310
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 20370. Inclusive Technology: Designing for Underserved and Marginalized Populations. 100 Units.'
- code: CMSC 20380
  title: Actuated User Interfaces and Technology
  units: 100
  description: The recent advancement in interactive technologies allows computer scientists, designers, and researchers to
    prototype and experiment with future user interfaces that can dynamically move and shape-change. This class offers hands-on
    experience in learning and employing actuated and shape-changing user interface technologies to build interactive user
    experiences. The class provides a range of basic engineering techniques to allow students to develop their own actuated
    user interface systems, including 3D mechanical design, digital fabrication (e.g. 3D Printing), electronics (Arduino microcontroller),
    and actuator control (utilizing different kinds of motors). Through multiple project-based assignments, students practice
    the acquired techniques to build interactive tangible experiences of their own.
  crosslists:
  - MADD 20380
  - CMSC 30380
  prereq:
    any:
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 20300 or CMSC 20310
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20380. Actuated User Interfaces and Technology. 100 Units.
- code: CMSC 20600
  title: Introduction to Robotics
  units: 100
  description: The University of Chicago's CMSC 20600 Introduction to Robotics course gives students a hands-on introduction
    to robot programming covering topics including sensing in real-world environments, sensory-motor control, state estimation,
    localization, forward/inverse kinematics, vision, and reinforcement learning. This course is centered around 3 mini projects
    exploring central concepts to robot programming and 1 final project whose topic is chosen by the students. Each of these
    mini projects will involve students programming real, physical robots interacting with the real world. The use of physical
    robots and real-world environments is essential in order for students to 1) see the result of their programs 'come to
    life' in a physical environment and 2) gain experience facing and overcoming the challenges of programming robots (e.g.,
    sensor noise, edge cases due to environment variability, physical constraints of the robot and environment).
  crosslists:
  - CMSC 30600
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
  prereq_text: CMSC 14200 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20600. Introduction to Robotics. 100 Units.
- code: CMSC 20630
  title: 'Human-Robot Interaction: Research and Practice'
  units: 100
  description: 'Robots are increasingly common in our everyday spaces: tutoring elementary students, assisting human workers
    in manufacturing contexts, providing museum tours, interacting with families within their homes, and helping to care for
    the elderly. One critical factor to the success of these robots is their ability to effectively interact with people:
    human-robot interactions. This course focuses on the core concepts and cutting-edge research in the field of human-robot
    interaction (HRI), covering topics that include nonverbal robot behavior, verbal robot behavior, social dynamics, norms
    & ethics, collaboration & learning, group interactions, applications, and future challenges of HRI. In class meetings,
    students lead discussions about cutting-edge peer-reviewed research HRI publications. In weekly labs, students engage
    in hands-on activities to learn the essential skills of human-robot interaction research, including experiment design,
    robot programming, and data analysis techniques. Students also participate in a quarter-long collaborative research project,
    where they pursue an HRI research question that often involves conducting their own human-subjects research study where
    they recruit human subjects to interact with a robot.'
  crosslists:
  - CMSC 30630
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
  prereq_text: CMSC 14200 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 20630. Human-Robot Interaction: Research and Practice. 100 Units.'
- code: CMSC 20900
  title: Computers for Learning
  units: 100
  description: 'Over time, technology has occupied an increasing role in education, with mixed results. Massive Open Online
    Courses (MOOCs) were created to bring education to those without access to universities, yet most of the students who
    succeed in them are those who are already successful in the current educational model. This course focuses on one intersection
    of technology and learning: computer games. This course covers education theory, psychology (e.g., motivation, engagement),
    and game design so that students can design and build an educational learning application. Labs focus on developing expertise
    in technology, and readings supplement lecture discussions on the human components of education.'
  crosslists:
  - MADD 20900
  - CMSC 30900
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14300 or CMSC 15400 or CMSC 22000
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20900. Computers for Learning. 100 Units.
- code: CMSC 21400
  title: Creative Machines and Innovative Instrumentation
  units: 100
  description: An understanding of the techniques, tricks, and traps of building creative machines and innovative instrumentation
    is essential for a range of fields from the physical sciences to the arts. In this hands-on, practical course, you will
    design and build functional devices as a means to learn the systematic processes of engineering and fundamentals of design
    and construction. The kinds of things you will learn may include mechanical design and machining, computer-aided design,
    rapid prototyping, circuitry, electrical measurement methods, and other techniques for resolving real-world design problems.
    In collaboration with others, you will complete a mini-project and a final project, which will involve the design and
    fabrication of a functional scientific instrument. The course will be taught at an introductory level; no previous experience
    is expected. The iterative nature of the design process will require an appreciable amount of time outside of class for
    completing projects. The course is open to undergraduates in all majors (subject to the pre-requisites), as well as Master's
    and Ph.D. students.
  crosslists:
  - PSMS 31400
  - ASTR 31400
  - ASTR 21400
  - PHYS 21400
  prereq:
    any:
    - PHYS 12200
    - PHYS 13200
    - PHYS 14200
    - CMSC 12100
    - CMSC 12200
    - CMSC 12300
    - consent: instructor
  prereq_text: PHYS 12200 or PHYS 13200 or PHYS 14200; or CMSC 12100 or CMSC 12200 or CMSC 12300; or consent of instructor.
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 21400. Creative Machines and Innovative Instrumentation. 100 Units.
- code: CMSC 21800
  title: Data Science for Computer Scientists
  units: 100
  description: Data-driven models are revolutionizing science and industry. This course covers computational methods for structuring
    and analyzing data to facilitate decision-making. We will cover algorithms for transforming and matching data; hypothesis
    testing and statistical validation; and bias and error in real-world datasets. A core theme of the course is "generalization";
    ensuring that the insights gleaned from data are predictive of future phenomena. The course will include bi-weekly programming
    assignments, a midterm examination, and a final.
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14300 or CMSC 15400 or CMSC 22000
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 21800. Data Science for Computer Scientists. 100 Units.
- code: CMSC 22000
  title: Introduction to Software Development
  units: 100
  description: Besides covering a number of topics in software engineering, with an emphasis on software design, this course
    focuses on imparting a number of skills and industry best practices that are valuable in the development of large software
    projects, such as source control techniques and workflows, issue tracking, code reviews, testing, continuous integration,
    working with existing codebases, integrating APIs and frameworks, generating documentation, deployment, and logging and
    monitoring. The course also emphasizes the importance of collaboration in real-world software development, including interpersonal
    collaboration and team management. The course will be organized primarily around the development of a class-wide software
    project, with students organized into teams. Collaboration both within and across teams will be essential to the success
    of the project.
  prereq: CMSC 14200
  prereq_text: CMSC 14200
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22000. Introduction to Software Development. 100 Units.
- code: CMSC 22001
  title: Software Construction
  units: 100
  description: Large software systems are difficult to build. The course discusses both the empirical aspects of software
    engineering and the underlying theory. Topics will include, among others, software specifications, software design, software
    architecture, software testing, software reliability, and software maintenance. Students will be expected to actively
    participate in team projects in this course.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22001. Software Construction. 100 Units.
- code: CMSC 22010
  title: Digital Fabrication
  units: 100
  description: Digital fabrication involves translation of a digital design into a physical object. While digital fabrication
    has been around for decades, only now has it become possible for individuals to take advantage of this technology through
    low cost 3D printers and open source tools for 3D design and modeling. In this course we will cover the foundations of
    3D object design including computational geometry, the type of models that can and can't be fabricated, the uses and applications
    of digital fabrication, the algorithms, methods and tools for conversion of 3D models to representations that can be directly
    manufactured using computer controlled machines, the concepts and technology used in additive manufacturing (aka 3D printing)
    and the research and practical challenges of developing self-replicating machines. We will have several 3D printers available
    for use during the class and students will design and fabricate several parts during the course.
  prereq: CMSC 15400
  prereq_text: CMSC 15400 and some experience with 3D modeling concepts.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22010. Digital Fabrication. 100 Units.
  needs_review: true
- code: CMSC 22100
  title: Programming Languages
  units: 100
  description: This course is an introduction to scientific programming language design, whereby design choices are made according
    to rigorous and well-founded lines of reasoning. The curriculum includes the lambda calculus, type systems, formal semantics,
    logic and proof, and, time permitting, a light introduction to machine assisted formal reasoning. Practical exercises
    in writing language transformers reinforce the the theory. While this course is not a survey of different programming
    languages, we do examine the design decisions embodied by various popular languages in light of their underlying formal
    systems.
  prereq:
    any:
    - CMSC 14300
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14300 or CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22100. Programming Languages. 100 Units.
- code: CMSC 22200
  title: Computer Architecture
  units: 100
  description: Computing systems have advanced rapidly and transformed every aspect of our lives for the last few decades,
    and innovations in computer architecture is a key enabler. Residing in the middle of the system design layers, computer
    architecture interacts with both the software stack (e.g., operating systems and applications) and hardware technologies
    (e.g., logic gates, interconnects, and memories) to enable efficient computing with unprecedented capabilities. In this
    course, students will learn the fundamental principles, techniques, and tradeoffs in designing the hardware/software interface
    and hardware components to create a computing system that meets functional, performance, energy, cost, and other specific
    goals. Example topics include instruction set architecture (ISA), pipelining, memory hierarchies, input/output, and multi-core
    designs. In addition, we will discuss advanced topics regarding recent research and trends. This course also includes
    hands-on labs, where students will enhance their learning by implementing a modern microprocessor in a C simulator.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22200. Computer Architecture. 100 Units.
- code: CMSC 22240
  title: Computer Architecture for Scientists
  units: 100
  description: Designed to provide an understanding of the key scientific ideas that underpin the extraordinary capabilities
    of today's computers, including speed (gigahertz), illusion of sequential order (relativity), dynamic locality (warping
    space), parallelism, keeping it cheap - and low-energy (e-field scaling), and of course their ability as universal information
    processing engines. These scientific "miracles" are robust, and provide a valuable longer-term understanding of computer
    capabilities, performance, and limits to the wealth of computer scientists practicing data science, software development,
    or machine learning. This course can be used towards fulfilling the Programming Languages and Systems requirement for
    the CS major.
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
  prereq_text: CMSC 14300 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22240. Computer Architecture for Scientists. 100 Units.
- code: CMSC 22300
  title: Functional Programming
  units: 100
  description: 'Programming languages often conflate the definition of mathematical functions, which deterministically map
    inputs to outputs, and computations that effect changes, such as interacting with users and their machines. In this course,
    students will develop an enriched perspective about these two related but distinct mechanisms, by studying the statically-typed
    pure functional programming language Haskell. Topics include: algebraic datatypes, an elegant language for describing
    and manipulating domain-specific data; higher-order functions and type polymorphism, expressive mechanisms for abstracting
    programs; and a core set of type classes, with strong connections to category theory, that serve as a foundational and
    practical basis for mixing pure functions with stateful and interactive computations. In addition to small and medium
    sized programming assignments, the course includes a larger open-ended final project.'
  prereq:
    any:
    - CMSC 14300
    - CMSC 14400
    - CMSC 15200
  prereq_text: CMSC 14300 or CMSC 14400 or CMSC 15200
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22300. Functional Programming. 100 Units.
- code: CMSC 22400
  title: Programming Proofs
  units: 100
  description: In this course, we will explore the use of proof assistants, computer programs that allow us to write, automate,
    and mechanically check proofs. These tools have two main uses. They allow us to prove properties of our programs, thereby
    guaranteeing that our code is free of software errors. They also allow us to formalize mathematics, stating and proving
    mathematical theorems in a manner that leaves no doubt as to their meaning or veracity. At the intersection of these two
    uses lies mechanized computer science, involving proofs about data structures, algorithms, programming languages and verification
    itself.
  notes: This course can count toward the Programming Languages & Systems requirement for the CS Major.
  crosslists:
  - CMSC 32400
  prereq:
    all:
    - any:
      - CMSC 27100
      - CMSC 27130
      - CMSC 37000
      - CMSC 37110
    - any:
      - CMSC 14100
      - CMSC 15100
      - CMSC 16100
      - CMSC 22100
      - CMSC 22300
  prereq_text: (CMSC 27100 or CMSC 27130 or CMSC 37000 or CMSC 37110), and (CMSC 14100 or CMSC 15100 or CMSC 16100 or CMSC
    22100 or CMSC 22300)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22400. Programming Proofs. 100 Units.
- code: CMSC 22450
  title: Foundations of Programming Languages
  units: 100
  description: This course is an introduction to the theory of programming languages. It develops the mathematical tools for
    specifying and reasoning about the static and dynamic semantics of programming languages. The course covers the λ-calculus,
    which underpins the semantics of many real-world languages, as well as various different techniques for specifying language
    semantics.
  crosslists:
  - CMSC 32450
  prereq:
    any:
    - CMSC 14200
    - CMSC 15200
    - CMSC 16200
    - CMSC 12200
    - MATH 15910
  prereq_text: CMSC 14200 or CMSC 15200 or CMSC 16200 or CMSC 12200, or MATH 15910 or higher.
  source:
