    quote: Discrete Mathematics (CMSC 27100, CMSC 27130, or CMSC 37115)
  needs_review: true
- code: CMSC 37220
  title: Information and Coding Theory
  units: 100
  description: 'This course is meant to serve as an introduction to some basic concepts in information theory and error-correcting
    codes, and some of their applications in computer science and statistics. We plan to cover the following topics: Introduction
    to entropy and source coding. Some applications of entropy to counting problems. Mutual information and KL-divergence.
    Method of types and hypothesis testing. I-projections and applications. Introduction to error-correcting codes. Unique
    and list decoding of Reed-Solomon and Reed-Muller codes. Applications of information theory to lower bounds in computational
    complexity and communication complexity. Expected outcomes: Familiarity with concepts such as Entropy, Mutual information
    and KL-divergence. Familiarity with source and channel coding. Understanding of the method of types and ability to derive
    large-deviation bounds using information-theoretic concepts. Understanding of the notions of unique and list decoding
    for various codes.'
  crosslists:
  - TTIC 31200
  prereq_text: Discrete probability. Some knowledge of finite-field algebra is required for the part on error-correcting codes
    but required basics are reviewed in class.
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 37220. Information and Coding Theory. 100 Units.
  needs_review: true
- code: CMSC 37370
  title: High-Dimensional Probability
  units: 100
  description: This course builds an essential probability toolbox for theoretical research in modern data science, theoretical
    computer science, machine learning, statistics, etc. We focus on the foundations of probability in high dimensions and
    their applications in data science. We will cover topics including concentration inequalities, subgaussian and subexponential
    random variables, the thin-shell phenomenon, random matrices, chaining, isoperimetric inequalities, etc. The course is
    suitable for students working in related areas who would like to understand the underlying mathematics systematically.
    Prerequisites include undergrad linear algebra, calculus, and probability theory. There will be no exam in this course,
    and grading is based on problem sets and a final project.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 37370. High-Dimensional Probability. 100 Units.
- code: CMSC 37503
  title: Approximation Algorithms
  units: 100
  description: 'This is a basic course on approximation algorithms, with the main focus on approximation algorithms for central
    combinatorial optimization problems. We will mostly focus on classical algorithmic results, but will also present some
    state of the art results and challenges in the area of approximation. The course will cover major algorithmic techniques,
    including LP-rounding, primal-dual schema, metric methods, SDP rounding and so on. While the main focus of the course
    is on algorithms, we will also discuss lower bounds on approximation and connections between algorithm design and lower
    bound proofs. Assumes the knowledge of material covered in the Algorithms course. Expected outcomes: Understand concepts
    such as approximation factor, polynomial time approximation schemes and hardness of approximation. Understand applications
    of linear programs (LPs) to design of approximation algorithms. Learn to analyze rounding algorithms for LPs and understand
    integrality gaps. Be able to apply LP duality. Understand semi-definite programming and its applications to approximation.'
  crosslists:
  - TTIC 31080
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 37503. Approximation Algorithms. 100 Units.
- code: CMSC 37712
  title: Foundations of Machine Learning and AI - Part II
  units: 100
  description: 'Deep generative models have become a staple of modern machine learning research. This course is meant as an
    introduction to the way generative models are structured and trained: students will learn the mechanics of generative
    models as well as getting their hands dirty building them. We will discuss open questions for which we lack complete theoretical
    or empirical answers, with importance placed on analyzing, interpreting, and making arguments from necessarily incomplete
    empirical evidence. We will have a specific focus on Autoregressive Transformers and their use as Large Language Models
    (LLMs). The goal of this course is to get students to be proficient enough with the inner workings of deep generative
    models to be able to understand and reason about cutting-edge research. This is an advanced machine learning course, and
    assumes a familiarity with basic machine learning concepts (generalization, overfitting, etc.) and techniques (regularization,
    stochastic gradient descent, etc).'
  crosslists:
  - DATA 37712
  prereq_text: DATA 37711; Consent of Instructor unless graduate student in Data Science
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 37712. Foundations of Machine Learning and AI - Part II. 100 Units.
  needs_review: true
- code: CMSC 37799
  title: 'Topics in Machine Learning: Machine Learning and Inverse Problems'
  units: 100
  description: In many scientific and medical settings, we cannot directly observe phenomena of interest, such as images of
    a person's internal organs, the microscopic structure of materials or cells, or observations of distant stars and galaxies.
    Rather, we use MRI scanners, microscopes, and satellites to collect indirect data that require sophisticated numerical
    methods to interpret. This course will explore a variety of machine learning techniques for solving inverse problems,
    ranging from linear inverse problems to PDE parameter estimation and data assimilation.
  crosslists:
  - STAT 37799
  - CAAM 37799
  prereq:
    any:
    - STAT 37710
    - CAAM 37710
    - CMSC 35400
    - consent: instructor
  prereq_text: STAT 37710/CAAM 37710/CMSC 35400 or consent of instructor.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 37799. Topics in Machine Learning: Machine Learning and Inverse Problems. 100 Units.'
- code: CMSC 37810
  title: 'Mathematical Computation I: Matrix Computation Course'
  units: 100
  description: 'This is an introductory course on numerical linear algebra, which is quite different from linear algebra.
    We will be much less interested in algebraic results that follow from axiomatic definitions of fields and vector spaces
    but much more interested in analytic results that hold only over the real and complex fields. The main objects of interest
    are real- or complex-valued matrices, which may come from differential operators, integral transforms, bilinear and quadratic
    forms, boundary and coboundary maps, Markov chains, correlations, DNA microarray measurements, movie ratings by viewers,
    friendship relations in social networks, etc. Numerical linear algebra provides the mathematical and algorithmic tools
    for analyzing these matrices. Topics covered: basic matrix decompositions LU, QR, SVD; Gaussian elimination and LU/LDU
    decompositions; backward error analysis, Gram-Schmidt orthogonalization and QR/complete orthogonal decompositions; solving
    linear systems, least squares, and total least squares problem; low-rank matrix approximations and matrix completion.
    We shall also include a brief overview of stationary and Krylov subspace iterative methods; eigenvalue and singular value
    problems; and sparse linear algebra.'
  crosslists:
  - STAT 30900
  - CAAM 30900
  prereq_text: Linear algebra (STAT 24300 or equivalent) and some previous experience with statistics. Master's students must
    be in Statistics, Computational and Applied Mathematics, Data Science, Mathematics, or Financial Mathematics, or have
    consent of instructor.
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 37810. Mathematical Computation I: Matrix Computation Course. 100 Units.'
  needs_review: true
- code: CMSC 37812
  title: 'Mathematical Computation III: Numerical Methods for PDE''s'
  units: 100
  description: The first part of this course introduces basic properties of PDE's; finite difference discretizations; and
    stability, consistency, convergence, and Lax's equivalence theorem. We also cover examples of finite difference schemes;
    simple stability analysis; convergence analysis and order of accuracy; consistency analysis and errors (i.e., dissipative
    and dispersive errors); and unconditional stability and implicit schemes. The second part of this course includes solution
    of stiff systems in 1, 2, and 3D; direct vs. iterative methods (i.e., banded and sparse LU factorizations); and Jacobi,
    Gauss-Seidel, multigrid, conjugate gradient, and GMRES iterations.
  crosslists:
  - STAT 31100
  - CAAM 31100
  - MATH 38309
  prereq_text: Some prior exposure to differential equations and linear algebra
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 37812. Mathematical Computation III: Numerical Methods for PDE''s. 100 Units.'
  needs_review: true
