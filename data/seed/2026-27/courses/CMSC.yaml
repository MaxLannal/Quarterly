- code: CMSC 25750
  title: Large Language Models
  units: 100
  description: This course will provide an in-depth understanding of key components in large language models (LLMs). It assumes
    prior knowledge of transformers and basic knowledge of modern LLMs. It will cover topics on different approaches to understand
    large language models including prompting and mechanistic interpretability. It will also cover post-training and advanced
    use of LLMs in simulation and scientific discovery.
