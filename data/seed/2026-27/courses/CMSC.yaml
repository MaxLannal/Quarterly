    quote: CMSC 14100. Introduction to Computer Science I. 100 Units.
- code: CMSC 14200
  title: Introduction to Computer Science II
  units: 100
  description: This course is a direct continuation of CMSC 14100. Students will explore more advanced concepts in computer
    science and Python programming, with an emphasis on skills required to build complex software, such as object-oriented
    programming, advanced data structures, functions as first-class objects, testing, and debugging. The class will also introduce
    students to basic aspects of the software development lifecycle, with an emphasis on software design. Students will also
    gain further fluency in working with the Linux command-line, including some basic operating system concepts, as well as
    the use of version control systems for collaborative software development.
  core_tags:
