- code: CMSC 29900
  title: Bachelor's Thesis
  units: 100
  description: Open to fourth-year CS majors.
  notes: Students should visit the Bx Thesis Program page for more details. https://cs.uchicago.edu/academics/undergraduate/bx-thesis-program/
  repeatable: true
