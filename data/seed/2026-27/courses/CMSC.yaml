    37110 or CMSC 27700 or MATH 27700)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22500. Type Theory. 100 Units.
- code: CMSC 22600
  title: Compilers for Computer Languages
  units: 100
  description: This course covers principles of modern compiler design and implementation. Topics include lexical analysis,
    parsing, type checking, optimization, and code generation. This is a project oriented course in which students will construct
    a fully working compiler, using Standard ML as the implementation language.
  prereq:
    any:
    - CMSC 22100
    - CMSC 22300
  prereq_text: CMSC 22100 or CMSC 22300
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22600. Compilers for Computer Languages. 100 Units.
- code: CMSC 22880
  title: Introduction to Quantum Computing
  units: 100
  description: This introduction to quantum computing will cover the key principles of quantum information science and how
    they relate to quantum computing as well as the notation and operations used in QIS. We will then take these building
    blocks and linear algebra principles to build up to several quantum algorithms and complete several quantum programs using
    a mainstream quantum programming language.
  notes: Students who have completed MENG 26400 may not enroll in CMSC 22880.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22880. Introduction to Quantum Computing. 100 Units.
- code: CMSC 22900
  title: Quantum Computer Systems
  units: 100
  description: This course will explore the design, optimization, and verification of the software and hardware involved in
    practical quantum computer systems. The course will provide an introduction to quantum computation and quantum technologies,
    as well as classical and quantum compiler techniques to optimize computations for technologies. Verification techniques
    to evaluate the correctness of quantum software and hardware will also be explored.
  crosslists:
  - CMSC 32900
  prereq:
    all:
    - any:
      - CMSC 14400
      - CMSC 15400
    - any:
      - CMSC 22880
      - MENG 26400
      - CMSC 38410
      - MATH 38410
      - CMSC 38420
      - MATH 38420
  prereq_text: CMSC 14400 or CMSC 15400, and CMSC 22880 or MENG 26400 or CMSC 38410 or MATH 38410 or CMSC 38420 or MATH 38420
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 22900. Quantum Computer Systems. 100 Units.
- code: CMSC 23000
  title: Operating Systems
  units: 100
  description: This course provides an introduction to basic Operating System principles and concepts that form as fundamental
    building blocks for many modern systems from personal devices to Internet-scale services. Basic topics include processes,
    threads, concurrency, synchronization, memory management, virtual memory, segmentation, paging, caching, process and I/O
    scheduling, file systems, storage devices. The course will also cover special topics such as journaling/transactions,
    SSD, RAID, virtual machines, and data-center operating systems. The course project will revolve around the implementation
    of a mini x86 operating system kernel.
  crosslists:
  - CMSC 33000
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23000. Operating Systems. 100 Units.
- code: CMSC 23010
  title: Parallel Computing
  units: 100
  description: 'This course provides an introduction to the concepts of parallel programming, with an emphasis on programming
    multicore processors. Topics include: Processes and threads, shared memory, message passing, direct-memory access (DMA),
    hardware mechanisms for parallel computing, synchronization and communication, patterns of parallel programming. The course
    will involve a substantial programming project implementing a parallel computations.'
  prereq:
    all:
    - any:
      - CMSC 14400
      - CMSC 15400
    - any:
      - CMSC 22200
      - CMSC 22240
      - CMSC 23000
      - CMSC 23300
      - CMSC 23320
  prereq_text: CMSC 14400 or CMSC 15400 and (CMSC 22200, CMSC 22240, CMSC 23000, CMSC 23300, OR CMSC 23320)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23010. Parallel Computing. 100 Units.
  needs_review: true
- code: CMSC 23200
  title: Introduction to Computer Security
  units: 100
  description: This course introduces the principles and practice of computer security. It aims to teach how to model threats
    to computer systems and how to think like a potential attacker. It presents standard cryptographic functions and protocols
    and gives an overview of threats and defenses for software, host systems, networks, and the Web. It also touches on some
    of the legal, policy, and ethical issues surrounding computer security in areas such as privacy, surveillance, and the
    disclosure of security vulnerabilities. The goal of this course is to provide a foundation for further study in computer
    security and to help better understand how to design, build, and use computer systems more securely.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23200. Introduction to Computer Security. 100 Units.
- code: CMSC 23206
  title: Security, Privacy, and Consumer Protection
  units: 100
  description: 'This course will cover the principles and practice of security, privacy, and consumer protection. Topics include:
    basic cryptography; physical, network, endpoint, and data security; privacy (including user surveillance and tracking);
    attacks and defenses; and relevant concepts in usable security. The course will place fundamental security and privacy
    concepts in the context of past and ongoing legal, regulatory, and policy developments, including: consumer privacy, censorship,
    platform content moderation, data breaches, net neutrality, government surveillance, election security, vulnerability
    discovery and disclosure, and the fairness and accountability of automated decision making, including machine learning
    systems. Students will learn both technical fundamentals and how to apply these concepts to public policy outputs and
    recommendations.'
  notes: 'Prerequisites: CMSC 14300 or CMSC 15400 or equivalent, or graduate student. Instructor consent required.'
  crosslists:
  - CMSC 30350
  - CAPP 30350
  prereq:
    all:
    - any:
      - CMSC 14300
      - CMSC 15400
    - consent: instructor
  prereq_text: CMSC 14300 or CMSC 15400 or equivalent, and instructor consent.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23206. Security, Privacy, and Consumer Protection. 100 Units.
  needs_review: true
- code: CMSC 23210
  title: Usable Security and Privacy
  units: 100
  description: Regardless of how secure a system is in theory, failing to consider how humans actually use the system leads
    to disaster in practice. This course will examine how to design for security and privacy from a user-centered perspective
    by combining insights from computer systems, human-computer interaction (HCI), and public policy. We will introduce core
    security and privacy technologies, as well as HCI techniques for conducting robust user studies. Topics will include usable
    authentication, user-centered web security, anonymity software, privacy notices, security warnings, and data-driven privacy
    tools in domains ranging from social media to the Internet of Things. Students will complete weekly problem sets, as well
    as conduct novel research in a group capstone project. No prior experience in security, privacy, or HCI is required.
  crosslists:
  - CMSC 33210
  prereq:
    any:
    - CMSC 12300
    - CMSC 14200
    - CMSC 15400
  prereq_text: CMSC 12300 or CMSC 14200 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23210. Usable Security and Privacy. 100 Units.
- code: CMSC 23218
  title: 'Surveillance Aesthetics: Provocations About Privacy and Security in the Digital Age'
  units: 100
  description: In the modern world, individuals' activities are tracked, surveilled, and computationally modeled to both beneficial
    and problematic ends. Jointly with the School of the Art Institute of Chicago (SAIC), this course will examine privacy
    and security issues at the intersection of the physical and digital worlds. Through both computer science and studio art,
    students will design algorithms, implement systems, and create interactive artworks that communicate, provoke, and reframe
    pervasive issues in modern privacy and security. The course will unpack and re-entangle computational connections and
    data-driven interactions between people, built space, sensors, structures, devices, and data. Synthesizing technology
    and aesthetics, we will communicate our findings to the broader public not only through academic avenues, but also via
    public art and media. The first phase of the course will involve prompts in which students design and program small-scale
    artworks in various contexts, including (1) data collected from web browsing; (2) mobility data; (3) data collected about
    consumers by major companies; and (4) raw sensor data. Students will receive detailed feedback on their work from computer
    scientists, artists, and curators at the Museum of Science & Industry (MSI). The course culminates in the production and
    presentation of a capstone interactive artwork by teams of computer scientists and artists; successful products may be
    considered for prototyping at the MSI.
  notes: 'Students interested in this class should complete this form to request permission to enroll: https://uchicago.co1.qualtrics.com/jfe/form/SV_5jPT8gRDXDKQ26a'
  crosslists:
  - CMSC 33218
  - MADD 23218
  prereq_text: One of CMSC 23200, CMSC 23210, CMSC 25900, CMSC 28400, CMSC 33210, CMSC 33250, or CMSC 33251 recommended, but
    not required.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 23218. Surveillance Aesthetics: Provocations About Privacy and Security in the Digital Age. 100 Units.'
- code: CMSC 23220
  title: Inventing, Engineering and Understanding Interactive Devices
  units: 100
  description: A physical computing class, dedicated to micro-controllers, sensors, actuators and fabrication techniques.
    The objective is that everyone creates their own, custom-made, functional I/O device.
  crosslists:
  - CMSC 33222
  - MADD 23220
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23220. Inventing, Engineering and Understanding Interactive Devices. 100 Units.
- code: CMSC 23230
  title: Engineering Interactive Electronics onto Printed Circuit Boards
  units: 100
  description: In this class we will engineer electronics onto Printed Circuit Boards (PCBs). We will focus on designing and
    laying out the circuit and PCB for our own custom-made I/O devices, such as wearable or haptic devices. In order for you
    to be successful in engineering a functional PCB, we will (1) review digital circuits and three microcontrollers (ATMEGA,
    NRF, SAMD); (2) use KICAD to build circuit schematics; (3) learn how to wire analog/digital sensors or actuators to our
    microcontroller, including SPI and I2C protocols; (4) use KICAD to build PCB schematics; (5) actually manufacture our
    designs; (6) receive in our hands our PCBs from factory; (7) finally, learn how to debug our custom-made PCBs.
  crosslists:
  - CMSC 33230
  prereq:
    all:
    - any:
      - CMSC 14400
      - CMSC 15400
    - any:
      - CMSC 23220
      - CMSC 21400
      - CMSC 20380
      - PHYS 13300
      - PHYS 14300
      - PHYS 22700
  prereq_text: CMSC 14400 or CMSC 15400, and CMSC 23220 or CMSC 21400 or CMSC 20380 or PHYS 13300 or PHYS 14300 or PHYS 22700.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23230. Engineering Interactive Electronics onto Printed Circuit Boards. 100 Units.
- code: CMSC 23240
  title: Emergent Interface Technologies
  units: 100
  description: 'In this class, we critically examine emergent technologies that might impact the future generations of computing
    interfaces, these include: physiological I/O (e.g., brain and muscle computer interfaces), tangible computing (giving
    shape and form to interfaces), wearable computing (I/O devices closer to the user''s body), rendering new realities (e.g.,
    virtual and augmented reality), haptics (giving computers the ability to generate touch and forces) and unusual auditory
    interfaces (e.g., silent speech and microphones as sensors). In this class you will: (1) learn about these new developments
    during the lectures, (2) read HCI papers and summarize these in short weekly assignments, and lastly, (3) start inventing
    the future of computing interfaces by proposing a new idea in the form of a paper abstract, which you will present at
    the end of the semester and have it peer-reviewed in class by your classmates.'
  prereq: CMSC 15400
  prereq_text: CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23240. Emergent Interface Technologies. 100 Units.
- code: CMSC 23260
  title: Internet Censorship and Online Speech
  units: 100
  description: Information dissemination and online discourse on the Internet are subject to the algorithms and filters that
    operate on Internet infrastructure, from network firewalls to search engines. This course will explore the technologies
    that are used to control access to online speech and information, and cutting-edge technologies that can empower citizens
    in the face of these information controls. Students will learn about and experiment with technologies to control online
    discourse, ranging from firewalls that perform network traffic filtering to algorithms for content personalization and
    content moderation. We will also explore underlying technical trends, such as the increasing consolidation of Internet
    infrastructure and protocols, and the implications of consolidation for control over online discourse. Each course meeting
    will include a technical overview, reading discussion, and a hands-on laboratory activity.
  crosslists:
  - MADD 23620
  - PARR 33260
  - CMSC 33260
  prereq_text: None
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23260. Internet Censorship and Online Speech. 100 Units.
- code: CMSC 23310
  title: Advanced Distributed Systems
  units: 100
  notes: Listed under the Computer Systems specialization; no course block on the Computer Science page. Title from that list;
    units assumed 100 like the other listed courses.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23310 Advanced Distributed Systems
  needs_review: true
- code: CMSC 23320
  title: Foundations of Computer Networks
  units: 100
  description: This course focuses on the principles and techniques used in the development of networked and distributed software.
    Topics include programming with sockets; concurrent programming; data link layer (Ethernet, packet switching, etc.); internet
    and routing protocols (IP, IPv6, ARP, etc.); end-to-end protocols (UDP, TCP); and other commonly used network protocols
    and techniques. This is a project-oriented course in which students are required to develop software in C on a UNIX environment.
    This course can be used towards fulfilling the Programming Languages and Systems requirement for the CS major.
  notes: This course can be used towards fulfilling the Programming Languages and Systems requirement for the CS major. Students
    who have taken CMSC 23300 may not take CMSC 23320.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23320. Foundations of Computer Networks. 100 Units.
- code: CMSC 23380
  title: Foundations of Distributed Systems
  units: 100
  description: Modern applications, from AI training clusters to web-scale data analytics, run on distributed systems that
    span hundreds or thousands of machines. This course introduces the fundamental principles that enable such systems to
    provide reliability, scalability, fault tolerance, and high performance despite failures, latency, and contention. We
    will study the classical foundations of distributed systems (time, ordering, consensus, fault tolerance) and connect them
    to modern cloud-native infrastructure such as object stores, distributed databases, serverless compute, and large-scale
    dataflow engines. Through a combination of lectures, readings, and hands-on programming assignments, students will learn
    to design, reason about, and build distributed systems. By the end of the course, students will be able to analyze tradeoffs,
    evaluate system behavior under failure, and implement practical distributed systems.
  crosslists:
  - CMSC 33380
  prereq: CMSC 14400
  prereq_text: CMSC 14400.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23380. Foundations of Distributed Systems. 100 Units.
- code: CMSC 23400
  title: Mobile Computing
  units: 100
  description: 'Mobile computing is pervasive and changing nearly every aspect of society. Sensing, actuation, and mediation
    capabilities of mobile devices are transforming all aspects of computing: uses, networking, interface, form, etc. This
    course explores new technologies driving mobile computing and their implications for systems and society. Current focus
    areas include new techniques to capture 3d models (depth sensors, stereo vision), drones that enable targeted, adaptive,
    focused sensing, and new 3d interactive applications (augmented reality, cyberphysical, and virtual reality). Labs expose
    students to software and hardware capabilities of mobile computing systems, and develop the capability to envision radical
    new applications for a large-scale course project.'
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23400. Mobile Computing. 100 Units.
- code: CMSC 23500
  title: Introduction to Database Systems
  units: 100
  description: 'Computers shape nearly every part of modern life-powering everything from healthcare and finance to entertainment
    and scientific research-and at the core of these systems are databases. Databases lie at the intersection of theory and
    practice: built on mathematical concepts like relational algebra and data structures, yet demanding careful systems engineering
    to deliver performance, reliability, and scalability. This course reveals how databases actually work behind the scenes.
    We begin with the fundamentals of the relational model and SQL to ensure all students have a solid foundation. From there,
    we transition into the internal architecture of database systems. While prior experience with SQL is not required, this
    systems-oriented course delves far beyond writing queries. Students will design and implement a relational database management
    system (DBMS) from scratch in Rust, engaging with core components such as storage and buffer management, indexing, query
    processing, concurrency control, recovery, and transaction management. This course is designed for Computer Science majors
    as an upper-level elective and for graduate students in Computer Science who are interested in learning about the construction
    and optimization of real-world data systems.'
  crosslists:
  - CMSC 33550
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23500. Introduction to Database Systems. 100 Units.
- code: CMSC 23530
  title: Advanced Database Systems
  units: 100
  description: This course focuses on advanced concepts of database systems topics and assumes foundational knowledge outlined
    in CMSC 23500. Topics will include distribute databases, materialized views, multi-dimensional indexes, cloud-native architectures,
    data versioning, and concurrency-control protocols.
  prereq: CMSC 23500
  prereq_text: CMSC 23500
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23530. Advanced Database Systems. 100 Units.
- code: CMSC 23700
  title: Introduction to Computer Graphics
  units: 100
  description: The course provides an introduction to computer graphics, covering fundamental concepts and techniques including
    rasterization, sampling, image/signal processing basics, convolutions, coordinate spaces, transformations, camera viewing,
    3D transformations, ray tracing, 3D processing, parameterization, animation/deformations, and more. Assignments will be
    in Python.
  notes: Prior experience with basic linear algebra (matrix algebra) is recommended.
  crosslists:
  - CMSC 33700
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23700. Introduction to Computer Graphics. 100 Units.
- code: CMSC 23710
  title: Scientific Visualization
  units: 100
  description: Scientific visualization combines computer graphics, numerical methods, and mathematical models of the physical
    world to create a visual framework for understanding and solving scientific problems. The mathematical and algorithmic
    foundations of scientific visualization (e.g. floating point representation, isocontours and volume rendering of scalar
    fields, streamline integration in vector fields) will be explained in the context of real-world data from scientific and
    biomedical domains. The course is also intended for students outside computer science who are experienced with programming
    and computing with scientific data. Projects will be implemented in the C11 dialect of the C programming language, but
    student code is also interactively usable within provided Python-based demonstration apps.
  crosslists:
  - CMSC 33710
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
  prereq_text: CMSC 14300 or CMSC 15400
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23710. Scientific Visualization. 100 Units.
- code: CMSC 23740
  title: Introduction to Real-time Graphics
  units: 100
  description: This course provides an introduction to Computer Graphics with a focus on real-time rendering techniques, such
    as those found in computer-game engines. Topics include coordinate systems and transformations; geometric modeling; the
    programmable graphics pipeline; shadows; level-of detail optimizations; and other rendering techniques. The course covers
    both the theory and practice of computer graphics. The lectures, homework assignments and exams focus on algorithms, data
    structures, and mathematical foundations, while the lab sessions and programming projects deal with translating theory
    into practice.
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400. Prior experience with linear algebra is recommended.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23740. Introduction to Real-time Graphics. 100 Units.
- code: CMSC 23900
  title: Data Visualization
  units: 100
  description: Data visualizations provide a visual setting in which to explore, understand, and explain datasets. This class
    describes mathematical and perceptual principles, methods, and applications of "data visualization" (as it is popularly
    understood to refer primarily to tabulated data). A range of data types and visual encodings will be presented and evaluated.
    Visualizations will be primarily web-based, using D3.js, and possibly other higher-level languages and libraries.
  prereq:
    any:
    - CMSC 12200
    - CMSC 14200
    - CMSC 15200
    - CMSC 16200
  prereq_text: CMSC 12200, CMSC 14200, CMSC 15200, OR CMSC 16200
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 23900. Data Visualization. 100 Units.
- code: CMSC 25025
  title: Machine Learning and Large-Scale Data Analysis
  units: 100
  description: This course is an introduction to machine learning and the analysis of large data sets using distributed computation
    and storage infrastructure. Basic machine learning methodology and relevant statistical theory will be presented in lectures.
    Homework exercises will give students hands-on experience with the methods on different types of data. Methods include
    algorithms for clustering, binary classification, and hierarchical Bayesian modeling. Data types include images, archives
    of scientific articles, online ad clickthrough logs, and public records of the City of Chicago. Programming will be based
    on Python and R, but previous exposure to these languages is not assumed.
