    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33222. Inventing, Engineering and Understanding Interactive Devices. 100 Units.
- code: CMSC 33230
  title: Engineering Interactive Electronics onto Printed Circuit Boards
  units: 100
  description: In this class we will engineer electronics onto Printed Circuit Boards (PCBs). We will focus on designing and
    laying out the circuit and PCB for our own custom-made I/O devices, such as wearable or haptic devices. In order for you
    to be successful in engineering a functional PCB, we will (1) review digital circuits and three microcontrollers (ATMEGA,
    NRF, SAMD); (2) use KICAD to build circuit schematics; (3) learn how to wire analog/digital sensors or actuators to our
    microcontroller, including SPI and I2C protocols; (4) use KICAD to build PCB schematics; (5) actually manufacture our
    designs; (6) receive in our hands our PCBs from factory; (7) finally, learn how to debug our custom-made PCBs.
  crosslists:
  - CMSC 23230
  prereq:
    all:
    - any:
      - CMSC 14400
      - CMSC 15400
    - any:
      - CMSC 23220
      - CMSC 21400
      - CMSC 20380
      - PHYS 13300
      - PHYS 14300
      - PHYS 22700
  prereq_text: CMSC 14400 or CMSC 15400, and CMSC 23220 or CMSC 21400 or CMSC 20380 or PHYS 13300 or PHYS 14300 or PHYS 22700.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33230. Engineering Interactive Electronics onto Printed Circuit Boards. 100 Units.
- code: CMSC 33231
  title: Topics in Human Computer Interaction
  units: 100
  description: Graduate study in current topics in Human Computer Interaction.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33231. Topics in Human Computer Interaction. 100 Units.
- code: CMSC 33232
  title: Combating Misleading Online Content
  units: 100
  description: 'The Internet is rife with misleading online content that can have benign to malicious consequences on users.
    To deal with this problem, we need to understand what types of misleading content exist, how to quantify the harm these
    types of content pose to users, what approaches are in place to detect and flag this content, and how to inform and educate
    users to be mindful of accepting such content at face value. In this seminar, we will discuss current topics related to
    combating misleading online content. These topics may include: disguised advertisements; dark patterns of design; misinformation;
    disinformation; media literacy; content moderation; and censorship. We will examine these topics from a Human-Computer
    Interaction lens. Course meetings will include weekly readings and discussions. Through the course, you will also work
    to develop a research paper on a topic of your choosing related to the overarching seminar themes.'
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33232. Combating Misleading Online Content. 100 Units.
- code: CMSC 33250
  title: Introduction to Computer Security
  units: 100
  description: This graduate course covers foundational research in computer and network security. The goal of this course
    is to provide students with a broad understanding of classical and modern security problems, the mental models and techniques
    commonly used in the field, and practical experience conducting security research. This class will consist of reading
    and discussing academic papers, as well as conducting and presenting an original research project. The course topics will
    span a wide cross-section of security research, ranging from hardware and systems security, to applied cryptography and
    machine learning security, to the economics and human aspects of cybercrime.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33250. Introduction to Computer Security. 100 Units.
- code: CMSC 33251
  title: Topics in Computer Security
  units: 100
  description: Seminar on current topics in computer security.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33251. Topics in Computer Security. 100 Units.
- code: CMSC 33255
  title: Modeling Democracy
  units: 100
  description: This is a graduate course that develops a mathematical/computational toolkit for analyzing democratic systems.
    I'll provide a self-contained introduction to social choice theory, computational social choice theory (also known as
    COMSOC), and applied modeling for democratic mechanisms.
  crosslists:
  - DATA 33255
  prereq_text: Consent of instructor unless graduate student in data science
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33255. Modeling Democracy. 100 Units.
  needs_review: true
- code: CMSC 33260
  title: Internet Censorship and Online Speech
  units: 100
  description: Information dissemination and online discourse on the Internet are subject to the algorithms and filters that
    operate on Internet infrastructure, from network firewalls to search engines. This course will explore the technologies
    that are used to control access to online speech and information, and cutting-edge technologies that can empower citizens
    in the face of these information controls. Students will learn about and experiment with technologies to control online
    discourse, ranging from firewalls that perform network traffic filtering to algorithms for content personalization and
    content moderation. We will also explore underlying technical trends, such as the increasing consolidation of Internet
    infrastructure and protocols, and the implications of consolidation for control over online discourse. Each course meeting
    will include a technical overview, reading discussion, and a hands-on laboratory activity.
  crosslists:
  - MADD 23620
  - PARR 33260
  - CMSC 23260
  prereq_text: None
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33260. Internet Censorship and Online Speech. 100 Units.
  needs_review: true
- code: CMSC 33281
  title: Topics in Human Robot Interaction
  units: 100
  description: 'People engage with most machines (e.g., microwaves, cell phones, printers) in similar ways that they engage
    with non-machine tools (e.g., hammers, water bottles) - they enable people to complete tasks and extend what a person
    can do. However, robots, a specific kind of machine, seem to occupy a unique category where people treat them somewhere
    in between a tool and a human or social agent. A vast majority of people believe that robots cannot have emotions or consciousness
    and that the role of robots is to provide assistance to people - much like the purpose of a tool. However, unlike tools,
    people often ascribe agency, autonomy, and mind to a wide range of robots - from robot vacuums to humanoid robots. In
    this class, we will try to answer the questions: "What factor(s) determine when people engage with robots and machines
    as tools versus social agents? And what are the consequences or outcomes of engaging with robots as tools versus social
    agents?" To answer these questions, we will discuss relevant research papers during class meetings and students will write
    a final paper that proposes a new HRI theory that predicts how humans interact with robots and machines.'
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33281. Topics in Human Robot Interaction. 100 Units.
- code: CMSC 33300
  title: Networks and Distributed Systems
  units: 100
  description: 'This course will focus on studying the state of the art in networking and networked systems, from a research
    and design perspective. We will cover a variety of topics from routing protocols to Internet stability, peer-to-peer,
    social networks and networking for data centers. Coverage of each topic will dive into fundamental design questions of
    protocols and systems, including updates from results of currently active research. Readings will focus on classic and
    current research publications, and students are expected to come in with a solid background on networking basics. Students
    will learn tools, techniques, and concepts while learning to carry out original research in an open-ended course project,
    with the end goal of producing real, publishable results by the end of the quarter. Students are also expected to gain
    experience in two skills: quickly reading technical papers (without sacrificing understanding), and giving clear and well-organized
    presentations.'
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33300. Networks and Distributed Systems. 100 Units.
- code: CMSC 33380
  title: Foundations of Distributed Systems
  units: 100
  description: Modern applications, from AI training clusters to web-scale data analytics, run on distributed systems that
    span hundreds or thousands of machines. This course introduces the fundamental principles that enable such systems to
    provide reliability, scalability, fault tolerance, and high performance despite failures, latency, and contention. We
    will study the classical foundations of distributed systems (time, ordering, consensus, fault tolerance) and connect them
    to modern cloud-native infrastructure such as object stores, distributed databases, serverless compute, and large-scale
    dataflow engines. Through a combination of lectures, readings, and hands-on programming assignments, students will learn
    to design, reason about, and build distributed systems. By the end of the course, students will be able to analyze tradeoffs,
    evaluate system behavior under failure, and implement practical distributed systems.
  crosslists:
  - CMSC 23380
  prereq: CMSC 14400
  prereq_text: CMSC 14400.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33380. Foundations of Distributed Systems. 100 Units.
- code: CMSC 33550
  title: Introduction to Database Systems
  units: 100
  description: 'Computers shape nearly every part of modern life-powering everything from healthcare and finance to entertainment
    and scientific research-and at the core of these systems are databases. Databases lie at the intersection of theory and
    practice: built on mathematical concepts like relational algebra and data structures, yet demanding careful systems engineering
    to deliver performance, reliability, and scalability. This course reveals how databases actually work behind the scenes.
    We begin with the fundamentals of the relational model and SQL to ensure all students have a solid foundation. From there,
    we transition into the internal architecture of database systems. While prior experience with SQL is not required, this
    systems-oriented course delves far beyond writing queries. Students will design and implement a relational database management
    system (DBMS) from scratch in Rust, engaging with core components such as storage and buffer management, indexing, query
    processing, concurrency control, recovery, and transaction management. This course is designed for Computer Science majors
    as an upper-level elective and for graduate students in Computer Science who are interested in learning about the construction
    and optimization of real-world data systems.'
  crosslists:
  - CMSC 23500
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33550. Introduction to Database Systems. 100 Units.
- code: CMSC 33580
  title: The Value of Data
  units: 100
  description: While data and artificial intelligence are driving many changes to our economic, social, political, financial,
    and legal systems, we know little about their foundations and governing dynamics. While the recombination and integration
    of diverse data creates vast new value, we currently have neither theory for how data can be combined nor an industrial
    policy for how to protect against the personal exposures and abuses that grow in proportion. Many of these issues call
    for treating data as a first-class citizen and thinking of it as an asset. What is the value of data, and how do we measure
    it? This course explores these questions from a multidisciplinary perspective that includes computer science, economy,
    social science, among others. The sessions are organized around broad themes related to the value of data. A typical session
    will consist of a short introduction by the instructor, followed by a paper discussion (students are expected to read
    the assigned papers ahead of the class), and finishing with a discussion about individual projects. The course can be
    taken pass-fail or for a letter grade. For a letter grade, you need to complete an individual, quarter-long project. You
    also need to attend classes, participate in discussions, and scribe for two/three classes. For pass-fail, you do not need
    to complete the individual project but all other requirements apply.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33580. The Value of Data. 100 Units.
- code: CMSC 33581
  title: Topics in Big Data
  units: 100
  description: 'The amount of data generated is growing faster than our computational infrastructure, and ever-smarter algorithms
    will be needed to structure, analyze, and manage such scales. This 10-week seminar studies key "great ideas" in scalable
    algorithms for data analysis. Topics include: sampling, sketching, randomized index structures, basic coding theory, and
    query optimization.'
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33581. Topics in Big Data. 100 Units.
- code: CMSC 33590
  title: Controlling Data through Law and Technology
  units: 100
  description: TBA
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33590. Controlling Data through Law and Technology. 100 Units.
- code: CMSC 33700
  title: Introduction to Computer Graphics
  units: 100
  description: The course provides an introduction to computer graphics, covering fundamental concepts and techniques including
    rasterization, sampling, image/signal processing basics, convolutions, coordinate spaces, transformations, camera viewing,
    3D transformations, ray tracing, 3D processing, parameterization, animation/deformations, and more. Assignments will be
    in Python.
  notes: Prior experience with basic linear algebra (matrix algebra) is recommended.
  crosslists:
  - CMSC 23700
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33700. Introduction to Computer Graphics. 100 Units.
- code: CMSC 33710
  title: Scientific Visualization
  units: 100
  description: Scientific visualization combines computer graphics, numerical methods, and mathematical models of the physical
    world to create a visual framework for understanding and solving scientific problems. The mathematical and algorithmic
    foundations of scientific visualization (e.g. floating point representation, isocontours and volume rendering of scalar
    fields, streamline integration in vector fields) will be explained in the context of real-world data from scientific and
    biomedical domains. The course is also intended for students outside computer science who are experienced with programming
    and computing with scientific data. Projects will be implemented in the C11 dialect of the C programming language, but
    student code is also interactively usable within provided Python-based demonstration apps.
  crosslists:
  - CMSC 23710
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
  prereq_text: CMSC 14300 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 33710. Scientific Visualization. 100 Units.
