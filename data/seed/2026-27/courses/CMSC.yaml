    quote: CMSC 22450. Foundations of Programming Languages. 100 Units.
  needs_review: true
- code: CMSC 22500
  title: Type Theory
  units: 100
  description: Church's λ-calculus, β-reduction, the Church-Rosser theorem. Simple type theory, strong normalization. The
    Barendregt cube of type theories. Dependent types. The Curry-Howard Isomorphism. Formal constructive mathematics.
  prereq:
