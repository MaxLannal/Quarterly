- code: CMSC 19925
  title: 'Understanding AI: Challenges, Changes for How We Communicate'
  units: 100
  description: 'Generative AI, large language models (LLMs) -- these buzzwords have been popping up in newsrooms, classrooms,
    and dinner tables. Questions about safety, environmental impacts, economic impacts and educational effects make people
    wonder how AI works, how it might change and augment the way we communicate and write, and what we should do about it.
    This class will give students the opportunity to: understand how AI powered applications for writing such as Gmail''s
    Smart Compose feature and Grammarly''s personalized revision suggestions work, get hands-on-experiences working with various
    AI-powered writing tools, speak with researchers and industry professionals to understand the design, impact, and motivation
    of these AI-based tools, consider historical events such as the development of the printing press and the internet to
    contextualize the effects of technology on human communication, and create a final project that analyzes and reflects
    on how technologies change the way that we communicate and write. Through these experiences, students will better understand
    the present AI landscape, with a focus on LLMs and their impacts on communication and writing, and form their own perspectives
    on the opportunities and risks of AI.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 19925. Understanding AI: Challenges, Changes for How We Communicate. 100 Units.'
- code: CMSC 19928
  title: 'Quantum Computing: An Introduction'
  units: 100
  description: This course will introduce students to the interdisciplinary endeavor of quantum computing. The course will
    focus on developing intuition about the quantum phenomena underlying quantum computing (superposition and entanglement),
    and their benefits and limitations. Through hands-on interfacing with Qiskit (a popular quantum computing language environment),
    students will learn about basic quantum operations and measurement, how to build basic quantum circuits with those operations,
    and understand example quantum algorithms. Students will develop strong competence in the fundamentals of quantum computing
    that will begin to prepare them for a career in the Quantum Information Systems space."
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 19928. Quantum Computing: An Introduction. 100 Units.'
- code: CMSC 19929
  title: Creating Computer Games for Learning
  units: 100
  description: 'As the computing field continues to advance, interdisciplinary applications of computer science are of increasing
    importance. This class focuses on a fun approach to the challenge and necessity of designing for human users: creating
    computer games for learning. We will learn game programming and explore concepts in game design, psychology, and education
    theory as we create our own educational computer games, where incorporating personal experiences and interests will be
    highly encouraged. During this process, we will meet active researchers in the field to discuss what they are using computer
    games to teach and how their games are effectively teaching it.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 19929. Creating Computer Games for Learning. 100 Units.
- code: CMSC 20300
  title: Introduction to Human-Computer Interaction
  units: 100
  description: 'An introduction to the field of Human-Computer Interaction (HCI), with an emphasis in understanding, designing
    and programming user-facing software and hardware systems. This class covers the core concepts of HCI: affordances, mental
    models, selection techniques (pointing, touch, menus, text entry, widgets, etc), conducting user studies (psychophysics,
    basic statistics, etc), rapid prototyping (3D printing, etc), and the fundamentals of 3D interfaces (optics for VR, AR,
    etc). We compliment the lectures with weekly programming assignments and two larger projects, in which we build/program/test
    user-facing interactive systems.'
  crosslists:
  - CMSC 30300
  - MADD 25300
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14200 or CMSC 15400 or CMSC 22000
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20300. Introduction to Human-Computer Interaction. 100 Units.
- code: CMSC 20310
  title: Introduction to Designing Interaction
  units: 100
  description: We are surrounded by interactive systems and designs, from the user interfaces for our computers and smartphones
    to home appliances, doors, and furniture. This class will introduce basic techniques, theories, and practices in designing
    interactive objects and systems. Specifically, it will introduce students to developing user experience-centric perspectives
    on critically reflecting on existing (and future) interactive designs. It also provides practices for students to ideate
    new design solutions and prototype them using design and engineering methods. Centered in interaction design, the class
    covers broad topics touching human-computer interaction, industrial design, user experience design, and communication
    design.
  crosslists:
  - MADD 20310
  prereq:
    any:
    - CMSC 15200
    - CMSC 15400
    - CMSC 14200
    - CMSC 14300
    - CMSC 14400
  prereq_text: CMSC 15200, CMSC 15400, CMSC 14200, CMSC 14300, or CMSC 14400.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20310. Introduction to Designing Interaction. 100 Units.
- code: CMSC 20360
  title: Creating Interactive Systems With User-Centered Design
  units: 100
  description: Creating technologies that fit into people's lives involves more than having technically sophisticated algorithms,
    systems, and infrastructure. It involves deeply understanding various community needs and using this understanding coupled
    with our knowledge of how people think and behave to design user-facing interfaces that can enhance and augment human
    capabilities. When dealing with different kinds of users, achieving these goals requires us to think through how different
    constraints such as costs, access to resources, and various cognitive and physical capabilities shape what socio-technical
    systems can best address a particular issue. This course leverages human-computer interaction and the tools, techniques,
    and principles that guide research on people to introduce you to the concepts of user centered design. You will learn
    about different user groups such as children, older adults, users facing financial constraints as well as those needing
    assistive technology and their particular needs. In addition, you will learn how to be mindful of working with different
    types of user populations and how to think creatively of technology solutions that enhance human capabilities while minimizing
    harm. You will also put your skills into practice in a quarter long group project involving the creation of an interactive
    system for one of the user populations we study.
  notes: Students who have taken 20370 may not enroll in 20360.
  crosslists:
  - MADD 20360
  - CMSC 30360
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
    - CMSC 12300
    - CMSC 22000
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 14400 or CMSC 15400 or CMSC 12300 or CMSC 22000 or CMSC 20300 or CMSC 20310.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 20360. Creating Interactive Systems With User-Centered Design. 100 Units.
- code: CMSC 20370
  title: 'Inclusive Technology: Designing for Underserved and Marginalized Populations'
  units: 100
  description: Creating technologies that are inclusive of people in marginalized communities involves more than having technically
    sophisticated algorithms, systems, and infrastructure. It involves deeply understanding various community needs and using
    this understanding coupled with our knowledge of how people think and behave to design user-facing interfaces that can
    enhance and augment human capabilities. When dealing with under-served and marginalized communities, achieving these goals
    requires us to think through how different constraints such as costs, access to resources, and various cognitive and physical
    capabilities shape what socio-technical systems can best address a particular issue. This course leverages human-computer
    interaction and the tools, techniques, and principles that guide research on people to introduce you to the concepts of
    inclusive technology design. You will learn about different underserved and marginalized communities such as children,
    the elderly, those needing assistive technology, and users in developing countries, and their particular needs. In addition,
    you will learn how to be mindful of working with populations that can easily be exploited and how to think creatively
    of inclusive technology solutions. You will also put your skills into practice in a semester long group project involving
    the creation of an interactive system for one of the user populations we study.
  crosslists:
  - MADD 20370
  - CMSC 30370
  prereq:
    any:
