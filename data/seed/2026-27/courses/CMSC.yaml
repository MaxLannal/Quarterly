  prereq_text: (CMSC 27100 or CMSC 27130 or CMSC 37000 or CMSC 37110), and (CMSC 14100 or CMSC 15100 or CMSC 16100 or CMSC
    22100 or CMSC 22300)
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 32400. Programming Proofs. 100 Units.
- code: CMSC 32450
  title: Foundations of Programming Languages
  units: 100
  description: This course is an introduction to the theory of programming languages. It develops the mathematical tools for
    specifying and reasoning about the static and dynamic semantics of programming languages. The course covers the λ-calculus,
    which underpins the semantics of many real-world languages, as well as various different techniques for specifying language
    semantics.
  crosslists:
  - CMSC 22450
  prereq_text: CMSC 14200 or CMSC 15200 or CMSC 16200 or CMSC 12200, or MATH 15910 or higher.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 32450. Foundations of Programming Languages. 100 Units.
  needs_review: true
- code: CMSC 32900
  title: Quantum Computer Systems
  units: 100
  description: This course will explore the design, optimization, and verification of the software and hardware involved in
    practical quantum computer systems. The course will provide an introduction to quantum computation and quantum technologies,
    as well as classical and quantum compiler techniques to optimize computations for technologies. Verification techniques
    to evaluate the correctness of quantum software and hardware will also be explored.
  crosslists:
  - CMSC 22900
  prereq:
    all:
    - any:
      - CMSC 14400
      - CMSC 15400
    - any:
      - CMSC 22880
      - MENG 26400
