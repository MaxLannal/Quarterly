- code: CMSC 10142
  title: Collaborative Learning in Computer Science II
  units: 0
  description: This is an optional, limited enrollment workshop for students concurrently enrolled in CMSC 142 Introduction
    to Computer Science II. The workshops focus on problem sets designed to augment students' learning in Computer Science
    II. Undergraduate Team Leaders will coach students as they work collaboratively in small groups on the assigned problems
    by referencing class lectures and assigned reading materials. Additionally, these workshops aim to develop communication
