- code: CMSC 32201
  title: Topics in Computer Architecture
  units: 100
  description: This course covers a selection of advanced topics in computer architecture.
  prereq_text: Consent of department counselor and instructor
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 32201. Topics in Computer Architecture. 100 Units.
  needs_review: true
- code: CMSC 32241
  title: Topics in Advanced Computer Systems Architecture
  units: 100
  description: 'Advanced hardware systems underpin all computing advances: AI/ML training, scalable clouds, intelligence in
    drones and medical implants, and smartphones. However, hardware technology advance (Silicon) has slowed to a crawl. How
    will future computer architecture meet the exploding demand for computing? We focus on the explosion of accelerators,
    how software/application interplay with hardware design (architecture) to meet the physical challenges of locality, power,
    and speed. Participants should expect to be exposed to advanced computer architecture topics and learn to reason rigorously
    about them. Topics may include accelerators, scalability, energy-efficiency, storage, interconnection networks, compilers,
    etc. But they will vary with each offering; contact Prof Andrew Chien for current information.'
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 32241. Topics in Advanced Computer Systems Architecture. 100 Units.
- code: CMSC 32400
  title: Programming Proofs
  units: 100
  description: In this course, we will explore the use of proof assistants, computer programs that allow us to write, automate,
    and mechanically check proofs. These tools have two main uses. They allow us to prove properties of our programs, thereby
    guaranteeing that our code is free of software errors. They also allow us to formalize mathematics, stating and proving
    mathematical theorems in a manner that leaves no doubt as to their meaning or veracity. At the intersection of these two
    uses lies mechanized computer science, involving proofs about data structures, algorithms, programming languages and verification
    itself.
  notes: This course can count toward the Programming Languages & Systems requirement for the CS Major.
  crosslists:
  - CMSC 22400
  prereq:
    all:
    - any:
      - CMSC 27100
      - CMSC 27130
      - CMSC 37000
      - CMSC 37110
    - any:
