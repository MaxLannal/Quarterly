- code: CMSC 30120
  title: Technical Presentation
  units: 100
  description: This course is intended for PhD students in CS and Data Science. This seminar will focus on giving technical
    presentations, emphasizing presenting results at a conference or workshop. We will cover topics such as structuring and
    designing talks, audience identification, setting context, introductions, body language, pacing, slideshow visualizations,
    explaining experiments and results, conclusions, and other general tips. Students will be expected to give short snippets
    of talks and provide active feedback on others.
  crosslists:
  - DATA 30120
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30120. Technical Presentation. 100 Units.
- code: CMSC 30300
  title: Introduction to Human-Computer Interaction
  units: 100
  description: 'An introduction to the field of Human-Computer Interaction (HCI), with an emphasis in understanding, designing
    and programming user-facing software and hardware systems. This class covers the core concepts of HCI: affordances, mental
    models, selection techniques (pointing, touch, menus, text entry, widgets, etc), conducting user studies (psychophysics,
    basic statistics, etc), rapid prototyping (3D printing, etc), and the fundamentals of 3D interfaces (optics for VR, AR,
    etc). We compliment the lectures with weekly programming assignments and two larger projects, in which we build/program/test
    user-facing interactive systems.'
  crosslists:
  - MADD 25300
  - CMSC 20300
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14200 or CMSC 15400 or CMSC 22000
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30300. Introduction to Human-Computer Interaction. 100 Units.
- code: CMSC 30350
  title: Security, Privacy, and Consumer Protection
  units: 100
  description: 'This course will cover the principles and practice of security, privacy, and consumer protection. Topics include:
    basic cryptography; physical, network, endpoint, and data security; privacy (including user surveillance and tracking);
    attacks and defenses; and relevant concepts in usable security. The course will place fundamental security and privacy
    concepts in the context of past and ongoing legal, regulatory, and policy developments, including: consumer privacy, censorship,
    platform content moderation, data breaches, net neutrality, government surveillance, election security, vulnerability
    discovery and disclosure, and the fairness and accountability of automated decision making, including machine learning
    systems. Students will learn both technical fundamentals and how to apply these concepts to public policy outputs and
    recommendations.'
  notes: 'Prerequisites: CMSC 14300 or CMSC 15400 or equivalent, or graduate student. Instructor consent required.'
  crosslists:
  - CMSC 23206
  - CAPP 30350
  prereq_text: CMSC 14300 or CMSC 15400 or equivalent, and instructor consent.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30350. Security, Privacy, and Consumer Protection. 100 Units.
  needs_review: true
- code: CMSC 30360
  title: Creating Interactive Systems With User-Centered Design
  units: 100
  description: Creating technologies that fit into people's lives involves more than having technically sophisticated algorithms,
    systems, and infrastructure. It involves deeply understanding various community needs and using this understanding coupled
    with our knowledge of how people think and behave to design user-facing interfaces that can enhance and augment human
    capabilities. When dealing with different kinds of users, achieving these goals requires us to think through how different
    constraints such as costs, access to resources, and various cognitive and physical capabilities shape what socio-technical
    systems can best address a particular issue. This course leverages human-computer interaction and the tools, techniques,
    and principles that guide research on people to introduce you to the concepts of user centered design. You will learn
    about different user groups such as children, older adults, users facing financial constraints as well as those needing
    assistive technology and their particular needs. In addition, you will learn how to be mindful of working with different
    types of user populations and how to think creatively of technology solutions that enhance human capabilities while minimizing
    harm. You will also put your skills into practice in a quarter long group project involving the creation of an interactive
    system for one of the user populations we study.
  notes: Students who have taken 20370 may not enroll in 20360.
  crosslists:
  - MADD 20360
  - CMSC 20360
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
    - CMSC 12300
    - CMSC 22000
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 14400 or CMSC 15400 or CMSC 12300 or CMSC 22000 or CMSC 20300 or CMSC 20310.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30360. Creating Interactive Systems With User-Centered Design. 100 Units.
- code: CMSC 30370
  title: 'Inclusive Technology: Designing for Underserved and Marginalized Populations'
  units: 100
  description: Creating technologies that are inclusive of people in marginalized communities involves more than having technically
    sophisticated algorithms, systems, and infrastructure. It involves deeply understanding various community needs and using
    this understanding coupled with our knowledge of how people think and behave to design user-facing interfaces that can
    enhance and augment human capabilities. When dealing with under-served and marginalized communities, achieving these goals
    requires us to think through how different constraints such as costs, access to resources, and various cognitive and physical
    capabilities shape what socio-technical systems can best address a particular issue. This course leverages human-computer
    interaction and the tools, techniques, and principles that guide research on people to introduce you to the concepts of
    inclusive technology design. You will learn about different underserved and marginalized communities such as children,
    the elderly, those needing assistive technology, and users in developing countries, and their particular needs. In addition,
    you will learn how to be mindful of working with populations that can easily be exploited and how to think creatively
    of inclusive technology solutions. You will also put your skills into practice in a semester long group project involving
    the creation of an interactive system for one of the user populations we study.
  crosslists:
  - CMSC 20370
  - MADD 20370
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
    - CMSC 12300
    - CMSC 22000
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 14400 or CMSC 15400 or CMSC 12300 or CMSC 22000 or CMSC 20300 or CMSC 20310
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 30370. Inclusive Technology: Designing for Underserved and Marginalized Populations. 100 Units.'
- code: CMSC 30380
  title: Actuated User Interfaces and Technology
  units: 100
  description: The recent advancement in interactive technologies allows computer scientists, designers, and researchers to
    prototype and experiment with future user interfaces that can dynamically move and shape-change. This class offers hands-on
    experience in learning and employing actuated and shape-changing user interface technologies to build interactive user
    experiences. The class provides a range of basic engineering techniques to allow students to develop their own actuated
    user interface systems, including 3D mechanical design, digital fabrication (e.g. 3D Printing), electronics (Arduino microcontroller),
    and actuator control (utilizing different kinds of motors). Through multiple project-based assignments, students practice
    the acquired techniques to build interactive tangible experiences of their own.
  crosslists:
  - MADD 20380
  - CMSC 20380
  prereq:
    any:
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 20300 or CMSC 20310
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30380. Actuated User Interfaces and Technology. 100 Units.
- code: CMSC 30600
  title: Introduction to Robotics
  units: 100
  description: The University of Chicago's CMSC 20600 Introduction to Robotics course gives students a hands-on introduction
    to robot programming covering topics including sensing in real-world environments, sensory-motor control, state estimation,
    localization, forward/inverse kinematics, vision, and reinforcement learning. This course is centered around 3 mini projects
    exploring central concepts to robot programming and 1 final project whose topic is chosen by the students. Each of these
    mini projects will involve students programming real, physical robots interacting with the real world. The use of physical
    robots and real-world environments is essential in order for students to 1) see the result of their programs 'come to
    life' in a physical environment and 2) gain experience facing and overcoming the challenges of programming robots (e.g.,
    sensor noise, edge cases due to environment variability, physical constraints of the robot and environment).
  crosslists:
  - CMSC 20600
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
  prereq_text: CMSC 14200 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30600. Introduction to Robotics. 100 Units.
- code: CMSC 30630
  title: 'Human-Robot Interaction: Research and Practice'
  units: 100
  description: 'Robots are increasingly common in our everyday spaces: tutoring elementary students, assisting human workers
    in manufacturing contexts, providing museum tours, interacting with families within their homes, and helping to care for
    the elderly. One critical factor to the success of these robots is their ability to effectively interact with people:
    human-robot interactions. This course focuses on the core concepts and cutting-edge research in the field of human-robot
    interaction (HRI), covering topics that include nonverbal robot behavior, verbal robot behavior, social dynamics, norms
    & ethics, collaboration & learning, group interactions, applications, and future challenges of HRI. In class meetings,
    students lead discussions about cutting-edge peer-reviewed research HRI publications. In weekly labs, students engage
    in hands-on activities to learn the essential skills of human-robot interaction research, including experiment design,
    robot programming, and data analysis techniques. Students also participate in a quarter-long collaborative research project,
    where they pursue an HRI research question that often involves conducting their own human-subjects research study where
    they recruit human subjects to interact with a robot.'
  crosslists:
  - CMSC 20630
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
  prereq_text: CMSC 14200 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 30630. Human-Robot Interaction: Research and Practice. 100 Units.'
- code: CMSC 30900
  title: Computers for Learning
  units: 100
  description: 'Over time, technology has occupied an increasing role in education, with mixed results. Massive Open Online
    Courses (MOOCs) were created to bring education to those without access to universities, yet most of the students who
    succeed in them are those who are already successful in the current educational model. This course focuses on one intersection
    of technology and learning: computer games. This course covers education theory, psychology (e.g., motivation, engagement),
    and game design so that students can design and build an educational learning application. Labs focus on developing expertise
    in technology, and readings supplement lecture discussions on the human components of education.'
  crosslists:
  - CMSC 20900
  - MADD 20900
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14300 or CMSC 15400 or CMSC 22000
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 30900. Computers for Learning. 100 Units.
- code: CMSC 31140
  title: 'Computational Imaging: Theory and Methods'
  units: 100
  description: Computational imaging refers to the process of forming images from data where computation plays an integral
    role. This course will cover basic principles of computational imaging, including image denoising, regularization techniques,
    linear inverse problems and optimization-based solvers, and data acquisition models associated with tomography and interferometry.
    Specific topics may include patch-based denoising, sparse coding, total variation, dictionary learning, computational
    photography, compressive imaging, inpainting, and deep learning for image reconstruction.
  crosslists:
  - CAAM 31140
  - STAT 31140
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 31140. Computational Imaging: Theory and Methods. 100 Units.'
- code: CMSC 31150
  title: Mathematical Toolkit
  units: 100
  description: 'The course is aimed at first-year graduate students and advanced undergraduates. The goal of the course is
    to collect and present important mathematical tools used in different areas of computer science. The course will mostly
    focus on linear algebra and probability. We intend to cover the following topics and examples: Abstract linear algebra:
    vector spaces, linear transformations, Hilbert spaces, inner product, Gram-Schmidt orthogonalization, Eigenvalues and
    eigenvectors, SVD, least squares (under/over-constrained) Discrete probability: random variables, Markov, Chebyshev and
    Chernoff bounds. Gaussian variables, concentration inequalities, dimension reduction Martingales (time permitting) Stochastic
    Processes (time permitting) Expected outcomes: Ability to write correctly typed rigorous proofs. Understanding of various
    notions of linear algebra in the context of abstract vector spaces. Ability to understand and analyze stochastic processes.
    Familiarity with discrete and continuous random variables and various concentration bounds. Prerequisites: None'
  crosslists:
  - TTIC 31150
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 31150. Mathematical Toolkit. 100 Units.
- code: CMSC 31170
  title: Planning, Learning, and Estimation for Robotics and Artificial Intelligence
  units: 100
  description: 'This course concerned with fundamental techniques in robotics and artificial intelligence (AI), with an emphasis
    on probabilistic inference, learning, and planning under uncertainty. The course will investigate the theoretical foundations
    underlying these topics as rigorous mathematical tools that enable solutions to real-world problems drawn broadly from
    robotics and AI. The course will cover topics that include: Bayesian filtering (Kalman filtering, particle filtering,
    and dynamic Bayesian networks), simultaneous localization and mapping, planning, Markov decision processes, partially
    observable Markov decision processes, reinforcement learning, and graphical models. Expected outcomes: •'
  crosslists:
  - TTIC 31170
  prereq_text: Basic familiarity with basic linear algebra; background in probability theory; basic programming experience
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 31170. Planning, Learning, and Estimation for Robotics and Artificial Intelligence. 100 Units.
  needs_review: true
- code: CMSC 31230
  title: Fundamentals of Deep Learning
  units: 100
  description: 'Introduction to fundamental principles of deep learning. Deep learning systems are evolving rapidly and this
    course presents up to date material at a conceptual level. The course emphasizes theoretical and intuitive understanding
    rather than particular programming formalisms. Topics: Information theory as an organizing principle for machine learning
    and deep learning in particular. Deep learning frameworks. The "educational framework" (EDF) witten in directly in NumPy.
    Deep networks for computer vision: Convolutional neural networks (CNNs) and Resnet and the general principles behind them.
    Deep networks for language processing: Recurrent neural networks (RNNs), the Transformer, their applications and the general
    principles behind them. The theory and practice of stochastic gradient descent. Regularization and Generalization. Generative
    Adversarial Networks (GANs) Variational Autoencoders (VAEs) Contrastive Predictive Coding (CPC) Energy Based Models Reinforcement
    learning and AlphaZero Expected outcomes: An understanding of the general issues sufficient to guide architecture design
    and training. An ability to read and understand the current research literature in deep learning.'
  crosslists:
  - TTIC 31230
  prereq_text: 'Prerequisites: linear algebra, vector calculus, familiarity with multivariate Gaussian probability distributions
    and Markov processes.'
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 31230. Fundamentals of Deep Learning. 100 Units.
  needs_review: true
- code: CMSC 31500
  title: Data Interaction
  units: 100
  description: This course provides core knowledge and technical skills around data interfaces, with an emphasis on visualization
    and front-end software development. Graduate students in Data Science and Computer Science will engage in project-based
    learning to become fluent with visualization APIs, computational notebooks, web development, technical writing, and presentation.
    Topics of interest include data visualization design, cartography, interactive articles, data storytelling, uncertainty
    communication, model interpretability, and appropriate use of AI assistance.
  crosslists:
