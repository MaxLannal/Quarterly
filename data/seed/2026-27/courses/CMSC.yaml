- code: CMSC 25800
  title: Adversarial Machine Learning
  units: 100
  description: Machine learning tools are now integrated into all facets of our lives, ranging from facial recognition running
    on deep neural network classifiers on our phones, to large language models as productivity and educational tools. Yet
    they are dynamic and ever evolving tools with significant limitations and weaknesses, some of which can be used to manipulate
    their results, while others can be used to limit the harms produced by their misuse and weaponization. This course takes
    a pragmatic perspective to the intersection between machine learning and security and privacy. Students will learn about
    specific topics related to both security (robustness, consistency, attacks and defenses) and privacy of machine learning
    models, ranging from classifiers on deep neural network architectures to generative tools for text (large language models)
    and images (diffusion models). We will study both concepts and implementations of a range of attacks and defenses, from
    using optimization methods (SGD, PGD, CW) that generate model evasion attacks (e.g. adversarial examples) to broader classes
    of poisoning attacks (dirty-label, clean-label), privacy attacks (model-inversion/extraction, membership-inference), and
    evolving attacks against large language models. We will also cover techniques to improve model robustness and to defend
    against a variety of attacks.
  prereq:
    any:
    - CMSC 25300
    - CMSC 25400
    - TTIC 31020
  prereq_text: CMSC 25300 or CMSC 25400 or TTIC 31020.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 25800. Adversarial Machine Learning. 100 Units.
- code: CMSC 25910
  title: Engineering for Ethics, Privacy, and Fairness in Computer Systems
  units: 100
  description: This course takes a technical approach to understanding ethical issues in the design and implementation of
    computer systems. Technologies like machine learning systems, large language models, the web, ubiquitous sensing, algorithmic
    personalization/targeting, and surveillance systems all raise numerous ethical concerns. Tensions often arise between
    a computer system's utility and its privacy-invasiveness, between its robustness and its flexibility, and between its
    ability to leverage existing data and existing data's tendency to encode biases. The course will demonstrate how computer
    systems can violate individuals' privacy and agency, impact sub-populations in disparate ways, and harm both society and
    the environment. It will also introduce computational approaches to privacy, fairness, transparency, anonymity, internationalization,
    and auditing. Through hands-on programming assignments and a final project, students will design and implement computer
    systems that reflect both ethics and privacy by design. They will also wrestle with fundamental questions about who bears
    responsibility for a system's shortcomings, how to balance different stakeholders' goals, and what societal values computer
    systems should embed. Students may not take CMSC 25910 if they have taken CMSC 25900 or DATA 25900.
  notes: 'anti-requisites: CMSC 25900, DATA 25900'
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
  prereq_text: CMSC 14400 or CMSC 15400.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 25910. Engineering for Ethics, Privacy, and Fairness in Computer Systems. 100 Units.
- code: CMSC 27100
  title: Discrete Mathematics
  units: 100
  description: This course emphasizes mathematical discovery and rigorous proof, which are illustrated on a refreshing variety
    of accessible and useful topics. Basic counting is a recurring theme and provides the most important source for sequences,
    which is another recurring theme. Further topics include proof by induction; recurrences and Fibonacci numbers; graph
    theory and trees; number theory, congruences, and Fermat's little theorem; counting, factorials, and binomial coefficients;
    combinatorial probability; random variables, expected value, and variance; and limits of sequences, asymptotic equality,
    and rates of growth.
  notes: This is a directed course in mathematical topics and techniques that is a prerequisite for courses such as CMSC 27200
