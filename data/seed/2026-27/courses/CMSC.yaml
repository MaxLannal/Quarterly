    quote: CMSC 35750. Large Language Models. 100 Units.
- code: CMSC 35800
  title: Advanced Adversarial Machine Learning
  units: 100
  description: Machine learning tools are integrated into all facets of our lives, ranging from facial recognition running
    on deep neural network classifiers on our phones, to large language models as productivity and educational tools. They
    are dynamic and ever evolving tools with significant limitations and weaknesses, some of which can be used to weaponize
    to produce harm, while others can be used to limit those harms. This course takes a pragmatic perspective to the intersection
    between machine learning and security and privacy. The course will focus on advanced topics related to both security (robustness,
    consistency, attacks and defenses) and privacy of machine learning models, ranging from deep neural network classifiers
    to generative models (LLMs and diffusion models). Lectures will cover high impact research literature in the field, and
    students will conduct open ended research in course projects.
  prereq:
    any:
    - CMSC 35300
    - CMSC 35400
    - TTIC 31020
  prereq_text: CS35300 or CS35400 or TTIC 31020
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35800. Advanced Adversarial Machine Learning. 100 Units.
- code: CMSC 35900
  title: Topics in Artificial Intelligence
  units: 100
  description: Graduate study of current topics in artificial intelligence.
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35900. Topics in Artificial Intelligence. 100 Units.
- code: CMSC 36500
  title: Algorithms in Finite Groups
  units: 100
  description: We consider the asymptotic complexity of some of the basic problems of computational group theory. The course
    demonstrates the relevance of a mix of mathematical techniques, ranging from combinatorial ideas, the elements of probability
    theory, and elementary group theory, to the theories of rapidly mixing Markov chains, applications of simply stated consequences
    of the Classification of Finite Simple Groups (CFSG), and, occasionally, detailed information about finite simple groups.
    No programming problems are assigned.
  notes: This course is offered in alternate years.
  crosslists:
  - MATH 37500
  prereq_text: Consent of department counselor. Linear algebra, finite fields, and a first course in group theory (Jordan-Holder
    and Sylow theorems) required; prior knowledge of algorithms not required
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 36500. Algorithms in Finite Groups. 100 Units.
  needs_review: true
- code: CMSC 37000
  title: Algorithms
  units: 100
  description: 'This is a graduate level course on algorithms with the emphasis on central combinatorial optimization problems
    and methods for algorithm design and analysis. Topics covered include greedy algorithms, dynamic programming, algorithms
    for maximum flow and minimum cut, applications of linear programming, randomized algorithms, combinatorial optimization,
    and approximation algorithms. Time permitting, additional topics, such as online algorithms and probabilistic method will
    be covered. The course textbook is "Algorithm Design" by Kleinberg and Tardos Specific topics covered: Greedy algorithms
    Dynamic programming Max flow, min cut, bipartite matching, and their applications Linear programming, LP-duality NP-hardness
    Approximation algorithms Randomized algorithms (optional): online algorithms; probabilistic method Expected outcomes:
    Ability to design and rigorously analyze algorithms using paradigms such as greedy or dynamic programming. Understand
    the use of linear programming in optimization. Be able to formulate problems as linear programs. Knowledge of maximum
    flow / minimum cut problems and algorithms for solving them, and ability to apply this knowledge to suitable graph optimization
    problems. Understand the notion of NP-hardness and ability to prove NP-hardness of problems via reductions. Understand
    linear programming duality and applications to problems such as max- flow/min-cut. Be able to write duals for linear programs.'
  crosslists:
  - TTIC 31010
  prereq_text: Assumes familiarity with proofs and formal reasoning, knowledge of basic graph notions (such as graphs, trees,
    paths etc) and algorithms (such as BFS, DFS, Minimum Spanning Tree etc). Also assumes familiarity with asymptotic notation
    and running time analysis of algorithms, as well as basic knowledge of the notion of NP-hardness.
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 37000. Algorithms. 100 Units.
  needs_review: true
- code: CMSC 37115
  title: Discrete Mathematics
  units: 100
  notes: No course block found in the College or graduate catalogs; title taken from the Bx/MS requirement label.
  source:
