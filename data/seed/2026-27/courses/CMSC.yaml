- code: CMSC 39010
  title: Geometric Methods in Computer Science
  units: 100
  description: 'The course covers fundamental concepts, algorithms and techniques in computational and metric geometry. Topics
    covered include: convex hulls, polygon triangulations, range searching, segment intersection, Voronoi diagrams, Delaunay
    triangulations, metric and normed spaces, low-distortion metric embeddings and their applications in approximation algorithms,
    padded decomposition of metric spaces, Johnson-Lindenstrauss transform and dimension reduction, approximate nearest neighbor
    search and locality-sensitive hashing. Expected outcomes: -- Know standard algorithms and data structures for solving
    geometric problems -- Be able to design efficient algorithms and data structures for solving geometric problems -- Understand
    basic concepts of metric geometry such as metric and normed space, low distortion embedding, dimension reduction, nearest
    neighbor search. -- Understand applications of metric geometry to the field of approximation algorithms and other areas
    of computer science.'
  crosslists:
  - TTIC 31100
  prereq_text: Undergraduate-level algorithms, linear algebra and probability classes; a good background in mathematical analysis/calculus.
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 39010. Geometric Methods in Computer Science. 100 Units.
  needs_review: true
- code: CMSC 39020
  title: Geometry, Complexity and Algorithms
  units: 100
  description: This course will try to explore these three topics and their interactions. Among the topics likely to be discussed
    are metric measure geometry (e.g. concentration of measure) and its use designing algorithms, machine learning, manifold
    learning, the complexity of the construction of isotopies and nullcobordisms, the Blum-Cucker-Smale theory of real computation
    and estimates for the complexity of root finding and related problems, persistence homology and applications, and other
    topics that seem like a good idea as the course develops.
  crosslists:
  - MATH 38900
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 39020. Geometry, Complexity and Algorithms. 100 Units.
- code: CMSC 39100
  title: The Physics of Computation
  units: 100
  description: The class will focus on the theory of quantum information, covering specific topics at the intersection of
    theoretical computer science and physics and bringing students to the research frontier in these areas. Of particular
    interest are the theoretical foundations needed to characterize the computational power of quantum experiments in the
    "Near-term Intermediate Scale Quantum" era, Hamiltonian complexity and the theory of QMA completeness, and the power of
    resource limited models of quantum computation. While no formal prerequisites are required, a working familiarity with
    the basics of computational complexity theory and quantum mechanics is recommended.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 39100. The Physics of Computation. 100 Units.
- code: CMSC 39520
  title: Sustainability and Computing
  units: 100
  description: Once a darling of the economy, the computing industry has come under fire as "techlash" brings a spotlight
    to its negative environmental and societal impacts. We focus on understanding computing's environmental impact, and the
    productive and substantial (not greenwashing) actions that can be taken to reduce it. The objective of this course is
    to expose students to a sophisticated view of how computing affects the environment, and how it can become more sustainable
    through action in several dimensions, including technology invention and design, business/ecosystem structure, individual
    and government action. Students will be empowered with the intellectual tools to understand and act with insight on these
    issues in their professional careers.
  crosslists:
  - CEGU 29520
  - CMSC 29520
  - BPRO 29520
  - CCSG 22301
  prereq_text: Students must be in their third or fourth year of study.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 39520. Sustainability and Computing. 100 Units.
  needs_review: true
