- code: CMSC 25610
  title: Undergraduate Computational Linguistics
  units: 100
  description: 'This course is an introduction to topics at the intersection of computation and language. We will study computational
    linguistics from both scientific and engineering angles: the use of computational modeling to address scientific questions
    in linguistics and cognitive science, as well as the design of computational systems to solve engineering problems in
    natural language processing (NLP). The course will combine analysis and discussion of these approaches with training in
    the programming and mathematical foundations necessary to put these methods into practice. The course is designed to accommodate
    students both with and without prior programming experience. Our goal is for all students to leave the course able to
    engage with and evaluate research in cognitive/linguistic modeling and NLP, and to be able to implement intermediate-level
    computational models.'
  crosslists:
  - LING 28610
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 25610. Undergraduate Computational Linguistics. 100 Units.
- code: CMSC 25700
  title: Natural Language Processing
  units: 100
  description: This course will introduce fundamental concepts in natural language processing (NLP). It will cover the basics
    of enabling computers to understand and generate language, including word embeddings, language modeling, transformers,
    and an overview of large language models. It will also cover topics on connections with other disciplines such as linguistics
    and other social sciences.
