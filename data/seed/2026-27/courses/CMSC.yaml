- code: CMSC 38300
  title: Numerical Solutions to Partial Differential Equations
  units: 100
  description: This course covers the basic mathematical theory behind numerical solution of partial differential equations.
    We investigate the convergence properties of finite element, finite difference and other discretization methods for solving
    partial differential equations, introducing Sobolev spaces and polynomial approximation theory. We emphasize error estimators,
    adaptivity, and optimal-order solvers for linear systems arising from PDEs. Special topics include PDEs of fluid mechanics,
    max-norm error estimates, and Banach-space operator-interpolation techniques.
  crosslists:
  - MATH 38300
  prereq_text: Consent of department counselor and instructor
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 38300. Numerical Solutions to Partial Differential Equations. 100 Units.
  needs_review: true
- code: CMSC 38405
  title: Arithmetic Combinatorics
  units: 100
  description: This course covers a variety of topics in arithmetic combinatorics such as inverse problems, incidence geometry,
    uniformity, regularity and pseudo-randomness. For an *approximate* syllabus see http://people.cs.uchicago.edu/~razborov/teaching/spring24.html.,This
    course covers a variety of topics in arithmetic combinatorics such as inverse problems, incidence geometry, uniformity,
    regularity and pseudo-randomness. A special attention will be paid to connections to classical mathematics and theoretical
    computer science.
  crosslists:
  - MATH 38405
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 38405. Arithmetic Combinatorics. 100 Units.
- code: CMSC 38410
  title: Quantum Computing
  units: 100
  description: 'This course covers mathematical and complexity aspects of quantum computing, putting aside all questions pertaining
    to its physical realizability. Possible topics include: (1) quantum model of computation, quantum complexity classes,
    and relations to their classical counterparts; (2) famous quantum algorithms (including Shor and Grover); (3) black-box
    quantum models (lower and upper bounds); (4) quantum communication complexity (lower and upper bounds); and (5) quantum
    information theory.'
  notes: Not offered in 2016-17.
  crosslists:
  - MATH 38410
  prereq_text: Consent of department counselor. Basic knowledge of computational complexity and linear algebra required; knowledge
    of quantum mechanics not required
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 38410. Quantum Computing. 100 Units.
  needs_review: true
- code: CMSC 38420
  title: Mathematics of Quantum Computing
  units: 100
  description: 'This course is a gentle introduction to mathematical foundations of quantum computing taught in completely
    rigorous format: we will completely disregard physical aspects and specific questions pertaining to particular implementations.
    An (approximate) list of topics: reversible, probabilistic and quantum computation. Quantum complexity classes and relations
    to their classical counterparts. Fundamental quantum algorithms, notably Grover''s search and Shor''s factoring algorithm.
    Quantum (query) complexity theory and quantum communication complexity. Quantum probability, super-operators and non-unitary
    quantum computation. Basics of quantum information theory and quantum error-correction.'
  crosslists:
  - MATH 38420
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 38420. Mathematics of Quantum Computing. 100 Units.
- code: CMSC 38500
  title: Computability and Complexity Theory
  units: 100
  description: 'Part one of this course consists of models for defining computable functions: primitive recursive functions,
    (general) recursive functions, and Turing machines; the Church-Turing Thesis; unsolvable problems; diagonalization; and
    properties of computably enumerable sets. Part two of this course deals with Kolmogorov (resource bounded) complexity:
    the quantity of information in individual objects. Part three of this course covers functions computable with time and
    space bounds of the Turing machine: polynomial time computability, the classes P and NP, NP-complete problems, polynomial
    time hierarchy, and P-space complete problems.'
  notes: Not offered in 2016-17.
  crosslists:
  - TTIC 31060
  - MATH 30500
  prereq_text: Consent of department counselor and instructor
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 38500. Computability and Complexity Theory. 100 Units.
  needs_review: true
