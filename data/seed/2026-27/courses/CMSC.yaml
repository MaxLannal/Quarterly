- code: CMSC 13000
  title: 'AI for All: Societal Perspectives, Concepts and Applications'
  units: 100
  description: This course provides a gentle, broad introduction to machine learning and generative AI for students of all
    backgrounds. There are several goals for the course. First, students with develop high-level, technical understanding
    of ML and AI through a broad range of models and architectures (from early 2010s deep neural networks and classifiers,
    to generative adversarial networks, to recent generative AI models, both large language models for text and diffusion
    models for images). Second, students will gain a comprehensive and critical look at generative AI, its strengths and weaknesses,
    applications and misuses in today's societal context. Third, students will take a deep dive into the role of AI in multiple
    domains, via detailed presentations and debate with stakeholders and practitioners. Domains include health sciences, education,
    law, policy, biopharma, arts and music, philosophy and ethics, news and information. Lastly, students will learn to understand
    the strengths and limitations of GenAI models with hands-on experimentation.
  prereq:
    any:
    - MATH 15200
    - MATH 16200
  prereq_text: Calculus II (Math 15200/16200 or equivalent)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: 'CMSC 13000. AI for All: Societal Perspectives, Concepts and Applications. 100 Units.'
  needs_review: true
- code: CMSC 14100
  title: Introduction to Computer Science I
  units: 100
  description: This course is the first of a pair of courses that are designed to introduce students to computer science and
    will help them build computational skills, such as abstraction and decomposition, and will cover basic algorithms and
    data structures. Students will also be introduced to the basics of programming in Python including designing and calling
    functions, designing and using classes and objects, writing recursive functions, and building and traversing recursive
    data structures. Students will also gain basic facility with the Linux command-line and version control.
  core_tags:
