  needs_review: true
- code: CMSC 34901
  title: Special Topics in Operations Mgt./Mgt. Science
  units: 100
  description: Course Search
  crosslists:
  - BUSN 40901
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 34901. Special Topics in Operations Mgt./Mgt. Science. 100 Units.
- code: CMSC 35050
  title: Graduate Computational Linguistics
  units: 100
  description: 'This course is a graduate-level introduction to topics at the intersection of computation and language. We
    will study computational linguistics from both scientific and engineering angles: the use of computational modeling to
    address scientific questions in linguistics and cognitive science, as well as the design of computational systems to solve
    engineering problems in natural language processing (NLP). The course will combine analysis and discussion of these approaches
    with training in the programming and mathematical foundations necessary to put these methods into practice. The course
    is designed to accommodate students both with and without prior programming experience. Our goal is for all students to
    leave the course able to engage with and critically evaluate research in cognitive/linguistic modeling and NLP, and to
    be able to implement intermediate-level computational models for novel computational linguistics research.'
  crosslists:
  - LING 38600
  prereq_text: CMSC 12200, 15200 or 16200, or by consent
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35050. Graduate Computational Linguistics. 100 Units.
  needs_review: true
- code: CMSC 35100
  title: Natural Language Processing
  units: 100
  description: This course will introduce fundamental concepts in natural language processing (NLP). It will cover the basics
    of enabling computers to understand and generate language, including word embeddings, language modeling, transformers,
    and an overview of large language models. It will also cover topics on connections with other disciplines such as linguistics
    and other social sciences.
  crosslists:
  - CMSC 25700
  prereq:
    any:
    - CMSC 25300
    - CMSC 25400
    - CMSC 25025
  prereq_text: CMSC 25300, CMSC 25400, or CMSC 25025
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35100. Natural Language Processing. 100 Units.
- code: CMSC 35110
  title: Speech Technologies
  units: 100
  description: 'This course will introduce techniques used in speech technologies, mainly focusing on speech recognition and
    related tasks. Speech recognition is one of the oldest and most complex structured sequence prediction tasks receiving
    significant research and commercial attention, and therefore provides a good case study for many of the techniques that
    are used in other areas of artificial intelligence involving sequence modeling. The course will cover core techniques
    in detail, including hidden Markov models and neural network-based models. The course will include practical homework
    exercises where we will build and experiment with speech processing models. Finally, it will include a sampling of the
    connections between speech and other modalities like images and text. Expected outcomes: Understand and apply tools for
    analyzing speech time series such as Fourier analysis and dynamic time warping. Understand and apply hidden Markov models,
    Gaussian mixtures, and the EM algorithm for speech problems. Understand and apply language models for speech problems.
    Understand and apply modern deep learning tools for speech processing tasks.'
  crosslists:
  - TTIC 31110
  prereq_text: 'Prerequisites: a good background in basic probability and introductory machine learning.'
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35110. Speech Technologies. 100 Units.
  needs_review: true
- code: CMSC 35200
  title: Deep Learning Systems
  units: 100
  description: 'Deep learning is emerging as a major technique for solving problems in a variety of fields, including computer
    vision, personalized medicine, autonomous vehicles, and natural language processing. Critical to success in these target
    domains is the development of learning systems: deep learning frameworks that support the tasks of learning complex models
    and inferencing with those models, and targeting heterogeneous computing devices. This course is aimed as an introduction
    to this topic. We will cover various aspects of deep learning systems, including: basics of deep learning, programming
    models for expressing machine learning models, automatic differentiation methods used to compute gradients for training,
    memory optimization, scheduling, data and model parallel and distributed learning, hardware acceleration, domain specific
    languages, workflows for large-scale machine learning including hyper parameter optimization and uncertainty quantification,
    and training data and model serving. The goal is to present a comprehensive picture of how current deep learning systems
    work, discuss and explore research opportunities, for extending and building on existing frameworks, and deep dive into
    the accelerators being developed by numerous startups to address the needs of the machine learning community. A typical
    week will contain one lecture on a specific aspect of deep learning systems and one lab session exploring technologies
    such as Keras, Tensorflow, CNTK, Mxnet, and PyTorch.'
  notes: This course will provide useful background for students wishing to take our Spring 2019 class on Neuromorphic Computing.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35200. Deep Learning Systems. 100 Units.
- code: CMSC 35300
  title: Mathematical Foundations of Machine Learning
  units: 100
  description: This course is an introduction to the mathematical foundations of machine learning that focuses on matrix methods
    and features real-world applications ranging from classification and clustering to denoising and data analysis. Mathematical
    topics covered include linear equations, regression, regularization, the singular value decomposition, and iterative algorithms.
    Machine learning topics include classification and regression, support vector machines, kernel methods, clustering, matrix
    completion, neural networks, and deep learning. Students are expected to have taken calculus and have exposure to numerical
    computing (e.g. Matlab, Python, Julia, R).
  notes: Undergraduate students are not allowed to enroll in CMSC 35300.
  crosslists:
  - STAT 27700
  - CMSC 25300
  prereq:
    any:
    - CMSC 11900
    - CMSC 12200
    - CMSC 14100
    - CMSC 15200
    - CMSC 16200
  prereq_text: CMSC 11900 or CMSC 12200 or CMSC 14100 or CMSC 15200 or CMSC 16200
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35300. Mathematical Foundations of Machine Learning. 100 Units.
- code: CMSC 35380
  title: Programming the Continuum
  units: 100
  description: In the early days of high-speed networking, George Gilder observed that "when the network is as fast as the
    computer's internal links, the machine disintegrates across the net into a set of special purpose appliances." 2+ decades
    later, our networks are 1,000 times faster, our appliances are increasingly specialized, and our computer systems are
    indeed disintegrating. As hardware acceleration overcomes speed-of-light delays, time and space merge into a computing
    continuum. Familiar questions like "where should I compute," "for what workloads should I design computers," and "where
    should I place my computers" seem to allow for exciting new answers. Are there concepts that can help guide us as we design
    applications and computer systems in a world that is untethered from familiar landmarks like center, cloud, edge? In this
    class we will discuss papers on these and related topics; hear from visionary leaders in the field; and conduct projects
    that allow for practical exploration of concepts and techniques. The class is graduate level but is also open to qualified
    upper-level undergraduates.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35380. Programming the Continuum. 100 Units.
- code: CMSC 35400
  title: Machine Learning
  units: 100
  description: 'This course provides hands-on experience with a range of contemporary machine learning algorithms, as well
    as an introduction to the theoretical aspects of the subject. Topics covered include: the PAC framework, elements of computational
    learning theory, the VC dimension, boosting, Bayesian learning, graphical models, clustering, dimensionality reduction,
    linear classifiers, kernel methods including SVMs, and an introduction to statistical learning theory. The second half
    of the course will introduce neural networks, deep learning, transformers and other elements of modern AI.'
  crosslists:
  - STAT 37710
  - CAAM 37710
  prereq:
    any:
    - any:
      - CMSC 35300
      - STAT 27700
      - STAT 31430
      - STAT 30900
      - STAT 24300
      - STAT 24500
      - STAT 24510
    - consent: instructor
  prereq_text: 'Must be a PhD or MS student in Statistics, Computer Science, or Computational and Applied Mathematics, and
    has taken any one of: CMSC 35300/STAT 27700, STAT 31430, STAT 30900, STAT 24300, STAT 24500, or STAT 24510. Or consent
    of the instructor.'
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35400. Machine Learning. 100 Units.
  needs_review: true
- code: CMSC 35401
  title: 'Topics in Machine Learning: Applied Machine Learning'
  units: 100
  description: Graduate study in current topics in machine learning.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 35401. Topics in Machine Learning: Applied Machine Learning. 100 Units.'
- code: CMSC 35422
  title: Machine Learning for Computer Systems
  units: 100
  description: This course will cover topics at the intersection of machine learning and systems, with a focus on applications
    of machine learning to computer systems. Topics covered will include applications of machine learning models to security,
    performance analysis, and prediction problems in systems; data preparation, feature selection, and feature extraction;
    design, development, and evaluation of machine learning models and pipelines; fairness, interpretability, and explainability
    of machine learning models; and testing and debugging of machine learning models. The topic of machine learning for computer
    systems is broad. Given the expertise of the instructor, many of the examples this term will focus on applications to
    computer networking. Yet, many of these principles apply broadly, across computer systems. You can and should think of
    this course as a practical hands-on introduction to machine learning models and concepts that will allow you to apply
    these models in practice. We'll focus on examples from networking, but you will walk away from the course with a good
    understanding of how to apply machine learning models to real-world datasets, how to use machine learning to help computer
    systems operate better, and the practical challenges with deploying machine learning models in practice."
  crosslists:
  - DATA 25422
  - DATA 35422
  - CMSC 25422
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
  prereq_text: CMSC 14300 or CMSC 15400
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35422. Machine Learning for Computer Systems. 100 Units.
- code: CMSC 35428
  title: Large-Scale Machine Learning in Practice
  units: 100
  description: Large-scale machine learning systems power numerous applications including search, recommendation, scientific
    discovery, and language models. This course provides a practical and foundational view of how such systems are trained,
    adapted, and deployed in real-world settings. The course begins with the core principles of scalable learning, including
    stochastic gradient descent, adaptive optimization, distributed training, and efficiency considerations such as communication
    and memory bottlenecks. It then examines broader machine learning pipelines in practice, including data infrastructure,
    model compression, robustness, distribution shift, privacy, and collaborative learning. The second half of the course
    focuses on modern large language model systems with invited topics from industry researchers. Topics include data selection
    and labeling, large-scale pre-training algorithms, post-training, efficient inference, and multi-agent systems. Throughout
    the course, students will connect mathematical foundations with practical design choices made in industry-scale ML systems.
  crosslists:
  - DATA 35428
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35428. Large-Scale Machine Learning in Practice. 100 Units.
- code: CMSC 35430
  title: Machine Learning on Graphs, Groups and Manifolds
  units: 100
  description: In many domains, including applications of machine learning to scientific problems, social phenomena and computer
    vision/graphics, the data that learning algorithms operate on naturally lives on structured objects such as graphs or
    low dimensional manifolds. There are many connections between these cases; further, since groups capture symmetries, there
    are also natural connections to the theory of learning on groups and group equiviariant algorithms. This course provides
    a mathematical introduction to these topics both in the context of kernel based learning and neural networks. Specific
    topics covered include graph kernels, manifold learning, graph wavelets, graph neural networks, permutation equivariant
    learning, rotational equivariant networks for scientific applications and imaging, gauge equivariant networks and steerable
    nets.
  crosslists:
  - CAAM 37788
  - STAT 37788
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35430. Machine Learning on Graphs, Groups and Manifolds. 100 Units.
- code: CMSC 35440
  title: Machine Learning in Biology and Medicine
  units: 100
  description: In this course, we investigate the use of machine learning, deep learning, foundation models, and generative
    AI to study selected problems in cancer, digital pathology, infectious diseases, and cardiovascular diseases. One of the
    themes of the course is building systems that integrate foundation and generative AI models with other systems for managing
    and analyzing biomedical data, such as databases, data commons, predictive models, and simulation systems. No specific
    knowledge of biology or medicine is required, but familiarity with Python and analyzing data is necessary. Some prior
    experience with machine learning is recommended. Students will work through key papers, representative datasets, and a
    variety of machine learning, deep learning, and foundation model techniques. Students will have an opportunity to do significant
    project work as part of the course.
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35440. Machine Learning in Biology and Medicine. 100 Units.
- code: CMSC 35470
  title: 'Mathematical Computation IIA: Convex Optimization'
  units: 100
  description: The course will cover techniques in unconstrained and constrained convex optimization and a practical introduction
    to convex duality. The course will focus on (1) formulating and understanding convex optimization problems and studying
    their properties; (2) understanding and using the dual; and (3) presenting and understanding optimization approaches,
    including interior point methods and first order methods for non-smooth problems. Examples will be mostly from data fitting,
    statistics and machine learning.
  notes: In addition to the required prerequisites, background in analysis in R^n (at the level of MATH 20400) is recommended.
  crosslists:
  - BUSN 36903
  - CAAM 31015
  - STAT 31015
  - TTIC 31070
  prereq:
    any:
    - STAT 30900
    - STAT 31430
    - consent: instructor
  prereq_text: STAT 30900 or STAT 31430 or consent of instructor.
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: 'CMSC 35470. Mathematical Computation IIA: Convex Optimization. 100 Units.'
- code: CMSC 35490
  title: Special Topics in Machine Learning
  units: 100
  description: 'Learned emulators leverage neural networks to increase the speed of physics simulations in climate models,
    astrophysics, high-energy physics, and more. Recent empirical results have illustrated that these emulators can speed
    up traditional simulations by up to eight orders of magnitude. However, little is understood about these emulators. While
    it is possible that recent results are representative of what is possible in most settings, a more likely scenario is
    that these approaches are more effective for some simulators than others, and that learned emulators achieve strong average-case
    performance but fail to capture rare but important phenomena. In this graduate seminar course we will provide an overview
    and investigate recent literature on this topic, focusing on the following questions: 1. Introduction to learned emulators:
    how do they work, where have they been successful so far and what are the goals in this field? 2. Two different paradigms
    of learned emulation: physics vs. data driven. What are the advantages and pitfalls of each? 3. Robustness of emulation
    to noise: what is known so far? 4. Parameter estimation: how to handle parameter uncertainty? We will provide a list of
    papers covering the above topics and students will be evaluated on in-class presentations.'
  notes: Because this is a seminar course, it will be capped at 15 students, 4 Math, 4 CS/Stats, and 7 with instructor permission.
  crosslists:
  - CAAM 37794
  - STAT 37794
  - MATH 37794
  prereq_text: Students should be familiar with a numerical programming language like Python, Julia, R, or Matlab and the
    content of CMSC 35400. Students should also have familiarity with the contents of MATH 27300 and MATH 27500 or similar.
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofcomputerscience/
    quote: CMSC 35490. Special Topics in Machine Learning. 100 Units.
  needs_review: true
