- code: CMSC 25040
  title: Introduction to Computer Vision
  units: 100
  description: This course covers the fundamentals of digital image formation; image processing, detection and analysis of
    visual features; representation shape and recovery of 3D information from images and video; analysis of motion. We also
    study some prominent applications of modern computer vision such as face recognition and object and scene classification.
    Our emphasis is on basic principles, mathematical models, and efficient algorithms established in modern computer vision.
