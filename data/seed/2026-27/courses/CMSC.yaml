    quote: CMSC 14200. Introduction to Computer Science II. 100 Units.
- code: CMSC 14300
  title: Systems Programming I
  units: 100
  description: This course is the first in a pair of courses designed to teach students about systems programming. In this
    course, students will develop a deeper understanding of what a computer does when executing a program. In order to make
    the operations of the computer more transparent, students will study the C programming language, with special attention
    devoted to bit-level programming, pointers, allocation, file input and output, and memory layout. In the context of the
    C language, the course will revisit fundamental data structures by way of programming exercises, including strings, arrays,
    lists, trees, and dictionaries. Furthermore, the course will examine how memory is organized and structured in a modern
    machine. Students will gain basic fluency with debugging tools such as gdb and valgrind and build systems such as make.
  prereq:
    any:
    - CMSC 14200
    - placement: CMSC 14300
  prereq_text: CMSC 14200, or placement into CMSC 14300, is a prerequisite for taking this course.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
    quote: CMSC 14300. Systems Programming I. 100 Units.
