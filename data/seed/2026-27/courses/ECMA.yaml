    quote: ECMA 31130. Topics in Microeconometrics. 100 Units.
- code: ECMA 31140
  title: Perspectives on Computational Modeling for Economics
  units: 100
  description: In this course students will learn several computational methodologies and tools to solve, simulate, and analyze
    models that are the backbone of current macroeconomic analysis. While learning the relevant computational methods is the
    main objective, the theoretical economic aspects of the model will be stressed and the students will be required to apply
    their economic knowledge and skills to interpret and analyze the results. We will examine non-stochastic and stochastic
    general equilibrium models, both under local and global approximations. The main part of the course will deal with representative
    agent models, but a significant part will be devoted to introducing students to the solution of heterogeneous agent models
    as well.
  notes: MACSS students have priority.
