- code: ECMA 30750
  title: The Theory of Market Design
  units: 100
  description: This course will provide an introduction to social choice, two-sided matching, house allocation, school choice,
    and the recent theoretical developments in kidney exchange. We will develop formal, mathematical language to evaluate
    and compare different mechanisms including deferred acceptance, top trading cycles, the probabilistic serial mechanism
    and others. Our approach will be axiomatic; we will explore the tradeoff between the efficiency, incentive compatibility
    and fairness in the design of mechanisms. This course will be proof-based, so is appropriate for advanced students acquainted
    with formal mathematical reasoning.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - MATH 20300
      - MATH 20310
      - MATH 20700
  prereq_text: ECON 20100/20110 and MATH 20300/20310/20700
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 30750. The Theory of Market Design. 100 Units.
- code: ECMA 30770
  title: Decision and Strategy
  units: 100
  description: This course provides a formal introduction to game theory with applications in economics. We will study models
    of how individuals make decisions, and how those decisions are shaped by strategic concerns and uncertainty about the
    world. The topics will include the theory of individual choice, games of complete and incomplete information, and equilibrium
    concepts such as Nash equilibrium. The applications will include oligopoly, auctions, and bargaining. The course is appropriate
    for advanced undergraduates who are interested in a rigorous mathematical approach to understanding human behavior.
  crosslists:
  - ECON 20770
  prereq_text: 'Prerequsites for Undergraduates: ECON 20100/ECON 20110 and MATH 20300/MATH 20310/MATH 20700, or consent of
    instructor'
  terms_offered:
