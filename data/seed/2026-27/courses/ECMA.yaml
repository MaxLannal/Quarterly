- code: ECMA 31130
  title: Topics in Microeconometrics
  units: 100
  description: This course focuses on micro-econometric methods that have applications to a wide range of economic questions.
    We study identification, estimation, and inference in both parametric and non-parametric models and consider aspects such
    as consistency, bias and variance of estimators. We discuss how repeated measurements can help with problems related to
    unobserved heterogeneity and measurement error, and how they can be applied to panel and network data. Topics include
    duration models, regressions with a large number of covariates, non-parametric regressions, and dynamic discrete choice
    models. Applications include labor questions such as labor supply, wage inequality decompositions and matching between
    workers and firms. Students will be expected to solve programming assignment in R.
  prereq:
