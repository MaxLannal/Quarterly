- code: ECMA 33220
  title: Introduction to Advanced Macroeconomic Analysis
  units: 100
  description: This course introduces students to advanced methods for macroeconomic analysis. In the first part, we discuss
    time series methods such as impulse response analysis, vector autoregression, co-integration, shock identification, and
    business cycle detrending. In the second part, we examine and analyze a simple, yet powerful stochastic dynamic real business
    cycle model. In that context, the students will learn about dynamic programming, rational expectations, intertemporal
    optimization, asset pricing, the Frisch elasticity of labor supply, log-linearization, and computational tools to solve
    for the recursive law of motion of dynamic stochastic general equilibrium models. Finally, we touch upon some further
    models, such as the overlapping generations model and/or the continuous-time neoclassical growth model. The course is
    useful for students interested to deepen their knowledge in macroeconomics, in order to read, understand, and replicate
    some of the recent research in the field; as preparation for careers involving macroeconomic analysis, time series analysis,
    or asset pricing; or as preparation for graduate school. Decent knowledge of linear algebra and calculus is required.
    All advanced material will be taught in class.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200 (or ECON 20210) and ECON 21020 (or ECON 21030)
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33220. Introduction to Advanced Macroeconomic Analysis. 100 Units.
- code: ECMA 33221
  title: Introduction to Advanced Macroeconomic Analysis II
  units: 100
  description: This course introduces concepts and tools for advanced macroeconomics. It builds on ECMA 33220. We discuss
    the decision of consumption and investment over time, monetary economics, fiscal policy, asset pricing, and international
    economics. We introduce numerical methods to solve problems in economics and finance such as methods to solve nonlinear
    equations and to generate random numbers. These methods are useful when we solve economic models through value-function
    iterations, quadratic linearization, and other methods. Some topics discussed are the welfare cost of inflation, portfolio
    allocation, the yield curve and economic activity, optimal taxation, and financial markets and monetary policy. As ECMA
    33220, this course is useful for students interested in increasing their knowledge in macroeconomics for careers involving
    macroeconomic analysis and as preparation for graduate school. Knowledge of calculus and linear algebra is expected.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: 'For Undergraduates: ECON 20200/20210 and ECON 21020/21030'
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33221. Introduction to Advanced Macroeconomic Analysis II. 100 Units.
- code: ECMA 33230
  title: Macroeconomic Crises
  units: 100
  description: This course introduces students to economic theories of "crises" or particular periods of rapid (negative)
    changes in real and financial variables that are distinct from long-run growth and regular business cycles. In particular,
    we will cover the origin of various types of financial crises, i.e. speculative bubbles, bank runs, credit crunches, and
    sovereign debt crises and defaults. Time permitting, we will also study currency crises and speculative attacks. Throughout,
    our focus will be on the implications for fiscal and monetary policy.
  prereq:
    all:
    - ECON 23950
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 23950 and ECON 21020 (or ECON 21030)
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33230. Macroeconomic Crises. 100 Units.
- code: ECMA 33330
  title: Introduction to Dynamic Economic Modeling
  units: 100
  description: This course provides an introduction to dynamic economic models, with applications to macroeconomics, labor
    economics, financial economics, and other subfields of economics. The core methodology will be consistent over time, but
    the applications will vary from year to year. The course will analyze decentralized equilibrium and social planner's problems
    in dynamic environments. It will focus on developing techniques for analyzing such models graphically, analytically, and
    computationally. Students should be familiar with constrained optimization (e.g. Lagrangians), linear algebra, and difference
    equations, as well as microeconomics, macroeconomics, and econometrics at an intermediate level.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200 (or ECON 20210) and ECON 21020 (or ECON 21030)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33330. Introduction to Dynamic Economic Modeling. 100 Units.
- code: ECMA 33603
  title: Introduction to Macroeconomics and Financial Frictions
  units: 100
  description: This course studies the behavior of consumers, investors, and firms when they face frictions to take their
    decisions. These frictions can be in the form of costs to change portfolios, to change prices, or to find another investor
    to trade. Frictions also appear in the form of borrowing costs, the possibility of default, or the need to use money to
    carry on transactions. We show how taking into account these frictions change predictions about the economy. Borrowing
    constraints, for example, affect interest rates, and the need to rebalance portfolios changes predictions on optimal taxation.
    We discuss models, techniques and papers that show the relevance of frictions for economic analysis.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: 'PQ for Undergraduates: ECON 20200/20210 and ECON 21020/21030'
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33603. Introduction to Macroeconomics and Financial Frictions. 100 Units.
- code: ECMA 33620
  title: Introduction to Heterogeneous Agent Macroeconomics
  units: 100
  description: This class is an introduction to macroeconomics with heterogeneous households. We will study consumption-savings
    problems, income dynamics, wealth inequality in partial and general equilibrium, and the effects of fiscal and monetary
    policy in the presence of household inequality. The class will make use of theoretical analysis, empirical analysis and
    computational methods. Material will be presented in both discrete and continuous time. Students will analyze micro-level
    data on wealth, income and consumption, and will learn how to write code to solve heterogeneous agent models on a computer.
    Familiarity with a statisical package such as R or Stata, and a programming language such as Matlab, Python, Julia, Fortran
    or C is highly recommended.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: 'Undergraduates: PQ: ECON 20200/20210 and ECON 21020/21030'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 33620. Introduction to Heterogeneous Agent Macroeconomics. 100 Units.
- code: ECMA 34150
  title: Origins, Persistence, and Consequences of Inequality
  units: 100
  description: 'The continued rise of economic inequality in the U.S. has spurred heated debate among economists and policymakers
    over the past several years. This course aims to provide students with a comprehensive understanding of social science
    perspectives on inequality, including its causes, persistence, and effects. It also introduces students to different frameworks
    for discussing inequality and how societal forces contribute to increasing inequality. Additionally, the course helps
    students connect broader societal trends with specific government policies. By covering key vocabulary, concepts, theories,
    and debates related to economic inequality, the course lays a solid foundation for further studies in economics. Upon
    completion of the course, students should possess a deeper understanding of the facts about inequality and social mobility,
    as well as a grasp of the complexity of the problem and challenges inherent in addressing these issues through governmental
    policies. Specifically, students are anticipated to be able to: - Articulate economic terminology and methods for measuring
    inequality, - Perform calculations to assess and illustrate income/wealth inequality, and economic mobility, - Analyze
    the root causes, mechanisms, and consequences of economic inequality, - Demonstrate a nuanced comprehension of the policy
    and political ramifications associated with inequality.'
  prereq:
    any:
    - ECON 21020
    - ECON 21030
  prereq_text: 'PQ for Undergraduates: ECON 21020/21030'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 34150. Origins, Persistence, and Consequences of Inequality. 100 Units.
- code: ECMA 35050
  title: Information and Financial Markets
  units: 100
  description: 'This course studies the information economics that underlies modern financial markets and trading. Whether
    one is into designing new financial marketplaces (for example: fintech, crypto) or creating new trading strategies (for
    example: high-frequency, active management) or managing complex investment portfolios (for example: hedge funds, pension
    funds), tools from the economics of information asymmetry play an essential role. We take a deep dive into the technical
    tools that are commonly used and explore applications that help us place the techniques in context. Topics covered include:
    Lotteries, Measures of risk aversion, Orders of stochastic dominance, vNM and Savage utilities, Information structures,
    Blackwell ordering, Bayesian inference, Common knowledge and belief hierarchies, Agreement and No-trade theorems, Grossman-Stiglitz
    type paradoxes, Role of noise in markets, Kyle and Golsten-Milgrom models of trading and PIN models, along with Dealer,
    limit-order, automated-market-making and batch-auction market structures.'
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - STAT 23400
      - STAT 24400
      - STAT 24410
  prereq_text: 'PQ for Undergraduates: ECON 20200/20210 and STAT 23400/24400/24410'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECMA 35050. Information and Financial Markets. 100 Units.
- code: ECMA 35550
  title: The Practicalities of Running Randomized Control Trials
  units: 100
  description: This course is designed for those who plan to run a randomized control trial. It provides practical advice
    about the trade-offs researchers face when selecting topics to study, the type of randomization technique to use, the
    content of a survey instruments, analytical techniques and much more. How do you choose the right minimum detectable effect
    size for estimating the sample size needed to run a high quality RCT? How do you quantify difficult to measure outcomes
    such as women's empowerment or ensure people are providing truthful answers when you are asking questions on sensitive
    topics like sexual health? When should you tie your hands by pre-committing to your analysis plan in advance, and when
    is a pre-analysis plan not a good idea? This course will draw on lots of examples from RCTs around the world, most (though
    not all) from a development context. Alongside field tips, it will also cover the concepts and theory behind the tradeoffs
    researchers face running RCTs. The course is designed for PhD students but given its practical nature is open to and accessible
    to masters students who plan to work on RCTs.
