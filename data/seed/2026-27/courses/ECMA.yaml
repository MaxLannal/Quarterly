- code: ECMA 31340
  title: Big Data Tools in Economics
  units: 100
  description: The goal of the class is to learn how to apply microeconomic concepts to large and complex datasets. We will
    first revisit notions such as identification, inference and latent heterogeneity in classical contexts. We will then study
    potential concerns in the presence of a large number of parameters in order to understand over-fitting. Throughout the
    class, emphasis will be put on project-driven computational exercises involving large datasets. We will learn how to efficiently
    process and visualize such data using state of the art tools in python. Topics will include fitting models using Tensor-Flow
    and neural nets, creating event studies using pandas, solving large-scale SVDs, etc.
