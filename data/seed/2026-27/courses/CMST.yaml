- code: CMST 14565
  title: 'Special Topics: The Films of Alfred Hitchcock'
  units: 100
  description: This course focuses on the films of Alfred Hitchcock, one of the greatest filmmakers of the 20th century. We
    study both his films and a variety of approaches to them. We investigate the enduring power of his movies; his contributions
    to genre and popular cinema; his storytelling techniques; his stylistic command; his approach to romance, suspense, and
    action; his status as a master and auteur; and his remarkable control over the audience's thoughts and feelings.
  notes: Not offered in 2024-25.
  core_tags:
  - arts
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: 'CMST 14565. Special Topics: The Films of Alfred Hitchcock. 100 Units.'
- code: CMST 14570
  title: 'Special Topics: Animation Theory'
  units: 100
  description: Due to the ubiquity and pervasiveness of animation in contemporary media ecologies, recent years have seen
    a surge of interest in animation theory. But animation theory presents a vast and turbulent domain of inquiry, because
    animation may be narrowly defined as a set of objects or techniques or broadly conceptualized to embrace questions about
    life and death, about more-than-human animals, artificial life, and animism, for instance. This topics course has two
    aims. The first aim is to provide an overview of the key problematics of and approaches to animation theory in a global
    and historical perspective. The second aim is to develop tools for doing animation theory in a more localized manner.
    To this end, course will highlight theories of character and characterization with an emphasis on how the inherent tension
    between individual and type in animation affects our understanding race and racism.
  notes: Not offered in 2023-24.
  core_tags:
  - arts
