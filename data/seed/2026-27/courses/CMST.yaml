courses:
- code: CMST 14400
  title: Film and the Moving Image
  units: 100
  description: This course seeks to develop skills in perception, comprehension, and interpretation when dealing with film
    and other moving image media. It encourages the close analysis of audiovisual forms, their materials and formal attributes,
    and explores the range of questions and methods appropriate to the explication of a given film or moving image text. It
    also examines the intellectual structures basic to the systematic study and understanding of moving images. Most importantly,
    the course aims to foster in students the ability to translate this understanding into verbal expression, both oral and
    written. Texts and films are drawn from the history of narrative, experimental, animated, and documentary or non-fiction
    cinema. Screenings are a mandatory course component.
  notes: Attendance in first class is mandatory to confirm enrollment. Open only to non-CMS majors; may not count towards
    CMS major requirements. For non-majors, any CMST 14400 through 14599 course meets the general education requirement in
    the arts.
  core_tags:
  - arts
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14400. Film and the Moving Image. 100 Units.
- code: CMST 14503
  title: Cinema in Theory and Practice
  units: 100
  description: This course looks at film theory through the lens of film practice. Readings, screenings, and exercises focus
    on fundamental cinematic parameters and their complex practical uses. We look at several masterpieces of French cinema
    to compare film theory to film practice, read testimonies from filmmakers, and develop sophisticated skills of film appreciation,
    critique, and analysis.
  core_tags:
  - arts
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14503. Cinema in Theory and Practice. 100 Units.
- code: CMST 14505
  title: Visual Style in Still and Moving Images
  units: 100
  description: The aim of this course is first to introduce students to the world of French-language animation and comics
    (BD or bandes dessinées) by providing a historical overview of both forms. In addition, the course provides an alternative
    genealogy of cinema by exploring how common techniques and elements of style have emerged through ongoing processes of
    adaptation, coproduction, and intercommunication between still and moving images, between comics and animation. Screenings
    will highlight animated films inspired by popular BD as well as films directed by "bédéistes" who have moved into the
    world of animation production. The final unit will consider how French comics and animation in recent years have repurposed
    Japanese manga and anime techniques and styles, rather swiftly and resourcefully. This course will only be offered through
    the Study Abroad program in Paris.
  core_tags:
  - arts
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14505. Visual Style in Still and Moving Images. 100 Units.
- code: CMST 14514
  title: Chicago Film Cultures
  units: 100
  description: This Arts Core course examines the rich and vibrant cultures surrounding cinema in Chicago, from depictions
    of the city on screen, to film production from the silent era to the present day, to moviegoing culture from movie palaces
    to microcinemas. Students will study past and current film cultures in Chicago by examining particular films, events,
    venues, and critics. Topics covered will include the cinematic image of Chicago, film exhibition, audience and fan culture
    studies (with attention to Chicago's particular demographic contours), and contemporary television and digital media production
    in the city.
  core_tags:
  - arts
  crosslists:
  - CHST 14514
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14514. Chicago Film Cultures. 100 Units.
- code: CMST 14534
  title: French and Francophone Cinema
  units: 100
  description: 'This class is a survey of French and Francophone Cinema from the first years of cinema to the contemporary
    moment. In it, we will focus on three distinct moments: the idea of a "poetic" cinema in the 1920s that saw a heightened
    emphasis experiences unique to cinema; the rise of the "nouvelle vague" (New Wave) in the 1960s and the growth of cinephilia
    and art cinema; and the emergence of a "banlieue" or "beur" cinema of the 1990s and 2000s that focused on immigrant communities
    surrounding Paris. Our discussions will engage the formal developments of French and Francophone cinema, the history of
    film culture, and the historical discourse of national cinema that negotiates the politics of immigration, urbanization,
    and globalization.'
  core_tags:
  - arts
  prereq_text: Offered specifically as part of CMS Study Abroad in Paris program.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14534. French and Francophone Cinema. 100 Units.
  needs_review: true
