- code: CMST 14589
  title: Digital Filmmaking
  units: 100
  description: This course is designed to introduce students to digital filmmaking through (1) formal study and artistic analysis
    of film work, (2) technical training in camera, sound, and editing software, and (3) individual and group exercises including
    an original final project. Students will explore fiction, documentary, and experimental approaches to filmmaking while
    learning how cinematic techniques like framing, composition, lighting, sound, and editing shape meaning. Students will
    work both individually and in small groups that reflect the collaborative nature of film production. Overall, through
    a combination of lectures, screenings, trainings, and projects, students will gain a solid foundation in the digital filmmaking
    process and the creative possibilities of moving images and sound.
  core_tags:
  - arts
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14589. Digital Filmmaking. 100 Units.
