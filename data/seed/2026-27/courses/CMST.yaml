- code: CMST 14578
  title: Media Technologies
  units: 100
  description: This class is only offered through the Study Abroad Program in Paris. This course offers tools for understanding
    and theorizing media by attending to technology. Students will learn to think about the materiality of media, asking how
    media technologies-such as television, the mp3 format, or a mobile phone app-influence the contents or meanings they transmit,
    as well as the ways in which discourses and practices shape the nature of media and its technical infrastructures. What
    forms have culture and knowledge taken as the emergence of new media has reconfigured lived experience, social life, and
    power relations? We will consider the ways in which technology extends beyond the realm of machinery-how practices, regulations,
    beliefs and environments become part of the systematic deployment of media from content moderation to the cooling of servers.
    Examples of media discussed in class will include student-curated collections of social media content, videogames and
    television by French creators, and even infrastructural systems, including a failed project to create an automated train
    system in Paris.
  notes: Not offered in 2024-2025. For nonmajors, any CMST 14400 through 14599 course meets the general education requirement
    in the arts. This class is only offered through the Study Abroad Program in Paris.
  core_tags:
  - arts
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/cinemamediastudies/
    quote: CMST 14578. Media Technologies. 100 Units.
