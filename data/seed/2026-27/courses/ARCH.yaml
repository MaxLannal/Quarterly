- code: ARCH 11000
  title: Architecture, Drawing, and Design
  units: 100
  description: Drawing has shaped architecture for centuries. This course introduces students to architecture through the
    practice and critical discussion of drawing. Studio exercises will introduce media ranging from hand-sketching to digital
    modeling; representational conventions such as plans, sections, and diagrams; and the roles of drawings as creative tools
    and conveyors of ideas, visions, and technical information. Students will engage with historical and contemporary precedents,
    with fundamental texts about architecture and drawing, and with the built environment on campus and in Chicago.
  core_tags:
