courses:
- code: HMRT 10100
  title: Human Rights in World Civilizations I
  units: 100
  description: The first quarter begins with a set of conceptual problems and optics designed to introduce students to the
    critical study of human rights, opening up questions of the universal, human dignity, and the political along with the
    practices of witness and testimony. It is followed by two thematic clusters. "Anti-Slavery, Humanitarianism, and Rights"
    focuses on the late eighteenth and early nineteenth centuries to historicize notions of dignity, sympathy, and witness.
    "Declarations as a Human Rights Genre" examines revolutionary eighteenth-century rights declarations in France, the United
    States, and Haiti against the aspirations of the 1948 UN Universal Declaration of Human Rights.
  core_tags:
  - civilization
  crosslists:
  - SOSC 24900
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: HMRT 10100. Human Rights in World Civilizations I. 100 Units.
- code: HMRT 10200
  title: Human Rights in World Civilizations II
  units: 100
  description: Four thematic clusters structure the second quarter. "Migration, Minorities, and Refugees" examines minority
    rights, the evolution of legal norms around refugees, and human trafficking. "Late Twentieth Century Human Rights Talk"
    explores the contestations between rights claims in the political-civil and socio-economic spheres, calls for sexual rights,
    and cultural representations of human rights abuses. "Global Justice" considers forms of international criminal law, transitional
    justice, and distributive justice. "Indigenous Rights as Human Rights" takes up the relatively new domain of the rights
    of indigenous peoples and how they relate to contemporary human rights practice.
  core_tags:
  - civilization
  crosslists:
  - SOSC 24901
  prereq: SOSC 24900
  prereq_text: SOSC 24900
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: HMRT 10200. Human Rights in World Civilizations II. 100 Units.
