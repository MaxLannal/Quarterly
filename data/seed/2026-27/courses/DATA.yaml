- code: DATA 23700
  title: Visualization for Data Science
  units: 100
  description: This course imparts design knowledge and technical skills around data visualization that data scientists need
    for analysis and communication. Design principles for data visualization are based on frameworks for thinking about chart
    construction, empirical research on human perception and cognition, a repertoire of design strategies, and theories about
    what makes an effective chart. Data Science majors will build practical skills around visualization APIs, computational
    notebooks, graphics editing software, and technical writing. Topics of interest include visualization software, spatial
    and visual reasoning, cartography, making data interactive, persuasion and deception, uncertainty communication, and model
    interpretability.
