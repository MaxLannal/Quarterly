- code: DATA 25900
  title: Ethics, Fairness, Responsibility, and Privacy in Data Science
  units: 100
  description: This course takes a technical approach to exploring societal issues of ethics, fairness, responsibility, and
    privacy related to the collection, use, and generalization of data. The course introduces fundamental techniques related
    to data acquisition, data cleaning, sampling, statistical modeling, experimental design, feature engineering, and modeling
    with machine learning. It then explores the problems that arise in different ways of performing those tasks, the fairness
    and bias of machine learning models, data visualizations, and user interfaces. In addition, the course covers anonymization
    and deanonymization, conceptions of privacy from a number of perspectives (statistical, legal, and philosophical), and
    compliance with contractual or legal requirements around data. The course concludes by discussing current controversies
    around the use and misuse of data. Through both programming assignments and discussions, students who complete the course
    will learn how to design systems that are inclusive and respectful of all data subjects.
  prereq: DATA 11900
  prereq_text: DATA 11900
  terms_offered:
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/datascience/
    quote: DATA 25900. Ethics, Fairness, Responsibility, and Privacy in Data Science. 100 Units.
- code: DATA 26100
  title: Statistical Pitfalls and Misinterpretation of Data
  units: 100
  description: This course will provide tools for thinking critically about data and models that constitute evidence, e.g.,
    for the purpose of making predictions, reaching decisions, judging the quality of information, or in the context of scientific
    research. The course will examine examples of misleading language and graphics and discuss good practices in representing
    and communicating data. Examples will include such pitfalls as data size effects, false linearity, biased or correlated
    samples, mistaking correlation for causation, regression to the mean, and Simpson's paradox.
  prereq:
    all:
