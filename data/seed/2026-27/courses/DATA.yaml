- code: DATA 25422
  title: Machine Learning for Computer Systems
  units: 100
  description: This course will cover topics at the intersection of machine learning and systems, with a focus on applications
    of machine learning to computer systems. Topics covered will include applications of machine learning models to security,
    performance analysis, and prediction problems in systems; data preparation, feature selection, and feature extraction;
    design, development, and evaluation of machine learning models and pipelines; fairness, interpretability, and explainability
    of machine learning models; and testing and debugging of machine learning models. The topic of machine learning for computer
    systems is broad. Given the expertise of the instructor, many of the examples this term will focus on applications to
    computer networking. Yet, many of these principles apply broadly, across computer systems. You can and should think of
    this course as a practical hands-on introduction to machine learning models and concepts that will allow you to apply
    these models in practice. We'll focus on examples from networking, but you will walk away from the course with a good
    understanding of how to apply machine learning models to real-world datasets, how to use machine learning to help computer
    systems operate better, and the practical challenges with deploying machine learning models in practice."
  crosslists:
