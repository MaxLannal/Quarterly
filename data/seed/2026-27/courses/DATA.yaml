    quote: DATA 26100. Statistical Pitfalls and Misinterpretation of Data. 100 Units.
- code: DATA 27005
  title: AI Agents for Social Science & Society
  units: 100
  description: 'This course takes the position that AI agents represent a fundamental transformation in both society and social
    science methodology: from cartoons of social life to another dimension of sociality, and from tools that merely process
    data to autonomous systems that can formulate hypotheses, conduct literature reviews, design studies, analyze complex
    multimedia data, engage in theoretical reasoning, simulate human behavior and social dynamics, and reveal their own behaviors
    that are playing an increasingly important role in the human social world. In this course, students will learn to understand
    and construct AI agents that serve as research assistants (automating data collection and analysis), research subjects
    (simulating human responses and social processes or revealing their own authentic behavior), research advisors (synthesizing
    literature and proposing theoretical frameworks), research scientists (generating and testing hypotheses), and workers
    within organizations, institutions, and societies for study, but also productive work and life.'
  crosslists:
  - DATA 37005
  - MACS 37005
  - MACS 27005
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/datascience/
    quote: DATA 27005. AI Agents for Social Science & Society. 100 Units.
- code: DATA 27100
  title: Data Science Clinic I
  units: 100
  description: 'In order to enroll in this class, students must first submit an application and be matched with a project.
    Visit the Data Science Clinic site for application deadlines, how to apply, and information session details: https://github.com/dsi-clinic/the-clinic.
    The Data Science Clinic partners with public interest organizations to leverage data science research and technology to
    address pressing social and environmental challenges. The Clinic also provides students with exposure to real-world projects
    and problems that transcend the conventional classroom experience including: working with imperfect datasets, applying
    models and algorithms to real-world data, navigating security and privacy issues, communicating results to a diverse set
    of stakeholders (e.g., industry, public interest, government agencies), and translating information into actionable insights,
    policy briefs and software prototypes. The Clinic is an experiential project-based course where students work in teams
