    quote: DATA 20027. Quantitative Research Methods in Linguistics. 100 Units.
- code: DATA 20195
  title: Data and the State
  units: 100
  description: 'In order to regulate and govern, states must marshall data: the whos, whats, and wheres of a nation get rendered
    in records and statistics, at least approximately. One of the most fundamental instruments for the "datafication" of the
    population is a census - and the very first Article of the U.S. Constitution calls for one to be conducted every ten years.
    That same sentence is also the source of the notorious "Three-Fifths Compromise" establishing an enumeration rule where
    enslaved people count fractionally as much as free people: political arithmetic. In this course we will use Census data
    as a jumping-off point for an investigation of data practices of governance, looking at a host of frameworks and mechanisms
    to classify, measure, and locate. Students will learn to use a suite of modern packages for geospatial data science in
    Python, including Pandas, GeoPandas, Shapely, and Matplotlib, and readings will include texts from geography, anthropology,
    sociology, and science and technology studies. No prior knowledge assumed.'
  crosslists:
  - DATA 30195
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/datascience/
    quote: DATA 20195. Data and the State. 100 Units.
- code: DATA 20602
  title: Thinking like a Computational Social Scientist
  units: 100
  description: Computational social science has never been more essential for understanding human behavior and the AI systems
    increasingly intertwined with it. Students will learn the foundations of modern AI algorithms, from logistic regression
    to LLM alignment and reasoning, alongside network science and natural language processing. Students will also build analytical
    skills through formal paper presentations, oral exams, and an original research project. This is an intuitive introduction
    without prerequisites.
