- code: DATA 10018
  title: Pathways in Data Science
  units: 100
  description: In a world increasingly driven by information, data science has emerged as an all-encompassing term to describe
    the process of collecting, processing, analyzing, and drawing conclusions from data. The ability to use data science tools
    and understand their foundations is crucial for those who wish to engage with the greatest challenges in modern society.
    This course introduces students to the full data science pipeline-question formulation, data collection, storage, computation,
    visualization, inference, prediction, and communication. In addition to lectures, labs, discussions, and visits by guest
    speakers, students will learn Python and Jupyter Notebooks and complete a capstone project using real-world data.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/datascience/
    quote: DATA 10018. Pathways in Data Science. 100 Units.
- code: DATA 11800
  title: Introduction to Data Science I
  units: 100
  description: Data science provides tools for gaining insight into specific problems using data, through computation, statistics
    and visualization. This course introduces students to all aspects of a data analysis process, from posing questions, designing
    data collection strategies, management+storing and processing of data, exploratory tools and visualization, statistical
    inference, prediction, interpretation and communication of results. Simple techniques for data analysis are used to illustrate
    both effective and fallacious uses of data science tools. Although this course is designed to be at the level of mathematical
    sciences courses in the Core, with little background required, we expect the students to develop computational skills
    that will allow them to analyze data. Computation will be done using Python and Jupyter Notebook.
