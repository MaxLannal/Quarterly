- code: DATA 24100
  title: Software Engineering for Data Science
  units: 100
  description: This course is designed to equip students with the practical skills and theoretical knowledge necessary to
    excel at the intersection of data science and software engineering. Through a hands-on approach, students will delve into
    the core tools and concepts that form the backbone of this interdisciplinary field, including data modeling, building
    data pipelines and software development best-practices. Emphasis will be placed on real-world applications, enabling students
    to work on projects that simulate professional scenarios and challenges. This course is ideal for those looking to deepen
    their understanding of how data-focused technologies are developed and deployed.
