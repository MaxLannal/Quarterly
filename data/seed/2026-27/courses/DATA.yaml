  source:
    url: http://collegecatalog.uchicago.edu/thecollege/datascience/
    quote: DATA 20002. Cognitive Models. 100 Units.
- code: DATA 20027
  title: Quantitative Research Methods in Linguistics
  units: 100
  description: This course provides an introduction to how quantitative methods are used in the analysis of linguistic data.
    This will include a foundation in statistical methods that can be applied to experimental and psycholinguistic data, including
    probability theory, hypothesis testing, regression models and the use of Bayesian statistics. Further topics will include
    a brief introduction to the use of basic machine learning algorithms in linguistic research and techniques that can be
    used in the analysis of large linguistic datasets. The class will be grounded in case studies from a variety of subfields
    of linguistics and provide hands-on examples through a guided introduction to programming. This class is intended for
    students who are interested in jump-starting a path into linguistic data science and is designed to be accessible to those
    with no experience in data science or programming.
  crosslists:
  - LING 22500
  - LING 32500
  - COGS 20027
  terms_offered:
