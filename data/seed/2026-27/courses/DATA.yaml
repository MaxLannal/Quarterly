- code: DATA 13600
  title: Introduction to Data Engineering
  units: 100
  description: Data-driven models are revolutionizing science and industry. Scalable systems are needed to collect, stream,
    process, and validate data at scale. This course is an introduction to "big" data engineering where students will receive
    hands-on experience building and deploying realistic data-intensive systems. It will cover streaming, data cleaning, relational
    data modeling and SQL, and Machine Learning model training. A core theme of the course is "scale," and we will discuss
    the theory and the practice of programming with large external datasets that cannot fit in main memory on a single machine.
    The course will consist of bi-weekly programming assignments, a midterm examination, and a final.
