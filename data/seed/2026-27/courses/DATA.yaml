    or MATH 20800) and linear algebra (MATH 18600 or 19620 or 20250 or 20700 or STAT 24300 or equivalent). Master's students
    in Statistics can enroll without prerequisites. Master's students must be in Statistics, Computational and Applied Mathematics,
    Data Science, Mathematics, or Financial Mathematics, or have consent of instructor.
  terms_offered:
