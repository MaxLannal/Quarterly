- code: SOSC 13200
  title: Social Science Inquiry II
  units: 100
  description: 'Winter Quarter turns to statistical techniques to estimate models with data, as students learn to produce
    and scrutinize quantitative evidence themselves. Working in statistical software languages such as R, they learn to describe
    data and draw inferences: sampling, descriptive and inferential statistics, hypothesis testing, and estimation in the
    potential-outcomes framework. The quarter is organized around the "credibility revolution" in the social sciences, the
    movement toward research built on quality data, rigorous design, and transparent accounting for uncertainty. Throughout,
    students gain practice in producing and interpreting estimates in social scientific contexts.'
