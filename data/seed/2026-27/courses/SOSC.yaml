    quote: SOSC 11500. Power, Identity, Resistance II. 100 Units.
  needs_review: true
- code: SOSC 11600
  title: Power, Identity, Resistance III
  units: 100
  description: 'In the Spring, we bring the legacies of liberal theory, political economy, and their critique to bear on questions
    and problems that emerged from the late 19th century to the present. We take up a new dimension of society by thinking
    about its relationship to the self. How does morality rely on the inner discipline of individuals? How does individual
    identity rely on recognition by others? This question especially arises in the resistance movements we encounter in the
    histories of imperialism and totalitarianism. These widen the horizon on historical claims to liberty and equality along
    lines of race and gender. Finally, from forms of social domination we move to the human domination of nature in which
    students consider social-scientific approaches to the unstable boundaries between human and non-human worlds. Texts vary
    by year and have included: Hegel, Tocqueville, Nietzsche, Freud, Fanon, DuBois, Arendt, M.L. King, Foucault, Beauvoir,
    and C. Korsgaard'
  core_tags:
