- code: SOSC 26004
  title: History of City Planning
  units: 100
  description: 'This lecture-based course provides a broad survey of the history of city planning. It focuses on the normative:
    the endeavor to control and design the physical fabric of cities. What are the different ways cities have been envisioned
    and planned and to what effect? What are the competing theories of good city design that underlie city plans, and how
    do these plans interrelate to the social, political, cultural, and economic forces shaping cities? The course explores
    city planning''s successes and failures, its tangible effect on urban pattern and form, and the extent to which city planning
    ideals have changed over time. Though the emphasis is on city planning''s history, current debates about city planning
    within the context of the history of the profession will also be engaged. Emphasis will be on U.S. and European city planning
    experience, although global practices will also be surveyed.'
  crosslists:
