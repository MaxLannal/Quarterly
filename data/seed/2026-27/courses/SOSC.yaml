- code: SOSC 27910
  title: 'Ancient Mediterranean World III: Late Antiquity'
  units: 100
  description: Part III examines late antiquity, a period of paradox. The later Roman emperors established the most intensive,
    pervasive state structures of the ancient Mediterranean, yet yielded their northern and western territories to Goths,
    Huns, Vandals, and, ultimately, their Middle Eastern core to the Arab Muslims. Imperial Christianity united the populations
    of the Roman Mediterranean in the service of one God, but simultaneously divided them into competing sectarian factions.
    A novel culture of Christian asceticism coexisted with the consolidation of an aristocratic ruling class notable for its
    insatiable appetite for gold. The course will address these apparent contradictions while charting the profound transformations
    of the cultures, societies, economies, and political orders of the Mediterranean from the conversion of Constantine to
    the rise of Islam.
  crosslists:
