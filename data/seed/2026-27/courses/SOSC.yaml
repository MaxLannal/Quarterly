- code: SOSC 24100
  title: 'Russia and Eurasia: Empires, Societies, Cultures II (formerly Introduction to Russian Civilization)'
  units: 100
  description: The second quarter focuses on nearly two centuries of upheaval, from the radical movements of the late 19th
    century to the birth, life, and death of the Soviet Union and the emergence of post-Soviet states. Our topics include
    Russian imperialism, colonial conquests, and the reconstitution of the Russian empire as the Soviet Union; systems of
    social and political legitimization; political violence, the evolution of the repressive machinery, and the enduring problem
    of the rule of law; religious, national, and sexual minorities, practices of everyday life, social order and disorder;
    resistance, dissent, and liberation movements; creativity, experimentation, and self-expression under censorship.
  notes: Taking these courses in sequence is recommended but not required. When taken with HIST 13900, HIST 14000 meets the
    two-quarter general education requirement in Civilization Studies.
  crosslists:
