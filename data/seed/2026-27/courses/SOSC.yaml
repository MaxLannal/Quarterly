- code: SOSC 14100
  title: Mind I
  units: 100
  description: The first quarter of Mind challenges the naïve impression that our subjective experience of reality is a veridical
    reflection of the external world. By introducing a wide-range of phenomena that illustrate the constructive nature of
    experience-- perceptual, conceptual, affective, social, and cultural-- the lectures and readings engage students in analyzing
    the mind's role in the construction of our realities. In particular, we consider our subjective awareness of and introspective
    access to the mental processes that shape reality for us and the bottom-up and top-down control of information processing
    in generating that reality. During the second half of the quarter we examine the dynamic nature of mind-- how our constructed
    realities emerge and change over time and role of nature and nurture in their development across a variety of time scales,
    exploring processes that unfold over the course of milliseconds as well as those that unfold over millennia.
  core_tags:
