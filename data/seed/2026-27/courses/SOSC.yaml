  needs_review: true
- code: SOSC 15200
  title: Classics of Social and Political Thought II
  units: 100
  description: We will continue to explore theories about the nature and purpose of political life in the winter quarter,
    but we will also focus upon the ways in which political communities are organized and ruled. For instance, what is the
    basis of our political obligations and rights? Should people play a role in their own governance? If so, how should they
    navigate conflicts between their individual interests and the common good? Furthermore, is it acceptable for certain individuals
    or groups to have more political power and rights than others? And under what conditions can revolution or rebellion be
    justified? As we take up these questions, we will also examine the meaning of concepts such as sovereignty, freedom, and
    equality, as well as the relationship between politics and religion. Our readings will include texts by Thomas Hobbes,
    John Locke, Jean-Jacques Rousseau, and Mary Wollstonecraft.
