- code: SOSC 24506
  title: The Rights of Immigrants and Refugees in Practice
  units: 100
  description: This course employs an interdisciplinary approach to examine the work of social justice advocacy for and by
    non-citizens in the U.S. including asylum seekers, immigrant workers, women as migrants, migrant children, and the undocumented.
    Our readings will place selected case studies in their local, national, and international context. We will draw on sources
    from law, history, sociology, political science, and the arts. Texts, films, and guest speakers will address the history
    of immigrants' rights advocacy in the Chicago and the U.S., with selected global examples. Topics will include the rights
    of asylum seekers, the problems of migrant workers (guest-workers and the undocumented), women and children as migrants,
    and the impact of the global pandemic on migration in general. The case studies will illuminate the role of immigrants
    as leaders and the relationship between impacted communities and the state. We will meet with journalists, elected officials,
    organizers, academics, artists, lawyers, and immigrant community leaders to discuss distinct approaches to migrants' rights
    advocacy.
