- code: SOSC 19082
  title: 'Córdoba: Crossroads of Mediterranean Civilizations I'
  units: 100
  description: This course will focus on the cultural encounters that shaped southern Iberian in the proto- historic and Roman
    periods, and on the role of religion as a node of negotiation of local and foreign identities. Through readings and archaeological
    visits, the students will learn about the impact of the Phoenician culture, very present in the south since the ninth
    century BCE, as well as of the local Iberian and Tartessic culture. In the third century BCE, southern Iberia was also
    the scenario of the Second Punic War, when the Phoenicians from Carthage and the Romans fought for control of the western
    Mediterranean trade routes, ultimately leading to the Roman invasion and colonization of Iberia. Cordoba was at the center
    of these transformations, and became a full-fledged Roman city, which produced illustrious Roman writers and politicians;
    and the city shows the legacy of Visigothic and early Christian culture too. The course will explore the continuities
    and disruptions that accompanied these various phases of Andalusia's early history, with an emphasis on religious and
    cultural identities and their material and literary expression.
  core_tags:
  - civilization
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 19082. Córdoba: Crossroads of Mediterranean Civilizations I. 100 Units.'
- code: SOSC 19083
  title: 'Córdoba: Crossroads of Mediterranean Civilizations II'
  units: 100
  description: In this second part of the sequence, we will attend to Cordoba and Andalusia more broadly as a site of cultural
    and religious mixture. We will begin in Muslim-ruled al-Andalus (c. 8th - 15th centuries CE), focusing on the historical
    and cultural movements of people, ideas, and objects, and their visible aftermath in the architecture and lived culture
    of Cordoba and Andalusia in general as well as in the cultural lives of people across the Mediterranean. Eventually, we
    will move on to discuss the fraught nature of the contemporary movement of people across that same Mediterranean sea,
    including refugees and labor migrants. By the end of our three weeks, you will have gained a deeper knowledge of this
    period of Spanish and world history.
  core_tags:
  - civilization
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 19083. Córdoba: Crossroads of Mediterranean Civilizations II. 100 Units.'
- code: SOSC 19084
  title: 'Córdoba: Crossroads of Mediterranean Civilizations III'
  units: 100
  description: This course is the final part of a three-quarter sequence that explores the history and culture of ancient,
    medieval, early modern, and modern southern Europe from a cultural-historical perspective, with special attention to cultural
    contact across linguistic and religious groups. This course explores the intended and unintended consequences of some
    of those cultural encounters and the complex entanglements they created. It will focus on the making of new Spains-literally,
    Nueva España in the Americas, but also the influences and impacts of post-colonial Latin American literature, art, film,
    and music on the other side of the Atlantic. We will interrogate the dynamics of imperialism, conquest, and colonialism
    and their enmeshment with both Spanish and Latin American lives, identities, and resistance, while also considering the
    enduring legacies of those processes in the modern world.
  core_tags:
  - civilization
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 19084. Córdoba: Crossroads of Mediterranean Civilizations III. 100 Units.'
- code: SOSC 20004
  title: 'Ancient Near Eastern Thought and Literature I: Mesopotamian Literature'
  units: 100
  description: This course gives an overview of the richness of Mesopotamian Literature (modern Iraq) written in the 3rd-1st
    millennium BC. We will read myths and epics written on clay tablets in the Sumerian and Akkadian language in English translation
    and discuss content and style, but also the religious, cultural and historic implications. Particular focus will be on
    the development of stories over time, the historical context of the literature and mythological figures. The texts treated
    cover not only the famous Epic of Gilgamesh, but also various legends of Sumerian and Akkadian kings, stories about Creation
    and World Order, and destruction. The topics covered range from the quest for immortality, epic heroes and monsters, sexuality
    and love.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  crosslists:
  - NEHC 20004
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 20004. Ancient Near Eastern Thought and Literature I: Mesopotamian Literature. 100 Units.'
- code: SOSC 20005
  title: 'Ancient Near Eastern Thought & Literature II: Anatolian Lit'
  units: 100
  description: 'The goal of this class is to get an overview of Hittite literature, as "defined" by the Hittites themselves,
    in the wider historical-cultural context of the Ancient Near East. Some of the most important questions we can ask ourselves
    in reading ancient texts are: why were they written down, why were they kept, for whom were they intended, and what do
    the answers to these questions (apart from the primary content of the texts themselves) tell us about - in our case -
    Hittite society?'
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  crosslists:
  - NEHC 20005
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 20005. Ancient Near Eastern Thought & Literature II: Anatolian Lit. 100 Units.'
- code: SOSC 20006
  title: 'Ancient Near Eastern Thought & Literature III: Ancient Egyptian Literature'
  units: 100
  description: This course explores the rich body of literature surviving from ancient Egypt, covering texts spanning ca.
    2500 BCE-100 CE. We will read texts in English translation from a variety of genres-from adventure tales, to love poetry,
    to autobiographies and the Book of the Dead-asking throughout the quarter how the ancient Egyptians understood the concept
    of literature, how translation affects our experiences of the texts, who the authors and audiences were, and how the texts
    relate to their social, historical, and cultural contexts. We will also explore how literary conventions changed over
    time and what they reveal about broader societal shifts in ancient Egypt.
  crosslists:
  - NEHC 20006
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 20006. Ancient Near Eastern Thought & Literature III: Ancient Egyptian Literature. 100 Units.'
- code: SOSC 20011
  title: 'Ancient Empires I: The Hittite Empire'
  units: 100
  description: 'This course introduces students to the Hittite Empire of ancient Anatolia. In existence from roughly 1750-1200
    BCE, and spanning across modern Turkey and beyond, the Hittite Empire is one of the oldest and largest empires of the
    ancient world. We will be examining their history and their political and cultural accomplishments through analysis of
    their written records - composed in Hittite, the world''s first recorded Indo-European language - and their archaeological
    remains. In the process, we will also be examining the concept of "empire" itself: What is an empire, and how do anthropologists,
    archaeologists, and historians study this unique kind of political formation?'
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  crosslists:
  - NEHC 20011
  - HIST 15602
  - CLCV 25700
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 20011. Ancient Empires I: The Hittite Empire. 100 Units.'
- code: SOSC 20012
  title: 'Ancient Empires II: The Ottoman Empire'
  units: 100
  description: The Ottomans ruled in Anatolia, the Middle East, South East Europe and North Africa for over six hundred years.
    The objective of this course is to understand the society and culture of this bygone Empire whose legacy continues, in
    one way or another, in some twenty-five contemporary successor states from the Balkans to the Arabian Peninsula. The course
    is designed as an introduction to the Ottoman World with a focus on the cultural history of the Ottoman society. It explores
    identities and mentalities, customs and rituals, status of minorities, mystical orders and religious establishments, literacy
    and the use of the public sphere.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  crosslists:
  - MDVL 20012
  - HIST 15603
  - CLCV 25800
  - NEHC 20012
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 20012. Ancient Empires II: The Ottoman Empire. 100 Units.'
- code: SOSC 20013
  title: Ancient Empires III :The Egyptian Empire of the New Kingdom
  units: 100
  description: For most of the duration of the New Kingdom (1550-1069 BC), the ancient Egyptians were able to establish a
    vast empire and becoming one of the key powers within the Near East. This course will investigate in detail the development
    of Egyptian foreign policies and military expansion which affected parts of the Near East and Nubia. We will examine and
    discuss topics such as ideology, imperial identity, political struggle and motivation for conquest and control of wider
    regions surrounding the Egyptian state as well as the relationship with other powers and their perspective on Egyptian
    rulers as for example described in the Amarna letters.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  crosslists:
  - HIST 15604
  - NEHC 20013
  - CLCV 25900
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 20013. Ancient Empires III :The Egyptian Empire of the New Kingdom. 100 Units.
- code: SOSC 20101
  title: Introduction to African Civilization I
  units: 100
  description: 'Part one considers literary, oral, linguistic, and material sources to investigate African societies and states
    from the early Iron Age through the emergence of the Atlantic World. Case studies include: the empires of Ghana and Mali,
    the Swahili Coast, Great Zimbabwe, Nok of Nigeria, and medieval Ethiopia. We also consider religious and spiritual transformation,
    including Islam in Africa, as well as the origins and effects of European contact, and the emergence of the transatlantic
    trade in enslaved human beings. Students examine these times and places through primary sources (such as cultural artifacts,
    visual representations, myths, and memoirs) which illuminate African perspectives on these different places and times.
    Assignments: oral presentations, document analyses, essays, and team projects.'
  crosslists:
  - HIST 10101
  - MDVL 10101
  - ANTH 20701
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 20101. Introduction to African Civilization I. 100 Units.
- code: SOSC 20202
  title: Introduction to African Civilization II
  units: 100
  description: This course examines the transformations of African societies in the long nineteenth century. At the beginning
    of the era, European economic and political presence was mainly coastal, but by the end, nearly the entire continent was
    colonized. This course examines how and why this process occurred, highlighting the struggles of African societies to
    manage internal reforms and external political, military, and economic pressures. Students examine these processes through
    various primary sources (such as visual and material sources, cultural artifacts, and personal accounts) that highlight
    African perspectives on these processes.
  crosslists:
  - ANTH 20702
  - HIST 10102
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 20202. Introduction to African Civilization II. 100 Units.
- code: SOSC 20203
  title: Introduction to African Civilization III
  units: 100
  description: African Civilization III examines Africa and the African diaspora in the modern era. Topics may include the
    end of colonialism and decolonization, the legacies of slavery and its racial logics, identity and cultural expression,
    theories of personhood, gender and sexuality, migration, governance, and language. Readings vary widely, including primary
    sources by African and diasporic authors, social theory, and works of art and literature - written, spoken, and performed.
  notes: Taking these courses in sequence is recommended but not required.
  crosslists:
  - HIST 10103
  - ANTH 20703
  prereq_text: This sequence meets the general education requirement in civilization studies.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 20203. Introduction to African Civilization III. 100 Units.
  needs_review: true
- code: SOSC 20210
  title: UX Research Foundations
  units: 100
  description: User Experience ("UX") is a professional field and practice that aims to understand the core needs of users
    to positively impact the experience and successful adoption of a product. How we define "product" in UX has great variation
    and can be physical, digital, or omnichannel-this makes the field of study highly nuanced, complex, and engaging. UX practitioners
    are present in a variety of industries including Tech, Automotive, Healthcare, Travel, and CPG (consumer packaged goods).
    UX Researchers specifically contribute to this field by deeply understanding and measuring user outcomes. We report both
    findings and actionable insights for product, design, insights, engineering, marketing, and business stakeholders. To
    do so successfully, many user research methodologies are leveraged (both qualitative and quantitative) and findings are
    socialized in a way that makes product (rather than pedagogical) impact. This course aims to lay a theoretical and methodological
    foundation for user experience research and reporting. The goal of this course is to equip students who are curious about
    UXR with the basic foundation needed to enter the job market. Students will gain a deep theoretical and historical understanding
    of the field of User Experience and its methods, learn basic design principles to help them communicate with colleagues
    in an applied context, and produce a final project (and supplementary research materials) that can serve as a professional
    portfolio piece/case study.
  crosslists:
  - MAPS 30210
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 20210. UX Research Foundations. 100 Units.
- code: SOSC 21001
  title: 'Human Rights: Contemporary Issues'
  units: 100
  description: This course is being taught at a "watershed" moment in the history of human and civil rights in the U.S. The
    U.S. government has largely abandoned the post-World War 2 alliances and institutions which compose the modern international
    human rights regime - and changed the priorities of domestic rights-protection agencies. The course begins with a discussion
    of the nature of rights and our expectations about their protection. We will examine the state of democracy in the U.S.
    and the relationship between democracy, the rule of law, and human rights. We will follow this introduction with an overview
    of the founding of the modern human rights regime in the post-World War 2 period. For case studies, we focus primarily
    (but not exclusively) on the U.S. experience and place it in a global context. Students will have an opportunity to learn
    about and from human rights "practitioners" from the arts, science, journalism, and law, as well as NGOs which protect
    human rights. Learning about the reality of human rights "practice" today is a core element of this course. We will look
    at the persistence of racism, torture, and police abuse. We will examine contemporary issues such as the rule of law,
