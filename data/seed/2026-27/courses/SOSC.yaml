- code: SOSC 16200
  title: Global Society II
  units: 100
  description: 'The second quarter of Global Society is built around the theme of population and is designed as a hybrid course
    that brings together a) an intellectual history of population thought and census-taking and b) a practical introduction
    to basic demographic tools and contemporary debates about population. Students will engage Malthus, his detractors, and
    new incarnations of Malthusian thought in detail. Questions considered will include: What is a population? What is at
    stake when we count? How many people can this earth support? What are the implications of population shifts for individual
    life chances? For social values and patterns of difference? Students will learn how to construct basic period lifetables,
    how to compare populations and sub-populations using basic standardization techniques, and how to analyze generations
    and cohorts in context. At the same time, since population issues like reproduction, migration, and mortality are simultaneously
    philosophical, political, and empirical matters, students will connect these practical and empirical analyses to political
    and value debates about the causes and consequences of population change. Possible texts include: Graunt, Petty, Malthus,
    Nehru, Wu Ta-k''un, and contemporary instantiations.'
  core_tags:
  - social_sciences
  prereq_text: SOSC 16100. These courses must be taken in sequence. Students registered in this sequence must attend the first
    and second class sessions or their registration will be dropped.
  terms_offered:
  - WI
