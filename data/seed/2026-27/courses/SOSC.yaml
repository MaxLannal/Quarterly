  title: Introductory Statistical Methods
  units: 100
  description: This course introduces and applies fundamental statistical concepts, principles, and procedures to the analysis
    of data in social and behavioral sciences. Students will learn computation, interpretation, and application of commonly
    used descriptive, correlational, and inferential statistical procedures as they relate to social and behavioral research.
    The course will integrate the use of Stata as a tool for these techniques. This course is equivalent to SOSC 20004/30004
    (Statistical Methods of Research I), CHDV 20101/30101 (Applied Statistics in Human Development Research), PSYCH 20100
