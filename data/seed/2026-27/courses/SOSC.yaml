- code: SOSC 17100
  title: 'Religion: Cosmos, Conscience, and Community I'
  units: 100
  description: Religion has not merely enriched the human intellect already formed, but in fact has helped to form it." This
    is how Émile Durkheim, a pioneer of modern sociology, justifies his assertion that the study of religion is crucial for
    all social scientific inquiry. Taking its cue from Durkheim, this course explores how religious traditions around the
    globe have organized social realities, provided narrative frameworks for everyday life, and theorized collective identities.
    We will examine how religious traditions narrate the origin of the world and how religious myths and rituals structure
    societies and prescribe roles for individuals. We will analyze how social forms of power influence, and are influenced
    by, beliefs about divinities, the supernatural, and the nature of existence. Finally, we will compare modern critiques
    of religion and discuss the persistence of religious thought to address the question of whether societies can survive
    without religion. Readings include creation myths, the Daodejing, Genesis, Jean-Jacques Rousseau, Mary Douglas, Ibn Tufayl,
    and Buddhist suttas.
  core_tags:
  - social_sciences
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 17100. Religion: Cosmos, Conscience, and Community I. 100 Units.'
- code: SOSC 17200
  title: 'Religion: Cosmos, Conscience, and Community II'
  units: 100
  description: 'During the Fall quarter, we discussed how religious descriptions of the universe and our place in it are inscribed
    in power relations that are fundamentally social in nature. Building on that, this course asks: How do societies conceptualize
    the nature of suffering and evil? According to different religions, what can be done about suffering and evil on individual
    and collective levels? How do individual practices like meditation and collective practices like war reflect different
    diagnoses of what is wrong with the world? In this course, students compare scholarly efforts to theorize human finitude
    with religious parables, poetry, and practices aimed at surviving or overcoming pain, anxiety, and even death. We pay
    particular attention to the social dimension-is it true that "we''re all in this together" or is it true that "everybody
    dies alone," and how do these beliefs reflect and sustain socio-political structures? Readings include Sigmund Freud,
    the Book of Job, Plato, Zhuangzi, Friedrich Nietzsche, C.S. Lewis, and the Bhagavad Gita.'
  core_tags:
  - social_sciences
  prereq: SOSC 17100
  prereq_text: SOSC 17100
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 17200. Religion: Cosmos, Conscience, and Community II. 100 Units.'
- code: SOSC 17300
  title: 'Religion: Cosmos, Conscience, and Community III'
  units: 100
  description: In the Fall quarter, we examined how religious myths and rituals presuppose, challenge, and support social
    conditions and power relations. In the Winter, we discussed how these myths and accompanying rituals respond to the ways
    human beings are flawed and finite-vulnerable to evil, alienation, and misfortune. The Spring quarter is devoted to themes
    surrounding ideology, ethics, hope, and the future. What ideas and practices do religions propose as ways of remedying,
    coping with, or adjusting to the facts of existence? Where do different groups find the motivation to make the world a
    better place-is it because of religions and ideologies, or in spite of them? How do different religions address the moral
    standing of the neighbor, the enemy, the community, and the environment? How is religion connected to social, economic,
    and political power no-is it the "opiate of the masses," or the spark that ignites a revolution? Readings include Karl
    Marx, John Locke, Hannah Arendt, Malcolm X, Dorothy Day, Ali Shariati, and Max Weber.
