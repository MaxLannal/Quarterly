- code: SOSC 25500
  title: 'PIR: Contemporary and Research Applications'
  units: 100
  description: In this seminar, students will design and carry out their own research project based on readings and themes
    from PIR. They will explore other relevant literature, including secondary scholarship, and develop a question to examine
    through ethnographic, archival, library and/or media-based research. The final product can be a research paper, a Canvas-based
    web page presentation, or other form. In addition to providing some exposure to qualitative research methods and the use
