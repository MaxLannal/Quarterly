- code: SOSC 14300
  title: Mind III
  units: 100
  description: Spring quarter of Mind examines the highly context-dependent nature of psychological processes and how their
    operation changes depending on the particular goals, decisions, and applications for which they are used. Context can
    be viewed broadly to include the physical environment, other people, and the invisible forces of culture and society,
    i.e., external sources of context. However, it is equally important to consider the internal psychological and biological
    context of mental activity, e.g., the interactive effects of motivation, affect, attention and knowledge on a particular
    process or phenomenon. Lectures address a variety of topics, including distraction and attentional control, environmental
    effects on attention and mood, political attitudes, decision-making, mathematical knowledge, emotion, and language use.
