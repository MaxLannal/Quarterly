    quote: SOSC 16200. Global Society II. 100 Units.
  needs_review: true
- code: SOSC 16300
  title: Global Society III
  units: 100
  description: 'This third part of the sequence marries themes that emerge from Global Social Thought and Population, with
    an emphasis on social change and development during twentieth and twenty-first centuries. From the perspective of Global
    Society, "change" and "development" encompass everything from micro-level changes in gender relations to macro-level shifts
    in the global economy. With new theoretical and empirical tools from parts 1 & 2 of the sequence, students will engage
    the empirical, the theoretical, and the normative aspects of defining and evaluating long-run and short-run social change.
    Using global and comparative lenses, we examine forms of state repression, civil resistance, religious transformations,
    technological and economic changes, and the effects of these large social patterns on individual persons. Students will
    write about the relationship of individuals to broad forces of social change, connecting themes from the first and second
    quarters. The sequence concludes with a set of writing workshops designed to guide students through the steps of producing
    a capstone sequence paper. Using the skills and tools they''ve acquired throughout the sequence, students will analyze
    the relationship of a particular cohort (anchored in a time, place) to social change, with a focus on the empirical, normative,
    and theoretical stakes, their causes and consequences. Possible texts include: Geertz, DuBois, Srinivas, and contemporary
    instantiations.'
  core_tags:
  - social_sciences
  prereq_text: SOSC 16200. These courses must be taken in sequence. Students registered in this sequence must attend the first
    and second class sessions or their registration will be dropped.
  terms_offered:
