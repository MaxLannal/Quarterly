- code: SOSC 11400
  title: Power, Identity, Resistance I
  units: 100
  description: 'The first quarter of this sequence opens with the theoretical basis of the modern, liberal state - social
    contract theory. We consider how state power was legitimized by common consent and how principles of freedom and equality
    were anchored in accounts of "the state of nature." We also think about who was party to this original contract and ask
    whether the prosperity and protection of some was implicitly premised on the exclusion or exploitation of others. As we
    examine the protections offered by the liberal state against excessive, arbitrary power, we interrogate the limits of
    state power and ask at what point can we resist it? We trace these dialogues from the seventeenth century through the
    beginning of the nineteenth century. Texts vary by year and have included: Hobbes, Locke, Rousseau, Burke, Constant, Paine,
    Wollstonecraft, D. Walker, C.L.R. James'
  core_tags:
  - social_sciences
  prereq_text: These courses must be taken in sequence. Students registered in this sequence must attend the first and second
    class sessions or their registration will be dropped.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 11400. Power, Identity, Resistance I. 100 Units.
  needs_review: true
- code: SOSC 11500
  title: Power, Identity, Resistance II
  units: 100
  description: 'The emergence of the liberal state that we examine in the Fall quarter accompanied the rise of commercial
    society and industrial capitalism, so in the Winter quarter we turn to theories of political economy. Generally, we are
    concerned with the relationship between labor and human nature, the organization of economic life, and the relationship
    between the state and the economy. We pay particular attention to the depiction of society itself as a market and how
    the capitalist mode of economic organization was linked both to new possibilities for human emancipation and new forms
    of exploitation and subjection. But we also ask how distinct is the modern form of capitalism? And what do the organization
    of labor and trade, and the distribution of resources outside of capitalism tell us about the ways power can operate in
    relation to economy? Texts vary by year and have included: Smith, Marx, Durkheim, Mauss, Hayek, Kropotkin, Arendt, Friedman,
    S. Mintz, E. Williams'
  core_tags:
  - social_sciences
  prereq_text: SOSC 11400. These courses must be taken in sequence. Students registered in this sequence must attend the first
    and second class sessions or their registration will be dropped.
  terms_offered:
  - WI
