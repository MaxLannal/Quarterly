- code: SOSC 24200
  title: 'Russia and Eurasia: Empires, Societies, Cultures III, Russia and the West, 18th to 21st centuries'
  units: 100
  description: 'The third quarter is thematic, rather than chronological, and offers an in-depth or comparative exploration
    of special topics. Topics vary from year to year. There are few problems as enduring and central to Russian history as
    the question of the West-Russia''s most passionate romance and most bitter letdown. In this course we will read and think
    about Russia from the eighteenth to the twenty-first centuries through the lens of this obsession. We will study the products
    of Russian interactions with the West: constitutional projects, paintings, scientific and economic thought, the Westernizer-Slavophile
    controversy, and revolutions. We will consider the presence of European communities in Russia: German and British migrants
    who filled important niches in state service, trade, and scholarship; Italian sculptors and architects who designed some
    of Russia''s most famous monuments; French expatriates in the wake of the French Revolution; Communist workers and intellectuals,
    refugees from Nazi Germany; and Western journalists who, in the late Soviet decades, trafficked illicit ideas, texts,
    and artworks. In the end, we will follow émigré Russians to Europe and the United States and return to present-day Russia
    to examine the anti-Western turn in its political and cultural discourse.'
  notes: When taken with HIST 13900 and HIST 14000, HIST 14100 meets the three-quarter general education requirement in Humanities,
    Civilization Studies, and the Arts. HIST 14100 does not meet the two-quarter Civilization Studies requirement and cannot
    be combined with HIST 13900 or HIST 14000 for Civilization Studies credit.
  crosslists:
  - REES 26015
  - HIST 14100
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 24200. Russia and Eurasia: Empires, Societies, Cultures III, Russia and the West, 18th to 21st centuries.
      100 Units.'
- code: SOSC 24505
  title: Human Rights in Mexico
  units: 100
  description: This course is intended to give the student a foundation in understanding human rights as both concept and
    reality in contemporary Mexico. Subject matter includes an overview of key periods in Mexican history in which concepts
    of individual and group rights, the relationship between citizens and the state, and the powers of the Church and the
    state were subject to change. This historical review will form the foundation for understanding human rights issues in
    contemporary Mexico. The course will also examine modern social movements which frame their demands as human rights.
