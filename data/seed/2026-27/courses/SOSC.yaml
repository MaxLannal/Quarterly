- code: SOSC 25131
  title: Evolution in Thought, Art, and Culture
  units: 100
  description: Evolution, as it is understood by biologists and other scientists, refers to the process of generational change
    in the inherited characteristics of life forms. But it is also a powerful idea with ongoing significance for debates about
    human nature and the human relationship to nonhuman life and technology. Since its development in the nineteenth century,
    the idea of evolution has motivated countless writers, scientists, philosophers, and artists to imagine and advocate for
    diverse visions of the future of human life on earth and beyond. Through materials as diverse as Darwin's own account
    of his formulation of the theory of evolution to science fiction films like Gattaca, we will consider a variety of engagements
    with evolutionary thought ranging from the construction of political utopias to programs in genetic manipulation and biohacking
    to efforts at preserving the past and future of endangered species. In so doing, we will analyze the history of evolutionary
    speculation, consider the ethical values associated with the various scientific, social, and cultural projects it has
    inspired, and develop the critical skills needed to tackle questions raised by developments in science and technology.
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 25131. Evolution in Thought, Art, and Culture. 100 Units.
- code: SOSC 25132
  title: The Theory and Politics of Capitalism
  units: 100
  description: 'It is impossible to graduate from college without repeatedly encountering the term "capitalism." But what
    is it, actually? Is it primarily a political or an economic system? What is the difference and why does it matter? Why
    are economics and politics taught in different departments at modern universities and why is a major in economics so popular?
    This course will equip students with the basic conceptual tools to think about these questions. We will try to understand
    the history and theory of capitalism by reading selections from six of the most important theorists of modern economic
    life: Adam Smith, Karl Marx, Friedrich List, William Stanley Jevons, John Maynard Keynes, and Friedrich Hayek.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 25132. The Theory and Politics of Capitalism. 100 Units.
- code: SOSC 25313
  title: 'Beyond Human: Geniuses, Superheroes and A.I'
  units: 100
  description: 'This interdisciplinary course will explore what it means to be human by spotlighting cases that push the limits
    of human cognition. We will study sociological and psychological works that deal with topics ranging from gifted individuals,
    superhuman abilities, and technological wonders. As we do so, we will bring into conversation the real and the imagined-moving
    from social experiments to works of fiction and media productions. Questions we will tackle throughout the course include:
    Why do we look at geniuses with both awe and anxiety? What can superhero movies tell us about morality? Can we trust the
    machines that we built? Together, we will discuss how different cultural understandings and social contexts shape the
    answers we give to these questions.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 25313. Beyond Human: Geniuses, Superheroes and A.I. 100 Units.'
- code: SOSC 25314
  title: 'The Rise and Persistence of "The Top 1%": The Sociology of Economic Advantage'
  units: 100
  description: In many parts of the world, socioeconomic inequality has been on the rise for several decades. Within these
    countries, the wealth, resources, and power of "the Top 1%" seems to be reaching unparalleled levels. Who comprises this
    "elite"? How does an individual attain this status? How do they perform and reproduce their status in society? What role
    can (and should) the members of such an elite play in society? How might all of this be changing in the 21st century?
    This course explores these questions by turning our sociological lenses on those who are advantaged in structures of equality,
    and how they acquire, claim, and amass power and resources. Throughout the course, students will learn how to critically
    read social theory, draw on sociological concepts to debate real world dilemmas, and form their own nuanced and informed
    opinions.
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 25314. The Rise and Persistence of "The Top 1%": The Sociology of Economic Advantage. 100 Units.'
- code: SOSC 25315
  title: The Possibility of Freedom
  units: 100
  description: Since the eighteenth century, freedom has served as one of the primary ends toward which political life is
    directed, and perhaps as a result freedom has come to be understood largely in political terms. In this course we will
    question this association of freedom and politics, both with an eye toward expanding the possible avenues through which
    freedom can be understood and enjoyed while also identifying the conditions under which freedom can be meaningfully lived
    in the political realm. We will begin the course by engaging with classic thinkers like Jean-Jacques Rousseau and Alexis
    de Tocqueville. We will then move to a consideration of twentieth- and twenty-first century thinkers who have grappled
    with the question of freedom, including Hannah Arendt, Albert Camus, Simone Weil, Jacques Ellul, E.F. Schumacher, Wendell
    Berry, Alan Moore, and James C. Scott.
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 25315. The Possibility of Freedom. 100 Units.
- code: SOSC 25316
  title: 'Democracy Against Itself: From Antiquity to Modernity'
  units: 100
  description: How can we make sense of the global democratic crisis that dominates today's headlines? What do the historical
    and political transformations of democracy, from its ancient beginnings to its modern forms, reveal about our current
    moment? Across the United States, Europe, Asia, and the Middle East, democratic institutions seem increasingly fragile,
    with widespread discontent impacting public life. Whereas the ancients related to democracy in more direct terms, its
    modern trajectory has been marked by paradoxes obscuring our understanding of democratic ideals. This course traces the
    history of democracy from its origins in classical antiquity to its transformations with the rise of modern society. Starting
    with Ancient Greece, we examine the ideals and shortcoming of Athenian democracy through Aristotle's Politics, Thucydides'
    account of the Peloponnesian War, and Aristophanes' comic critiques. We will then focus on the emergence of bourgeois
    democracy in the age of revolutions, with close readings of the American Declaration of Independence, Alexis de Tocqueville's
    Democracy in America, and key texts of the French Revolution to parse out the potential of democracy rooted in the ideals
    of equality and liberty. Finally, the course considers the rise and crisis of capitalist democracy, through the failed
    revolutions of 1848 and the emergence of mass society in the twentieth century to mark the problematic rise of nationalism
    and authoritarian democracy."
  crosslists:
  - HIST 19906
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 25316. Democracy Against Itself: From Antiquity to Modernity. 100 Units.'
- code: SOSC 25411
  title: East Asian Civilization I, Ancient Period-1600
  units: 100
  description: This course examines the politics, society, and culture of East Asia from ancient times until c. 1600. Our
    focus will be on examining key historical moments and intellectual, social, and cultural trends with an emphasis on viewing
    the region as a whole. Students will read and discuss culturally significant texts and be introduced to various approaches
    to analyzing them. This will include discussions of differences in how we approach textual and non-textual evidence (such
    as archaeological artifacts and reconstructed climate data), and especially the challenges of recovering other meanings
    from texts that were written and/or later used to legitimate particular regimes, or to project current practices back
    into the distant past so that they seem to be manifestations of a society's defining traditions.
  crosslists:
  - EALC 15411
