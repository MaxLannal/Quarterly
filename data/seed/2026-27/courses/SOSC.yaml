- code: SOSC 15100
  title: Classics of Social and Political Thought I
  units: 100
  description: We will begin in the autumn quarter by investigating the nature and purpose of political life. Why do humans
    form political communities? What qualifies someone for citizenship in them and who should rule? What roles do justice,
    virtue, and law play in our political communities? Is it ever acceptable to violate the laws that govern us? We will examine
    how these questions were answered by Plato, Aristotle, Thomas Aquinas, and Niccolò Machiavelli. In addition to studying
    the substance of their political theories, we will analyze the principles and assumptions that animate them. We will pay
    especially close attention to how these theorists' accounts of human nature informed their ideas about political life.
  core_tags:
