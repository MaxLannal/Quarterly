- code: SOSC 13100
  title: Social Science Inquiry I
  units: 100
  description: 'Autumn Quarter begins by asking under what conditions a claim about the social world is specified sharply
    enough to be studied? Students learn to turn vague questions into answerable ones, to measure social concepts, and to
    see why an observed correlation, between a minimum wage and employment, say, or an officer''s race and the use of force,
    is not yet evidence of a causal effect. Building on research on causal inference from across the social sciences, the
    quarter introduces the research designs researchers use to do better: randomized experiments and observational strategies
    such as natural experiments, differences-in-differences, and regression discontinuity.'
