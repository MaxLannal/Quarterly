- code: SOSC 15300
  title: Classics of Social and Political Thought III
  units: 100
  description: In the final quarter of the sequence, we will turn to texts by nineteenth- and twentieth-century writers who
    developed criticisms of existing social and political conditions. They include Alexis de Tocqueville, Karl Marx, Friedrich
    Nietzsche, W. E. B. Du Bois, and Simone de Beauvoir. These writers will invite us to explore the ways in which freedom
    and domination appear and operate within liberal democracies and capitalist societies, as well as the requirements for
    overcoming domination and realizing greater freedom. We will also examine the meaning of values such as equality, progress,
    self-reliance, thrift, morality, and truth, and we will consider how these values shape human lives. Finally, throughout
    the quarter we will use the assigned texts as resources for learning about the practice of social criticism. We will consider
    how it can serve society, as well as how we might use the concepts and models of inquiry that we find in our texts to
    analyze present social and political conditions.
