- code: SOSC 25412
  title: East Asian Civilization II, 1600-1895
  units: 100
  description: Second quarter of East Asian civilization sequence covering what are now China, Japan, and Korea from roughly
    1600-1895. Major themes include demographic and economic change, plus the social and cultural effects of widespread but
    uneven commercialization; state formation, rebellion, and political change; migration, urbanization, and territorial expansion;
    changes in family and gender roles; changes in the "natural" environment, particularly as related to agricultural expansion;
    changes in religion, ideology, and relationships between "elite" and "popular" culture; and increasingly consequential
    encounters with Western Europeans, Russians, and Americans, especially in the 19th century. The course aims to treat East
    Asia as a single, interacting region, rather than as three (or more) sharply separated proto-nations; however, it will
    also call attention to the enormous diversity both among and within China, Japan, and Korea, treating those differences
    as constantly evolving, and as something to be explained rather than assumed.
  crosslists:
  - EALC 15412
  - HIST 15412
  prereq_text: HIST 15411-15412-15413 meets the general education requirement in civilization studies via three civilization
    courses. HIST 15411-15412, HIST 15411-15413, or HIST 15412-15413 meets the general education requirement in civilization
    studies via two civilization courses.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 25412. East Asian Civilization II, 1600-1895. 100 Units.
  needs_review: true
- code: SOSC 25413
  title: East Asian Civilization III, 1895-Present
  units: 100
  description: The third quarter of the East Asian civilization sequence covers the emerging nation-states of China, Korea,
    and Japan in the context of Western and Japanese imperialism and the rise of an interconnected global economy. Our themes
    include industrialization and urbanization, state strengthening and nation-building, the rise of social movements and
    mass politics, the impact of Japanese colonialism on the homeland and the colonies, East Asia in the context of US-Soviet
    rivalry, and the return of the region to the center of the global economy in the postwar years. Similar to the first and
    second quarters, we will look at East Asia as an integrated region, connected by trade and cultural exchange even when
    divided into opposing blocs during the Cold War. As much as possible, we will look beyond nation-states and their policies
    to explore the underlying trends shared by the three East Asian nations, such as mass culture, imperialism, and the impact
    of the cold war.
  crosslists:
