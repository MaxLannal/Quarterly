- code: SOSC 26002
  title: 'Urban Design Studio: Reconstructing Chicago''s Lost Neighborhoods Using Machine Learning'
  units: 100
  description: This course offers a hands-on learning experience in which students will digitally recreate the "lost neighborhoods"
    of Chicago using machine learning techniques. Students will be guided through the process of turning historical Sanborn
    maps into 3D models of historic urban neighborhoods. The creation of these historic urban models will be contextualized
    through archival research at the Chicago History Museum, as well as readings and lectures designed to advance student
    understanding of urban development within the historical context of U.S. cities in the 20th century, and Chicago specifically.
    Programming experience is helpful, but not required.
