- code: SOSC 18400
  title: 'Democracy: Equality, Liberty, and the Dilemmas of Self-Government I'
  units: 100
  description: The first quarter of the Democracy sequence examines the establishment, maintenance, and demise of pre-modern
    popular governments, specifically Athenian democracy, the Roman Republic, and the medieval/Renaissance Florentine commune.
    Through close textual reading, conceptual and institutional analysis, and historical inquiry, students explore the stability,
    security, and constitutional forms of such regimes, and the place of liberty, equality, and justice within them (relative
    to other regime types such as monarchies and oligarchies). When engaging the question of how democracies decline and die,
    students consider factors such as civic corruption, oligarchic encroachment, and imperial overreach. Students read and
    discuss both primary texts from these regimes and social scientific analyses of them.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - social_sciences
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 18400. Democracy: Equality, Liberty, and the Dilemmas of Self-Government I. 100 Units.'
- code: SOSC 18500
  title: 'Democracy: Equality, Liberty, and the Dilemmas of Self-Government II'
  units: 100
  description: The second quarter of the Democracy sequence is devoted to the historical understanding of the emergence and
    fragility of democracy, probing sources of change and continuity-revolutionary rupture, constitutional stabilization,
    and counter-revolutionary reaction. The course has a number of overarching goals. First, students discover the diverse
    advantages offered by varied modes of inquiry in the social sciences as practiced by historians, sociologists, political
    scientists and economists, and theorists of all stripes. Second, students engage with texts to uncover multiple layers
    of analysis. In addition to reading works of philosophy and theory that augment texts assigned in the first term, students
    also examine political manifestos, constitutions, correspondence, speeches, essays, broadsides, and the like. Third, students
    develop intellectual habits and skills that are essential to independent inquiry, moving beyond the debates of the seminar
    room to pursue a guided encounter with library research.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - social_sciences
  prereq: SOSC 18400
  prereq_text: SOSC 18400
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 18500. Democracy: Equality, Liberty, and the Dilemmas of Self-Government II. 100 Units.'
- code: SOSC 18600
  title: 'Democracy: Equality, Liberty, and the Dilemmas of Self-Government III'
  units: 100
  description: The final quarter of the Democracy sequence grapples with the possibilities of, and challenges to, democratic
    government in the twentieth and twenty-first centuries. Faced with the bleak panorama of contemporary democratic erosion
    and breakdown, what can we learn from twentieth-century debates about democracy? When democracy has come under threat
    before, what ideas have emerged, from its detractors and from its defenders? This course offers a window into those debates.
    Students learn how political theorists, some of them also political participants, have responded to fascism, authoritarianism,
    and racial oppression, from the inter-war years through the middle decades of the last century. At the end of the course,
    students explore ideas about our current crises. Readings and written assignments sustain the concern for close textual
    analysis and historical inquiry established earlier in the sequence, but also highlight systematic attention to the uses
    of comparison, both over time and across nations.
  notes: These courses must be taken in sequence. Students registered in this sequence must attend the first and second class
    sessions or their registration will be dropped.
  core_tags:
  - social_sciences
  prereq: SOSC 18500
  prereq_text: SOSC 18500
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: 'SOSC 18600. Democracy: Equality, Liberty, and the Dilemmas of Self-Government III. 100 Units.'
- code: SOSC 19073
  title: Jewish Civilization in Vienna I
  units: 100
  description: 'Designed in relation to the following two segments of a three-part sequence, this course has two main goals:
    1) to provide an introduction to Central European Jewish History from the mid-19th century to the present; and, 2) to
    give you a sense of Jewish Vienna in the same time period. The course is chronological in organization, but each class
    also focuses on a different theme - the place of politics, migration, culture, and commerce in the transformation of Jewish
    life in Vienna and Central Europe more generally. Since the latter two segments focus on literature and thought, we will
    focus here on social, political, and cultural history, with a particular emphasis on: migration and settlement patterns;
    the built environment; Jews at-home and not-at-home (in all senses) in Vienna; and, commemorative practices. Taking advantage
    of being in Vienna, this course makes full use of the city. Three class sessions will be held outside the classroom and
    there will be two day-long field trips. You will also have an assignment that can, if you so choose, take you into the
    city.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 19073. Jewish Civilization in Vienna I. 100 Units.
- code: SOSC 19074
  title: Jewish Civilization in Vienna II
  units: 100
  description: In this section of the class we will focus on the role of Jewish thought in a city that represented both the
    hope and possibility of modernity as a site of liberation for Jews and as a place of profound disappointment and despair
    over the failure of that project. We will begin by considering the religious, often Hasidic roots, of the community of
    Galician Jews who would make up Vienna's Jewish population. We will turn then to philosophy, political theory and psychoanalysis
    as three discourses in which modern Jewish thinkers made their mark, reading Mendelsson, Freud, Herzl and Kelsen, and
    then in the final section of the class will treat the reconstruction of Jewish memory in light of the destruction of European
    Jewry in the Holocaust, pairing an examination of memory studies with the representation of Judaism and the Shoah in Viennese
    museums and at its historical sites.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 19074. Jewish Civilization in Vienna II. 100 Units.
- code: SOSC 19075
  title: Jewish Civilization in Vienna III
  units: 100
  description: Building on the two previous units, this section focuses on the arts - especially literature - created by Jews
    in East and Central Europe from the turn of the century, through the interwar period, and into the postwar period. We
    will ask how Jewish poets, novelists, theater practitioners and visual artists responded to the social, political, and
    intellectual developments you learned about in the previous two sections. We will think about the relation between the
    urban centers (Vienna, Berlin, Warsaw, Odessa) and their peripheries, and about the journey to the city as a modernist
    trope. We will pay close attention to the dynamics between the different languages in which Jews wrote - German, Yiddish,
    Hebrew, Polish, Russian - asking how Jewish authors made language choices and what these choices meant. In addition to
    rounding out your understanding of Jewish cultural history, the purpose of this unit is to think about how art and literature
    slows us down, creating spaces for thinking and reflection. We will be circling back to some of the figures you've already
    encountered and re-visit some of the sites you've already been to, trying see them in a new light, through the prism of
    artistic practice. In accordance with that, you will have the option of submitting creative writing or other artistic
    work for some of your assignments.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 19075. Jewish Civilization in Vienna III. 100 Units.
- code: SOSC 19076
  title: Migration, Decolonization, and Diaspora Civilization-I
  units: 100
  description: This sequence is designed to give students the historical context for understanding contemporary debates on
    postcolonial immigration and multiculturalism as well conceptual frameworks for analyzing issues of race, otherness, and
    the legacies of the colonial encounter-in France and elsewhere. We will explore the histories, definitions, and connotations
    of "Frenchness," as well as consider how colonized peoples have helped to create those meanings. However, this course
    will not simply treat the inhabitants of former French colonies as a window onto France. We will also investigate how
    various colonized peoples directed, shaped and contributed to the worlds in which they lived, and how they actively made
    and maintained relations with other peoples, such as the French. Those processes and interchanges, as we will learn, often
    produced unintended consequences, with which both the inhabitants of France and the inhabitants of the former French empire
    continue to grapple today. Our goal is for students to emerge from the class with a better understanding of the legacies
    of French imperialism, and of the history and theories that animate contemporary debates on multicultural France. Students
    will have an opportunity to learn about Paris beyond its standard hallmarks-the museums and sites that are the mainstay
    of typical tourist guides-to explore the ways in which France's former empire and its peoples has made and remade the
    city.
  core_tags:
  - civilization
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/socialsciences/
    quote: SOSC 19076. Migration, Decolonization, and Diaspora Civilization-I. 100 Units.
