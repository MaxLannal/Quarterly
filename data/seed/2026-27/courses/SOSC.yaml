- code: SOSC 18100
  title: Topics in Behavioral and Social Sciences Relevant to Medicine
  units: 100
  description: This course will survey key topics in behavioral and social sciences relevant to training in and practice of
    medicine. Among the topics addressed will be sensation and perception, cognition, social psychology, and the biological
    bases of behavior, as well as communications theory, institutional organization, sociology of health choices and outcomes,
    statistical reasoning, and research design. Grades will be based on a combination of exams and quizzes. There are no prerequisites
    for this course. It will not count toward major or minor credit in any College program with the exception of the Health
    and Society minor.
  notes: This course is most appropriate for second- and third-year students, preparing for the MCAT.
  crosslists:
