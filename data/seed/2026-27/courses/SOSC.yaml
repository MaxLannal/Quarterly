- code: SOSC 14200
  title: Mind II
  units: 100
  description: This quarter focuses on how we can explain the causes of mental phenomena that are at once manifest in biological
    materials and determined by social and cultural forces. We examine theoretical explanations for a wide range of mental
    and behavioral phenomena based on mechanisms that operate at different levels of scientific analysis, including genetic,
    hormonal, neural, psychological, social, and cultural. The goal is to illustrate how explaining phenomena at different
    levels of analysis not only provides a richer, more detailed understanding of mental states and processes but can constrain
    causal models and lead to theoretical advances. Lectures cross-cut topics such as function and mechanism, reductionism
    and emergence, dynamic processes, genetics and epigenetics, distributed vs. localized neural representation, neuroendocrine
    systems, cognitive process models, modularity of processing, and socio-cultural interactions.
