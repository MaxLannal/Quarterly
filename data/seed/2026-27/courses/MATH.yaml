    quote: MATH 23500. Markov Chains, Martingales, and Brownian Motion. 100 Units.
- code: MATH 23700
  title: Introduction to Modelling
  units: 100
  description: This class focuses on applications of mathematics to disciplines such as biology, chemistry, economics, engineering,
    and physics. The particular collection of areas discussed may vary from year to year. The emphasis is on the modeling
    process which includes observing real-world phenomena, constructing mathematical models, analyzing the mathematical model,
    using these results to shed light on the phenomena, and then revisiting the phenomena to see how the model might be modified
    for improvements.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
    - all:
      - MATH 18300
      - MATH 18400
      - MATH 18500
      - MATH 18600
  prereq_text: MATH 20500 or MATH 20510 or MATH 20520 or MATH 20900 or MATH 18300-18400-18500-18600
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 23700. Introduction to Modelling. 100 Units.
- code: MATH 23900
  title: Topics in Analysis
  units: 100
  description: 'This course introduces undergraduate students who have already completed the standard analysis sequence to
    more advanced topics in analysis. Topics will vary. Possible topics include, among many others: Fourier series and Fourier
    transforms, wavelets, uncertainty principle; Hausdorff measure and dimension, fractal geometry; harmonic functions and
    their properties, Brownian motion; geometry of Banach spaces; descriptive set theory.'
  prereq:
    any:
    - MATH 20900
    - consent: instructor
  prereq_text: MATH 20900 or Consent
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 23900. Topics in Analysis. 100 Units.
  needs_review: true
- code: MATH 24200
  title: Algebraic Number Theory
  units: 100
  description: The goal of this course is to develop the foundational results of algebraic number theory. Core topics include
    the arithmetic of number fields, prime decomposition and unique factorization of ideals in rings of integers, Dirichlet's
    unit theorem, and the finiteness of the ideal class group.
  prereq:
    any:
    - MATH 25500
    - MATH 25800
  prereq_text: MATH 25500 or 25800
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 24200. Algebraic Number Theory. 100 Units.
- code: MATH 24400
  title: Introduction to Algebraic Geometry
  units: 100
  description: 'This is a first course in algebraic geometry. Topics include: affine and projective varieties; coordinate
    rings; the Zariski topology; Nullstellensatz; Hilbert basis Theorem; the dictionary between algebraic geometry and commutative
    algebra; rational functions and morphisms; smoothness; theory of dimension; Other possible topics might include: the classification
    of plane cubics; elliptic curves; 27 lines on a cubic surface; introduction to the theory of curves (degree, divisors,
    Bezout''s Theorem, etc.). Besides the formal prerequisites, MATH 27000 and MATH 26200 are strongly recommended as preparation.'
  prereq:
    all:
