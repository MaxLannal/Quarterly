- code: MATH 31200
  title: Analysis I
  units: 100
  description: 'Topics include: Lebesgue integration, Lp spaces and Banach spaces, differentiation theory, Hilbert spaces
    and Fourier series, Fourier transform, probability spaces and random variables, strong law of large numbers, central limit
    theorem, conditional expectation and martingales, Brownian motion.'
  prereq:
    all:
    - MATH 26200
    - MATH 27000
    - MATH 27200
    - MATH 27400
    - consent: director of undergraduate studies
  prereq_text: MATH 26200, 27000, 27200, and 27400; and consent of director or co-director of undergraduate studies
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31200. Analysis I. 100 Units.
- code: MATH 31300
  title: Analysis II
  units: 100
  description: 'Topics include: Hilbert spaces, projections, bounded and compact operators, spectral theorem for compact selfadjoint
    operators, unbounded selfadjoint operators, Cayley transform, Banach spaces, Schauder bases, Hahn-Banach theorem and its
    geometric meaning, uniform boundedness principle, open mapping theorem, Frechet spaces, applications to elliptic partial
    differential equations, Fredholm alternative.'
  prereq: MATH 31200
  prereq_text: MATH 31200
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31300. Analysis II. 100 Units.
- code: MATH 31400
  title: Analysis III
  units: 100
  description: 'Topics include: Basic complex analysis, Cauchy theorem in the homological formulation, residues, meromorphic
    functions, Mittag-Leffler theorem, Gamma and Zeta functions, analytic continuation, mondromy theorem, the concept of a
    Riemann surface, meromorphic differentials, divisors, Riemann-Roch theorem, compact Riemann surfaces, uniformization theorem,
    Green functions, hyperbolic surfaces, covering spaces, quotients.'
  prereq: MATH 31300
  prereq_text: MATH 31300
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31400. Analysis III. 100 Units.
- code: MATH 31700
  title: Topology and Geometry I
  units: 100
  description: 'Topics include: Fundamental group, covering space theory and Van Kampen''s theorem (with a discussion of free
    and amalgamated products of groups), homology theory (singular, simplicial, cellular), cohomology theory, Mayer-Vietoris,
    cup products, Poincare Duality, Lefschetz fixed-point theorem, some homological algebra (including the Kunneth and universal
    coefficient theorems), higher homotopy groups, Whitehead''s theorem, exact sequence of a fibration, obstruction theory,
    Hurewicz isomorphism theorem.'
  prereq:
    all:
    - MATH 26200
    - MATH 27000
    - MATH 27200
    - MATH 27400
    - consent: director of undergraduate studies
  prereq_text: MATH 26200, 27000, 27200, and 27400; and consent of director or co-director of undergraduate studies
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31700. Topology and Geometry I. 100 Units.
- code: MATH 31800
  title: Topology and Geometry II
  units: 100
  description: 'Topics include: Definition of manifolds, tangent and cotangent bundles, vector bundles. Inverse and implicit
    function theorems. Sard''s theorem and the Whitney embedding theorem. Degree of maps. Vector fields and flows, transversality,
    and intersection theory. Frobenius'' theorem, differential forms and the associated formalism of pullback, wedge product,
    integration, etc. Cohomology via differential forms, and the de Rham theorem. Further topics may include: compact Lie
    groups and their representations, Morse theory, cobordism, and differentiable structures on the sphere.'
  prereq: MATH 31700
  prereq_text: MATH 31700
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31800. Topology and Geometry II. 100 Units.
- code: MATH 31900
  title: Topology and Geometry III
  units: 100
  description: 'Topics include: Riemannian metrics, connections and curvature on vector bundles, the Levi-Civita connection,
    and the multiple interpretations of curvature. Geodesics and the associated variational formalism (formulas for the 1st
    and 2nd variation of length), the exponential map, completeness, and the influence of curvature on the topological structure
    of a manifold (positive versus negative curvature). Lie groups. The Chern-Weil description of characteristic classes,
    the Gauss-Bonnet theorem, and possibly the Hodge Theorem.'
  prereq: MATH 31800
  prereq_text: MATH 31800
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 31900. Topology and Geometry III. 100 Units.
- code: MATH 32500
  title: Algebra I
  units: 100
  description: 'Topics include: Representation theory of finite groups, including symmetric groups and finite groups of Lie
    type; group rings; Schur functors; induced representations and Frobenius reciprocity; representation theory of Lie groups
    and Lie algebras, highest weight theory, Schur-Weyl duality; applications of representation theory in various parts of
    mathematics.'
  prereq:
    all:
    - MATH 25700
    - MATH 25800
    - MATH 25900
    - consent: director of undergraduate studies
  prereq_text: MATH 25700-25800-25900, and consent of director or co-director of undergraduate studies
  terms_offered:
  - AU
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 32500. Algebra I. 100 Units.
- code: MATH 32600
  title: Algebra II
  units: 100
  description: 'This course will explain the dictionary between commutative algebra and algebraic geometry. Topics will include
    the following. Commutative ring theory; Noetherian property; Hilbert Basis Theorem; localization and local rings; etc.
    Algebraic geometry: affine and projective varieties, ring of regular functions, local rings at points, function fields,
    dimension theory, curves, higher-dimensional varieties.'
  prereq: MATH 32500
  prereq_text: MATH 32500
  terms_offered:
  - WI
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 32600. Algebra II. 100 Units.
- code: MATH 32700
  title: Algebra III
  units: 100
  description: 'According to the inclinations of the instructor, this course may cover: algebraic number theory; homological
    algebra; further topics in algebraic geometry and/or representation theory.'
  prereq: MATH 32600
  prereq_text: MATH 32600
  terms_offered:
  - SP
  source:
    url: http://graduateannouncements.uchicago.edu/graduate/departmentofmathematics/
    quote: MATH 32700. Algebra III. 100 Units.
