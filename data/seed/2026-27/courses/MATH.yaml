      - MATH 20500
      - MATH 20510
      - MATH 20520
      - MATH 20900
    - any:
      - MATH 25500
      - MATH 25800
  prereq_text: (MATH 20500 or MATH 20510 or MATH 20520 or MATH 20900) and (MATH 25500 or MATH 25800)
  terms_offered:
