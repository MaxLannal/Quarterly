- code: MATH 11200
  title: Studies In Mathematics I
  units: 100
  description: MATH 11200 AND 11300 cover the basic conceptual foundations of mathematics by examining the ideas of number
    and symmetry. MATH 11200 addresses number theory, including a study of the rules of arithmetic, integral domains, primes
    and divisibility, congruences, and modular arithmetic. These courses emphasize the understanding of ideas and the ability
    to express them through rigorous mathematical arguments. While students may take MATH 11300 without having taken MATH
    11200, it is recommended that MATH 11200 be taken first. Either course in this sequence meets the general education requirement
    in mathematical sciences. These courses are at the level of difficulty of the MATH 13100-13200-13300 calculus sequence.
  core_tags:
