    quote: MATH 21100. Basic Numerical Analysis. 100 Units.
- code: MATH 21200
  title: Advanced Numerical Analysis
  units: 100
  description: This course covers topics similar to those of Math 21100 but at a more rigorous level. The emphasis is on proving
    all of the results. Previous knowledge of numerical analysis is not required. The course makes extensive use of the material
    developed in the analysis sequence (ending in Math 20500 or Math 20900) and provides an introduction to other areas of
    analysis such as functional analysis and operator theory.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
  prereq_text: MATH 20500 or 20510 or 20520 or 20900
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 21200. Advanced Numerical Analysis. 100 Units.
- code: MATH 23500
  title: Markov Chains, Martingales, and Brownian Motion
  units: 100
  description: 'This course discusses three of the most important types of stochastic processes: Markov chains (in both discrete
    and continuous time), martingales (the mathematical model of "fair games"), and Brownian motion (random continuous motion).
    Applications will include random walk, queueing theory, and branching processes, and may also include other areas such
    as optimal stopping or stochastic integration.'
  prereq:
    any:
    - STAT 25100
    - STAT 25150
    - STAT 24400
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
  prereq_text: STAT 25100 or STAT 25150 or STAT 24400 or MATH 20500 or MATH 20510 or MATH 20520 or MATH 20900
  terms_offered:
  - AU
  - SP
  source:
