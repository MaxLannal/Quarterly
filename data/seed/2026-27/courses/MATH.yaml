- code: MATH 20900
  title: Honors Analysis in Rn III
  units: 100
  description: This is the third course in a highly theoretical sequence in analysis. Topics include the real number system,
    metric spaces, basic functional analysis, and the Lebesgue integral.
  prereq: MATH 20800
