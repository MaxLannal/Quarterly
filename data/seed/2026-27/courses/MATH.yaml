- code: MATH 25900
  title: Honors Basic Algebra III
  units: 100
  description: Topics in this course include basic field theory, the structure of p-adic fields, and Galois theory.
  prereq: MATH 25800
  prereq_text: MATH 25800
  terms_offered:
