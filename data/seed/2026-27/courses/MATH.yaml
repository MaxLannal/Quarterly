  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28000. Introduction to Formal Languages. 100 Units.
- code: MATH 28100
  title: Introduction to Complexity Theory
  units: 100
  description: 'Computability: Turing machines, Universal Turing machines and the Church-Turing thesis. Undecidability. Reducibilities.
    Complexity--the study of the amount of resources -- time, space, communication, randomness, etc -- needed in computations:
    Time and space complexity classes, nondeterministic and probabilistic computations. Complete problems. Lower bounds, and
    the big open problems: P vs NP, space vs. time, etc. Communication Complexity.'
  crosslists:
  - CMSC 28100
  prereq:
    any:
    - CMSC 27200
    - CMSC 27230
    - CMSC 37000
    - MATH 15900
    - MATH 15910
    - MATH 16300
    - MATH 16310
    - MATH 19900
    - MATH 25500
  prereq_text: CMSC 27200 or CMSC 27230 or CMSC 37000, or MATH 15900 or MATH 15910 or MATH 16300 or MATH 16310 or MATH 19900
    or MATH 25500; experience with mathematical proofs.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28100. Introduction to Complexity Theory. 100 Units.
  needs_review: true
- code: MATH 28130
  title: Honors Discrete Mathematics
  units: 100
  description: We emphasize mathematical discovery and rigorous proof, which are illustrated on a refreshing variety of accessible
    and useful topics. Basic counting is a recurring theme. Further topics include proof by induction; number theory, congruences,
    and Fermat's little theorem; relations; factorials, binomial coefficients and advanced counting; combinatorial probability;
    random variables, expected value, and variance; graph theory and trees. Time permitting, material on recurrences, asymptotic
    equality, rates of growth and Markov chains may be included as well. The honors version of Discrete Mathematics covers
    topics at a deeper level.
  crosslists:
  - CMSC 27130
  prereq:
    any:
    - any:
      - CMSC 14200
      - CMSC 15200
      - CMSC 16200
      - CMSC 12200
    - any:
      - MATH 15910
      - MATH 16300
      - MATH 16310
      - MATH 19900
      - MATH 20300
      - MATH 20310
      - MATH 20400
      - MATH 20410
      - MATH 20700
      - MATH 25400
      - MATH 25500
      - MATH 25700
  prereq_text: (CMSC 14200 or CMSC 15200 or CMSC 16200 or CMSC 12200) or (MATH 15910 or MATH 16300 or MATH 16310 or MATH 19900
    or MATH 20300 or MATH 20310 or MATH 20400 or MATH 20410 or MATH 20700 or MATH 25400 or MATH 25500 or MATH 25700)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28130. Honors Discrete Mathematics. 100 Units.
- code: MATH 28230
  title: Honors Theory of Algorithms
  units: 100
  description: This course covers design and analysis of efficient algorithms, with emphasis on ideas rather than on implementation.
    Algorithmic questions include sorting and searching, discrete optimization, algorithmic graph theory, algorithmic number
    theory, and cryptography. Design techniques include divide-and-conquer methods, dynamic programming, greedy algorithms,
    and graph search, as well as the design of efficient data structures. Methods of algorithm analysis include asymptotic
    notation, evaluation of recurrent inequalities, the concepts of polynomial-time algorithms, and NP-completeness. The honors
    version of Theory of Algorithms covers topics at a deeper level.
  crosslists:
  - CMSC 27230
  prereq:
    any:
    - CMSC 27100
    - CMSC 27130
    - CMSC 37110
    - consent: instructor
  prereq_text: CMSC 27100 or CMSC 27130 or CMSC 37110 or consent of the instructor.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28230. Honors Theory of Algorithms. 100 Units.
- code: MATH 28330
  title: Honors Introduction to Complexity Theory
  units: 100
  description: Computability topics are discussed (e.g., the s-m-n theorem and the recursion theorem, resource-bounded computation).
    This course introduces complexity theory. Relationships between space and time, determinism and non-determinism, NP-completeness,
    and the P versus NP question are investigated.
  crosslists:
  - CMSC 28130
  prereq:
    any:
    - CMSC 27100
    - CMSC 27130
    - MATH 15900
    - MATH 19900
    - MATH 25500
  prereq_text: CMSC 27100 or CMSC 27130, or MATH 15900 or MATH 19900 or MATH 25500; experience with mathematical proofs.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28330. Honors Introduction to Complexity Theory. 100 Units.
  needs_review: true
- code: MATH 28410
  title: Honors Combinatorics
  units: 100
  description: Methods of enumeration, construction, and proof of existence of discrete structures are discussed in conjunction
    with the basic concepts of probability theory over a finite sample space. Enumeration techniques are applied to the calculation
    of probabilities, and, conversely, probabilistic arguments are used in the analysis of combinatorial structures. Other
    topics include basic counting, linear recurrences, generating functions, Latin squares, finite projective planes, graph
    theory, Ramsey theory, coloring graphs and set systems, random variables, independence, expected value, standard deviation,
    and Chebyshev's and Chernoff's inequalities.
  notes: This course is offered in alternate years.
  crosslists:
  - CMSC 27410
  prereq:
    any:
    - MATH 19900
    - MATH 15900
    - MATH 25400
    - MATH 25700
    - CMSC 27100
    - CMSC 27130
    - CMSC 37110
  prereq_text: MATH 19900 or MATH 15900 or MATH 25400 or MATH 25700, or CMSC 27100 or CMSC 27130 or CMSC 37110. Experience
    with mathematical proofs.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 28410. Honors Combinatorics. 100 Units.
  needs_review: true
- code: MATH 28530
  title: Honors Graph Theory
  units: 100
  description: This course covers the basics of the theory of finite graphs. Topics include shortest paths, spanning trees,
    counting techniques, matchings, Hamiltonian cycles, chromatic number, extremal graph theory, Turan's theorem, planarity,
    Menger's theorem, the max-flow/min-cut theorem, Ramsey theory, directed graphs, strongly connected components, directly
    acyclic graphs, and tournaments. Techniques studied include the probabilistic method, but no prior knowledge of probability
    theory is assumed. If time permits, at the end of the course we shall also discuss applications of linear algebra. For
    that section, familiarity with the basics of linear algebra will be assumed.
  crosslists:
