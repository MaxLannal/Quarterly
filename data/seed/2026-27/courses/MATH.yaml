    quote: MATH 25400. Basic Algebra I. 100 Units.
- code: MATH 25500
  title: Basic Algebra II
  units: 100
  description: This course covers rings and ideals, PIDs, Euclidean domains, UFDs, fields and field extensions, modules and
    canonical forms of matrices, quadratic forms, and multilinear algebra.
  prereq:
