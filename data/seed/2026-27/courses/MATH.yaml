    any:
    - CMSC 27100
    - CMSC 27130
    - CMSC 37110
    - MATH 20400
    - MATH 20800
  prereq_text: CMSC 27100, CMSC 27130, or CMSC 37110, or MATH 20400 or MATH 20800.
  source:
