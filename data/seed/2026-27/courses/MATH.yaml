- code: MATH 21100
  title: Basic Numerical Analysis
  units: 100
  description: This course covers direct and iterative methods of solution of linear algebraic equations and eigenvalue problems.
    Topics include numerical differentiation and quadrature for functions of a single variable, approximation by polynomials
    and piece-wise polynomial functions, approximate solution of ordinary differential equations, and solution of nonlinear
    equations.
  prereq:
    any:
    - MATH 18400
    - MATH 20000
    - MATH 20250
    - MATH 20400
    - MATH 20410
    - MATH 20420
  prereq_text: MATH 18400 or 20000 or 20250 or 20400 or 20410 or 20420
  terms_offered:
  - SP
