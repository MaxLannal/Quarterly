    quote: MATH 25900. Honors Basic Algebra III. 100 Units.
- code: MATH 26200
  title: Point-Set Topology
  units: 100
  description: After an introduction to abstract topology and some fundamental constructions and concepts (product topologies,
    order topologies, compactness, connectivity, separation axioms) in this course some of the core theorems of the subject
    are proved, including Tychonoff's theorem, the Tietze extension lemma, and the Urysohn metrization theorem. As time allows,
    more advanced topics will be discussed, such as the Alexandroff-Hausdorff theorem, the Hahn-Mazurkiewicz theorem, function
    spaces and Arzela-Ascoli.
  prereq:
    all:
    - any:
      - MATH 20300
      - MATH 20310
      - MATH 20320
      - MATH 20700
    - any:
      - concurrent: MATH 25400
      - concurrent: MATH 25700
  prereq_text: (MATH 20300 or 20310 or 20320 or 20700) and (MATH 25400 or 25700). MATH 25400/25700 may be taken concurrently.
  terms_offered:
  - AU
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 26200. Point-Set Topology. 100 Units.
- code: MATH 26300
  title: Introduction to Algebraic Topology
  units: 100
  description: This course is about the use of algebraic methods in topology and is focused on homotopy theory. Topics include
    the fundamental group, degree of maps, and homology. Applications include the fundamental theorem of algebra, the Brouwer
    fixed point theorem, the Borsuk-Ulam theorem, and dimension. If there is time, we will also introduce higher homotopy
    and cohomology.
  prereq: MATH 26200
  prereq_text: MATH 26200
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 26300. Introduction to Algebraic Topology. 100 Units.
- code: MATH 26500
  title: Introduction to Riemannian Geometry
  units: 100
  description: The course begins with the study of curves and surfaces in three-dimensional space. After a basic introduction,
    the relationship between the intrinsic and extrinsic geometry of curves and surfaces is discussed, including the second
    fundamental form and curvature, geodesics and parallel transport, Gauss's Theorema Egregium and the Gauss-Codazzi equations,
    culminating in the Gauss-Bonnet Theorem and some applications.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
  prereq_text: MATH 20500 or 20510 or 20520 or 20900
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 26500. Introduction to Riemannian Geometry. 100 Units.
- code: MATH 26700
  title: Introduction to Representation Theory of Finite Groups
  units: 100
  description: 'This course is an introduction to the representation theory of finite and compact groups. The basic topics
    covered include irreducible representations, Schur''s Lemma, character theory, induced representations and Frobenius Reciprocity.
    Additional topics may include special topics in, and applications of, representation theory, such as: Burnside''s p^aq^b
    theorem, random walks on groups (applications of Fourier analysis on finite groups), representations of symmetric groups
    and Young tableaux, and representation theory of compact groups, concentrating on SU(2).'
  prereq:
    any:
    - MATH 25800
    - MATH 25500
  prereq_text: MATH 25800 or 25500
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 26700. Introduction to Representation Theory of Finite Groups. 100 Units.
- code: MATH 27000
  title: Basic Complex Variables
  units: 100
  description: Topics include complex numbers, elementary functions of a complex variable, complex integration, power series,
    residues, conformal mapping, the Fundamental Theorem of Algebra, applications of the residue theorem to the evaluation
    of various integrals and series, analysis of isolated singularities, and Laurent series.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
  prereq_text: MATH 20500 or 20510 or 20520 or 20900
  terms_offered:
  - AU
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27000. Basic Complex Variables. 100 Units.
- code: MATH 27100
  title: Measure and Integration
  units: 100
  description: In this course, we construct Lebesgue measure, measurable sets, and functions. Topics include the Lebesgue
    integral, convergence theorems, the relationship between Lebesgue and Riemann integrals, the Lp spaces, completeness,
    and duality. Time permitting, we explore other related topics, such as examples of measures other than Lebesgue measure.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
  prereq_text: MATH 20500 or MATH 20510 or MATH 20520
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27100. Measure and Integration. 100 Units.
- code: MATH 27200
  title: Basic Functional Analysis
  units: 100
  description: 'We review metric spaces and define normed spaces and inner product spaces. Topics include Banach spaces, bounded
    linear operators, and the three basic principles of functional analysis: the closed graph theorem, the open mapping theorem
    and the uniform boundedness principle. We examine duality and weak topologies, weak and weak-star compactness, Hilbert
    spaces, orthogonal expansions, and compact operators. Time permitting, we cover the spectral theorem and applications.'
  prereq:
    any:
    - MATH 27100
    - MATH 20900
  prereq_text: MATH 27100 or MATH 20900
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27200. Basic Functional Analysis. 100 Units.
- code: MATH 27300
  title: Basic Theory of Ordinary Differential Equations
  units: 100
  description: This course is an introduction to the theory of ordinary differential equations in Euclidean space. Topics
    include first-order equations of one variable, separation of variables, solving higher order systems via reduction of
    order, linear constant coefficient ordinary differential equations, real Jordan normal form and the matrix exponential,
    variation of parameters, gradient and Hamiltonian vector fields, existence and uniqueness of solutions for Lipschitz vector
    fields, local analysis near equilibria, stability of solutions, comparison methods.
  prereq:
    any:
    - MATH 20500
    - MATH 20510
    - MATH 20520
    - MATH 20900
  prereq_text: MATH 20500 or MATH 20510 or MATH 20520 or MATH 20900
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27300. Basic Theory of Ordinary Differential Equations. 100 Units.
- code: MATH 27400
  title: Introduction to Differentiable Manifolds and Integration on Manifolds
  units: 100
  description: 'Topics include manifolds and smooth maps, Sard''s theorem, transversality and intersection theory, vector
    fields, and the classical theorems: Lefschetz fixed-point theorem, Poincaré-Hopf theorem, Hopf degree theorem. Other topics
    include integration on manifolds, Stokes Theorem, and de Rham cohomology.'
  prereq:
    all:
    - MATH 26200
    - any:
      - MATH 20500
      - MATH 20510
      - MATH 20520
      - MATH 20900
  prereq_text: MATH 26200 and (MATH 20500 or MATH 20510 or MATH 20520 or MATH 20900)
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27400. Introduction to Differentiable Manifolds and Integration on Manifolds. 100 Units.
- code: MATH 27500
  title: Basic Theory of Partial Differential Equations
  units: 100
  description: 'This course covers the analysis of the four fundamental partial differential equations: the transport equation,
    Laplace equation, heat equation, and wave equation. Some explicit formulas are given, but the emphasis is on proving theorems
    about the solutions of the equations. Topics include Fourier series, energy methods, maximum principle, Liouville theorems,
    the method of characteristics, and various a priori estimates.'
  prereq:
    all:
    - MATH 27000
    - MATH 27300
  prereq_text: MATH 27000 and MATH 27300
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27500. Basic Theory of Partial Differential Equations. 100 Units.
- code: MATH 27600
  title: Dynamical Systems
  units: 100
  description: This course gives an introduction to concepts and examples in the study of dynamical systems. The key notions
    of recurrence, classification, stability, entropy and chaos will be introduced and illustrated through model examples.
    A variety of areas of dynamics will be covered, and may include topological dynamics, symbolic dynamics, ergodic theory,
    and smooth dynamics.
  prereq:
    any:
    - MATH 20900
    - MATH 27100
  prereq_text: MATH 20900 OR MATH 27100
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27600. Dynamical Systems. 100 Units.
- code: MATH 27700
  title: Mathematical Logic I
  units: 100
  description: This course introduces mathematical logic. Topics include ordinals and cardinals, propositional and predicate
    logic, and the syntactic notion of proof versus the semantic notion of truth (e.g., soundness, completeness). We also
    discuss the Gödel completeness theorem, the compactness theorem, and applications of compactness to algebraic problems.
  crosslists:
  - CMSC 27700
  prereq:
    all:
    - any:
      - MATH 20300
      - MATH 20310
      - MATH 20320
      - MATH 20700
    - any:
      - MATH 25400
      - MATH 25700
  prereq_text: (MATH 20300 or MATH 20310 or MATH 20320 or MATH 20700) and (MATH 25400 or 25700). Algebra may be taken concurrently
    with department consent.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27700. Mathematical Logic I. 100 Units.
  needs_review: true
- code: MATH 27800
  title: Mathematical Logic II
  units: 100
  description: Topics include axiomatic set theory, decidability and undecidability in number theory, Peano arithmetic, Turing
    computability, unsolvable problems, Gödel's incompleteness theorems, and quantifier elimination.
  crosslists:
  - CMSC 27800
  prereq: MATH 27700
  prereq_text: MATH 27700 or equivalent
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
    quote: MATH 27800. Mathematical Logic II. 100 Units.
  needs_review: true
- code: MATH 28000
  title: Introduction to Formal Languages
  units: 100
  description: This course is a basic introduction to computability theory and formal languages. Topics include automata theory,
    regular languages, context-free languages, and Turing machines.
  crosslists:
  - CMSC 28000
  prereq:
    any:
    - CMSC 27100
    - CMSC 27130
    - CMSC 37110
