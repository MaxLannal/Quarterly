  title: Fundamental Mathematics I
  units: 100
  description: Students who place into this course must take it in their first year in the College. Must be taken for a quality
    grade. MATH 10500 will count only as one elective. This course does NOT meet the Core requirement in the mathematical
    sciences. This course covers basic precalculus topics with an emphasis on their use in Calculus. It is concerned with
