- code: BUSN 20900
  title: Competitive Strategy
  units: 100
  description: The course applies microeconomics (including elements of price theory, game theory, and industrial organization)
    to analyze decisions firms face in business environments. There will be specific focus on strategic decisions and the
    factors that influence firms' competitive advantages. Class time will be devoted to lectures and case discussions. Topics
    covered include sources of competitive advantage, scope of the firm, efficient performance, pricing, entry and exit, vertical
    structure, and network externalities.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20900 if BUSN 42001 Competitive Strategy taken
    previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course.'
