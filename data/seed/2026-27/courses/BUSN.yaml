  title: Financial Accounting
  units: 100
  description: This course provides an introduction to financial statements and the financial reporting process from a user's
    perspective. The focus of the course is on fundamental accounting concepts and principles. Students learn how the economic
    transactions of a firm are reported in the financial statements and related disclosures. The objective of the course is
    to provide students with basic skills necessary to read and analyze financial statements as well as to prepare students
    for more advanced financial statement analysis courses.
