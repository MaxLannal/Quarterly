    quote: BUSN 20500. Operations Management. 100 Units.
  needs_review: true
- code: BUSN 20510
  title: Managerial Decision Modeling
  units: 100
  description: This course is designed to sharpen students' analytical skills and elucidate quantitative modeling as an aid
    in managerial decision-making. The course teaches various ways to frame, set up and solve managerial questions about resource
    allocation, revenue management, finance, marketing, operations and risk analysis using Microsoft Excel, as well as various
    tools and add-ins. The course will introduce various modeling frameworks and analytical tools in optimization and simulation.
    Students in this course will become proficient in formulating relevant managerial questions in the language of optimization
    and simulation modeling, as well as in solving the resulting problems using the frameworks covered in the course and interpreting
    the results. The course involves hands-on active learning through in-class cases and examples, homework and term project
    which applies the tools and modeling frameworks learned in the course to a business problem.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20510 if BUSN 36106 Managerial Decision Modeling
