    quote: BUSN 20150. Financial Statement Analysis. 100 Units.
  needs_review: true
- code: BUSN 20160
  title: Accounting for Entrepreneurship
  units: 100
  description: This course provides the core set of tools needed to effectively provide the accounting functions for private,
    entrepreneurial companies. The course follows the life-cycle of a company that begins life as a start-up, and the course
    covers the accounting-related financial metrics that are needed by an entrepreneur. We will cover topics relevant at the
    earliest states of a business, such as setting up the initial accounting infrastructure, through to the companies exit
    to a strategic buyer, a private equity firm or an IPO.
  prereq_text: 'This course is not open to MBA students. Booth Book Fee may be assessed. Cannot enroll in BUSN 20160 if BUSN
    30121 Accounting for Entrepreneurship: From Start-Up through IPO taken previously. Refer to FAQ webpage for registration
    and schedule details: https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into
    this course.'
  source:
