- code: BUSN 20600
  title: Marketing Management
  units: 100
  description: 'The objective of the course is to provide an intro to marketing strategy. The course develops a common framework
    (3Cs/4Ps) to analyze real world problems presented in business cases and synthesize recommendations addressing strategic
    marketing issues. Numerous tools used to support the framework are also introduced. GOALS: 1. Introduce marketing strategy
    and elements of marketing analysis or business situation analysis: Customer analysis, Company analysis and Competitor
    analysis (3Cs). 2. Develop familiarity with tactical use of elements of the marketing mix - product policy, pricing, promotion
    and placement/distribution (4 Ps)-in a manner consistent with marketing analysis and strategy. 3. Integrate elements of
    the framework prescriptively into real world business situations. 4. Provide exposure to business case analysis and critical
    thinking common in case-based business classes. FORMAT: This course uses lectures to introduce concepts, and uses cases
    and business examples to illustrate them. Grading criteria includes homework assignments/case write-ups, final exam, and
    class participation that may involve student presentations or in-class exercises.'
