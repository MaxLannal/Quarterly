- code: BUSN 20101
  title: Managerial Accounting
  units: 100
  description: This course focuses on internal operations, cost analysis, and performance evaluation, as opposed to the evaluation
    of external financial statements. Its targeted audience includes students intending become management consultants, entrepreneurs,
    managers (e.g., CEOs, CFOs, COOs, and product managers), and anyone with an interest in understanding how firms (1) make
    decisions about products and services and (2) evaluate performance and control risk. Topics covered include overhead allocation,
    activity based costing, opportunity cost of excess capacity, customer profitability, capital budgeting, transfer pricing,
    performance evaluation, risk management, internal controls, and fraud. Applications cover both the manufacturing and services
    sectors.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20101 if BUSN 30001 Cost Analysis and Internal
    Controls taken previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage for registration and schedule
