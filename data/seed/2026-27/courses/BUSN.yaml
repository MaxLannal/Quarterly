- code: BUSN 20711
  title: Choosing Leadership
  units: 100
  description: 'This in-person, highly participatory course gives you a head start on your leadership journey by inviting
    you to ask critical questions many wait years to consider: What makes me a good leader? How can I improve my leadership
    skills? How can I add value by creating meaning? What is my definition of leadership? Through reflection and examining
    your own experiences, written assignments, and engaging in discussions, films, simulations, and peer coaching, you will
    explore how you lead, manage, and follow. Grounded in the core principles of social psychology, this course guides you
    in clarifying your values and skillfully applying lessons to your personal leadership practice. No prerequisites.'
  prereq_text: 'This course is not open to MBA students. Booth Book Fee may be assessed. Refer to FAQ webpage for registration
    and schedule details: https://tinyurl.com/y8wz3oge. All first year College students are restricted from enrolling into
    this course.'
  source:
