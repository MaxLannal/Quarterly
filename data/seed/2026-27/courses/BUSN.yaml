- code: BUSN 20170
  title: Tax Strategies
  units: 100
  description: 'This course provides students with a framework for thinking about tax planning. This framework has two principal
    advantages. First, it is designed to have value long after the recent and next tax law change. Second, the framework is
    portable, in that it can be applied to any set of tax laws - those of the United States or any other country. Although
    the course generally focuses on U.S. based transactions and planning examples, the underlying ideas are applicable in
    other jurisdictions. Once developed, the framework is applied to a variety of business settings. The applications integrate
    concepts from finance, economics, and accounting to achieve a more complete understanding of the role of taxes in business
    strategy. The course also includes periodic focus on the financial accounting ramifications of tax planning. Moreover,
    the course content has valuation related implications. Topics include the following: tax planning for mergers, acquisitions,
    and divestitures; taxation of structures for new businesses (e.g., C Corps, and LLCs); tax planning for financing transactions,
    including cross-border financing, executive compensation (e.g., incentive stock options); and others.'
  prereq_text: All first year college students are restricted from enrolling in this course; new transfer students ok.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20170. Tax Strategies. 100 Units.
  needs_review: true
- code: BUSN 20180
  title: Advanced Financial Analysis and Valuation for Global Firms
  units: 100
  description: The course covers advanced financial analysis and valuation for global firms. It is designed for students who
    already have a basic familiarity with corporate valuation and DCF analysis (from corporate finance class) as well as solid
    accounting knowledge. We cover financial analysis of different business models, specific situations (e.g., cyclicals,
    young growth companies, closely-held firms) as well as the analysis and valuation of foreign companies (e.g., emerging
    markets, reporting under IFRS). Capital markets have become increasingly global, providing more opportunities for corporate
    investments and M&A abroad. Evaluating these global investments, however, poses unique challenges for financial analysis
    (e.g., regarding information, accounting and governance) as well as valuation problems.
  prereq_text: Investments (BUSN 20400 or 35000), corporate finance (BUSN 20410 or 35200) and accounting (BUSN 20100 or 30000)
    all helpful background for success in this class. Cannot take BUSN 20180 if BUSN 30131 taken previously.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20180. Advanced Financial Analysis and Valuation for Global Firms. 100 Units.
  needs_review: true
- code: BUSN 20200
  title: Macroeconomics and the Business Environment
  units: 100
  description: This course is designed to introduce students to classic macroeconomic issues such as economic growth, recessions,
    unemployment, inflation, interest rates, government deficit, international capital flows, and exchange rates. The course
    will provide a unified framework to address these issues and to study the impact of different policies, such as monetary
    and fiscal policies, on the aggregate behavior of the economy. The analytical tools developed in class will be used to
    understand the recent experience of the United States and of the world economy and to discuss current policy debates.
  prereq_text: Cannot enroll in BUSN 20200 if BUSN 33050 (or 33040) taken previously.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20200. Macroeconomics and the Business Environment. 100 Units.
  needs_review: true
- code: BUSN 20230
  title: International Financial Policy
  units: 100
  description: This course will help students develop an understanding of issues in international macroeconomics that are
    important for investors and managers operating in the global marketplace. It will cover theories of the determination
    of exchange rates and interest rates, the management of foreign exchange risk, international capital flows, debt and currency
    crises, international monetary and exchange rate regimes, the roles of the international financial institutions in developing
    countries, and other characteristics of international financial markets.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20230 if BUSN 33502 International Financial
    Policy taken previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage for registration and schedule
    details: https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into this course.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20230. International Financial Policy. 100 Units.
  needs_review: true
- code: BUSN 20231
  title: Economics in a Globalized World
  units: 100
  description: 'International trade has always been economically controversial and politically contentious. This course demystifies
    some of the complex issues that surround discussions of globalization. It asks such questions as: Why do countries engage
    in trade? Are countries in competition with one another, making one a winner and another a loser, or is trade mutually
    beneficial? Who gains and who loses from international trade within a country? Should high-wage countries be worried about
    competition from low-wage countries? Is international trade the main cause of increasing U.S. wage inequality? How do
    global supply chains affect firms and workers? How is the burden of import tariffs divided in the economy? Do international
    trade agreements create jobs or destroy jobs? What is the impact of a trade war on the global economy? This course examines
    these questions and much more. There are no strict prerequisites, but I assume familiarity with concepts of microeconomics.'
  prereq_text: 'There are no strict prerequisites, but I assume familiarity with concepts of microeconomics. This course is
    not open to MBA students. Cannot enroll in BUSN 20231 if BUSN 33501 International Commercial Policy taken previously.
    Booth Book Fee may be assessed. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course.'
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20231. Economics in a Globalized World. 100 Units.
  needs_review: true
- code: BUSN 20232
  title: Central Banks, Financial Institutions and the Business Environment
  units: 100
  description: This course is about money, central banks, and financial institutions. We focus on how they affect businesses,
    how they help companies grow, and what can go wrong. One focus of the course is monetary policy. We study how modern central
    banks affect the real economy and how they can be successful. We analyze how central banks use conventional and unconventional
    monetary policy in crises, using examples from the 2008 financial crisis and the recent inflationary period. We also consider
    how households and firms react to monetary policy. A second focus is financial crises. We highlight why a well-functioning
    monetary and financial system is key to a successful economy, and how crises disrupt businesses. To evaluate whether and
    how the academic concepts matter in the real world, we read and discuss modern empirical research. A third focus is how
    companies finance themselves and why they choose banks. Key questions are why banks exist and whether banks have a special
    role in the economy. We cover fundamental economic concepts, including asymmetric information on credit markets and banks'
    instability due to liquidity transformation. A fourth focus is how central banks regulate the financial sector. We discuss
    topical questions, such as whether we should stop banks from becoming "too big to fail" and whether banks should receive
    government bailouts. The regulatory concepts that we discuss affect not only financial institutions, but also businesses
    and their customers.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20232. Central Banks, Financial Institutions and the Business Environment. 100 Units.
- code: BUSN 20330
  title: Building the New Venture
  units: 100
  description: This course is intended for students who are interested in starting new entrepreneurial businesses. It is tactical,
    hands-on, and covers the nuts and bolts of starting a company with a lesser emphasis on investing in entrepreneurial ventures.
    Students will learn how to raise seed funding, compensate for limited human and financial resources, establish brand values
    and positioning, secure a strong niche position, determine appropriate sourcing and sales channels, and develop execution
    plans in sales, marketing, product development and operations. The emphasis is managerial and entrepreneurial, essentially
    a working model for starting an enterprise. This class is executed through a combination of lectures, group assignments
    based on student's new venture ideas, case discussions, VC and entrepreneur guest lectures and panels, and ultimately
    ties together in a pitch at the end of the quarter to a panel of VC observers.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20330 if BUSN 34103 Building the New Venture
