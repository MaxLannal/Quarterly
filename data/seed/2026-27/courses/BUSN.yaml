- code: BUSN 20621
  title: Data Science for Marketing Decision-Making with AI
  units: 100
  description: 'How should a firm set prices when customers differ in their willingness to pay? Which consumers should be
    targeted with an offer or advertisement? What is the ROI of a digital ad campaign? In this course, you will learn how
    to address these and other questions in modern marketing analytics by combining big data with AI/ML methods. We will use
    AI agents to reduce the coding burden and focus instead on developing the key skills needed to apply these tools effectively:
    framing questions appropriately, evaluating the quality of the output, and using the results to guide business decisions.
    We will cover a broad range of topics, including demand modeling, customer relationship management, optimal targeting,
    and digital marketing. Throughout the course, you will work through the full pipeline of a marketing analytics project:
    processing raw data, applying statistical and machine learning methods, generating predictions, and translating those
    predictions into concrete marketing decisions. In-class presentations will help you develop the ability to communicate
    and defend the conclusions of your analyses.'
  prereq_text: 'BUSN 20600 or BUSN 37000 required prereq. Previous stats background helpful. This course is not open to MBA
    students. Cannot enroll in BUSN 20621 if BUSN 20620, 37105, or 37115 taken previously. Refer to FAQ webpage for registration
    and schedule details: https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into
    this course.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20621. Data Science for Marketing Decision-Making with AI. 100 Units.
  needs_review: true
- code: BUSN 20701
  title: Managing in Organizations
  units: 100
  description: Successfully managing other people - be they competitors or co-workers - requires an understanding of their
    thoughts, feelings, attitudes, motivations, and determinants of behavior. Developing an accurate understanding of these
    factors, however, can be difficult to achieve because intuitions are often misguided and unstructured experience can be
    a poor teacher. This course is intended to address this development by providing the scientific knowledge of human thought
    and behavior that is critical for successfully managing others, and also for successfully managing ourselves.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20701 if BUSN 38001 Managing in Organizations
    taken previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course.'
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20701. Managing in Organizations. 100 Units.
  needs_review: true
- code: BUSN 20702
  title: Managerial Decision Making
  units: 100
  description: This course is designed to make you a better decision maker. Good decision makers know how to recognize decision
    situations, then how to represent the essential structure of the situations, and how to analyze them with the formal tools
    from decision theory. But, perhaps more important, they need to be able to think effectively about the inputs into a decision
    analysis, whether to trust the analysis, and how to use the outputs to guide actions by themselves and their firms. And,
    maybe most important of all, they need to know how to make effective, unaided intuitive decisions, and to recognize the
    limits on their intuitive skills. This course will move back and forth between formal, optimal models and behavioral,
    descriptive models to help you understand and improve your native decision making abilities.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20702 if BUSN 38002 Managerial Decision Making
    taken previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course.'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20702. Managerial Decision Making. 100 Units.
  needs_review: true
- code: BUSN 20710
  title: Behavioral Economics
  units: 100
  description: Behavioral economics applies psychological insights to economic markets and decision making. In this class,
    we will discuss the recent theoretical and empirical advances that have been made in this increasingly important field
    of economics. Being thoughtful about the role of psychology can lead to a greater understanding of how the economy works.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20710 if BUSN 38120 The Study of Behavioral
