- code: BUSN 20400
  title: Investments
  units: 100
  description: 'This course offers the financial theory and quantitative tools necessary for understanding how stock, bond,
    and option prices are determined, and how financial assets are used for investment decisions. Topics covered include the
    following: the term structure of interest rates; portfolio selection based on mean-variance analysis; models of risk and
    return (including the CAPM and multifactor models); performance evaluation; market efficiency and the random walk hypothesis;
    asset pricing anomalies and behavioral finance; derivative security pricing (including options, futures, forwards, and
    swaps); and international investment. This course is not open to MBA students.'
