- code: BUSN 20920
  title: Social Entrepreneurship and Innovation
  units: 100
  description: We will study social innovation with a focus on the role of social entrepreneurship for implementing innovative
    solutions to society's problems. A team of 4 students will be assigned with an innovative idea that addresses a social
    problem and could become a (for-profit or non-profit) social venture. Students will provide their preferences for assignment
    from a list of preselected ideas. Teams will essentially develop a business idea around this innovation. To achieve this,
    students will research the relevant literature, conduct customer discovery, analyze the competitive landscape, validate
    and refine the offering, propose a business model, articulate a theory of change, and identify an impact management strategy.
    Teams will present to the idea sponsor at the end of the quarter and in a mid-quarter check-in. The hope is that there
    will be sufficient validation and interest to move forward with some of these ventures with students involved in or leading
    the venture. One path is to participate in the John Edwardson, '72, Social New Venture Challenge. Much of class time will
    be devoted to group exercises to implement frameworks to answer these questions for the projects as well as a set of case
    study examples we will use throughout the course. In addition, there will be readings and discussions on a set of topics
    to provide a broader understanding of the economics of social innovation and its relationship to more traditional innovation.
    Grading will be based weekly project
  prereq_text: 'Prerequisite(s): This course is not open to MBA students. Cannot enroll in BUSN 20920 if BUSN 34117 Social
    Entrepreneurship and Innovation taken previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage
    for registration and schedule details: https:// tinyurl.com/y8wz3oge. All first year College students are restricted from
    enrolling into this course.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20920. Social Entrepreneurship and Innovation. 100 Units.
  needs_review: true
- code: BUSN 20930
  title: Social Sector Strategy and Structure
  units: 100
  description: The social sector, which encompasses nonprofit & for-profit firms that are primarily pursuing a solution to
    social or environmental issues, is an increasingly important sector. This course provides an overview of the structures,
    strategy frameworks, and management tools employed by social sector organizations to ensure that they deliver on the impact
    they seek. In particular, the course examines those approaches that differ from managing a non-impact seeking venture.
    The same fundamental approaches to marketing, competitive analysis, etc. can be translated across contexts. Where there
    are differences, however, they are important. We will review & analyze the distinctive challenges of managing for social
    or environmental impact, as opposed to profit maximization. We will use cases & exercises to examine and unpack social
    sector management and strategy. This includes how organizations are structured from a tax-status perspective; common business
    models; management tools such as the construct of theory of change/intended impact, impact measurement, marketing to donors
    & beneficiaries; managing paid & unpaid labor; funding sources such as philanthropy & impact investing; governance; and
    scale and growth. This is a "survey course" of the management tools, strategy frameworks, and structural approaches used
    in the social sector. It is not deep dive into any of these topics, and is designed to provide any student with a working
    knowledge of managing social sector organizations.
  prereq_text: 'This course is not open to MBA students. Booth Book Fee may be assessed. Refer to FAQ webpage for registration
    and schedule details: https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into
    this course.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20930. Social Sector Strategy and Structure. 100 Units.
  needs_review: true
- code: BUSN 20940
  title: Business Ethics
  units: 100
  description: Students in this course will gain experience formulating coherent arguments about the ethics and role of business,
    by relating their own views to important ideas about business, democracy and markets. We will use this approach to consider
    a broad range of tradeoffs and controversies that business leaders often confront. The business environment creates ethical
    choices that can be hard to think through clearly. It can also subject companies to negative publicity or political pressure,
    which affects both how they are regulated and how well they attract employees, customers and partners. Business leaders
    are often called upon to make credible and persuasive arguments defending their products, their firms, their industries,
    or the capitalist or market system in which they operate. The quality and accuracy of arguments in this environment vary,
    but usually include assertions that a business or its leaders are behaving unethically or lack legitimacy. The ability
    to assess these claims, and to address them effectively when you think the facts and arguments are on your side, is a
    crucial skill, especially given the extensive influence of governments, pressure groups and the media. This course requires
    students to consider how their views on the role and conduct of business relate to the ideas of important thinkers, and
    to apply their views to business settings by discussing controversial topics or decisions.
  prereq_text: 'Prerequisite(s): This course is not open to MBA students. Cannot enroll in BUSN 20940 if BUSN 33471Business,
    Politics, and Ethics taken previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage for registration
    and schedule details: https://tinyurl.com/y8wz3oge. All first year College students are restricted from enrolling into
    this course.'
  terms_offered:
  - SP
