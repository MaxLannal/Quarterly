    quote: BUSN 20101. Managerial Accounting. 100 Units.
  needs_review: true
- code: BUSN 20140
  title: Accounting and Financial Analysis
  units: 100
  description: Course is designed to improve students' understanding of financial information beyond an intro accounting class.
    It is designed to provide the knowledge of financial statements necessary to conduct a reasonably sophisticated financial
    statement analysis. Focus is on the use of financial statements, although this requires some understanding of the process
    by which financial statements are produced. It will benefit students who want to become investment bankers, economic consultants,
    analysts, or other jobs that requires more than a superficial understanding of financial reporting. Not limited to study
    of financial statements. Will also work with supplemental disclosures, which help the user to interpret the financial
    statements and to understand better the economic transactions that gave rise to them. Techniques employed will be useful
    for variety of purposes including (but not limited to) equity, credit, and complex deals (such as M&A) analysis. Although
    this course does not cover forecasting, valuation, or models of complex deals, a thorough understanding of financial reporting
    issues is critical to being able to use such techniques. This course especially useful as a prelude to Financial Statement
    Analysis (B20150/B30130), Advanced Financial Analysis and Valuation for Global Firms (B30131), and Deal Structuring and
    Financial Reporting Implications (B30122). Must submit answers to 5 cases based on actual financial statements. There
    are two in-person exams (Weeks 5 & 10).
  prereq_text: 'Strict PQ: BUSN 20100 (or 30000). To register for this class, students must have taken BUSN 20100 or 30000.
    NEGPQ BUSN 30116 - Students cannot enroll in this class if they have taken BUSN 30116. All first year college students
    are restricted from enrolling in this course; new transfer students ok.'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20140. Accounting and Financial Analysis. 100 Units.
  needs_review: true
- code: BUSN 20150
  title: Financial Statement Analysis
  units: 100
  description: This course teaches you how to analyze financial statements in order to develop financial statement models,
    assess credit risk, and, ultimately, value a company. The course provides both a framework and the tools necessary to
    analyze financial statements. Its primary objective is to advance your understanding of how financial reporting can be
    used in a variety of decisions (e.g., lending and investment decisions) and analyses (e.g., financial distress and bankruptcy
    prediction). It is applied in nature and stresses the use of actual financial statements. Throughout the course, I draw
    heavily on real business examples and use cases to illustrate the application of the techniques and tools. Topics include
    traditional ratio analysis techniques, accounting analysis (i.e., identifying earnings management and accounting quality
    issues), and financial risk assessment. The second part of the course focuses on equity valuation, e.g., the preparation
    of pro forma financial statements, and the use of various valuation models. While students with a multitude of interests
    will benefit from this course, students with an interest in investment banking, equity or credit analysis, consulting,
    strategy, corporate finance, or management will find this course particularly relevant.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20150 if BUSN 30130 Financial Statement Analysis
    taken previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course. Financial Accounting (BUSN 20100 or BUSN
    30000) is a strict prerequisite.'
  terms_offered:
  - SP
  source:
