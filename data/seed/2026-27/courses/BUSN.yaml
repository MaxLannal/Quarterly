- code: BUSN 20410
  title: Corporation Finance
  units: 100
  description: This course provides you with an understanding of major decisions made by corporate financial managers and
    to familiarize you with the tools used to make these decisions. The first part of the course covers methods used to value
    investment opportunities. Particular attention is given to discounted cash flow valuation, including the methods of weighted
    average cost of capital (WACC) and adjusted present value (APV). The second part of the course focuses on issues of corporate
    financial structure. The focus will be on the choice of financing through equity, debt and other types of securities and
    on payout policies through dividends. Specialized topics, such as mergers and acquisitions and corporate hedging will
    be covered as time permits.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20410 if BUSN 35200 Corporation Finance taken
    previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course. Financial Accounting (BUSN 20100 or 30000)
    required. Investments (BUSN 20400 or 35000) strongly recommended.'
