    quote: BUSN 20711. Choosing Leadership. 100 Units.
  needs_review: true
- code: BUSN 20800
  title: Big Data
  units: 100
  description: 'Big Data is a course about data mining: the analysis, exploration, and simplification of large high-dimensional
    datasets. Students will learn how to model and interpret complicated `Big Data'' and become adept at building powerful
    models for prediction and classification. Techniques covered include an advanced overview of linear and logistic regression,
    model choice and false discovery rates, multinomial and binary regression, classification, decision trees, factor models,
    clustering, the bootstrap and cross-validation. We learn both basic underlying concepts and practical computational skills,
    including techniques for analysis of distributed data. Heavy emphasis is placed on analysis of actual datasets, and on
    development of application specific methodology. Among other examples, we will consider consumer database mining, internet
    and social media tracking, network analysis, and text mining.'
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20800 if BUSN 41201 Big Data taken previously,
    and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge. All first year
    college students are restricted from enrolling into this course.'
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20800. Big Data. 100 Units.
  needs_review: true
- code: BUSN 20810
  title: Machine Learning
  units: 100
  description: Students will learn about state-of-the-art machine learning techniques and how to apply them in business related
    problems. Techniques will be introduced in the context of business applications and the emphasis will be put on how machine
    learning can be used to create value and provide insights from data. First, and the biggest, part of the class will focus
    on predictive analytics. Students will learn about decision trees, nearest neighbor classifiers, boosting, random forests,
    deep neural networks, naive Bayes and support vector machines. Among other examples, we will apply these techniques to
    detecting spam in email, click-through rate prediction in online advertisement, image classification, face recognition,
    sentiment analysis and churn prediction. Students will learn what techniques to apply and why. In the second part of the
    class, students will learn about unsupervised techniques for extracting actionable patterns from data. Examples include
    clustering, collaborative filtering, probabilistic graphical modelling and dimension reduction with applications to customer
    segmentation, recommender systems, graph and time series mining, and anomaly detection.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20810 if BUSN 41204 Machine Learning taken
    previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage for registration and schedule details:
    https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into this course.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20810. Machine Learning. 100 Units.
  needs_review: true
- code: BUSN 20820
  title: Financial Econometrics
  units: 100
  description: This course covers a variety of topics in financial econometrics. The topics covered are of real- world, practical
    interest and are closely linked to material covered in other advance finance courses. Topics covered include ARMA models,
    volatility models (GARCH), factor models, models for time varying correlations, analysis of panel data, cointegration
    models for long-run co-movement between prices and models for transactions data and the analysis of transactions cost.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20820 if BUSN 41203 Financial Econometrics
