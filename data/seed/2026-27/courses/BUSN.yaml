    quote: BUSN 20510. Managerial Decision Modeling. 100 Units.
  needs_review: true
- code: BUSN 20520
  title: Supply Chain Management
  units: 100
  description: The supply chain of a firm is critical to its performance. Supply chains are networks of organizations that
    supply and transform materials and distribute final products to consumers. If designed and managed properly, these networks
    can be a crucial source of competitive advantage for both manufacturing and service enterprises. Students will learn how
    to examine and improve the flow of materials and information through this network of suppliers, manufacturers, distributors,
    and retailers in order to match supply with demand (i.e., to get the right products to the right customers in the right
    amount and at the right time). Key topics include inter- and intra-firm coordination, incentive design, the impact of
    uncertainty, and the role of information technology. Special emphasis is given to understanding how the business context
    shapes managerial decisions regarding the strategic design and management of the supply chain.
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20520 if BUSN 40101 Supply Chain Strategy and
    Practice taken previously, and vice versa. Booth Book Fee may be assessed. Refer to FAQ webpage for registration and schedule
    details: https://tinyurl.com/y8wz3oge. All first year college students are restricted from enrolling into this course.'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: BUSN 20520. Supply Chain Management. 100 Units.
  needs_review: true
- code: BUSN 20550
  title: Application Development
  units: 100
  description: 'On the first day of this course, you''ll bring an app idea of your own and we''ll show you how to use AI to
    generate a robust, deployed version of it. It will include a web app backed by a centralized server and database; iPhone
    and Android apps; email and push notifications; user accounts and permissions; and more. The code will live in a GitHub
    repository you own, and you''ll begin iterating with an AI coding agent of your choice. But the thing is: you won''t understand
    the code you now own. That''s what the rest of the course is for. We think the best way to develop that understanding
    is to roll up your sleeves and write the code yourself, by hand, at least once. Starting from scratch, you will write
    full-stack applications, step by step; and in doing so learn how the browser, server, database, APIs, deployment, monitoring,
    and other pieces fit together. The course has two connected strands: - App: You will build and deploy full-stack, responsive,
    authenticated, database-backed web applications using Ruby on Rails. - AI: You will learn about generative AI and integrate
    chat, image and file input, structured output, and tool use into the apps we build. No prior programming experience is
    required. Core lessons cover HTML, Ruby, Postgres, AI APIs, and more. Elective lessons go deeper into native mobile apps,
    CSS, real-time updates, Python, local models, and more. You''ll finish with working software, practical experience, and
    a better sense of what you want to learn next.'
  prereq_text: 'This course is not open to MBA students. Cannot enroll in BUSN 20550 if BUSN 36110 Application Development
    taken previously, and vice versa. Refer to FAQ webpage for registration and schedule details: https://tinyurl.com/y8wz3oge.
    All first year college students are restricted from enrolling into this course. BUSN 20550 (and BUSN 36110) cannot count
    toward the standard economics major electives or the business economics specialization electives.'
