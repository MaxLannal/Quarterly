  description: 'SPAN 10300 is the third and final segment of the introductory-level course sequence in Spanish language and
    Hispanic culture. The introductory course sequence in Spanish has two main objectives: 1) to enable students to understand
    simple texts and dialogues and communicate successfully with highly proficient speakers about everyday, concrete topics;
    and 2) to build students'' transcultural competence via exposure to different aspects of Spanish-speaking cultures. Using
