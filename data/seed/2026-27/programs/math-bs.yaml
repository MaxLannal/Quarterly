# Generated from the 2026-2027 UChicago College Catalog (fetched 2026-11-12) by hand-checked scripts;
# every source.quote is copied verbatim (whitespace collapsed) from source.url. See data/seed/REVIEW.md.
id: math-bs
catalog_year: 2026-27
name: Mathematics (BS)
type: major
degree: BS
department: Mathematics
status: review
sources:
- url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
  quote: 'Four bachelor''s degrees are available in the Department of Mathematics: the BA in mathematics, the BS in mathematics,
    the BS in applied mathematics, and the BS in mathematics with specialization in economics.'
rules:
  id: math-bs
  label: Mathematics BS
  group:
    all: true
    children:
    - id: gened-phys
      label: 'General education: first-year chemistry or physics'
      select:
        count: 2
        from:
          list: math-gened-phys-sequences
      constraints:
        same_sequence: true
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
        quote: The general education sequence in the physical sciences must be selected from either first-year chemistry or
          first-year physics.
      needs_review: true
    - id: gened-calc
      label: 'General education: two-quarter calculus sequence'
      select:
        count: 2
        from:
          list: calc-two-quarter-sequences
      constraints:
        same_sequence: true
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
        quote: Completing the first two quarters of Calculus (MATH 13100-13200 or MATH 15100-15200 or MATH 16100-16200 or
          MATH 16110-16210) satisfies the general education requirement, as does completing any higher-level course, which
          then confers back credit for the first two quarters of Calculus.
    - id: chem-phys-third
      label: Third quarter of basic chemistry or physics
      slot:
        any_of:
        - CHEM 11300
        - PHYS 12300
      constraints:
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
        quote: One of these courses must complete the three-quarter sequence in basic chemistry or basic physics.
      needs_review: true
    - id: calc-third
      label: MATH 16300/16310 or MATH 15910
      slot:
        any_of:
        - MATH 16300
        - MATH 16310
        - MATH 15910
      constraints:
        min_grade: C-
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
        quote: Either MATH 16300 Honors Calculus III or MATH 16310 Honors Calculus III (IBL) as the third quarter of the calculus
          sequence or MATH 15910 Introduction to Proofs in Analysis
      needs_review: true
    - id: linear-algebra
      label: MATH 20250
      slot:
        any_of:
        - MATH 20250
      constraints:
        min_grade: C-
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/mathematics/
        quote: The linear algebra course MATH 20250 Abstract Linear Algebra
    - id: analysis
      label: Three-quarter analysis sequence
