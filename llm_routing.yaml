# The only place model ids live (CLAUDE.md hard rule). Read by packages/llm_gateway (routing.py).
# Source: docs/SPEC.md "Model routing". `effort` is from the spec where it names one, else null
# (provider default: medium on Opus 5.5 and Haiku 5.5, high on Sonnet 5.5). Prompt 07 set the
# app agents' effort explicitly. `max_tokens` values are starting defaults, not from the spec.
# Fallback: OpenRouter, after two provider errors (SPEC). OpenRouter model names need
# confirming (docs/OPEN_QUESTIONS.md). `refusal_fallback: true` asks the Anthropic API to re-run
# a request its safety classifier declines on another model (server-side "default" routing;
# Opus and Sonnet only).
version: 1
providers:
  primary: anthropic
  fallback: openrouter
  fallback_after_errors: 2

tasks:
  # Richard, 2026-11-14: Fable is overkill here; every rule is still checked by deterministic
  # code, golden plans and human review. The second run uses a different model so the two runs
  # stay independent.
  e3_program_formalizer:      # E3, offline, yearly
    model: claude-opus-5-5
    effort: high
    max_tokens: 16000
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  e3b_second_opinion:         # E3b independent second run
    model: claude-sonnet-5-5
    effort: high
    max_tokens: 16000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  e2_program_enumerator:
    model: claude-opus-5-5
    effort: null
    max_tokens: 8000
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  e1_prereq_formalizer:       # prerequisite sentence -> DSL
    model: claude-haiku-5-5
    effort: null
    max_tokens: 1024
    thinking: disabled
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  e4_backtranslation_judge:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 4000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  scraper_repair:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 8000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  # Max, 2026-11-26: Opus 5.5 for the planner agent (issues #17 and #18), through Teamorouter
  # (ANTHROPIC_BASE_URL in .env). Generation writes, checks and repairs a whole plan, so its cap
  # covers adaptive thinking plus the full submit_plan call. Chat turns propose 1-3 changes.
  # Live, 2026-11-26: at 16000 the whole-plan submit_plan was cut off (stop_reason max_tokens)
  # after Opus 5.5's adaptive thinking; 32000 leaves room for both.
  a1_planner_agent:
    model: claude-opus-5-5
    effort: medium
    max_tokens: 32000
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  a1_planner_chat:
    model: claude-opus-5-5
    effort: low
    max_tokens: 6000
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  a2_scope_classifier:        # in_scope / off_topic / confirmation / suspicious
    model: claude-haiku-5-5
    effort: low
    max_tokens: 200           # prompt 13 asked for 50; live, Haiku 5.5 was cut off at 50 on 5 of
                              # 6 off-topic messages (an empty answer, then the dearer advisor ran)
    thinking: disabled
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  a3_forum_extraction:
    model: claude-haiku-5-5
    effort: null
    max_tokens: 2000
    thinking: disabled
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  a3_forum_summary:
    model: claude-sonnet-5-5
    effort: low  # a short structured answer; null would mean high on Sonnet 5.5
    max_tokens: 400            # prompt 13: summary 400
    thinking: between_tools
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a3_cold_start_estimate:
    model: claude-sonnet-5-5
    effort: low  # a short structured answer; null would mean high on Sonnet 5.5
    max_tokens: 2000
    thinking: between_tools
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a4_moderation:
    model: claude-haiku-5-5
    effort: low
    max_tokens: 100           # prompt 13: moderation 100, thinking off
    thinking: disabled
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  # Prompt 10: department offering pages -> planned offerings with verbatim quotes (E-style,
  # every item checked by code, then human review). Not in the SPEC routing table; Sonnet 5.5
  # like the other mid-difficulty ingestion tasks (docs/OPEN_QUESTIONS.md P10-3).
  dept_offerings_extraction:
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 8000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}

  # Campus companion (docs/BEST-OF-UCHICAGO-PLAN.md, 2026-11-20). Every one of these has a
  # deterministic fallback, so the features work with the AI off. (a5_campus_ask, a7_routes and
  # a10_updates_digest were removed with the Ask page, the routes and the companion, issue #15;
  # a8_feed_notes with the Feed, issue #19.)
  a6_interview:               # the dashboard agent: the General Information questions (Issue #16)
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 4000
    thinking: between_tools
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a9_commons_bot:             # the bot's answer under a Commons question (read tools, cited)
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 4000
    thinking: between_tools
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}

# List prices in USD per million tokens, for llm_call.cost_usd and the live-test budget guard.
# Checked 2026-11-16 against the Claude models overview (prompt 13): Opus 5.5 $4 / $20, cache
# reads $0.20; Sonnet 5.5 $2 / $10, cache reads $0.10; Haiku 5.5 $0.10 / $0.50 (prompts of 100K
# tokens or fewer). Cache writes 1.25x input (5-minute). The Haiku 5.5 cache-read rate is not
# published there, so it is priced at the higher candidate, the full input rate (prompt 13:
# "if a price is unclear, use the higher one"). OpenRouter names are priced like their models.
prices:
  claude-opus-5-5:            {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5:          {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5:           {input: 0.10, output: 0.50, cache_read: 0.10, cache_write: 0.125}
  anthropic/claude-opus-5.5:  {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  anthropic/claude-sonnet-5.5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  anthropic/claude-haiku-5.5: {input: 0.10, output: 0.50, cache_read: 0.10, cache_write: 0.125}
