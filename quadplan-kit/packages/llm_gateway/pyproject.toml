[project]
name = "llm-gateway"
version = "0.1.0"
description = "Provider clients, model routing (llm_routing.yaml) and cost logging"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_gateway"]
