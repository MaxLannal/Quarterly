[project]
name = "planner-core"
version = "0.1.1"
description = "Trusted core: requirements DSL, verifier V01-V12, CP-SAT model, certificate checker. No I/O."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3", "ortools>=9.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_core"]
