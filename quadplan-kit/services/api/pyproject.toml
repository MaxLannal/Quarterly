[project]
name = "quarterly-api"
version = "0.1.0"
description = "FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "planner-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "cryptography>=44",
]

[tool.uv.sources]
planner-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
