[project]
name = "quarterly-worker"
version = "0.1.0"
description = "Arq background worker"
requires-python = ">=3.12,<3.13"
dependencies = ["planner-core", "llm-gateway", "arq>=0.26", "pydantic-settings>=2.6"]

[tool.uv.sources]
planner-core = { workspace = true }
llm-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
