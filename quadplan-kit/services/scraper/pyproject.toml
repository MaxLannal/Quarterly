[project]
name = "quarterly-scraper"
version = "0.1.0"
description = "Playwright scraper (no jobs yet; schedule scraping stays off until permitted)"
requires-python = ">=3.12,<3.13"
dependencies = ["playwright>=1.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
