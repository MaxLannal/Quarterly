[project]
name = "quarterly-scraper"
version = "0.1.0"
description = "Quarterly schedule pipeline (prompt 10): Class Search scraper (off unless SCHEDULE_SCRAPER_ENABLED=true), parser, checks, department pages, self-repair"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.49",
    "pydantic-settings>=2.6",
    "planner-core",
    "llm-gateway",
    "quarterly-api",
]

[tool.uv.sources]
planner-core = { workspace = true }
llm-gateway = { workspace = true }
quarterly-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
