# The only place model ids live (CLAUDE.md hard rule). Read by packages/llm_gateway (routing.py).
# Source: docs/SPEC.md "Model routing". `effort` is from the spec where it names one, else null
# (provider default: medium on Opus 5.5 and Haiku 5.5, high on Sonnet 5.5). Prompt 07 set the
# app agents' effort explicitly. `max_tokens` values are starting defaults, not from the spec.
# Fallback: OpenRouter, after two provider errors (SPEC). OpenRouter model names need
# confirming (docs/OPEN_QUESTIONS.md). `refusal_fallback: true` asks the Anthropic API to re-run
# a request its safety classifier declines on another model (server-side "default" routing;
# Opus and Sonnet only).
version: 1
providers:
  primary: anthropic
  fallback: openrouter
  fallback_after_errors: 2

tasks:
  # Richard, 2026-11-14: Fable is overkill here; every rule is still checked by deterministic
  # code, golden plans and human review. The second run uses a different model so the two runs
  # stay independent.
  e3_program_formalizer:      # E3, offline, yearly
    model: claude-opus-5-5
    effort: high
    max_tokens: 16000
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  e3b_second_opinion:         # E3b independent second run
    model: claude-sonnet-5-5
    effort: high
    max_tokens: 16000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  e2_program_enumerator:
    model: claude-opus-5-5
    effort: null
    max_tokens: 8000
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  e1_prereq_formalizer:       # prerequisite sentence -> DSL
    model: claude-haiku-5-5
    effort: null
    max_tokens: 1024
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  e4_backtranslation_judge:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 4000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  scraper_repair:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 8000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a1_plan_generator:          # A1 steps 3 (electives) and 6 (rationale)
    model: claude-opus-5-5
    effort: medium
    max_tokens: 8000
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  a2_advisor_chat:
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 4000
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a2_advisor_chat_escalation: # whole-plan comparisons
    model: claude-opus-5-5
    effort: medium
    max_tokens: 8000
    refusal_fallback: true
    fallback: {provider: openrouter, model: anthropic/claude-opus-5.5}
  a2_scope_classifier:        # in_scope / off_topic / confirmation / suspicious
    model: claude-haiku-5-5
    effort: low
    max_tokens: 1024          # thinking stays on (adaptive); room for it plus the label
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  a3_forum_extraction:
    model: claude-haiku-5-5
    effort: null
    max_tokens: 2000
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}
  a3_forum_summary:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 1000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a3_cold_start_estimate:
    model: claude-sonnet-5-5
    effort: null
    max_tokens: 1000
    fallback: {provider: openrouter, model: anthropic/claude-sonnet-5.5}
  a4_moderation:
    model: claude-haiku-5-5
    effort: low       # thinking stays on: leave room for it plus the label
    max_tokens: 1024
    fallback: {provider: openrouter, model: anthropic/claude-haiku-5.5}

# List prices in USD per million tokens, for llm_call.cost_usd. Anthropic: SPEC "Model routing"
# and the models overview (cache reads at the published rate, cache writes 1.25x input; the
# Haiku cache-read rate is assumed 0.1x input). OpenRouter names are priced like their models.
prices:
  claude-opus-5-5:            {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5:          {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5:           {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  anthropic/claude-opus-5.5:  {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  anthropic/claude-sonnet-5.5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  anthropic/claude-haiku-5.5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
