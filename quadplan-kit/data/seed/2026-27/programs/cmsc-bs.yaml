# Generated from the 2026-2027 UChicago College Catalog (fetched 2026-11-12) by hand-checked scripts;
# every source.quote is copied verbatim (whitespace collapsed) from source.url. See data/seed/REVIEW.md.
id: cmsc-bs
catalog_year: 2026-27
name: Computer Science (BS)
type: major
degree: BS
department: Computer Science
status: review
sources:
- url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
  quote: The computer science program offers BA and BS degrees.
rules:
  id: cmsc-bs
  label: Computer Science BS
  group:
    all: true
    children:
    - id: gened-math
      label: 'General education: two-quarter calculus sequence'
      select:
        count: 2
        from:
          list: calc-two-quarter-sequences
      constraints:
        same_sequence: true
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: Both the BA and BS in computer science require the general education requirement in the mathematical sciences
          to be fulfilled by an approved two-quarter Calculus Sequence.
    - id: gened-phys
      label: 'General education: physical sciences sequence for science majors'
      select:
        count: 2
        from:
          list: core-phys-science-major-sequences
      constraints:
        same_sequence: true
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: To earn a BS in computer science, the general education requirement in the physical sciences must be satisfied
          by completing a two-quarter sequence chosen from the General Education Sequences for Science Majors.
    - id: intro
      label: Introductory Sequence
      group:
        all: true
        children:
        - id: '1'
          slot:
            any_of:
            - CMSC 14100
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: CMSC 14100
        - id: '2'
          slot:
            any_of:
            - CMSC 14200
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: CMSC 14200
        - id: '3'
          slot:
            any_of:
            - CMSC 14300
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: CMSC 14300
        - id: '4'
          slot:
            any_of:
            - CMSC 14400
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: CMSC 14400
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: 'Students who major in computer science (either BA or BS) must complete the introductory sequence:'
      needs_review: true
    - id: systems
      label: Systems Requirement
      select:
        count: 1
        from:
          list: cmsc-systems
      constraints:
        min_grade: C-
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: BS students are required to take one of the following systems programming courses.
    - id: theory
      label: Theory Requirement (A, B and C)
      group:
        all: true
        children:
        - id: theory-a
          label: Theory Area A
          slot:
            any_of:
            - CMSC 27100
            - CMSC 27130
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: Area A
          needs_review: true
        - id: theory-b
          label: Theory Area B
          slot:
            any_of:
            - CMSC 27200
            - CMSC 27230
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: Area B
        - id: theory-c
          label: Theory Area C
          select:
            count: 1
            from:
              list: cmsc-theory-c
          constraints:
            min_grade: C-
            no_pass_fail: true
          source:
            url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
            quote: Area C
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: BA students must choose two courses from the following (one course each from areas A and B). BS students must
          choose three courses from the following (one course each from areas A, B, and C).
    - id: ml
      label: Machine Learning Requirement
      slot:
        any_of:
        - CMSC 25300
        - CMSC 25400
        - TTIC 31020
      constraints:
        min_grade: C-
        no_pass_fail: true
      source:
        url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
        quote: BS students are required to take one of the following machine learning courses.
      needs_review: true
    - id: specialization
