            - id: more
              select:
                count: 2
                from:
                  codes:
                  - CMSC 23900
                  - CMSC 25300
                  - CMSC 25400
                  - STAT 37601
              constraints:
                min_grade: C-
                no_pass_fail: true
              source:
                url: http://collegecatalog.uchicago.edu/thecollege/computerscience/
