    quote: ECON 28030. Markets and Regulation. 100 Units.
  needs_review: true
- code: ECON 28040
  title: Introduction to Securities Regulation
  units: 100
  description: This course will introduce students to the legal, economic, and business principles of capital markets in the
    United States. Students will learn the use of initial public offerings and private placements to raise capital, the trading
    of securities on public stock exchanges and in private transactions, and the regulation of these activities by the Securities
    and Exchange Commission. Students will study stocks, bonds, and recent financial innovations, as well as the public and
    private funds that invest in these instruments.
