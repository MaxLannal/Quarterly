- code: ECON 17100
  title: Introduction to International Trade
  units: 100
  description: This course covers international economics with an emphasis on international trade. The basic theories of international
    trade are introduced and used to analyze welfare and distributional effects of international trade, government policies,
    and technology diffusion. In addition, this course also discusses the main empirical patterns of international trade and
    international investment.
