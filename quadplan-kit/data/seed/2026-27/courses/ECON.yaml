- code: ECON 11710
  title: The Psychology of Negotiation
  units: 100
  description: Negotiation is ubiquitous in interpersonal interactions, from making plans for a trip with friends or family,
    to determining working conditions with an employer, to managing international conflicts. In this course we examine the
    structure of different negotiations and the psychology that governs the processes and outcomes of a negotiation. For instance,
    we consider the role of perceptions, expectations, intuitions, and biases. We evaluate the role of information processing,
    modes of communication, and power in influencing a negotiated outcome. We see how the psychology of trust, reciprocity,
    fairness, cooperation, and competition can affect our ability to benefit from an exchange or contribute to the escalation
    of conflict. To better understand the dynamics of the negotiation process, we learn both through engaging in a variety
    of negotiation role-plays and relating these experiences to research findings. Third- or fourth-year students only. Priority
    will be given to fourth-year students.
  crosslists:
  - PSYC 25700
  terms_offered:
  - AU
  source:
