      - ECON 21020
      - ECON 21030
  prereq_text: ECON 10000/20000/20010 and ECON 11020/21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 11310. Big Data and Better Decisions. 100 Units.
- code: ECON 11600
  title: Experimental Design
  units: 100
  description: The course equips students with the necessary skills to design and execute experiments effectively. In the
    first part of the course, students will learn why experiments are conducted and explore different types of experiments
    along with their respective advantages and disadvantages. Students will gain insights into choosing appropriate incentive
    structures and appropriate sample sizes. The course addresses critical issues, including internal and external validity,
    scalability concerns, and the risks of P-hacking and multiple hypothesis testing. Students will also learn about Institutional
    Review Board procedures. In the second part of the course, students will learn how to measure time preferences, risk preferences,
    subjective expectations, other-regarding preferences, competitiveness, and discrimination.
  prereq:
