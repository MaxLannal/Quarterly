- code: ECON 13300
  title: Introduction to the Macroeconomics of Monetary and Fiscal Policy
  units: 100
  description: This course examines monetary and fiscal issues in the macroeconomy. The first part of the course will focus
    on long-run topics in monetary economics, such as the nature of a monetary economy, inflation, the quantity theory of
