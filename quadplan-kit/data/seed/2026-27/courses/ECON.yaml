- code: ECON 10000
  title: Principles of Microeconomics
  units: 100
  description: 'This course introduces the principles and applications of price theory, which is a fundamental framework to
    analyze the decision-making of individuals and firms. The course is designed to develop problem-solving skills, both analytically
    and numerically, for students to be successful in subsequent coursework in the major. Coverage includes consumer theory,
    producer theory, determinants of demand and supply, market structures, equilibrium and welfare analysis, government intervention,
    international trade policy, and market failure and externalities. Students may substitute "Econ 20000: The Elements of
    Economic Analysis I" for this course in the business economics track.'
