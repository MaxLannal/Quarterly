- code: ECON 28000
  title: Industrial Organization
  units: 100
  description: This course extends the analysis from ECON 20100, with a focus on understanding the way firms make decisions
    and the effects of those decisions on market outcomes and welfare. The course examines the structure and behavior of firms
    within industries. Topics include oligopolistic behavior, the problems of regulating highly concentrated industries, and
    the implementation of U.S. antitrust policy.
  prereq:
    any:
    - ECON 20100
    - ECON 20110
  prereq_text: ECON 20100/20110
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 28000. Industrial Organization. 100 Units.
- code: ECON 28010
  title: Applied Empirical Industrial Organization
  units: 100
  description: In this course, students will learn how to apply techniques and models developed in industrial organization
    and law and economics to important questions that arise in litigation and government regulation. We will be guided and
    informed by pure theory underlying industrial organization and implement it in a world of partial information, incomplete
    data, and even contradictory data, among other complexities. Students will learn how to develop inferences by applying
    the models to real world cases and data - ie, extracting the most information possible from partial, imperfect data, frequently
    with missing values or poorly-measured data points. These fact patterns will not always result in an incontrovertible
    answer. Thus, students will be expected to identify and express the "best argument for" and "best argument against" the
    questions posed to them. This means that students will be expected to (i) use theory as a guideline to assess the relevant
    facts, circumstances, and data, (ii) reach a view, (iii) succinctly express that view in writing and acknowledge and address
    contrary theory and empirical results. Students will also see actual expert reports and/or white papers that have been
    prepared in actual disputes and investigations. Part of the grade will be based on an "expert report" written by the students
    in small teams.
  notes: Standard Track Economics majors should register for Econ 28010
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: Econ 20100/20110 and Econ 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 28010. Applied Empirical Industrial Organization. 100 Units.
- code: ECON 28030
  title: Markets and Regulation
  units: 100
  description: 'This is an applied industrial organization course that examines economically regulated market structures.
    We will analyze: a) types of market structures that particularly generate economic regulation; b) common methods used
    by regulatory agencies given a particular market structure; and c) models of the supply of and the demand for regulation
    of markets, with emphasis on maximizing behavior on the part of both suppliers (regulators) and demanders (firms, consumers,
    political representatives). We will focus on non-financial markets, as financial markets are well-covered in other courses.'
  crosslists:
  - PBPL 28670
  prereq_text: 'PQ: PBPL 20000 or equivalent'
  terms_offered:
  - AU
