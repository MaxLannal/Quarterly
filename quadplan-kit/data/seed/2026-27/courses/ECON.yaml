    quote: ECON 25520. Development Economics and Data Analysis. 100 Units.
- code: ECON 25530
  title: Behavioral Development Economics (Undergraduate)
  units: 100
  description: This course will focus on the intersection of two rapidly growing and recently Nobel Prize-winning fields in
    economics - development, and behavioral economics. Behavioral development economics brings insights and tools from psychology
    and behavioral economics to the study of developing economies and poverty more generally. The class is aimed at students
    interested in either (or both) of the fields. A decent part of lectures will be focused on introducing and describing
    tools of behavioral economics, before moving to applications in low-and middle-income countries.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
