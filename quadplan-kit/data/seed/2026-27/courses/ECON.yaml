- code: ECON 15500
  title: Introduction to Development Economics
  units: 100
  description: 'The course explores one of the most pressing global challenges: poverty. Through a microeconomic and empirical
    lens, students learn to analyze the economic lives of the poor, examining why poverty persists, and which interventions
    have been effective to sustainably improve the lives of poor people in low- and middle-income countries (LMIC). The course
    employs economic theory and econometric methods to analyze consumption, health, education, access to credit, entrepreneurship,
    and migration. The course places the microeconomic issues in the context of the macroeconomic context of economic institutions,
    e.g., security of property rights, and political institutions, e.g., electoral empowerment. Using both historical perspectives
    and contemporary studies, students learn about the frontier of knowledge at the frontier of development economics, emphasizing
    empirical research and data analysis. The course prioritizes close reading of accessible articles from top economics journals
    and includes data analysis interpretation exercises. Class discussions apply the frontier state of knowledge to real-world
    cases to prepare students for further study and careers in policy and economic development.'
  prereq:
    all:
    - any:
      - ECON 10000
      - ECON 20000
      - ECON 20010
    - any:
      - STAT 22000
      - STAT 23400
      - STAT 24400
      - ECON 11010
  prereq_text: ECON 10000/20000/20010 and STAT 22000/STAT 23400/STAT 24400/ECON 11010
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 15500. Introduction to Development Economics. 100 Units.
- code: ECON 16000
  title: 'Elements of Human Capital Theory: The Economic Science of People'
  units: 100
  description: 'Many believe economics is a discipline mostly concerned with money, finance, taxes, international trade, and
    industrial policy. This course explores how economics is, above all, about people. It covers a wide range of topics, all
    seen through the lens of human capital theory to demonstrate its importance in the economy: parental investment in children,
    nature versus nurture, aging, education, health, marriage, fertility, preference formation, specialization, and economic
    growth. In addition to discussing economic theory, students will gather and analyze data, consider applicable examples
    in literature, movies, sports, or popular culture, and write short essays. No prior knowledge of calculus, economic theory,
    or econometrics is required.'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: 'ECON 16000. Elements of Human Capital Theory: The Economic Science of People. 100 Units.'
- code: ECON 16040
  title: Introduction to Human Capital
  units: 100
  description: This course introduces the concept of human capital, its accumulation process, its role in family decisions,
    and its impact on the economy. The insights of several models are explained and discussed, covering a wide range of topics,
    including parental altruism, education, bequests, health, fertility, support in old age, income inequality, intergenerational
    transmission of wealth, specialization, division of labor, and economic growth. The theory is complemented with historical
    evidence from different countries and periods.
  prereq:
    all:
    - any:
      - ECON 10000
      - ECON 20000
      - ECON 20010
    - any:
