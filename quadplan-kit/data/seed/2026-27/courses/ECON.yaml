    quote: ECON 16560. Consumers, Firms, and the Environment. 100 Units.
  needs_review: true
- code: ECON 16700
  title: Introduction to Economics of Education
  units: 100
  description: This course investigates economic issues related to education. We will first discuss the theory behind the
    decision to invest in education. We will talk about private and social returns to education as well as signaling value
    of education. Then, we will investigate which factors (class size, teachers, incentives, peers, beliefs, etc.) matter
    in determining the success of students. Throughout the course, we will learn how different methods (experiments, difference-in-differences,
    instrumental variables, and regression discontinuity) are used to answer the economics of education questions.
  prereq:
