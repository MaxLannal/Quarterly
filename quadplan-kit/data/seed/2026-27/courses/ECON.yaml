    quote: ECON 27000. International Economics. 100 Units.
- code: ECON 27300
  title: Regulation of Vice
  units: 100
  description: This course discusses government policy regarding traditional vices (i.e., drinking, smoking, gambling, illicit
    sex, recreational drug use). Among policies considered are prohibition, taxation, treatment, decriminalization, and legalization.
    The intellectual framework employed to evaluate various policies is primarily economic, though other disciplines are drawn
    upon. This course is offered in alternate years.
  crosslists:
  - PBPL 27300
  prereq:
    any:
