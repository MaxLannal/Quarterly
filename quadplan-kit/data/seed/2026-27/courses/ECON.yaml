    quote: ECON 27300. Regulation of Vice. 100 Units.
- code: ECON 27700
  title: Health Economics and Public Policy
  units: 100
  description: This course analyzes the economics of health and medical care in the United States with particular attention
    to the role of government. The first part of the course examines the demand for health and medical and the structure and
    the consequences of public and private insurance. The second part of the course examines the supply of medical care, including
    professional training, specialization and compensation, hospital competition, and finance and the determinants and consequences
    of technological change in medicine. The course concludes with an examination of recent proposals and initiatives for
    health care reform. Must have completed PPHA 32300 Principles of Microeconomics and Public Policy I or equivalent to enroll.
  crosslists:
