- code: ECON 28060
  title: 'The Economics of Organizations: An Experimental Perspective'
  units: 100
  description: This course offers an introduction to the experimental methodology while at the same time providing the students
    with up-to-date insights and findings on how to run an organization and how to manage a workforce. Students will learn
    the basics of the experimental methodology, learn about the most ground-breaking findings in experimental economics related
    to the functioning of firms, and know the relevant papers and findings in organizational and personnel economics with
    a particular emphasis on the question of how to set incentives for workers.
  prereq:
    all:
    - any:
      - ECON 10000
      - ECON 20000
      - ECON 20010
    - any:
