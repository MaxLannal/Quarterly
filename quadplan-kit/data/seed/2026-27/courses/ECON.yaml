- code: ECON 15010
  title: 'Investments: From Economics to Finance'
  units: 100
  description: 'This course studies finance and investments through the lens of economic equilibrium methods. We look at how
    the general equilibrium framework in economics gives rise to the factor pricing models in finance, the no-arbitrage framework
    in economics gives rise to the option pricing models in finance, and the Nash equilibrium framework in economics gives
    rise to the microstructure trading models in finance. Trillions of dollar worth of financial products ride on these financial
    models, and we trace the path from the basic models of equilibrium in economic theory to these applied models in finance
    that have found immense use in practice. The course combines a theoretical framework with applied analysis. Topics covered
    include: basics of general equilibrium with uncertainty, mean-variance utility, portfolio optimization, capital asset
    pricing model, no-arbitrage equilibrium, fundamental theorem of asset pricing, binomial option pricing, Black-Scholes-Merton
    options theory, Bayes Nash equilibrium, Kyle and Glosten-Milgrom models of trading.'
  prereq:
    all:
    - any:
      - ECON 10000
      - ECON 20000
      - ECON 20010
    - any:
      - STAT 22000
      - STAT 23400
      - ECON 11010
  prereq_text: ECON 10000/20000/20010 and STAT 22000/STAT 23400/ECON 11010.
