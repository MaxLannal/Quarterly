- code: ECON 16710
  title: Education and Economic Development
  units: 100
  description: This course covers policy issues related to education in developing contexts. We will analyze education policies
    and reforms, develop skills to be a critical consumer of relevant research on each topic, and examine implications of
    the findings to policy and practice. Topics include discrimination and inclusion in education, understanding factors that
    influence educational decisions, provision of basic needs in schools, teacher pay and incentives, education in emergency
    settings, and school choice.
