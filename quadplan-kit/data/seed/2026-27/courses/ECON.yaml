- code: ECON 10700
  title: Introductory Game Theory
  units: 100
  description: How should one bid at an auction in order to win at the lowest possible hammer price? How do firms behave when
    they possess market power but also face competition? Why do companies engage in R&D races in order to release their new
    products sooner than their competitors? Why do the Republicans and the Democrats almost always ended up choosing moderates
    as their party nominees in presidential races? To what extent can the veto power of presidents allow them to influence
    legislative outcomes? To answer these questions, we study Games of Strategies, and explore how lessons learned from such
    games can guide one's thinking in everyday strategic interactions.
  notes: Student may count only one of [ECON 10700 or ECON 20700 or ECON 20770] toward the 42 credits required for graduation.
