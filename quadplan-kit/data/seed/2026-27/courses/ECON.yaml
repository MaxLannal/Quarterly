  needs_review: true
- code: ECON 16560
  title: Consumers, Firms, and the Environment
  units: 100
  description: This course applies microeconomic analysis to energy markets and environmental problems like climate change.
    Using theory and data, we examine how consumers and firms make decisions about pollution, energy use, and clean technology
    adoption. We also study how government policies like taxes, regulations, and subsidies shape these decisions. Students
    may use this course to satisfy the microeconomics method requirement for the business economics specialization.
  prereq_text: ECON 10000 or ECON 20000 or ECON 20010) and (STAT 22000 or STAT 23400 or STAT 24400 or ECON 11010).
  terms_offered:
