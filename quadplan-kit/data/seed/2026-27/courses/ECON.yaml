    consumers given their incomes and preferences, as well as the relative prices of different goods. This course develops
    tools for analyzing how these optimal choices change when relative prices and consumer incomes change. Finally, this course
    presents several measures of consumer welfare. Students learn how to evaluate the impact of taxes and subsidies using
    these measures. Completion of ECON 10000 is strongly recommended of students without a prior microeconomics course.
