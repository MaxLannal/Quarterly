- code: ECON 19000
  title: 'Economics for Everyone: Micro'
  units: 100
  description: The field of economics has generated a powerful set of insights which have fundamentally shaped the modern
    world. Because modern economics puts such a heavy stress on mathematical rigor, the most interesting economic ideas often
    get pushed to the background. In this course, we will explore these big economic ideas, without the math. Our goal is
    to make the beauty and power of economic thinking available to everyone. We will discuss what it means to think like an
    economist, how you can use economic thinking to make the world a better place (or to take advantage of your friends and
    enemies, if you prefer), and also how sometimes thinking like an economist can get you into trouble.
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: 'ECON 19000. Economics for Everyone: Micro. 100 Units.'
- code: ECON 19100
  title: 'Economics for Everyone: Macro'
  units: 100
  description: 'This course explores the big ideas in macroeconomics in a way that is enjoyable and accessible, with minimal
    reliance on mathematics. The goal is to provide an introduction to macroeconomic issues for people who have never before
    studied macroeconomics (and who might never study it again), so that they can understand and contribute to ongoing discussions
    in the news and on social media. We will demystify some of the major macroeconomic questions of our times: Why is there
    unemployment? Why are some countries poor? What''s the big deal about government debt? How high should we set taxes? What
    gives money and stocks their value? What does the Fed do? And why did all those economists win Nobel Prizes? We will show
    the fun, interesting, and strange sides of macroeconomics.'
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: 'ECON 19100. Economics for Everyone: Macro. 100 Units.'
- code: ECON 19200
  title: Introduction to Issues and Methods in Microeconomics
  units: 100
  description: Microeconomics is the study of how agents make optimal choices when facing constraints. The course will start
    by developing the "Economic Approach" as the basic tool for analysis in economics. We will continue with a model of causal
    inference, and link it with concepts students have learned in the econometrics course. Then, we introduce the use of experiments
    as an alternative methodology for the researchers to gather their own data. Finally, we cover some major topics in behavioral
    economics.
  notes: Study Abroad
  prereq:
    any:
    - ECON 10000
    - ECON 20000
    - ECON 20010
  prereq_text: Econ 10000/20000/20010.
  terms_offered:
  - WI
  source:
