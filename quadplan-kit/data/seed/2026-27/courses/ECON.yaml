- code: ECON 14020
  title: 'Labor Markets: a Global Perspective'
  units: 100
  description: In this course we will explore standard models that form the core of labor economics including labor supply,
    labor demand, job search models, wage setting, discrimination, and migration. For each topic we will then examine empirical
    applications of these models with a focus on middle and low-income countries. We will discuss how these traditional models
    are useful, or not, in understanding labor market outcomes in these settings and how they can be expanded to better capture
    relevant features of labor markets outside high-income countries.
  crosslists:
