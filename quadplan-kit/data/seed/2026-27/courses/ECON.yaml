  units: 100
  description: This course introduces the basics of corporate finance, investments, and banking, with an emphasis on real-world
    applications. The aim is to prepare students for a career in financial economics and allied industries including banking,
    investment management, and capital markets. We shall discuss capital structure, corporate valuation, financial statement
    analysis, cost of capital, interest rates, yield curve analysis, monetary policy impact, risk and return analysis, portfolio
    theory, capital asset pricing model and financial instruments. The course is a rigorous introduction to various facets
