- code: ECON 18650
  title: Law and Economics of Business
  units: 100
  description: This course will introduce students to the economic analysis of business law. Students will be introduced to
    basic concepts of private law, including contracts, property, and remedies. They will then learn the basic tools of law
    and economics. With those skills they will explore the law of for-profit businesses, including corporate governance, mergers
    and acquisitions, and corporate bankruptcy. Students may use this course to satisfy the microeconomics method requirement
    for the business economics specialization.
