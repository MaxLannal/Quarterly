    quote: ECON 19200. Introduction to Issues and Methods in Microeconomics. 100 Units.
- code: ECON 19300
  title: Introduction to Issues and Methods in Macroeconomics
  units: 100
  description: We will develop basic tools and methods in economics and study issues in macroeconomics and international trade
    and finance. The topics we cover include both contemporary and classical issues such as tax incidence and distortions,
    optimal taxation, inflation, monetary policy, patterns and benefits of trade, and exchange rate determination. The objective
    of the course is to train students with analytical tools in macroeconomics so that they can understand, analyze, and evaluate
    various policies and policy proposals. To make the subject matters relevant and practical, students are strongly encouraged
    to read the Wall Street Journal and the Economist regularly to keep up with current events and controversies.
  notes: Study Abroad
  prereq:
