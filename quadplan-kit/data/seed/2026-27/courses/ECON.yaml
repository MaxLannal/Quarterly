- code: ECON 18010
  title: Introduction to Managerial Microeconomics
  units: 100
  description: This course presents several classic microeconomic models applicable in business contexts. The topics covered
    include self-selection, commitment, product differentiation, matching, and mechanism design, among others. The theoretical
    insights of each model are analyzed. Real-world applicability is discussed using practical examples. Students are required
    to write short papers applying the models presented in the course to real-world situations in the context of business.
