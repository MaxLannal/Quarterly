- code: ECON 14030
  title: The Workplace and Family Policy
  units: 100
  description: 'The topics covered in the course will include: the demographic transition, human capital accumulation, gender
    wage and employment gaps, discrimination in the workplace, family leave and childcare policies, tax policies including
    subsidies like the Earned Income Tax Credit (ETIC), and related welfare policies. We will draw on the theory of static
    and dynamic labor supply, theories of labor demand, and labor market equilibrium to guide its investigation, and use empirical
    tools to answer research questions. For each topic covered in this course, I will introduce an elementary treatment of
    the canonical theoretical model and give examples of its empirical application. In studiying empirical applications, we
    will often draw on analysis from international experience.'
