  prereq_text: '[Econ 20100 or Econ 20110] and [Math 19620 or Math 18500 or Math 20000 or Math 20250 or Math 20700 or Stat
    24300 ] and [Stat 23400 or Stat 24400 or Stat 24410]'
  terms_offered:
