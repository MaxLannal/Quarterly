    - ECON 21030
  prereq_text: ECON 21020 or ECON 21030
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26700. Economics of Education. 100 Units.
- code: ECON 26740
  title: 'Climate Crossroads: Policy, Diplomacy, and the Global Future'
  units: 100
  description: 'The world''s atmosphere and oceans are rapidly warming-the result of human economic progress fueled by fossil
    fuels and other greenhouse gas emissions. A 2018 analysis by the Intergovernmental Panel on Climate Change concluded that
    stabilizing the atmosphere requires reaching "net zero" emissions, where as much greenhouse gas is removed from the atmosphere
    as is emitted. Achieving this demands a transformation of the global economy on a scale without historic precedent. This
    course begins by describing the nature and complexity of the climate policy challenge. It then explores the policy levers
    available to governments at both national and international levels to address it. The course considers perspectives from
    wealthy, advanced economies-historically the largest source of emissions-as well as emerging economies with significant
    development needs and rising emissions. It reviews the international framework for cooperation and negotiation on climate
    change through the United Nations Framework Convention on Climate Change. Finally, students will examine the challenges
    democratic societies face in maintaining public consensus on climate action, focusing on shifting U.S. policy frameworks.
    The course will be taught by three experienced practitioners: the White House lead on climate policy in the Obama and
    Biden Administrations, the former Foreign Minister of Pakistan, and the U.S.''s longtime lead negotiator at the UNFCCC
    and other international treaty negotiations.'
  notes: This course can count towards the Politics, Economics, and Society specialization in for the Climate and Sustainable
    Growth major.
  crosslists:
  - CEGU 21025
  - PBPL 21025
  - GLST 21025
  - CCSG 21025
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: 'ECON 26740. Climate Crossroads: Policy, Diplomacy, and the Global Future. 100 Units.'
- code: ECON 26920
  title: Behavioral Economics and Policy
  units: 100
  description: The standard theory of rational choice exhibits explanatory power in a vast range of circumstances, including
    such disparate decision making environments as whether to commit a crime, have children, or seek to emigrate. Nonetheless,
    shortfalls from full rationality seem not to be uncommon, and are themselves, to some extent, systematic. Behavioral economics
    documents and tries to account for these departures from full rationality. This course looks at areas in which some modification
    of the traditional rational choice apparatus might most be warranted; these include decisions that unfold over time, involve
    low probability events, or implicate willpower. To what extent should public policy respond to shortfalls from rationality
    or concern itself with promoting happiness?
  crosslists:
  - PBPL 28805
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26920. Behavioral Economics and Policy. 100 Units.
- code: ECON 27000
  title: International Economics
  units: 100
  description: This course covers international economics with an emphasis on international trade. The basic theories of international
    trade are introduced and used to analyze welfare and distributional effects of international trade, government policies,
    and technology diffusion. In addition, this course also discusses the main empirical patterns of international trade and
    international investment.
  crosslists:
  - PBPL 27000
  prereq:
