    quote: 'ECON 28060. The Economics of Organizations: An Experimental Perspective. 100 Units.'
- code: ECON 28620
  title: Crony Capitalism
  units: 100
  description: The economic system prevailing in most of the world today differs greatly from the idealist version of free
    markets generally taught in economic classes. This course analyzes the role played by corporate governance, wealth inequality,
    regulation, the media, and the political process in general in producing these deviations. It will explain why crony capitalism
    prevails in most of the world and why it is becoming more entrenched also in the United States of America. The course,
    which requires only basic knowledge of economics, welcomes undergraduates. This is a cross-listed course offered under
    BUSN 35225 for Booth students and ECON 28620 for non-Booth students. Booth students will bid on BUSN 35225. Non-Booth
    student can register under ECON 28620 or, if space is available, enroll via the non-Booth registration process for BUSN
    35225. ECON 28620 is not eligible for pass/fail.
  crosslists:
  - BUSN 35225
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 28620. Crony Capitalism. 100 Units.
- code: ECON 29200
  title: Issues and Methods in Microeconomics
  units: 100
  description: Microeconomics is the study of how agents make optimal choices when facing constraints. The course will start
    with a quick refresher in the "Economic Approach" as the basic tool for analysis in economics. We will continue with a
    model of causal inference, and link it with concepts students have learned in the econometrics course. Then, we introduce
    the use of experiments as an alternative methodology for the researchers to gather their own data. Finally, we cover some
    major topics in behavioral economics.
  notes: Study Abroad
  prereq:
    any:
    - ECON 20000
    - ECON 20010
  prereq_text: Econ 20000/20010
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 29200. Issues and Methods in Microeconomics. 100 Units.
- code: ECON 29300
  title: Issues and Methods in Macroeconomics
  units: 100
  description: Using tools and methods in economics, we will study issues in macroeconomics and international trade and finance.
    The topics we cover include both contemporary and classical issues such as tax incidence and distortions, optimal taxation,
    inflation, monetary policy, patterns and benefits of trade, and exchange rate determination. The objective of the course
    is to train students with analytical tools in macroeconomics so that they can understand, analyze, and evaluate various
    policies and policy proposals. To make the subject matters relevant and practical, students are strongly encouraged to
    read the Wall Street Journal and the Economist regularly to keep up with current events and controversies.
  notes: Study Abroad
  prereq:
