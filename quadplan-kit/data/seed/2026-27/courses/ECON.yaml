- code: ECON 14000
  title: Introduction to Labor Economics
  units: 100
  description: 'This course is an introduction to labor economics with an emphasis on applied microeconomic theory and empirical
    analysis. Topics to be covered include: labor supply and demand, taxes and transfers, minimum wages, immigration, human
    capital, creativity over the lifecycle and unemployment. For each topic we will describe the basic economic framework
    used in the analysis, analyze associated cases of study and drawn conclusions about what we have learned. Most of the
    examples will be taken from U.S. labor data and special attention will be given to randomized trials and experimental
    methods to infer causality.'
  prereq:
