    quote: ECON 25530. Behavioral Development Economics (Undergraduate)
- code: ECON 25540
  title: Poverty and Public Policy
  units: 100
  description: This course covers the extent and nature of poverty, mainly in the United States and other rich countries.
    We begin with the measurement of poverty, deprivation and homelessness. We then discuss causes of these problems, rationales
    for government interventions, and the effectiveness of various public policies. The course will focus on the empirical
    evidence on each topic, but begin with the theoretical foundation in each area.
  crosslists:
  - PBPL 23215
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 25540. Poverty and Public Policy. 100 Units.
- code: ECON 26010
  title: Public Finance
  units: 100
  description: This course addresses the measurement, explanation, and consequences of government activity including tax systems,
    expenditure programs, and regulatory arrangements. Topics include cross-country comparisons of government behavior, market
    analyses of public policy, the incidence of government activity, and effects of economic activity on politics and public
    policy.
  notes: ECON 26010 or 26020 may be used as an economics elective, but only one may be used toward degree requirements.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200/20210 and ECON 21020 (or ECON 21030)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26010. Public Finance. 100 Units.
- code: ECON 26015
  title: Cost-Benefit Analysis
  units: 100
  description: 'The learning objectives of the class include: (1) understanding the role and importance of each of the key
    steps in conducting a CBA, (2) understand the microeconomic foundations underlying the core elements of a CBA including
    identifying, measuring, and monetizing impacts and costs, and assessing whether the social gain of a policy is positive,
    (3) understand the most important conceptual and practical problems that arise in CBA. The class offers a comprehensive
    treatment of the cost benefit analysis methodology and how its use can increase the effectiveness of public policy and
    make society better off. The class includes applications drawn from many areas, including health, education, poverty and
    the environment. Highly recommended prior coursework: PBPL 20000 Economics for Public Policy or ECON 20000 The Elements
    of Economic Analysis I.'
  crosslists:
  - PBPL 21300
  prereq_text: 'Recommended Coursework: PBPL 20000 Economics for Public Policy or ECON 20000 The Elements of Economic Analysis
    I'
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26015. Cost-Benefit Analysis. 100 Units.
  needs_review: true
- code: ECON 26030
  title: The Economics of Socialism
  units: 100
  description: The course examines the economic theories of socialism ranging from Karl Marx's to market socialism, as well
    as theories of market power, collective action, and price regulation. These theories are applied to the measurement of
    socialism, income distribution, surplus value, and the degree of exploitation of labor. These metrics are used to compare
    various mixed economies including the Nordic model and various sectors in the United States. We consider how the economics
    of socialism might evolve as the health sector grows in the near future and artificial intelligence transforms the workplace
    in the long run.
  prereq:
    any:
    - ECON 10200
    - ECON 20000
    - ECON 20010
  prereq_text: Econ 10200/20000/20010
  terms_offered:
  - AU
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26030. The Economics of Socialism. 100 Units.
- code: ECON 26040
  title: Human Capital and the Economy
  units: 100
  description: This course introduces the concept of human capital, its accumulation process, its role in family decisions,
    and its impact on the economy. Several models are presented and discussed, covering a wide range of topics, including
    parental altruism, education, bequests, health, fertility, support in old age, income inequality, intergenerational transmission
    of wealth, specialization, division of labor, and economic growth. The theory is complemented with historical evidence
    from different countries and periods.
  prereq:
    any:
    - ECON 20200
    - ECON 20210
  prereq_text: Econ 20200/20210
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26040. Human Capital and the Economy. 100 Units.
- code: ECON 26610
  title: The Economics of Cities and Regions
  units: 100
  description: This course studies business and individual location decisions and how they determine the main economic forces
    that lead to the existence and performance of cities and regional agglomerations. The course starts by developing a simple
    theory of cities and its implications for city size, firm productivity, and housing prices. It then studies evidence of
    the impact of cities on firm and worker productivity, urban amenities, and congestion. We will discuss the problems in
    measuring these forces, the methodologies to do so, as well as the implications of this measurement for businesses, individuals,
    and urban policy. We will also study the internal structure of cities, and how to evaluate the effect of new infrastructure
    or policy on land and housing values as well as on overall welfare. Finally, the course will analyze the role cities and
    regions play in aggregate economic development.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20100/20110 and ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 26610. The Economics of Cities and Regions. 100 Units.
- code: ECON 26700
  title: Economics of Education
  units: 100
  description: This course explores economic models of the demand for and supply of different forms of schooling. The course
    examines the markets for primary, secondary, and post-secondary schooling. The course examines numerous public policy
    questions, such as the role of government in funding or subsidizing education, the design of public accountability systems,
    the design of systems that deliver publicly funded (and possibly provided) education, and the relationship between education
    markets and housing markets.
  crosslists:
  - PBPL 26705
  - EDSO 26700
  prereq:
    any:
