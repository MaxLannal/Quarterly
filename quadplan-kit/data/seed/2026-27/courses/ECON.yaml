- code: ECON 16050
  title: Why aren't humans replacing themselves? What are the consequences?
  units: 100
  description: The human fertility rate has fallen in half in the last 50 years, and is below replacement in more and more
    countries. These declines imply that the human population on Earth will peak at roughly 12 billion around 2075. Will the
    human population stabilize or collapse after it peaks? Will human civilization survive? This course will examine this
    Big Question in depth. We will first review the data demonstrating the decline in total fertility rate in countries around
    the world, then consider the multitude of explanations that have been proposed for this decline. Next, we will explore
    the consequences for human well-being and civilization of population decline. Finally, we will investigate potential solutions
    to the problem, with an eye to the underlying causes of fertility decline. Students from a wide variety of fields are
    welcome, including those with knowledge of partial differential equations, data analysis, or programming skills, but no
    prior experience in demography or related areas. Students will write a final paper that examines a particular cause of
    fertility decline and critically evaluates it, providing the best evidence for and against it. This course is cross-listed
    with the McKeon Center in the UChicago College.
  crosslists:
  - BPRO 27450
  prereq_text: 'PQ: Third or fourth-year standing.'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 16050. Why aren't humans replacing themselves? What are the consequences?
  needs_review: true
- code: ECON 16550
  title: The Climate and Growth Challenge
  units: 100
  description: The global energy and climate challenge is perhaps the most important problem society faces. It requires identifying
    approaches to ensure people have access to the inexpensive and reliable energy critical for human development, without
    causing disruptive climate change or unduly compromising health and the environment. The course pairs technical and economic
    analysis to develop an understanding of policy challenges in this area. Lecture topics will include the past, present,
    and future of energy supply and demand, global climate change, air pollution and its health consequences, selected energy
    technologies such as solar photovoltaics, nuclear power, unconventional oil and gas, and an analysis of theoretical and
    practical policy solutions in developed and emerging economies.
  crosslists:
  - CCSG 19000
  - CEGU 22510
  - PBPL 22510
  - BPRO 22510
  prereq_text: 'BPRO 22510: third or fourth-year status. CEGU 22510, CCSG 19000, ECON 16550, PBPL 22510: First-year student
    by permission of instructor only.'
