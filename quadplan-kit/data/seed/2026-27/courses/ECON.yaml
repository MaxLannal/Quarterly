    quote: ECON 21020. Econometrics. 100 Units.
- code: ECON 21030
  title: Econometrics - Honors
  units: 100
  description: The topics are essentially the same as those covered in ECON 21020, but this foundations course in econometrics
    gives a more systematic introduction to the application of statistical theory to economic applications. This course is
    intended for students who are planning to study economics at the graduate level.
