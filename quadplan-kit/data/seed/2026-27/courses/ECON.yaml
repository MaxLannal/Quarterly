- code: ECON 17720
  title: Evidence in Health Policy
  units: 100
  description: In this course, we will consider the role of evidence and empirical studies in helping inform us about important
    health policy topics, such as the consequences of expanding the Medicaid program, the effects of private equity acquisitions
    of medical facilities, and the burden of medical debt. The course will be divided into two-lecture modules where, in the
    first, we will read an editorial or descriptive piece that helps introduce a health policy context, and, in the second,
    we will read a study that confronts the topic using modern empirical methods. In class, we will learn both about health
    policy and how to read and understand evidence in support or opposition of those policies. Out of class activities will
    including synthesizing studies to inform a prospective policy proposal and reanalyzing prior studies using actual data
    and statistical programming. This course was previously named Issues in Health Policy.
  crosslists:
