- code: ECON 11300
  title: Correlation or Causation? Applied Causal Reasoning in Economics
  units: 100
  description: 'Every day we are surrounded by claims about what causes what: from "minimum wages raise unemployment levels"
    to "new supplement in the market improves focus and grades." But how do we know which of these claims are true? In a world
    with abundance of data, the challenge is not finding information, but correctly assessing patterns from the real world.
    This course gives you the tools to do exactly that. You will learn how economists separate coincidence from real cause-and-effect
    using modern techniques that power today''s most influential research in the field.Throughout the program, you will explore
    real-world questions, work hands-on with data, and practice methods used to evaluate everything from education policies
    to health interventions. The course builds toward a collaborative class paper, where you will investigate a causal question
    and present your findings. By the end of this course, you will have the foundational skills beyond only understanding
    the difference between correlation and causation - you will know how to test it yourself. These skills will stay with
    you well beyond the classroom, helping you make sense of the news, analyze studies you encounter online, and succeed in
    future college-level coursework."'
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 11300. Correlation or Causation? Applied Causal Reasoning in Economics. 100 Units.
- code: ECON 11310
  title: Big Data and Better Decisions
  units: 100
  description: 'This course will introduce students to advanced methods for data driven decision making with an emphasis on
    business applications. Students will learn how to build and interpret models that address two fundamental categories of
    business questions: (i) causal analysis and (ii) forecasting and prediction. The first portion of the course will cover
    experimental design, as well as non-experimental causal inference (e.g. matching, fixed effects, differences-in-differences,
    synthetic control). The second portion of the course will focus on machine learning topics including linear regularization,
    cross validation, tree models, random forests and boosting. The course will also explore cutting edge methods at the intersection
    of causal inference and machine learning. Heavy emphasis will be placed on discussion of real examples and business applications
    of these methodologies. The course work will include writing code and analyzing data in R to learn how these techniques
    are implemented in practice.'
  prereq:
    all:
    - any:
      - ECON 10000
      - ECON 20000
      - ECON 20010
    - any:
