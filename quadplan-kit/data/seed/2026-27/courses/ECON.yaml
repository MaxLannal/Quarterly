- code: ECON 21031
  title: Econometrics II-Honors
  units: 100
  description: This course is a continuation of ECON 21030. The topics covered include additional applications of linear regression
    to descriptive and causal inference. Other topics may include nonlinear models, panel data, quantile regression, time
    series, the bootstrap, and nonparametric regression. This course is intended for students who are planning to study economics
    at the graduate level.
  prereq:
    any:
    - ECON 21020
    - ECON 21030
  prereq_text: ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21031. Econometrics II-Honors. 100 Units.
- code: ECON 21110
  title: Applied Microeconometrics
  units: 100
  description: This course will cover a broad set of applications in labor economics, public economics, industrial organization,
    economics of education, environmental economics, and development economics. There will be a strong focus on how economic
    theory, institutional details, and experiments can be used to draw causal inferences on economic relationships. There
    will be emphasis on applying a number of commonly used microeconometric methods to economic data; including the linear
    regression model, fixed and random effects models, instrumental variables, and discrete choice models. When interpreting
    the empirical results, we will also discuss the importance of omitted variables bias and measurement error.
  prereq:
    any:
    - ECON 21020
    - ECON 21030
  prereq_text: ECON 21020 or ECON 21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21110. Applied Microeconometrics. 100 Units.
- code: ECON 21160
  title: Topics in Causal Inference
  units: 100
  description: This course covers selected topics on causal inference and econometrics. Special attention will be given to
    the use of economic models in causal inference. This course is intended for students who are planning to study economics
    at the graduate level.
  prereq:
    any:
    - ECON 21030
    - all:
      - ECON 21020
      - consent: instructor
  prereq_text: ECON 21030 (or ECON 21020 with instructor consent)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21160. Topics in Causal Inference. 100 Units.
- code: ECON 21200
  title: Time Series Econometrics
  units: 100
  description: This course focuses on theory, and covers a broad range of topics, both mathematical and statistical, on stationary
    time series models in time and frequency domains. The models include ARMA, VAR, ARCH/GARCH and their variants. It also
    covers nonstationary time series models with unit roots and cointegration, and the theories and methodologies to estimate
    and test them statistically.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200/20210 and ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21200. Time Series Econometrics. 100 Units.
- code: ECON 21315
  title: Econometric Applications I
  units: 100
  description: Course one of a two-quarter sequence designed to guide students through the steps of writing a research paper
    that applies econometric methods to study an economic question of interest. In the course, we will review and supplement
    our understanding of econometric methods that are frequently used in applied work, along with readings and in-class discussions
    of research papers to illustrate how applied research is conducted and presented. Along with homework assignments and
    required readings, during the first quarter, students will identify a topic of interest, locate data sources, review relevant
    literature, and make a presentation of their research proposal.
  prereq:
    any:
    - ECON 21030
    - consent: instructor
  prereq_text: ECON 21030 or consent of instructor
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21315. Econometric Applications I. 100 Units.
- code: ECON 21316
  title: Econometric Applications II
  units: 100
  description: This course is a continuation of ECON 21315. Students will refine and execute their proposal (from ECON 21315),
    resulting in a final presentation and a final paper that will undergo peer review.
  crosslists:
  - ECMA 31316
  prereq_text: ECON 21315 or consent of instructor (if they have taken ECMA 31320)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21316. Econometric Applications II. 100 Units.
  needs_review: true
- code: ECON 21410
  title: Computational Methods in Economics
  units: 100
  description: This course introduces the empirical and computational techniques necessary for numerical estimation and simulation
    in economics. Through examples in economics, the course covers topics such as optimization, function approximation, and
    monte carlo techniques. Emphasis will be placed on developing effective programming and research practices. The course
    is structured through a series of applications in such topics as segregation, occupational choice, and repeated games.
    The course will be taught in R and STATA. Though helpful, no previous experience with R or STATA is required.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20100/20110 and ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21410. Computational Methods in Economics. 100 Units.
- code: ECON 21730
  title: Applied Behavioral Economics
  units: 100
  description: This class covers recent work in behavioral economics. Topics include discrimination, social pressure, social
    norms, identity and gender. Applications will cover a wide range of fields, including labor economics, finance, and political
    economy.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20100/20110 and ECON 21020/21030
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21730. Applied Behavioral Economics. 100 Units.
- code: ECON 21740
  title: Behavioral Economics and Experiments
  units: 100
  description: This is a hands-on course in behavioral economics. Basic concepts of preferences, traits, and behavioral biases
    are reviewed that link economics and psychology. Methods for eliciting traits and preferences will be taught and implemented
    in actual lab experiments. Grade will be determined by reports and quality of lab work.
  prereq_text: ECON 10000/19800/20000/20010 AND STAT 22000/23400/24300/24400/24410/ECON 21010 (Lab students require one economics
    course.)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21740. Behavioral Economics and Experiments. 100 Units.
  needs_review: true
- code: ECON 21800
  title: Experimental Economics
  units: 100
  description: This course provides the necessary tools to be an avid consumer of the experimental literature and instructs
    students on how to become a producer of that literature. Topics include a summary of recent experimental findings and
    details on how to gather and analyze data using experimental methods.
  notes: Students may count either ECON 11700 or ECON 21800, but not both, toward the 42 credits required for graduation.
  prereq_text: ECON 20100/20110 and ECON 21020/21030; ECON 10000/20000 and ECON 11020 for declared business economics students.
    No first-year students.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 21800. Experimental Economics. 100 Units.
  needs_review: true
- code: ECON 22010
  title: History of Financial Crises
  units: 100
  description: 'This course has an ambitious goal - to investigate both the tools of risk management at the firm level through
    hands-on training and practice, and the lessons of macroeconomic or systemic risk through examination of financial crises
    throughout history. These lessons are important - whether it is the South Sea Company crisis of 1700s or the mortgage
    debt crisis in the United States in the 2000s, financial crises have shaped our world. Understanding history is the first
    step towards intelligent policy. To examine the financial and economic history we will read some of the classic (and also
    some of the newer) texts in this area: A Monetary History of the United States, 1857-1960 by Milton Friedman and Anna
    Jacobson Schwartz; Manias, Panics, and Crashes by Charles P. Kindleberger (for a history of financial panics); Extraordinary
    Popular Delusions and the Madness of Crowds by Charles Mackay (for a history of the 18th century South Sea Bubble in Britain
    and the Sword Blade Bank and Mississippi Company in France); This Time is Different - Eight Centuries of Financial Folly
    by Carmen Reinhart and Kenneth Rogoff (for why this time is not different - financial folly has a long history); and Fragile
    by Design by Charles Calomiris and Stephen Haber (for a cogent and disciplined analysis of banking systems across time
    and across countries - US, Canada, UK, Mexico, and Brazil).'
  crosslists:
  - PBPL 22521
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 22010. History of Financial Crises. 100 Units.
- code: ECON 22030
  title: The Chinese Economy
  units: 100
  description: This course provides an overview of the Chinese economy, with two main focuses. First, we will review the significant
    reforms that happened in China in the past four decades, which fundamentally reshaped the modern China as we see today.
    Second, we will discuss some of China's key political and economic institutions, and their implications on China and the
    rest of the world. Throughout the course, special emphasis will be given to the role of the state in China's growth experience,
    at both the central- and local-levels.
  crosslists:
  - PPHA 35585
  - PBPL 25585
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 22030. The Chinese Economy. 100 Units.
- code: ECON 22850
  title: Why Nations Fail or Succeed
  units: 100
  description: This course is an overview of world economic and political history over the past ten thousand years and it
    presents a simple theory which can account for the major patters. Part of the theory was presented in my book with Daron
    Acemoglu Why Nations Fail, but the course will be much more than this since our thinking has evolved quite a bit since
    then. In particular, WNF emphasized power relations and the material basis of both power and interests and how these were
    structured through institutions. Our current research, which you will see represented in this course, examines the ideational
    and cultural foundations for, power, interests and institutions. I hope what comes out of this is a much richer cross-cultural
    understanding of comparative economic and political development. You might think of it as WNF 2.0. This is not a simple
    economic history course, but you might be inspired, as we were, by some of the great modern accounts of economic history.
  crosslists:
  - PBPL 26420
  - PLSC 26420
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 22850. Why Nations Fail or Succeed. 100 Units.
- code: ECON 23000
  title: Money and Banking
  units: 100
  description: This course covers economic theories and topical issues in money and banking. We discuss such "traditional"
    topics as the quantity theory, the Phillips curve, and the money creation process. We also investigate models of bank
    runs and financial crises, the tradeoff between rules and discretion, and the New Macroeconomic Synthesis of New Classical.
    Other topics include New Keynesian approaches to modeling money and monetary policy, practical and institutional issues
    in European and U.S. monetary policy, and the 2008 financial crisis.
  prereq:
    any:
    - ECON 20200
    - ECON 20210
  prereq_text: ECON 20200 (or ECON 20210); ECON 21020 and ECON 23950 are strongly recommended.
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 23000. Money and Banking. 100 Units.
- code: ECON 23050
  title: Artificial Intelligence, Innovation, and Growth
  units: 100
  description: Social and cultural innovation, alongside economic growth, are among the most compelling, critical and challenging
    phenomena in modern social science. Innovation has always been associated with unleashing transformative growth in art,
    science, and the economy, and in this class we explore these issues in the context of the contemporary emergence of Artificial
    Intelligence (AI). AI represents a novel source of innovation in economy and society, but also a powerful tool for understanding,
    modeling, and steering innovation in new ways. The primary purpose of this course is to enable students to understand
    innovation and growth in the age of AI, and with tools from AI alongside theoretical frameworks and methods from economics,
    sociology, evolution, and complex systems necessary for study them. The course strives to provide students with a background
    in dynamic analysis, data analysis, and modern AI requisite for studying innovation in the modern age. We will also consider
    a number of compelling theoretical and empirical challenges, ranging from the paradox of institutionalizing innovation
    to inequalities that emerging AI capacities could create or remove to advances it could unleash in science and technology
    to the spread of misinformation to consequences of AI tools and "agents" in all domains of modern life to existential
    risks associated with AI. We will cover theories and models at an abstract and advanced level.
  crosslists:
  - DATA 20620
  - SOCI 20620
  - ECMA 33050
  - SOCI 30620
  - MACS 23050
  - MACS 33050
  prereq:
    all:
    - any:
      - MATH 13200
      - MATH 15200
      - MATH 16200
      - MATH 15910
      - MATH 20250
      - MATH 20300
    - any:
      - ECON 11010
      - STAT 22000
      - STAT 23400
      - STAT 24400
      - SOCI 20004
      - SOCI 20602
      - SOCI 20596
  prereq_text: '[MATH 13200 or MATH 15200 or MATH 16200 or MATH 15910 or MATH 20250 or MATH 20300] and [ECON 11010 or STAT
    22000 or STAT 23400 or STAT 24400 or SOCI 20004 or SOCI 20602 or SOCI 20596]'
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 23050. Artificial Intelligence, Innovation, and Growth. 100 Units.
- code: ECON 23200
  title: Topics in Macroeconomics
  units: 100
  description: This course focuses on the use of dynamic general equilibrium models to study questions in macroeconomics.
    Topics include long-run growth and dynamic fiscal policy (Ricardian equivalence, tax smoothing, capital taxation), labor
    market search, industry investment, and asset pricing. On the technical side, we cover basic optimal control (Hamiltonians)
    and dynamic programming (Bellman equations).
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - MATH 20300
      - MATH 20310
      - MATH 20700
  prereq_text: ECON 20200 (or ECON 20210) and MATH 20300 (or MATH 20310 or MATH 20700)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 23200. Topics in Macroeconomics. 100 Units.
- code: ECON 23410
  title: Economic Growth
  units: 100
  description: The process of economic growth and the sources of differences in economic performance across nations are some
    of the most interesting, important and challenging areas in modern social science. You cannot travel or read the news
    without wondering why differences in standards of living among countries are so large. The primary purpose of this course
    is to introduce undergraduate students to these major issues and to the theoretical tools necessary for studying them.
    The course therefore strives to provide students with a solid background in dynamic economic analysis, as well as empirical
    examples and data analysis. We will cover models at an abstract and advanced level. You must have the degree of mathematical
    maturity associated with the concepts of functions, derivatives, integrals, Taylor series, optimization, ordinary differential
    equations. Some basic knowledge on regression analysis is also required.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200 (or ECON 20210) and ECON 21020 (or ECON 21030)
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 23410. Economic Growth. 100 Units.
- code: ECON 23950
  title: Economic Policy Analysis
  units: 100
  description: Building on the tools and methods that are developed in the core courses, this course analyzes fiscal and monetary
    policy and other topical issues. We use both theoretical and empirical approaches to understand the real-world problems.
  notes: This course does not apply toward the economics major elective requirement. Students may not receive credit for both
    Econ 13000 and Econ 23950 toward the 42 degree credits.
  prereq:
    any:
    - ECON 20200
    - ECON 20210
  prereq_text: ECON 20200/20210; ECON 21020 or 21030 strongly recommended.
  terms_offered:
  - AU
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 23950. Economic Policy Analysis. 100 Units.
- code: ECON 24000
  title: Labor Economics
  units: 100
  description: 'This course is an introduction to labor economics with an emphasis on applied microeconomic theory and empirical
    analysis. Topics to be covered include: labor supply and demand, taxes and transfers, minimum wages, immigration, human
    capital, creativity over the lifecycle and unemployment. For each topic we will describe the basic economic framework
    used in the analysis, analyze associated cases of study and drawn conclusions about what we have learned. Most of the
    examples will be taken from U.S. labor data and special attention will be given to randomized trials and experimental
    methods to infer causality.'
  prereq:
    any:
    - ECON 10000
    - ECON 20000
    - ECON 20010
  prereq_text: ECON 10000/20000/20010
  terms_offered:
  - SU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 24000. Labor Economics. 100 Units.
- code: ECON 24450
  title: 'Inequality and the Social Safety Net: Theory, Empirics, and Policies'
  units: 100
  description: This course will introduce students to key economic and conceptual issues surrounding inequality and the social
    safety net. We will study the theoretical underpinnings and empirical analysis of the social safety net, focusing on the
    effects of social insurance and public assistance programs on individual and societal outcomes. After studying models
    of the insurance-incentive tradeoff, we will apply these models and econometric strategies to the empirical analysis of
    social safety net programs. We will study how social safety net programs interact with labor markets, specifically human
    capital investment and work decisions, and how they affect long-term outcomes such as income, health, well-being, and
    inequality. Students will learn how to analyze the tradeoffs involved in social safety net programs and will learn the
    current state of evidence on these programs.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20100/20110 and ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: 'ECON 24450. Inequality and the Social Safety Net: Theory, Empirics, and Policies. 100 Units.'
- code: ECON 25000
  title: Introduction To Finance
  units: 100
  description: This course develops the tools to quantify the risk and return of financial instruments. These are applied
    to standard financial problems faced by firms and investors. Topics include arbitrage pricing, the capital asset pricing
    model, and the theory of efficient markets and option pricing.
  prereq:
    all:
    - any:
      - ECON 20200
      - ECON 20210
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20200/20210 and ECON 21020/21030
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 25000. Introduction To Finance. 100 Units.
- code: ECON 25100
  title: Financial Economics; Speculative Markets
  units: 100
  description: This course focuses on the description, pricing, and hedging of basic derivative claims on financial assets.
    We study the characteristics, uses, and payoffs of a variety of contracts where the underlying claims include commodities,
    foreign currencies, bonds, stocks, or stock indices. We examine contracts such as options, swaps, and futures contracts.
    We use a unified approach (the technique of portfolio replication) to study pricing of these claims. Students also gain
    an understanding of strategies for hedging of the risks inherent in holding these derivative claims.
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - STAT 23400
      - STAT 24400
      - STAT 24410
      - ECON 21010
  prereq_text: ECON 20100/20110 and STAT 23400/24400/24410/ECON 21010
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 25100. Financial Economics; Speculative Markets. 100 Units.
- code: ECON 25120
  title: Options and Volatility Products
  units: 100
  description: This class covers the pricing and hedging of different type of financial options, as well as of volatility
    products. The class will develop the analytical tools necessary to understand the basic properties of prices and hedging
    portfolios, and to write computer code for the valuation and hedging of a very large class of derivatives. The first part
    of the course covers the valuation of European and American options on Stocks, Commodities, Futures. The second step is
    to extends it to arbitrary derivative contracts. We will start with the binomial model, and then we will introduces its
    continuous time limit, as in Black-Scholes. We will proceed to study the valuation of an arbitrary general derivative
    where the underlying follows a continuous time process. We will further extend it to the case where the derivative depends
    on several stochastic process, which is required for some cases such as interest rate products, exotic options, and most
    importantly stochastic volatility. The last part of the class develops the theory of volatility products, with emphasis
    on variance and volatility swaps, the role of VIX, and derivatives written on VIX over them.
  notes: While students don’t need to take any other finance class as prerequisite, Introduction to Finance, and especially
    Speculative Markets are very helpful as background. Students are not required to take advanced calculus or partial differential
    equations, but any knowledge in those areas will help them to take the material beyond the parts covered in class. Finally,
    I will start with basic codes in excel, and move to the codes in Matlab, but only a minimum of familiarity with writing
    computer codes is necessary.
  prereq:
    any:
    - ECON 10000
    - ECON 20000
    - ECON 20010
  prereq_text: ECON 10000/20000/20010.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 25120. Options and Volatility Products. 100 Units.
- code: ECON 25520
  title: Development Economics and Data Analysis
  units: 100
  description: 'Why do some countries grow faster than others? Why do farmers not adopt new technologies that generate higher
    yields? What is the most effective way to improve health, education and women''s empowerment in middle and low income
    countries? We will examine these questions by applying the tools of economics to the best available data. In addition
    to mastering the economic literature on development economics, students will learn applied econometric techniques and
    how to apply them in practice. They will learn how to critically evaluate data analysis and spot potential biases: is
    the outcome variable likely to be subject to social desirability bias? is there potential selection bias or attrition
    bias? What techniques are best adapted to addressing these potential biases in the data? In the final part of the course
    we will cover the role of the International Financial Institutions (the IMF and World Bank) in international development.
    The course is designed for undergraduates with a strong interest in economics and data and previous experience using statistical
    software (such as R or Stata).'
  prereq:
    all:
    - any:
      - ECON 20100
      - ECON 20110
    - any:
      - ECON 21020
      - ECON 21030
  prereq_text: ECON 20100/20110 and ECON 21020/21030
  source:
