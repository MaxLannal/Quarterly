  title: Elements of Economic Analysis IV
  units: 100
  description: This is a course in money and banking, monetary theories, the determinants of the supply and demand for money,
    the operation of the banking system, monetary policies, financial markets, and portfolio choice.
  prereq:
    any:
    - ECON 20200
    - ECON 20210
  prereq_text: ECON 20200 or 20210
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 20300. Elements of Economic Analysis IV. 100 Units.
- code: ECON 20520
  title: Formal Models of Political Economics
  units: 100
  description: Why do the Republicans and the Democrats almost always ended up choosing moderates as their party nominees
    in presidential races? How do "checks and balances" such as a legislative committee's power to set the agenda or a president's
    power to veto a bill affect policy outcomes? What leads to coalition building in a legislature and how does it affect
    the result of legislative bargaining? When can a legislature optimally delegate its power to a bureaucratic agency who
    has its own interests and agenda? To answer questions like these, we study formal models of political economics. Such
    models examine explicitly the incentives of participants in political processes and generate predictions of their behavior
    based on such incentives and any confounding strategic considerations. Our approach is largely game theoretical. Familiarity
    with fundamental game theoretical ideas like the strategic and extensive games, the Nash Equilibrium, and the Subgame
    Perfect Equilibrium is essential and assumed.
  notes: Students may count either ECON 20510 or ECON 20520, but not both, toward the 42 credits required for graduation.
  prereq:
    any:
    - ECON 10700
    - ECON 20100
    - ECON 20110
    - ECON 20700
  prereq_text: ECON 10700 or ECON 20100 or ECON 20110 or ECON 20700
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 20520. Formal Models of Political Economics. 100 Units.
- code: ECON 20700
  title: Game Theory and Economic Applications
  units: 100
  description: This course introduces the basic ideas and applications of game theory. Topics include models of games in extensive
    and strategic form, equilibria with randomization, signaling and beliefs, reputation in repeated games, bargaining games,
    investment hold-up problems, and mediation and incentive constraints.
  prereq:
    any:
    - ECON 20100
    - ECON 20110
  prereq_text: ECON 20100/20110
  terms_offered:
  - WI
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 20700. Game Theory and Economic Applications. 100 Units.
- code: ECON 20770
  title: Decision and Strategy
  units: 100
  description: This course provides a formal introduction to game theory with applications in economics. We will study models
    of how individuals make decisions, and how those decisions are shaped by strategic concerns and uncertainty about the
    world. The topics will include the theory of individual choice, games of complete and incomplete information, and equilibrium
    concepts such as Nash equilibrium. The applications will include oligopoly, auctions, and bargaining. The course is appropriate
    for advanced undergraduates who are interested in a rigorous mathematical approach to understanding human behavior.
  crosslists:
  - ECMA 30770
  prereq_text: 'Prerequsites for Undergraduates: ECON 20100/ECON 20110 and MATH 20300/MATH 20310/MATH 20700, or consent of
    instructor'
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 20770. Decision and Strategy. 100 Units.
  needs_review: true
- code: ECON 20780
  title: Decision and Strategy II
  units: 100
  description: We continue the formal introduction to decision theory and game theory begun in ECMA 30780, with a specific
    focus on models of incomplete information. Topics covered include subjective expected utility, Bayesian games, contract
    theory, and mechanism design. Among the applications we will consider are auctions, collusion, entry deterrence, and strategic
    communication. The course is appropriate for advanced undergraduates who are interested in a rigorous mathematical approach
    to decision making in strategic situations.
  crosslists:
  - ECMA 30780
  prereq:
    any:
    - ECON 20770
    - ECMA 30770
    - consent: instructor
  prereq_text: ECON 20770/ECMA 30770 or consent of instructor
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/economics/
    quote: ECON 20780. Decision and Strategy II. 100 Units.
- code: ECON 21020
  title: Econometrics
  units: 100
  description: Required of students who are majoring in economics; those students are encouraged to meet this requirement
    by the end of their third year. This course covers the single and multiple linear regression model, the associated distribution
    theory, and testing procedures; corrections for heteroskedasticity, autocorrelation, and simultaneous equations; and other
    extensions as time permits. Students also apply the techniques to a variety of data sets using PCs.
  prereq:
