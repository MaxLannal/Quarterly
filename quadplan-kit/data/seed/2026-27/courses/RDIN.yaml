- code: RDIN 24002
  title: 'Colonizations II: Imperial Expansion, Anti-Imperialism, and Nation in Asia'
  units: 100
  description: This quarter addresses the histories of modern European and Japanese colonialism in Asia and their interconnection
    within the Pacific and Indian Ocean worlds. Themes examined include the logics and dynamics of imperial expansion and
    rule; Orientalist discourses; uprisings and anti-imperial movements; the rise of nationalisms; and paths to decolonization
    in the region.
  core_tags:
