- code: RDIN 24001
  title: 'Colonizations I: Colonialism, Enslavement and Resistance in the Atlantic World'
  units: 100
  description: This quarter examines the making of the Atlantic world in the aftermath of European colonial expansion. Focusing
    on the Caribbean, North and South America, and western Africa, we cover the dynamics of invasion, representation of otherness,
    enslavement, colonial economies and societies, as well as resistance and revolution.
  notes: This sequence meets the general education requirement in civilization studies. This course is offered every year.
    These courses can be taken in any sequence.
  core_tags:
