- code: RDIN 24003
  title: 'Colonizations III: Decolonization, Revolution, Freedom'
  units: 100
  description: The third quarter of the Colonizations sequence considers the processes and consequences of decolonization
    both in newly independent nations and former colonial powers. Through an engagement with postcolonial studies, we explore
    the problematics of freedom and sovereignty; anti-colonial movements, thinking and struggles; nation-making and nationalism;
    and the enduring legacies of colonialism.
