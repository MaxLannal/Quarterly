- code: CRWR 12136
  title: 'Reading as a Writer: Adaptation as Form'
  units: 100
  description: The main goal of this course will be to understand the reasons, traditions and methods behind the practice
    of literary adaptations. From Joyce Carol Oates's "Blue Bearded Lover," to Anne Sexton's "Cinderella", to Angela Carter's
    "Wolf-Alice" and Marina Carr's "By the Bog of Cats," there are stories that continue to resonate through the centuries,
    and others that are made to resonate through the labor of new story tellers. Each text will be explored both independently
    and within the context of its adaptive genealogy. Students will be expected to read each text carefully, come prepared
    to actively participate in class discussion and respond to both academic and creative writing prompts based on assigned
    texts and class lecture.
  core_tags:
  - arts
  prereq_text: If the course is listed as consent required or closed, please reach out to the instructor to enroll or to be
    added to the waitlist. Attendance on the first day is mandatory.
  terms_offered:
