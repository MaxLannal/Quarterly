- code: CRWR 12165
  title: 'Intro to Genres: Short Form Screenwriting'
  units: 100
  description: This course explores short form screenwriting, as distinct from feature-length or episodic screenwriting. In
    addition to studying the essential elements of a screenplay, we will read, view, and discuss approaches to scripting brief
    documentary, poetic, and fictional time-based works. This work will prepare us for in- and out-of-class writing exercises
    in these modes, which students will often discuss in a workshop environment. Students will respond in creative and critical
    ways to the screenings and readings; present on a specific time-based work or creator; and write in the short screenwriting
