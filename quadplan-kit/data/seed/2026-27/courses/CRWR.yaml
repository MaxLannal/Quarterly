- code: CRWR 12150
  title: 'Intro to Genres: Writing for TV: The Writers'' Room'
  units: 100
  description: In this course, you'll learn the craft of writing for television by collaboratively developing a pilot script
    for an original television series set in the South Side of Chicago. Modeled on the "writers' room," we'll research and
    develop the concept, characters, the outline, and create a plan for the series. In addition to being introduced to the
    fundamentals of storytelling through lectures, discussions, screenings, and script analysis, you'll also learn to work
    collaboratively with a team, constructing a daily agenda, brainstorming, researching, pitching, discussing ideas, and
    composing in screenwriting format. By the end of this hands-on course, you will be armed with a set of techniques and
    skills that will support your professional development as a writer.
  core_tags:
  - arts
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/creativewriting/
    quote: 'CRWR 12150. Intro to Genres: Writing for TV: The Writers'' Room. 100 Units.'
- code: CRWR 12151
  title: 'Intro to Genres: The Gothic Lens'
  units: 100
  description: Like the monsters it so often portrays, Gothic fiction is at once a transgressive, seductive, and mutable genre-blending
    horror, mystery, and romance and using supernatural elements to blur the line between realism and fantasy. It's amid this
    ambiguity that the Gothic is at its most evocative and visceral, powerfully dramatizing our encounters with the irrational
    and inexplicable in nature, in others, and in ourselves. This Arts Core course will focus on these psychologically provocative
    aspects of the genre. As we read Gothic works from different eras and cultures, we'll examine what these stories of extraordinary
    conflict might reveal about the horrors and mysteries of ordinary life-of our hidden desires, anxieties, and pathologies.
    Crucially, we'll approach them from the writer's perspective and consider what the Gothic enables a writer to explore
    and express that other genres may not. With this in mind, students will write their "Gothic Scenes" throughout the quarter,
    applying their own intimate Gothic lens to elusive encounters from their past.
  core_tags:
  - arts
  prereq_text: If the course is listed as consent required or closed, please reach out to the instructor to enroll or to be
