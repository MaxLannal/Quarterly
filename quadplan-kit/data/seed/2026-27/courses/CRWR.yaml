- code: CRWR 12112
  title: 'Reading as a Writer: Chicago "City on the Remake"'
  units: 100
  description: This course invites writers to reconsider the influence of Chicago's public spaces on artistic impulse. In
    particular this quarter, we will examine aspects and depictions of a "fantastic Chicago." If Chicago is a city that "dreams
    itself," what do its spaces of violence and environmental degradation say about that dream? Students will analyze and
    explore Chicago writers' work in prose and poetry, then develop their own creative responses, building connections to
    adopted critical approaches. To these ends, we will examine work by writers including Daniel Borzutzky, Barry Pearce,
    Sterling Plumpp, Ed Roberson, and Ava Tomasula y Garcia, as well as the city's rich legacies in documentary and the visual
    arts.
  core_tags:
