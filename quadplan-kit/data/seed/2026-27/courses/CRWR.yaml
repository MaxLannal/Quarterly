- code: CRWR 12184
  title: 'Reading as a Writer: Violence and Comedy'
  units: 100
  description: According to Mel Brooks, "Tragedy is when I cut my finger. Comedy is when you fall into an open sewer and die."
    It isn't easy to argue with Brooks, yet there exist numerous wildly successful marriages between violence and comedy for
    which his maxim doesn't fully account. In this class, we will explore such marriages-works by Helen Garner, Juan Pablo
    Villalobos, Laura Vasquez, Daniil Kharms, Franz Kafka, Ludmilla Petrushevskaya, Isaac Babel, Ralph Ellison, and more-and
    we'll attempt to better understand their success. In the process, we'll seek to develop a clearer sense of the twisting
    border that separates comedic from tragic violence. Students will read the assigned works closely, discuss them with rigor,
    and write violent and comic fiction of their own.
  core_tags:
