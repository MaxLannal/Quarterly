- code: CRWR 12171
  title: 'Intro to Genres: True Crime Fiction'
  units: 100
  description: From 19th century penny dreadfuls to the more recent explosion of podcasts and documentaries, True Crime has
    long endured as a popular narrative genre. Yet, despite the genre's popularity, there is contention around its potential
    exploitation of victims, romanticization of violence, and lurid positioning as "entertainment." This course aims to critically
    examine the narrative tropes, appeals, and language of the true crime genre by engaging with works of True Crime fiction,
    including both works of fiction based on "true" events (such as Underneath by Lily Hoang, Butter by Asako Yuzuki, and
    My Men by Victoria Kielland) and entirely fictionalized works that develop themselves as convincing True Crime facsimiles
    (such as Defiance by Carole Maso, My Sister, the Serial Killer by Oyinkan Braithwaite, and Death in Her Hands by Ottessa
    Moshfegh). The course will include reading discussions, short weekly written responses, and a project wherein students
    compare and contrast two alternate "versions" of a True Crime story.
  core_tags:
