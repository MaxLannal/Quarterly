- code: CRWR 12173
  title: 'Intro to Genres: You Didn''t Hear This From Me'
  units: 100
  description: 'Gossip, rumor, scandal, hearsay: from Heian period Japan to contemporary gossip columns, marginal channels
    of information have been an essential vehicle for storytelling, information transmission, and entertainment. In this class,
    we will explore the role of marginal, subversive, and communal forms of communication as both a tool and a topic in literature.
    From pushing plot forward to challenging power dynamics, we will examine the practical and ethical potential of gossip
    in fiction, poetry, and nonfiction. Students will read broadly across genres and styles then apply what they''ve learned
    in two creative pieces culminating in a final reflective paper that details the writer''s choices in revision and their
    creative pieces''s connection to the class topic.'
