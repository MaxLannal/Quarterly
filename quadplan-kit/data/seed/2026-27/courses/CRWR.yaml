- code: CRWR 12159
  title: 'Reading as a Writer: The Bad Girls Club'
  units: 100
  description: 'Jezebels, witches, femme fatales, nasty women, sirens, madwomen, and murderesses: the world over, these women
    of many names-whom we''ll collectively refer to as "the Bad Girls Club"-have alternately inspired the disdain and delight
    of multitudes. Whether jailed, expelled, excommunicated, or burned at the stake, their antiheroic antics have challenged,
    critiqued, or, some might say, corrupted the laws, mores, and sensibilities of societies. If it is true that polite, well-behaved
    women rarely make history, then what do impolite, badly-behaved women teach us about the construction of his story? In
    this course, we''ll examine literature from around the world featuring members of the "Bad Girls Club," who, in opposing
    complimentary constructions of femininity, femaleness, and power invite introspection on the gendered nature of story
    and storytelling. In short critical papers, we''ll analyze the tropes, features, and conventions of literature featuring
    these bad characters, and in short exercises, you''ll write stories, poetry, and essays inspired by them.'
  core_tags:
