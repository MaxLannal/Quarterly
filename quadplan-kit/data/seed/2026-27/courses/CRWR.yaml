- code: CRWR 12170
  title: 'Reading as a Writer: Literary Tyrants'
  units: 100
  description: 'This course explores the characteristics and features of non-democratic regimes and tyrannies as they are
    reflected in literature and film: how and why they come about, what sustains them, why some resist them and others do
    not, and how/why they fall. Analyzing films, novels, and articles left in the wake of dictatorships like those of Julius
    Caesar, Hitler, and Rafael Trujillo, we will investigate the effects of absolute authority, how ordinary people react
    to repression, and the shaky transition from despotism to freedom. We will consider a diverse range of writers including
    Suetonius, Shakespeare, Gabriel Garcia Marquez, Hannah Arendt, and George Orwell. Assignments include critical essays,
    creative exercises, and a final creative piece.'
  core_tags:
