- code: CRWR 12183
  title: 'Intro to Genres: The Grammars of Narrative'
  units: 100
  description: Ever since humans were drawing on cave walls, the ways in which we communicate meaning through stories has
    been evolving. This class will look at three forms of narrative-fiction, narrative poetry, and film-and explore their
    "grammars" (i.e. the modes, tools, elements of craft, etc. that a particular genre uses to convey meaning or achieve certain
    effects). How does film (a visual medium that offers a voyeuristic experience) tell a story differently than does fiction
    (which invites the reader to participate more in an act of shared imagination), differently than poetry (which condenses
    a story to its essences)? How is meaning or emotion conveyed differently through each? How do different grammars influence
    the effects they achieve? Students will look at and discuss various works of fiction, poetry, and film, read critical
    and craft-oriented texts, complete weekly reading responses, and write creative exercises. A hybrid creative/analytical
    paper will be due at the end of the course.
  core_tags:
