- code: CRWR 12147
  title: 'Intro to Genres: The River''s Running Course'
  units: 100
  description: 'Rivers move--over land, through history, among peoples--and they make: landscapes and civilizations. They
    are the boundaries on our maps, the dividers of nations, of families, of the living and the dead, but they are also the
    arteries that connect us. They are meditative, meandering journeys and implacable, surging power. They are metaphors but
    also so plainly, corporeally themselves. In this course, we will encounter creative work about rivers, real and imaginary,
    from the Styx to the Amazon. Through poetry, fiction, nonfiction, and drama, we will consider what rivers are, what they
    mean to us, and how they are represented in art and literature. Rivers will be the topic and inspiration for our own creative
    writing, too. The goal for this course is to further your understanding of creative writing genres and the techniques
    that creative writers employ to produce meaningful work in each of those genres. You will also practice those techniques
    yourselves as write your own creative work in each genre. Our weekly sessions will involve a mixture of discussions, brief
    lectures, student presentations, mini-workshops and in-class exercises. Most weeks, you will be responsible for a creative
    and/or critical response (300-500 words) to the reading, and the quarter will culminate in a final project (7-10 pages)
    in the genre of your choice, inspired by the Chicago River.'
  core_tags:
  - arts
  crosslists:
  - CHST 12147
  prereq_text: If the course is listed as consent required or closed, please reach out to the instructor to enroll or to be
    added to the waitlist. Attendance on the first day is mandatory.
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/creativewriting/
    quote: 'CRWR 12147. Intro to Genres: The River''s Running Course. 100 Units.'
