- code: LACS 16100
  title: Introduction to Latin American Civilization I
  units: 100
  description: Autumn Quarter examines the origins of native civilizations in Latin America, with a focus on the political,
    social, and cultural dimensions of the major pre-Columbian civilizations (the Maya, the Inca, and the Aztecs); the causes
    and consequences of the Spanish and Portuguese conquests; and the establishment of colonial societies and economies in
    the 16th century.
  notes: 'Fulfills the following requirements in the ARTH major and minor: Latin American'
