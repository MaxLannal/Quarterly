- code: GNSE 15002
  title: Gender and Sexuality in World Civilizations I
  units: 100
  description: The first quarter of the GNSE Civ sequence offers a historical examination of bodies, sex, and gender. Through
    a series of readings that include historical primary sources and examples of cultural production from antiquity to the
    present, we will investigate how bodies across a variety of cultures become sexed and gendered. In particular, we will
    ask how the very categories of sex and gender not only produce social meaning from bodies and their anatomical differences
    but may also be complicit in acts violence, oppression, and colonization. Thematically we will pay attention to the emergence
    and critique of the distinction between sex and gender; resistances to the gender binary; the relationship between gender,
    power, and authority; feminism and critiques of Western feminism; the category of woman as an object of scientific knowledge;
    and the flourishing of and violence against trans life. Finally, while we will be dealing with historical accounts in
    this course, the aim is to understand how the regulation of bodies in the past has informed and may challenge our understanding
    of the diversity of embodied experience in the present.
  notes: This sequence meets the general education requirement in civilization studies. This course is not available for First
    Year Preregistration.
  core_tags:
  - civilization
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: GNSE 15002. Gender and Sexuality in World Civilizations I. 100 Units.
- code: GNSE 15003
  title: Gender and Sexuality in World Civilizations II
  units: 100
  description: 'The second half of the civ sequence will extend our earlier interrogation of bodies, sex, and gender into
    an examination of sexualities and socialities. Through an encounter with theoretical texts, literature, and art, we will
    investigate a series of important critiques of biopower, or statist strategies for regulating bodies and controlling populations.
    These interventions include critiques of nationalism, colonialism, capitalism, and heteronormativity, all of which, as
    we will see, contribute to our understanding of sexuality. Throughout the course, feminist and queer critique will fundamentally
    frame our analyses of power, desire, and sexuality. PQ: GNSE 15002.'
  notes: This sequence meets the general education requirement in civilization studies.
  core_tags:
  - civilization
  prereq: GNSE 15002
  prereq_text: GNSE 15002
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: GNSE 15003. Gender and Sexuality in World Civilizations II. 100 Units.
