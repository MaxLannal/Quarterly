- code: NEHC 20012
  title: 'Ancient Empires II: The Ottoman Empire'
  units: 100
  description: The Ottomans ruled in Anatolia, the Middle East, South East Europe and North Africa for over six hundred years.
    The objective of this course is to understand the society and culture of this bygone Empire whose legacy continues, in
    one way or another, in some twenty-five contemporary successor states from the Balkans to the Arabian Peninsula. The course
    is designed as an introduction to the Ottoman World with a focus on the cultural history of the Ottoman society. It explores
    identities and mentalities, customs and rituals, status of minorities, mystical orders and religious establishments, literacy
    and the use of the public sphere.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
