- code: NEHC 20015
  title: 'Ancient Empires V: The Umayyad'
  units: 100
  description: 'The Umayyads ruled over the last "great empire" of late antiquity: the early Islamic empire, spanning from
    the Atlas to the Hindu Kush, from the Atlantic to the Amu Darya, and embracing regions with different cultural and political
    traditions. This course introduces to the history of the Umayyad caliphate, focusing on some of the visible legacies its
    inhabitants left behind: texts, objects, and monumental buildings that are still standing in cities of the Middle East
    and Europe. But we will also reflect upon less material legacies: for example, cities with a long-lasting urban culture,
    infrastructures for communicating across a vast empire, the consolidation of religious traditions, and exchanges and cohabitation
    of different religious groups.'
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
