- code: NEHC 20013
  title: Ancient Empires III :The Egyptian Empire of the New Kingdom
  units: 100
  description: For most of the duration of the New Kingdom (1550-1069 BC), the ancient Egyptians were able to establish a
    vast empire and becoming one of the key powers within the Near East. This course will investigate in detail the development
    of Egyptian foreign policies and military expansion which affected parts of the Near East and Nubia. We will examine and
    discuss topics such as ideology, imperial identity, political struggle and motivation for conquest and control of wider
    regions surrounding the Egyptian state as well as the relationship with other powers and their perspective on Egyptian
    rulers as for example described in the Amarna letters.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
