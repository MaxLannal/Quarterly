- code: NEHC 20014
  title: 'Ancient Empires IV: the Achaemenid Empire'
  units: 100
  description: This course introduces students to the Achaemenid Empire, also known as the First Persian Empire (ca. 550-330
    BCE). We will be examining the political history and cultural accomplishments of the Achaemenids who, from their homeland
    in modern-day Iran, quickly rose to become one of the largest empires of the ancient world, ruling from North Africa to
    North India at their height. We will also be examining the history of Greek-Persian encounters and the image of the Achaemenids
    in Greek and Biblical literature. The students will visit the Oriental Institutes' archive and object collection to learn
    more about the University of Chicago's unique position in the exploration, excavation, and restoration of the Persian
    Empire's royal architecture and administrative system through the Persian Expedition carried out in the 1930s.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
