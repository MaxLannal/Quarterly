- code: NEHC 20603
  title: Islamic Thought & Lit III - The Experience of Being Colonized
  units: 100
  description: This course explores the multilayered nature of colonialism in the modern Middle East-military, institutional,
    ideological, educational, and economic-and surveys the different ways in which it was experienced by different Middle
    Easterners. The sources discussed range from historical accounts and autobiographies to novels, short stories, movies,
    and visual art. Through these sources, we consider questions such as, Is there something distinctive about Western colonialism?
    Is the distinction between colonialism and postcolonialism meaningful? Is colonialism a form of globalization (or vice
    versa)?
  core_tags:
