- code: NEHC 20016
  title: 'Ancient Empires VI: The Assyrian Empire'
  units: 100
  description: This course will examine the concept and definition of empire and the practices of imperial control through
    a case study of Mesopotamia's best-known empire, the Neo-Assyrian (first half of the 1st millennium BCE). At its peak,
    the Assyrians ruled a vast area covering most of modern Iraq and Syria, plus parts of Iran, Turkey and the Levant, with
    aspirations to control Egypt. The gradual expansion of this empire from late 2nd millennium BCE beginnings and its extremely
    rapid collapse in ca. 612 BCE provide an excellent example of the tensions within trajectories of empire. The course themes
    include warfare and political strategies, identity and ethnicity, imperial bureaucracy, and the practical and ideological
    purposes of infrastructure building. Evidence examined will include texts (in translation) and the archaeological record
    at various scales, from settlements through artworks. We will also examine paradoxes, such as the contrast between textual
    claims of hegemony and limited archaeological evidence for this, and the power of visual propaganda versus its select
    audience.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
  - civilization
  crosslists:
  - HIST 20405
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20016. Ancient Empires VI: The Assyrian Empire. 100 Units.'
- code: NEHC 20017
  title: 'Ancient Empires VII: Sumerians and Akkadians'
  units: 100
  description: The course introduces students to the first 'empires' in the ancient Middle East. We will study the earliest
    attempts under both Sumerian and Akkadian leadership at unifying the old Sumerian city states in what is today southern
    Iraq in the mid-third millennium BCE. Our focus will then be on the two successful empires that arose from these attempts,
    namely the one founded by Sargon of Akkade in ca. 2300 BCE and the one ruled by the Third Dynasty of Ur from 2092-2003
    BCE. While exploring a rich variety of sources, both textual and from archaeological contexts, we will pay particular
    attention to understanding expansionist efforts, strategies of empire building, the establishment of a centralized state
    bureaucracy, ideologies of kingship, ethnicity and identity, as well as rebellions against the new political system and
    theories about why these early empires began to crumble after only a few generations. Since these new forms of dominion
    were tested and developed for the first time in this formative period and kings of these dynasties acquired a special
    status in Mesopotamian cultural memory, this course provides a solid base for understanding the later development of ancient
    Middle Eastern history but can also be studied for the sake of understanding early empire formation.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
  - civilization
  crosslists:
  - HIST 20406
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20017. Ancient Empires VII: Sumerians and Akkadians. 100 Units.'
- code: NEHC 20018
  title: 'Ancient Empires VIII: Arabia and the Arabs - on the edge of empire (3000 BCE to the 7th century CE)'
  units: 100
  description: This course will explore the development of the Arabian Peninsula and Arab identity from the earliest times
    to shortly after the rise of Islam. Using mainly archaeological evidence, but considering also epigraphic, textual, and
    linguistic evidence, it will examine a range of case studies chosen to provide an overview of regional developments from
    the Bronze Age to the Late Antique period. A key text will be Hoyland's (2001) Arabia and the Arabs; from the Bronze Age
    to the coming of Islam, which will be brought up to date through examination of recent archaeological and epigraphic evidence.
    The course will also examine the way in which the empires and powers surrounding Arabia (eg Mesopotamia, the Indus, Rome/Byzantium,
    the Persian empires) affected the development of a this relatively marginal (in economic terms) region, leading to the
    rise of Islamic/Arab empire in the 7th century.
  core_tags:
  - civilization
  crosslists:
  - HIST 25604
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20018. Ancient Empires VIII: Arabia and the Arabs - on the edge of empire (3000 BCE to the 7th century CE)'
- code: NEHC 20601
  title: Islamic Thought and Literature I
  units: 100
  description: In the first quarter of Islamic Thought and Literature, students will explore the intellectual and cultural
    history of the Islamic world in its various political and social contexts. Chronologically, the course begins with emergence
    of Islam in the 7th century CE and continues through the Mongol conquests until the rise of the "gunpowder empires" circa
    1500. Students will leave the course with a historical and geographical framework for understanding the history of the
    Middle East and a familiarity with the major forms of premodern Islamic cultural production (e.g., history-writing, scriptural
    exegesis, poetry, philosophy, jurisprudence, etc.). Students will also develop the skills and contextual knowledge necessary
    for analyzing these sources in English translation; they will thus come to appreciate premodern Islamic cultural products
    on their own terms while engaging in the collective work of historical interpretation. No prior background in the subject
    is required. This sequence meets the general education requirement in civilization studies.
  core_tags:
  - civilization
  crosslists:
