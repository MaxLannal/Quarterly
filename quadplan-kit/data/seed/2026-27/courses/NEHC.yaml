  - SOSC 22000
  - MDVL 20601
  - HIST 25610
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: NEHC 20601. Islamic Thought and Literature I. 100 Units.
- code: NEHC 20602
  title: Islamic Thought and Literature II
  units: 100
  description: In the second quarter of Islamic Thought and Literature, students will explore the Islamic world in its various
    political, social, and intellectual aspects. Chronologically, the course begins with the consolidation of the "gunpowder
    empires" in the 16th Century and continues into the modern era. Students will leave the course with a historical and geographical
    framework for understanding the history of the Middle East and a familiarity with the major debates such as state reform
    efforts, Islamic modernism, and nationalism; new genres (e.g., the novel); and new modes of communication, such as journals
    and newspapers. No prior background in the subject is required.Participation in the first quarter of the sequence is assumedThis
    sequence meets the general education requirement in civilization studies.
  notes: Taking these courses in sequence is recommended but not required. This sequence meets the general education requirement
    in civilization studies.
