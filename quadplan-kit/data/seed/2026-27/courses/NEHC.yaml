- code: NEHC 20004
  title: 'Ancient Near Eastern Thought and Literature I: Mesopotamian Literature'
  units: 100
  description: This course gives an overview of the richness of Mesopotamian Literature (modern Iraq) written in the 3rd-1st
    millennium BC. We will read myths and epics written on clay tablets in the Sumerian and Akkadian language in English translation
    and discuss content and style, but also the religious, cultural and historic implications. Particular focus will be on
    the development of stories over time, the historical context of the literature and mythological figures. The texts treated
    cover not only the famous Epic of Gilgamesh, but also various legends of Sumerian and Akkadian kings, stories about Creation
    and World Order, and destruction. The topics covered range from the quest for immortality, epic heroes and monsters, sexuality
    and love.
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
  - civilization
  crosslists:
  - SOSC 20004
  terms_offered:
  - AU
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20004. Ancient Near Eastern Thought and Literature I: Mesopotamian Literature. 100 Units.'
- code: NEHC 20005
  title: 'Ancient Near Eastern Thought & Literature II: Anatolian Lit'
  units: 100
  description: 'The goal of this class is to get an overview of Hittite literature, as "defined" by the Hittites themselves,
    in the wider historical-cultural context of the Ancient Near East. Some of the most important questions we can ask ourselves
    in reading ancient texts are: why were they written down, why were they kept, for whom were they intended, and what do
    the answers to these questions (apart from the primary content of the texts themselves) tell us about - in our case -
    Hittite society?'
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
  - civilization
  crosslists:
  - SOSC 20005
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20005. Ancient Near Eastern Thought & Literature II: Anatolian Lit. 100 Units.'
- code: NEHC 20006
  title: 'Ancient Near Eastern Thought & Literature III: Ancient Egyptian Literature'
  units: 100
  description: This course explores the rich body of literature surviving from ancient Egypt, covering texts spanning ca.
    2500 BCE-100 CE. We will read texts in English translation from a variety of genres-from adventure tales, to love poetry,
    to autobiographies and the Book of the Dead-asking throughout the quarter how the ancient Egyptians understood the concept
    of literature, how translation affects our experiences of the texts, who the authors and audiences were, and how the texts
    relate to their social, historical, and cultural contexts. We will also explore how literary conventions changed over
    time and what they reveal about broader societal shifts in ancient Egypt.
  core_tags:
  - civilization
  crosslists:
  - SOSC 20006
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/civilizationstudies/
    quote: 'NEHC 20006. Ancient Near Eastern Thought & Literature III: Ancient Egyptian Literature. 100 Units.'
- code: NEHC 20011
  title: 'Ancient Empires I: The Hittite Empire'
  units: 100
  description: 'This course introduces students to the Hittite Empire of ancient Anatolia. In existence from roughly 1750-1200
    BCE, and spanning across modern Turkey and beyond, the Hittite Empire is one of the oldest and largest empires of the
    ancient world. We will be examining their history and their political and cultural accomplishments through analysis of
    their written records - composed in Hittite, the world''s first recorded Indo-European language - and their archaeological
    remains. In the process, we will also be examining the concept of "empire" itself: What is an empire, and how do anthropologists,
    archaeologists, and historians study this unique kind of political formation?'
  notes: Taking these courses in sequence is not required. This sequence meets the general education requirement in civilization
    studies.
  core_tags:
  - civilization
  crosslists:
