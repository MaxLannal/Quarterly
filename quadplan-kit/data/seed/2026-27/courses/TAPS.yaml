- code: TAPS 10900
  title: Moving and Thinking / Thinking and Moving
  units: 100
  description: 'Though we often imagine a divide between the physical practice of dance training and the intellectual practice
    of dance history and theorization, in reality they overlap: movement training is embodied research and a form of intellectual
    labor, while dance theorization and scholarship is deeply connected to the physicality of thought. This course offers
    an introduction to dance with an integrated approach to thinking and doing. Students will explore a range of embodied
    research methodologies that draw from improvisational forms, codified techniques, and social and cultural dance practices.
    No prior dance experience is required for this hybrid seminar/ studio course.'
  notes: 'Attendance at first class meeting is mandatory. This course meets the general education requirement in the arts.
    For questions regarding this class please contact Vicki Walden, vwalden@uchicago.edu. Waitlists for TAPS core courses
    open after resolution for that quarter is complete. To be considered for the waitlist, you must sign up here: https://forms.gle/G62skjnAZFmhHcL88
    (do NOT send a consent request to the instructor).'
