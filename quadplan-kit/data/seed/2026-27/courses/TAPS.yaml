- code: TAPS 10100
  title: 'Drama: Embodiment and Transformation'
  units: 100
  description: This course introduces students to a range of theatrical concepts and techniques, including script analysis
    and its application to staging, design and acting. Throughout, we investigate how theater - as a collaborative art form
    - tells stories. Students will act, direct, and design. In doing so, they will gain an understanding of a variety of processes
    by which scripts are realized in the theater, with an emphasis on the text's role in production rather than as literature.
  notes: 'Attendance at first class meeting is mandatory. This course meets the general education requirement in the arts.
