- code: TAPS 10300
  title: Text and Performance
  units: 100
  description: 'This course offers an introduction to a number of significant dramatic works and seminal figures in the theorization
    of theater and performance. But the course''s aspirations go much further: we will be concentrating upon the intersection
    of interpretation and enactment, asking how these pieces appear on stage and why. This will not be merely descriptive
    work, but crucially it will be interpretive and physical work. Students will prepare and present applied interpretations-that
    is, interpretations that enable conceptual insights to take artistic form. Throughout, we will be searching for that elusive
    combination of philological rigor, theoretical sophistication, and creative inspiration-probing the theoretical stakes
    of creativity and testing the creative implications of analytic insights.'
  notes: 'Attendance at first class meeting is mandatory. This course meets the general education requirement in the arts.
    Waitlists for TAPS core courses open after resolution for that quarter is complete. To be considered for the waitlist
    you must sign up here: https://forms.gle/G62skjnAZFmhHcL88 (do NOT send a consent request to the instructor).'
  core_tags:
