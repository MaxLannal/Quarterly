- code: TAPS 10800
  title: Contemporary Dance Practices
  units: 100
  description: This hybrid studio/seminar course offers an overview of the formal techniques, cultural contexts, and social
    trends that shape current dance practices. Through both scholarly and practical approaches to course content, students
    will gain a working knowledge of a wide range of formal and aesthetic approaches to dance. Other topics include the influence
    of pop culture, the role of cultural appropriation, and the privileging of Western-based perspectives within dance presentation,
    education, scholarship, and criticism. Selected readings and viewings will supplement movement practice. No previous experience
    with dance or performance is required. This course meets the general education requirement in the arts.
  notes: Attendance at first class meeting is mandatory. This course meets the general education requirement in the arts.
    Wait list requests for TAPS core courses are due several weeks before the quarter begins. Sign up for the wait list at
    https://forms.gle/G62skjnAZFmhHcL88
  core_tags:
