  source:
    url: http://collegecatalog.uchicago.edu/thecollege/theaterperformancestudies/
    quote: TAPS 10300. Text and Performance. 100 Units.
- code: TAPS 10700
  title: Introduction to Stage Design
  units: 100
  description: 'Approaching theatrical design as a visual art, we will achieve a basic understanding of the theory, methodology
    and artistic expression fundamental to each area of design for the stage: scenic, costume, lighting, sound, and projections.
    We will learn how each discipline approaches and executes visual (aural in the case of sound) communication involved in
    the design process. Students will learn the professional design process, from contracting through production. Projects
    for this course will be completed using a combination of mediums and materials. Creativity in the execution of visual
    communication will be of great importance. Students will learn to show collaborators ideas instead of talking about them.'
  notes: 'Attendance at first class meeting is mandatory. This course meets the general education requirement in the arts.
    Waitlists for TAPS core courses open after resolution for that quarter is complete. To be considered for the waitlist
    you must sign up here: https://forms.gle/G62skjnAZFmhHcL88 (do NOT send a consent request to the instructor).'
