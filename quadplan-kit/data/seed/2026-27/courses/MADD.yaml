- code: MADD 23620
  title: Internet Censorship and Online Speech
  units: 100
  description: Information dissemination and online discourse on the Internet are subject to the algorithms and filters that
    operate on Internet infrastructure, from network firewalls to search engines. This course will explore the technologies
    that are used to control access to online speech and information, and cutting-edge technologies that can empower citizens
    in the face of these information controls. Students will learn about and experiment with technologies to control online
    discourse, ranging from firewalls that perform network traffic filtering to algorithms for content personalization and
    content moderation. We will also explore underlying technical trends, such as the increasing consolidation of Internet
    infrastructure and protocols, and the implications of consolidation for control over online discourse. Each course meeting
    will include a technical overview, reading discussion, and a hands-on laboratory activity.
  crosslists:
  - PARR 33260
  - CMSC 33260
  - CMSC 23260
  prereq_text: None
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 23620. Internet Censorship and Online Speech. 100 Units.
  needs_review: true
- code: MADD 25300
  title: Introduction to Human-Computer Interaction
  units: 100
  description: 'An introduction to the field of Human-Computer Interaction (HCI), with an emphasis in understanding, designing
    and programming user-facing software and hardware systems. This class covers the core concepts of HCI: affordances, mental
    models, selection techniques (pointing, touch, menus, text entry, widgets, etc), conducting user studies (psychophysics,
    basic statistics, etc), rapid prototyping (3D printing, etc), and the fundamentals of 3D interfaces (optics for VR, AR,
    etc). We compliment the lectures with weekly programming assignments and two larger projects, in which we build/program/test
    user-facing interactive systems.'
  crosslists:
  - CMSC 30300
  - CMSC 20300
  prereq:
    any:
    - CMSC 14200
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14200 or CMSC 15400 or CMSC 22000
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 25300. Introduction to Human-Computer Interaction. 100 Units.
- code: MADD 26210
  title: Media Art and Design Practice
  units: 100
  description: 'This studio-based course explores the practice, conventions, and boundaries of contemporary media art and
    design. This can encompass areas as diverse as interactive installation, app design, and the Internet meme. Through projects
    and critical discussion, students engage with the problems and opportunities of digitally driven content creation. Fundamental
    elements of digital production are introduced, including basic properties of image, video, and the global network. Further
    topics as varied as--though not limited to--web production, digital fabrication, interfaces, the glitch, and gaming may
    be considered. Sections will vary based on the instructor''s fields of expertise. This course meets the general education
    requirement in the arts. This course may not double count for general education requirements and the Media Arts and Design
    minor. However, it is a great way for students to explore a potential interest in these areas. During the academic year,
    students must attend the first course session to confirm enrollment. Students aiming to get into the course after registration
    or during drop/add must use the waitlist to request to enroll. WAITLIST: https://forms.gle/WjLWCguW42GpcoRBA'
  core_tags:
  - arts
  crosslists:
