    quote: 'MADD 20370. Inclusive Technology: Designing for Underserved and Marginalized Populations. 100 Units.'
- code: MADD 20380
  title: Actuated User Interfaces and Technology
  units: 100
  description: The recent advancement in interactive technologies allows computer scientists, designers, and researchers to
    prototype and experiment with future user interfaces that can dynamically move and shape-change. This class offers hands-on
    experience in learning and employing actuated and shape-changing user interface technologies to build interactive user
    experiences. The class provides a range of basic engineering techniques to allow students to develop their own actuated
    user interface systems, including 3D mechanical design, digital fabrication (e.g. 3D Printing), electronics (Arduino microcontroller),
    and actuator control (utilizing different kinds of motors). Through multiple project-based assignments, students practice
    the acquired techniques to build interactive tangible experiences of their own.
  crosslists:
  - CMSC 20380
  - CMSC 30380
  prereq:
    any:
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 20300 or CMSC 20310
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 20380. Actuated User Interfaces and Technology. 100 Units.
- code: MADD 20900
  title: Computers for Learning
  units: 100
  description: 'Over time, technology has occupied an increasing role in education, with mixed results. Massive Open Online
    Courses (MOOCs) were created to bring education to those without access to universities, yet most of the students who
    succeed in them are those who are already successful in the current educational model. This course focuses on one intersection
    of technology and learning: computer games. This course covers education theory, psychology (e.g., motivation, engagement),
    and game design so that students can design and build an educational learning application. Labs focus on developing expertise
    in technology, and readings supplement lecture discussions on the human components of education.'
  crosslists:
  - CMSC 20900
  - CMSC 30900
  prereq:
    any:
    - CMSC 14300
    - CMSC 15400
    - CMSC 22000
  prereq_text: CMSC 14300 or CMSC 15400 or CMSC 22000
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 20900. Computers for Learning. 100 Units.
- code: MADD 21111
  title: Creative Coding
  units: 100
  description: This course is an introduction to programming, using exercises in graphic design and digital art to motivate
    and employ basic tools of computation (such as variables, conditional logic, and procedural abstraction). We will write
    code in JavaScript and related languages, and we will work with a variety of digital media, including vector graphics,
    raster images, animations, and web applications. Students who have taken or are taking CMSC 14100 may not enroll in CMSC
    11111.
  crosslists:
  - CMSC 11111
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 21111. Creative Coding. 100 Units.
- code: MADD 23218
  title: 'Surveillance Aesthetics: Provocations About Privacy and Security in the Digital Age'
  units: 100
  description: In the modern world, individuals' activities are tracked, surveilled, and computationally modeled to both beneficial
    and problematic ends. Jointly with the School of the Art Institute of Chicago (SAIC), this course will examine privacy
    and security issues at the intersection of the physical and digital worlds. Through both computer science and studio art,
    students will design algorithms, implement systems, and create interactive artworks that communicate, provoke, and reframe
    pervasive issues in modern privacy and security. The course will unpack and re-entangle computational connections and
    data-driven interactions between people, built space, sensors, structures, devices, and data. Synthesizing technology
    and aesthetics, we will communicate our findings to the broader public not only through academic avenues, but also via
    public art and media. The first phase of the course will involve prompts in which students design and program small-scale
    artworks in various contexts, including (1) data collected from web browsing; (2) mobility data; (3) data collected about
    consumers by major companies; and (4) raw sensor data. Students will receive detailed feedback on their work from computer
    scientists, artists, and curators at the Museum of Science & Industry (MSI). The course culminates in the production and
    presentation of a capstone interactive artwork by teams of computer scientists and artists; successful products may be
    considered for prototyping at the MSI.
  notes: 'Students interested in this class should complete this form to request permission to enroll: https://uchicago.co1.qualtrics.com/jfe/form/SV_5jPT8gRDXDKQ26a'
  crosslists:
  - CMSC 33218
  - CMSC 23218
  prereq_text: One of CMSC 23200, CMSC 23210, CMSC 25900, CMSC 28400, CMSC 33210, CMSC 33250, or CMSC 33251 recommended, but
    not required.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: 'MADD 23218. Surveillance Aesthetics: Provocations About Privacy and Security in the Digital Age. 100 Units.'
  needs_review: true
