courses:
- code: MADD 10006
  title: Contemporary Art
  units: 100
  description: This course will consider the practice and theory of visual art in the late twentieth and early twenty-first
    centuries. Among the subjects that will drive our narrative will be the rise of postmodernism, pop art, the aesthetics
    of the social movements of the 1960s, institutional critique, the relationship between reproductive media and Feminism,
    the concept of spectacle, conceptual art, the appearance of a global art industry after 1989, the connections between
    art school and art-making, "relational aesthetics," the fate of art in the age of the Internet, the art of the post-studio
    moment, and what happens to art when it engages with *everything*.
  crosslists:
  - ARTV 20006
  - ARTH 15800
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 10006. Contemporary Art. 100 Units.
- code: MADD 10630
  title: 'Understanding Digital Media: An Introduction to Contemporary Media Aesthetics'
  units: 100
  description: 'This course offers an introduction to the aesthetics and theory of digital media. We explore how the digital
    revolution has transformed media aesthetics across film, television, online environments and the arts. Through a blend
    of philosophical, political, and aesthetic inquiry, we investigate how the digital society redefines what it means to
    be human, how we interact socially, and how we conceptualize reality itself. Our exploration is guided by several questions:
    Is reality a simulation? Can humans be "upgraded" through merger with digital technology? Are algorithms and A.I. ushering
    in a post-human social reality? We will also address the political dimensions of these shifts, specifically how computational
    power has fueled "cybernetic capitalism" and the rise of the "control society". We engage with these concepts through
    a diverse range of media, including film (Inception, The Matrix, Ex Machina, Edge of Tomorrow, Everything Everywhere All
    at Once), television (Black Mirror, The Rehearsal), digital media examples and A.I., video games, and the arts. Along
    the way we discuss media theory and cybernetic theory (e.g. Katherine Hayles, Niklas Luhmann) in pursuit of our themes
    and questions. No prior background is required - only curiosity about our digital world and its future. HUMA 16300 can
    qualify for a third Humanities general education requirement if the student completed HUMA 16000 and HUMA 16100. HUMA
    16300 may also be taken as an independent elective.'
  crosslists:
  - HUMA 16300
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: 'MADD 10630. Understanding Digital Media: An Introduction to Contemporary Media Aesthetics. 100 Units.'
- code: MADD 14207
  title: 'Mindfulness: Experience and Media'
  units: 100
  description: How do we experience media (of all kinds) with (or without) awareness? Methods of mindfulness offer principles
    and practices of awareness focusing on mind, body, and embodied mind. Mindfulness (a flexible, moment-to-moment, non-judging
    awareness) is an individual experience and at the same time, practices of mindfulness can be a mode of public health intervention.
    Mindfulness involves social epistemologies of how we know (or don't know) collectively, as we interact with immediate
    sensory experience as well as with mediated communication technologies generating various sorts of virtual realities (from
    books to VR). In addition to readings and discussions, this course teaches embodied practices of attention and awareness
    through the curriculum of Mindfulness-Based Stress Reduction.
  crosslists:
  - HLTH 25207
  - HUMA 25207
  - HIPS 25207
  - TAPS 20507
  terms_offered:
  - SP
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: 'MADD 14207. Mindfulness: Experience and Media. 100 Units.'
- code: MADD 14570
  title: 'Special Topics: Animation Theory'
  units: 100
  description: Due to the ubiquity and pervasiveness of animation in contemporary media ecologies, recent years have seen
    a surge of interest in animation theory. But animation theory presents a vast and turbulent domain of inquiry, because
    animation may be narrowly defined as a set of objects or techniques or broadly conceptualized to embrace questions about
    life and death, about more-than-human animals, artificial life, and animism, for instance. This topics course has two
    aims. The first aim is to provide an overview of the key problematics of and approaches to animation theory in a global
    and historical perspective. The second aim is to develop tools for doing animation theory in a more localized manner.
    To this end, course will highlight theories of character and characterization with an emphasis on how the inherent tension
    between individual and type in animation affects our understanding race and racism.
  notes: Not offered in 2023-24.
  crosslists:
  - EALC 14570
  - CMST 14570
  terms_offered:
  - WI
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: 'MADD 14570. Special Topics: Animation Theory. 100 Units.'
- code: MADD 20310
  title: Introduction to Designing Interaction
  units: 100
  description: We are surrounded by interactive systems and designs, from the user interfaces for our computers and smartphones
    to home appliances, doors, and furniture. This class will introduce basic techniques, theories, and practices in designing
    interactive objects and systems. Specifically, it will introduce students to developing user experience-centric perspectives
    on critically reflecting on existing (and future) interactive designs. It also provides practices for students to ideate
    new design solutions and prototype them using design and engineering methods. Centered in interaction design, the class
    covers broad topics touching human-computer interaction, industrial design, user experience design, and communication
    design.
  crosslists:
  - CMSC 20310
  prereq:
    any:
    - CMSC 15200
    - CMSC 15400
    - CMSC 14200
    - CMSC 14300
    - CMSC 14400
  prereq_text: CMSC 15200, CMSC 15400, CMSC 14200, CMSC 14300, or CMSC 14400.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 20310. Introduction to Designing Interaction. 100 Units.
- code: MADD 20360
  title: Creating Interactive Systems With User-Centered Design
  units: 100
  description: Creating technologies that fit into people's lives involves more than having technically sophisticated algorithms,
    systems, and infrastructure. It involves deeply understanding various community needs and using this understanding coupled
    with our knowledge of how people think and behave to design user-facing interfaces that can enhance and augment human
    capabilities. When dealing with different kinds of users, achieving these goals requires us to think through how different
    constraints such as costs, access to resources, and various cognitive and physical capabilities shape what socio-technical
    systems can best address a particular issue. This course leverages human-computer interaction and the tools, techniques,
    and principles that guide research on people to introduce you to the concepts of user centered design. You will learn
    about different user groups such as children, older adults, users facing financial constraints as well as those needing
    assistive technology and their particular needs. In addition, you will learn how to be mindful of working with different
    types of user populations and how to think creatively of technology solutions that enhance human capabilities while minimizing
    harm. You will also put your skills into practice in a quarter long group project involving the creation of an interactive
    system for one of the user populations we study.
  notes: Students who have taken 20370 may not enroll in 20360.
  crosslists:
  - CMSC 30360
  - CMSC 20360
  prereq:
    any:
    - CMSC 14400
    - CMSC 15400
    - CMSC 12300
    - CMSC 22000
    - CMSC 20300
    - CMSC 20310
  prereq_text: CMSC 14400 or CMSC 15400 or CMSC 12300 or CMSC 22000 or CMSC 20300 or CMSC 20310.
  source:
    url: http://collegecatalog.uchicago.edu/thecollege/MediaArtsandDesign/
    quote: MADD 20360. Creating Interactive Systems With User-Centered Design. 100 Units.
- code: MADD 20370
  title: 'Inclusive Technology: Designing for Underserved and Marginalized Populations'
  units: 100
  description: Creating technologies that are inclusive of people in marginalized communities involves more than having technically
    sophisticated algorithms, systems, and infrastructure. It involves deeply understanding various community needs and using
    this understanding coupled with our knowledge of how people think and behave to design user-facing interfaces that can
    enhance and augment human capabilities. When dealing with under-served and marginalized communities, achieving these goals
    requires us to think through how different constraints such as costs, access to resources, and various cognitive and physical
    capabilities shape what socio-technical systems can best address a particular issue. This course leverages human-computer
    interaction and the tools, techniques, and principles that guide research on people to introduce you to the concepts of
    inclusive technology design. You will learn about different underserved and marginalized communities such as children,
    the elderly, those needing assistive technology, and users in developing countries, and their particular needs. In addition,
    you will learn how to be mindful of working with populations that can easily be exploited and how to think creatively
    of inclusive technology solutions. You will also put your skills into practice in a semester long group project involving
    the creation of an interactive system for one of the user populations we study.
  crosslists:
