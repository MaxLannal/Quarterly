  prereq_text: 'MADD 26210 Media Art and Design Practice is affiliated with HUMA 16000-16100-16200 Media Aesthetics: Image,
    Text, Sound I-II-III. Students satisfying the general education requirement in the humanities will have priority in enrollment
    for Media Arts and Design Practice.'
  terms_offered:
