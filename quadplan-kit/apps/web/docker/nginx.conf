server {
  listen 5173;
  root /usr/share/nginx/html;
  # No request logs: the app must not keep IP addresses (SPEC "Accounts and anonymity").
  access_log off;
  error_log /dev/stderr crit;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_buffering off;            # Server-Sent Events from /agents/*
    proxy_set_header Host $host;
    # Rate limits need the client address; the API keeps it in a Redis-only counter (never logged).
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
