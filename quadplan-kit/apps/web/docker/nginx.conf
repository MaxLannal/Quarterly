server {
  listen 5173;
  root /usr/share/nginx/html;
  # No request logs: the app must not keep IP addresses (SPEC "Accounts and anonymity").
  access_log off;
  error_log /dev/stderr crit;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_buffering off;            # Server-Sent Events from /agents/*
    proxy_set_header Host $host;
    # Rate limits need the client address; the API keeps it in a Redis-only counter (never logged).
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Built files have a content hash in their name: cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself must be re-checked on every visit, so a rebuild shows up at once (without
  # this header browsers guess, and kept showing an old build for hours).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
